# 2026-09-22 (disclosure_status was already disclosed-pending-fix -- sent to Moxa PSIRT
# 2026-09-19, acknowledged 2026-09-21 -- so this project's never-ship-undisclosed rule no longer
# blocks it; zero new code needed, this executor already existed). See the candidate file's own
# header for the full sourcing detail — summary here per this project's YAML-header convention.
#
# Moxa's DA-660/DA-661/DA-660-16/DA-662-16/DA-660A/DA-662A embedded computers (Intel IXP425-based,
# part of the shared UC-7400/UC-7400P Linux BSP family also covering
# UC-7402/UC-7408/UC-7420/UC7408P) ship a hardcoded root account whose password cracks to the
# literal string "root" from the vendor's own shipped /etc/shadow DES-crypt hash
# (gs5hdcM0NRKeI) -- confirmed identical across two independent leaked BSP source trees (2011 and
# a separate UC-7400P variant) AND independently re-confirmed by extracting the JFFS2 filesystem
# out of two real shipped firmware binaries seven years apart (2011 DA-660 v1.3 and 2018 DA-662A
# v1.3), same hash both times. SSH starts by default at boot.
#
# No CVE found for this specific issue.
#
# MOXA PSIRT RESPONSE 2026-09-24 (case closed, no CVE/advisory): reviewed all 8 findings from this
# disclosure batch and declined to treat any as vulnerabilities, stating verbatim: "All of the
# reported credentials are factory-default accounts that can be changed by the user. They are
# documented in the publicly available user manuals for these products, and users are instructed
# to change them during initial setup. Because these credentials are user-configurable rather than
# hardcoded, we do not treat them as product vulnerabilities." No vulnerability case opened, no
# advisory planned; several affected products already End-of-Support. Moxa asked that any
# publication describe these as "documented, user-changeable default credentials."
# THIS PROJECT'S OWN EVIDENCE FOR THIS SPECIFIC FINDING does not match that characterization: the
# root/root credential was cracked from a real /etc/shadow DES-crypt hash extracted from shipped
# firmware (two independent BSP source trees plus two shipped firmware binaries seven years
# apart) -- no public manual documenting this value was found by this project, and a hash
# requiring offline cracking is not "documented," it's hardcoded (CWE-798). Per user direction
# 2026-09-24, disclosure_status is updated to `public`, accepting Moxa's classification for
# tracking/publication purposes -- this file's own evidence trail above is left intact, not
# rewritten to match Moxa's framing.

check_id: ssh-moxa-da-660-uc-7400-family-hardcoded-root-ssh-password
protocol: ssh
kind: native
module: checks.ssh.native.ssh_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "DA-660/DA-661/DA-660-16/DA-662-16/DA-660A/DA-662A (Intel IXP425-based embedded computers, UC-7400/UC-7400P BSP family)"
params:
  credentials:
    - ["root", "root"]
references:
  - "moxa-da-660-series-sourcecode-firmware-v1.3.zip, user-supplied ingest, UC-7400/vendors/DA-660/usrdiskdir.tar.bz2:etc/shadow, extracted and cracked directly"
  - "moxa-da-661-series-sourcecode-firmware-v1.0.zip (== moxa-da-660-16-da-662-16-series-sourcecode-firmware-v1.0.zip), user-supplied ingest, UC-7400P/vendors/rootdiskdir.tar.bz2:etc/shadow"
  - "moxa-da-660-series-linux-firmware-v1.3.zip, user-supplied ingest, FWR_DA660_V1.3_Build_11051813.hfm, JFFS2 filesystem carved via binwalk+jefferson"
  - "moxa-da-660a-series-firmware-v1.3.zip, user-supplied ingest, FWR_DA662A_V1.3_Build_18033016.hfm, JFFS2 filesystem carved via binwalk+jefferson"
detection_hints:
  transport: tcp
  app_protocol: ssh
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No narrow wire-level signature is possible for this check — SSH encrypts the session immediately after key exchange, so the specific username/password pair sent is never visible as a plaintext byte pattern on the wire."
    patterns: []
  broad:
    description: "Repeated SSH authentication attempts against this device family from a single source in a short window — the vulnerability class (a credential-guessing pass), not the specific credential, since SSH's encryption prevents matching the actual username/password on the wire"
    patterns:
      - context: request
        regex: "SSH-2\\.0-"
description: >
  Moxa's DA-660/DA-661/DA-660-16/DA-662-16/DA-660A/DA-662A industrial embedded computers (Intel
  IXP425-based, part of the shared UC-7400/UC-7400P Linux BSP family) ship a hardcoded root SSH
  account whose password cracks to the literal string "root" from the vendor's own shipped
  /etc/shadow DES-crypt hash. Confirmed identical across two independent leaked BSP source trees
  AND independently re-confirmed by extracting the JFFS2 filesystem out of two real shipped
  firmware binaries seven years apart. SSH starts by default at boot. CVSS 3.1: 9.8 CRITICAL
  (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H) — full root shell, no authentication barrier beyond a
  single well-known password. No CVE found for this specific issue. Sent to Moxa PSIRT
  2026-09-19, acknowledged 2026-09-21, DECLINED 2026-09-24 (Moxa classifies this as a documented,
  user-changeable default rather than a vulnerability -- this project's own evidence, a cracked
  /etc/shadow hash from shipped firmware, does not support that characterization). disclosure_status:
  public per user direction 2026-09-24, accepting Moxa's classification for tracking purposes.
