# Built check 2026-10-06 (Phase 1a), promoted from candidates/moxa-security-dashboard-console-root-moxa-vshell.yaml.
# Moxa Security Dashboard Console ships a hardcoded SSH root account per its own official manual
# (v1.2): "The default administrator credentials are: Username: root / Password: moxa", reachable
# locally or over SSH. Documented default -> disclosure_status public. ssh_default_creds executor.
check_id: moxa-security-dashboard-console-root-moxa-default-password
protocol: ssh
kind: native
module: checks.ssh.native.ssh_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "Security Dashboard Console (SSH, port 22)"
params:
  credentials:
    - ["root", "moxa"]
  default_port: 22
references:
  - "Moxa Security Dashboard Console User Manual v1.2 (user-supplied, pdftotext): 'The default administrator credentials are: Username: root / Password: moxa' (local or remote over SSH)."
detection_hints:
  transport: tcp
  app_protocol: ssh
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No narrow wire-level signature is possible — SSH encrypts the session immediately after key exchange, so the root/moxa username/password sent is never visible as a plaintext byte pattern on the wire."
    patterns: []
  broad:
    description: "Repeated SSH authentication attempts against the Security Dashboard Console from a single source in a short window — the vulnerability class (a default-login/credential-guessing pass), not the specific credential, which SSH's encryption hides."
    patterns:
      - context: request
        regex: "SSH-2\\.0-"
description: >
  Moxa Security Dashboard Console ships a documented default SSH root login root/moxa (vendor
  manual v1.2), reachable over SSH. CVSS 3.1 9.8 CRITICAL. Built against ssh_default_creds.py.
