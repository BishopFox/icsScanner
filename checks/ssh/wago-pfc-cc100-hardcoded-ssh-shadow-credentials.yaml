# Candidate stub — 2026-09-26, WAGO ingest (vendor firmware ingest 52 cloned GitHub repos
# under github.com/orgs/WAGO/repositories, plus all 14 WAGO/pfc-firmware GitHub releases, 55
# assets). Confirmed no prior candidate/check for this covers it: `grep -rli "wago|pfc"
# checks/candidates/ checks/ssh/ checks/http/` returns only candidate-cve-2019-10953.yaml (an
# unrelated Modicon M221 network-flood DoS) and checks/http/wago-750-series-default-creds.yaml
# (a DIFFERENT mechanism — the HTTP web-UI Basic Auth login admin/wago, user/user, guest/guest —
# not this candidate's Linux-level SSH/shadow accounts; the two share a coincidental "user/user"
# plaintext value across otherwise-unrelated services).
#
# THE FINDING: real, shipped WAGO PFC/CC100 firmware (WAGO_FW0750-8xxx_V030039_IX12_r38974.img,
# 2016, through PFC-G2-Linux_sd_V040213_24_r74297.img, 2024 — 5+ firmware images spanning 8 years
# and 3 hardware generations, all extracted and read directly, not assumed) ships THREE Linux
# accounts with real login shells (all `/bin/bash`, none restricted) whose /etc/shadow
# SHA-512-crypt hashes are BYTE-IDENTICAL across every image checked:
#   root:  $6$MNidEGHnOF1kXjTZ$nQ0dahud2x4AuEOQnYxbA.Op2IdWToXVxjB2sqY2PKs3wSEyRZ1o8EZjSgZPNyz9sU6Bl4o.AXZ7be3/QhXXx0
#   admin: $6$uv8NulqCRL0DChv3$52QonDAqpnuIiU0heh5QJilNPPY2dDcdmkyAsucShpUsJPo.XEZlLFeoW.z9AyUlMLmECSZF5pkaCe5TGDIzi.
#   user:  $6$THok0gnuizbSxjUF$WxgCKL0ucvOf.FRF9kiqoBS.ioPZ3ozfFhbZvoitzYFvW.ib/0RLayUFvq0wQM4nXJVp/GWnistSjf1vcOFbj.
# ALL THREE CRACKED, directly (Python stdlib `crypt` against the real stored hash, not guessed
# — `crypt.crypt(candidate, hash) == hash` verified for each):
#   root:  wago
#   admin: wago
#   user:  user
# `root` and `admin` share the SAME plaintext value as WAGO's own already-documented HTTP web-UI
# default (see the sibling wago-750-series-default-creds.yaml check, sourced from SCADAPASS + the
# official WAGO-I/O-SYSTEM 750 manual) — i.e. WAGO reused the SAME secret ("wago") across two
# different trust boundaries: the documented, lower-privilege web-UI login, and the undocumented,
# full-root-shell Linux/SSH accounts on the same device. Reusing a customer-visible, documented
# default across a much more consequential attack surface is itself notable, independent of the
# credential's own weakness.
#
# THESE EXACT HASH STRINGS (full salt+hash, byte-for-byte) ALSO APPEAR LITERALLY in WAGO's own
# public GitHub source, in the `PTXCONF_ROOTFS_SHADOW_ADMIN_ENTRY` / `_USER_ENTRY` build-config
# variables of `ptxconfig_generic` files, confirmed independently across THREE separate public
# repos cloned this session: WAGO/pfc-firmware-sdk (configs/wago-pfcXXX/ptxconfig_generic, both
# current and a retained `.old` copy), WAGO/pfc-firmware-sdk-G2
# (ptxproj/configs/wago-pfcXXX/ptxconfig_pfc_g2), and WAGO/cc100-firmware-sdk
# (ptxproj/configs/cc100/ptxconfig_generic and .../cc100_bu_solutions_ptxconfig_generic). `root`'s
# hash additionally appears as a literal (non-templated) value directly in
# cc100-firmware-sdk/ptxproj/projectroot.cc100/etc/shadow. This means the exact evidence needed to
# reproduce this finding is independently obtainable from WAGO's own public source control, with
# no firmware extraction required at all.
#
# SCOPE: the same `etc/shadow`-template structure (with `@USER_ADMIN@`/`@USER_USER@` placeholders
# resolved from the same `PTXCONF_ROOTFS_SHADOW_*_ENTRY` build variables) also exists in
# WAGO/tp-firmware-sdk, WAGO/wp400-firmware-sdk, and WAGO/pfc300-firmware-sdk — NOT independently
# confirmed to resolve to these SAME hash values (only the PFC/PFC-G2/CC100 lines' generic
# configs were read this pass); flagged as a likely-wider scope, not assumed.
#
# NETWORK EXPOSURE, confirmed directly from the extracted firmware's own config, not assumed:
# dropbear (SSH) starts at boot by default (`/etc/rc.d/S16dropbear` in the 2016 image,
# `/etc/rc.d/S25_dropbear` in the 2024 image — enabled across the whole span checked) on port 22,
# with `etc/dropbear/dropbear.conf` setting `ROOT_LOGIN=true`, `ROOT_PASSWORD_LOGIN=true`, and
# `PASSWORD_LOGIN=true`. PAM (`/etc/pam.d/*`) applies only the stock `common-account`/`common-auth`
# includes — no `AllowUsers`/`DenyUsers`-equivalent restriction found limiting which accounts may
# authenticate remotely.
#
# NOT INDEPENDENTLY CHECKED:
#   - Live SSH login was NOT attempted against a real device this pass (no live unit available);
#     the dropbear.conf settings are the shipped DEFAULT configuration, not independently confirmed
#     against a live device's actual runtime state (e.g. a customer or WAGO could have changed
#     these accounts' passwords or dropbear's config post-deployment — this candidate describes
#     the FACTORY-SHIPPED state, not a guarantee every deployed unit still matches it).
#   - tp-firmware-sdk/wp400-firmware-sdk/pfc300-firmware-sdk's actual hash VALUES (only their
#     template STRUCTURE was confirmed to match).
#   - Whether WAGO's own PSIRT/security advisories already cover this specific mechanism -- a
#     full prior-art search WAS since performed (2026-09-26) before drafting the actual disclosure
#     report. Found and read directly, none overlapping:
#       * CVE-2012-4879 -- WAGO I/O System 758 (758-870/874/875/876), Linux Console via TELNET,
#         IDENTICAL credential values (root/admin=wago, user=user, guest=guest), but a DIFFERENT
#         product family and protocol. The credential VALUE is not novel; this candidate's own
#         contribution is confirming the SAME value present via SSH on the CURRENT PFC/CC100 line
#         as recently as 2024, traced to a specific, current, public build-config variable.
#       * CVE-2019-12550 / CVE-2019-12549 (ICSA-19-164-02) -- WAGO 852-series managed switches,
#         hardcoded root creds via SSH/Telnet, CVSS 9.8, already FIXED by WAGO. Same
#         vulnerability class, unrelated product family; confirms WAGO fixes this class when
#         reported and gives a direct severity precedent.
#       * SEC Consult 2022-01-26 WAGO 750-8xxx advisory -- read directly, confirmed NOT
#         overlapping (CODESYS DoS, web-UI PHP timing side-channel, outdated components, binary
#         hardening -- no SSH/shadow mechanism).
#       * CVE-2019-5134 (web-UI PasswordCorrect() regex bypass), a Cloud Connectivity RCE, and a
#         CODESYS-runs-as-root finding -- also unrelated mechanisms, checked earlier this pass.
#     Not exhaustive (no direct CNVD/JVN database query this pass) -- WAGO's own PSIRT is better
#     positioned to do a fully authoritative internal check. Full detail in the actual disclosure
#     report, lab-notes/disclosures/wago-pfc-cc100-hardcoded-ssh-shadow-credentials.md.
#
# SEVERITY: CVSS v3.1 scored via the installed `cvss` Python package, not hand-estimated. Scored
# for the confirmed-worst case (root-equivalent shell access via the shared, network-reachable
# SSH credential):
#   Vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
#   Base Score: 9.8 (CRITICAL) — AV:N/AC:L because dropbear SSH is directly network-reachable
#   with no special positioning needed; PR:N/UI:N because a password-authenticated SSH session
#   needs no prior access or user interaction beyond the login attempt itself; C:H/I:H/A:H because
#   a shell account (root, or admin/user with a real login shell on a device with no further
#   confirmed privilege boundary) grants full read/write/execute control of the controller.
#
# disclosure_status: undisclosed. The raw EVIDENCE (the exact hash strings, and — for admin —
# the plaintext value itself) is independently public via WAGO's own GitHub source and manual —
# but per this project's own established precedent (the Phoenix Contact mGuard SNMP MIB
# candidate: evidence read from the vendor's own publicly shipped MIB file, still filed
# undisclosed because the SECURITY IMPLICATION was never vendor-documented or acknowledged, only
# the raw material was public), the same reasoning applies here: WAGO's own user manuals document
# admin/wago as the INTENDED HTTP web-UI default (see the sibling wago-750-series-default-creds.yaml
# check) — but nowhere is "the SAME 'wago' value also unlocks a full root/admin Linux shell via
# SSH on this device" stated as an intended, acknowledged security posture, and root's SSH
# password being "wago" is not documented anywhere found this pass. This reads as an unintentional
# secrets-in-source-control exposure via WAGO's own open-source build tooling (reusing a
# customer-facing default across a far more privileged surface) rather than a documented
# factory-default policy, and is treated as this project's own undisclosed finding pending
# responsible disclosure to WAGO.
#
# (Historical note: at filing time this was held back only by this project's own
# never-ship-undisclosed rule, not a technical gap -- see "NOW BUILT" below for how that resolved.
# All three credentials were cryptographically confirmed via crypt.crypt match against the real
# stored hash, but never confirmed via an actual live SSH login against a real device -- that
# live-hardware confirmation remains open, see NOT INDEPENDENTLY CHECKED above.)
#
# UPDATE 2026-09-26: full disclosure report (joint finding, credit requested for Shad Malloy/
# alosafuzz and Zoe Duncan/zodun) SENT to psirt@wago.com, PGP-encrypted to WAGO PSIRT's own
# published key (fingerprint CF3C 6446 8008 7D12 4E3A E111 D820 A2B3 E087 ED2C, verified against
# their own security.txt before use). Full package (report .md/.pdf/.docx, PoC, PGP key,
# submission email) lives in lab-notes/disclosures/wago-pfc-cc100-hardcoded-ssh-shadow-credentials.*
# and lab-notes/disclosures/wago-psirt-*.
#
# WAGO RESPONSE 2026-10-01 (Arne Wienold, WAGO PSIRT, replying "AW: Product Vulnerability
# Report...", archived in the WAGO PSIRT correspondence), quoted in full:
#   "The credentials you describe are the documented default passwords of our controllers. We are
#   aware of this, and it is intended behaviour. To make sure customers don't keep using them, we
#   ask them to change these passwords both in the product manuals and on every login with a
#   default password. For this reason, we don't consider this a vulnerability and will keep the
#   behaviour as it is."
# DECLINED -- same shape as this project's Moxa 8-finding disclosure (2026-09-24): vendor
# characterizes a real, confirmed hardcoded credential as an intentional, documented,
# user-changeable default rather than a vulnerability. PER USER DIRECTION, same precedent as
# Moxa: framing accepted for tracking purposes, promoted from checks/candidates/ to this
# checks/ssh/ built check, disclosure_status flipped to `public`.
#
# EVIDENTIARY CONTRADICTION, recorded plainly rather than silently accepted at face value (same
# standard applied to Moxa's own "documented, user-changeable defaults" claim, which this
# project's evidence contradicted for 5 of 8 findings there): WAGO's reply makes two specific,
# checkable claims that this candidate's own original research does not support --
#   1. "documented default passwords ... in the product manuals" -- the original research (see
#      "disclosure_status: undisclosed" reasoning above, now historical) explicitly found root's
#      SSH password being "wago" documented NOWHERE across the manuals/public source checked.
#      Only the admin HTTP web-UI default ("wago") is actually vendor-documented (see the sibling
#      checks/http/wago-750-series-default-creds.yaml) -- the SSH/Linux-shadow-level accounts
#      (root, admin via SSH, and user) were never found in any customer-facing documentation.
#   2. "on every login with a default password" -- no forced-password-change-on-first-login
#      mechanism was found in the firmware's own dropbear.conf or PAM configuration (`/etc/pam.d/*`
#      uses only stock common-account/common-auth includes, no expiry/force-change directive).
#   Neither contradiction was independently re-verified against a live device or WAGO's current
#   manual set as part of this response-processing pass -- recorded as open questions a future
#   session could resolve, not re-litigated with WAGO without explicit direction to do so.
#
# NOW BUILT: promoted from checks/candidates/wago-pfc-cc100-hardcoded-ssh-shadow-credentials.yaml
# (git-renamed, history preserved) now that disclosure_status is public -- the
# checks/ssh/native/ssh_default_creds.py executor already existed and needed zero new code, exactly
# as anticipated when this candidate was first filed.

check_id: ssh-wago-pfc-cc100-hardcoded-ssh-shadow-credentials
protocol: ssh
kind: native
module: checks.ssh.native.ssh_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "WAGO GmbH & Co. KG"
  product: "PFC100/PFC200/PFC300 and CC100 series Linux-based controllers running firmware traceable to the WAGO/pfc-firmware-sdk, WAGO/pfc-firmware-sdk-G2, or WAGO/cc100-firmware-sdk build configs (confirmed shipped in firmware spanning 2016 through 2024; WAGO/tp-firmware-sdk, WAGO/wp400-firmware-sdk, and WAGO/pfc300-firmware-sdk share the same template structure, not independently confirmed to share the same hash values)"
params:
  credentials:
    - ["root", "wago"]
    - ["admin", "wago"]
    - ["user", "user"]
references:
  - "User-supplied ingest: WAGO_FW0750-8xxx_V030039_IX12_r38974.img (2016) and PFC-G2-Linux_sd_V040213_24_r74297.img (2024), plus 3 further firmware versions in between -- unblob-extracted, /etc/shadow and /etc/passwd read directly, root/admin/user hashes confirmed byte-identical across all 5; all three independently verified via Python stdlib crypt.crypt(candidate, hash) == hash against the real stored hash: root=wago, admin=wago, user=user"
  - "User-supplied ingest: cloned github.com/orgs/WAGO/repositories in full (52 repos) -- WAGO/pfc-firmware-sdk (configs/wago-pfcXXX/ptxconfig_generic and .old), WAGO/pfc-firmware-sdk-G2 (ptxproj/configs/wago-pfcXXX/ptxconfig_pfc_g2), and WAGO/cc100-firmware-sdk (ptxproj/configs/cc100/ptxconfig_generic and cc100_bu_solutions_ptxconfig_generic) all contain the identical, literal PTXCONF_ROOTFS_SHADOW_ADMIN_ENTRY/_USER_ENTRY hash strings; WAGO/cc100-firmware-sdk's own projectroot.cc100/etc/shadow additionally carries root's hash as a non-templated literal; WAGO/pfc-firmware-sdk/rules/rootfs.make read directly to confirm the @USER_ADMIN@/@USER_USER@ placeholder substitution mechanism"
  - "User-supplied ingest: same firmware images' etc/dropbear/dropbear.conf (ROOT_LOGIN=true, ROOT_PASSWORD_LOGIN=true, PASSWORD_LOGIN=true) and etc/rc.d/S16dropbear (2016) / S25_dropbear (2024) boot-enablement, read directly"
detection_hints:
  transport: tcp
  app_protocol: ssh
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own SSH login attempt using one of the three confirmed cracked credentials (root/wago, admin/wago, user/user)"
    patterns: []
  broad:
    description: "Any SSH authentication attempt against this device on port 22 -- the vulnerability class (a shared, hardcoded OS-level credential across the firmware line), not the specific guessed value(s). No safe broader wire-level signature exists for a generic SSH password auth attempt distinct from legitimate administrative SSH use."
    patterns: []
description: >
  WAGO PFC100/PFC200/PFC300 and CC100 series Linux-based controllers ship root, admin, and user
  Linux accounts (all with real /bin/bash shells) whose /etc/shadow SHA-512-crypt hashes are
  byte-identical across firmware spanning 2016 through 2024 — the same three exact hash strings
  are also independently present, literally, in WAGO's own public GitHub SDK source
  (pfc-firmware-sdk, pfc-firmware-sdk-G2, cc100-firmware-sdk). All three cracked directly
  (crypt.crypt(candidate, hash) == hash verified against the real stored hash): root=wago,
  admin=wago, user=user. root and admin share the same plaintext as WAGO's own documented HTTP
  web-UI default ("wago"), now confirmed to also unlock a full root/admin Linux shell via SSH —
  reuse of a customer-facing default across a far more privileged surface. dropbear SSH is
  enabled by default (root/password login permitted, no account restriction) on all firmware
  checked. CVSS 3.1 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H = 9.8 CRITICAL, scored for root-equivalent
  shell access. The credential VALUE itself is not novel (CVE-2012-4879, WAGO 758-series IPC via
  Telnet, 2012) -- this candidate's contribution is confirming the same value via SSH on the
  CURRENT PFC/CC100 line as recently as 2024. No CVE covers THIS mechanism specifically; also
  checked and confirmed not overlapping: CVE-2019-12550/12549 (WAGO 852 switches, same class,
  already fixed), a 2022 SEC Consult 750-8xxx advisory (unrelated mechanisms), CVE-2019-5134, a
  Cloud Connectivity RCE, and a CODESYS-as-root finding (not exhaustive). Reported to WAGO PSIRT
  2026-09-26 (joint finding with Zoe Duncan); WAGO responded 2026-10-01 characterizing these as
  "documented default passwords ... intended behaviour," declining to treat this as a
  vulnerability — a claim this project's own original research does not fully support (root's SSH
  password was never found documented anywhere, and no forced-password-change-on-login mechanism
  was found in the firmware's own dropbear/PAM config; see the WAGO RESPONSE / EVIDENTIARY
  CONTRADICTION notes above). disclosure_status: public, promoted to a built check accordingly,
  same precedent as this project's Moxa disclosure closure.
