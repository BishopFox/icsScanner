# PROMOTED from checks/candidates/moxa-da-681-lx-series-moxa-sudo-default-password.yaml,
# 2026-09-22 (disclosure_status was already disclosed-pending-fix -- sent to Moxa PSIRT
# 2026-09-19, acknowledged 2026-09-21 -- so this project's never-ship-undisclosed rule no longer
# blocks it; zero new code needed, this executor already existed). See the candidate file's own
# header for the full sourcing detail — summary here per this project's YAML-header convention.
#
# Moxa's x86-based industrial embedded computer line (DA-681A, DA-681C, DA-682A, DA-682C, DA-710
# confirmed directly; likely extends to DA-680/DA-681/DA-682/DA-685/DA-710-series siblings by
# shared build/packaging convention) ships a hardcoded interactive user account, "moxa", whose
# password cracks to the literal string "moxa" — confirmed across FIVE firmware images spanning
# 2009-2021, using three different extraction techniques. This account is a member of the sudo
# group with unrestricted full-sudo access (Debian/Ubuntu default `%sudo ALL=(ALL:ALL) ALL`) —
# functionally equivalent to a direct root compromise via a single well-known credential. SSH is
# confirmed enabled by default on the 2009, 2015, and 2017 images (not independently confirmed
# for the 2021 images' live-boot layer specifically). On the 2009 DA-710, root itself is still
# ACTIVE and cracks to the literal password "root" as well, with SSH, Telnet, and FTP all
# enabled by default simultaneously — that older root/root combination is not separately
# configured here since the always-present moxa/moxa + sudo path already grants equivalent
# access on every generation checked.
#
# No CVE found for this specific issue.
#
# MOXA PSIRT RESPONSE 2026-09-24 (case closed, no CVE/advisory): reviewed all 8 findings from this
# disclosure batch and declined to treat any as vulnerabilities, stating verbatim: "All of the
# reported credentials are factory-default accounts that can be changed by the user. They are
# documented in the publicly available user manuals for these products, and users are instructed
# to change them during initial setup. Because these credentials are user-configurable rather than
# hardcoded, we do not treat them as product vulnerabilities." No vulnerability case opened, no
# advisory planned; several affected products already End-of-Support. Moxa asked that any
# publication describe these as "documented, user-changeable default credentials."
# THIS PROJECT'S OWN EVIDENCE FOR THIS SPECIFIC FINDING does not match that characterization: the
# moxa/moxa credential was cracked from a real password hash extracted from shipped firmware
# (five independent images spanning 2009-2021) -- no public manual documenting this value was
# found by this project. Per user direction 2026-09-24, disclosure_status is updated to `public`,
# accepting Moxa's classification for tracking/publication purposes -- this file's own evidence
# trail above is left intact, not rewritten to match Moxa's framing.

check_id: ssh-moxa-da-681-lx-series-moxa-sudo-default-password
protocol: ssh
kind: native
module: checks.ssh.native.ssh_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "DA-681A/DA-681C/DA-682A/DA-682C/DA-710 (x86 Debian-based industrial embedded computers, 2009-2021)"
params:
  credentials:
    - ["moxa", "moxa"]
    - ["root", "root"]
references:
  - "moxa-da-681a-series-linux-firmware-v1.0.zip, user-supplied ingest, Clonezilla partclone image restored+read via debugfs"
  - "moxa-da-681c-series-linux-firmware-v1.1.zip, user-supplied ingest, live-boot disk image, rfs.squashfs extracted via unsquashfs"
  - "moxa-da-682a-series-linux-firmware-v1.0.zip, user-supplied ingest, same Clonezilla partclone technique"
  - "moxa-da-682c-series-linux-firmware-v1.2.zip, user-supplied ingest, same live-boot-GPT technique -- moxa hash byte-identical to DA-681C"
  - "moxa-da-710-series-linux-firmware-v1.0.zip, user-supplied ingest, 2009 partimage 0.6.1 disk image, restored via partimage -b + debugfs"
detection_hints:
  transport: tcp
  app_protocol: ssh
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No narrow wire-level signature is possible for this check — SSH encrypts the session immediately after key exchange, so the specific username/password pair sent is never visible as a plaintext byte pattern on the wire."
    patterns: []
  broad:
    description: "Repeated SSH authentication attempts against this device family from a single source in a short window — the vulnerability class (a credential-guessing pass), not the specific credential, since SSH's encryption prevents matching the actual username/password on the wire"
    patterns:
      - context: request
        regex: "SSH-2\\.0-"
description: >
  Moxa's x86-based industrial embedded computer line (DA-681A, DA-681C, DA-682A, DA-682C, DA-710
  confirmed directly) ships a hardcoded interactive user account, "moxa", whose password cracks
  to the literal string "moxa" from the vendor's own shipped password hash — confirmed across
  five firmware images spanning 2009-2021, using three different extraction techniques. The
  account is a full sudo-group member with unrestricted access, functionally equivalent to a
  direct root compromise. SSH is confirmed enabled by default on the 2009/2015/2017 images. The
  2009 DA-710 additionally has root itself active with the literal password "root". CVSS 3.1:
  9.8 CRITICAL (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). No CVE found for this specific issue.
  Sent to Moxa PSIRT 2026-09-19, acknowledged 2026-09-21, DECLINED 2026-09-24 (Moxa classifies
  this as a documented, user-changeable default -- this project's own evidence, a cracked
  password hash from shipped firmware, does not support that characterization).
  disclosure_status: public per user direction 2026-09-24, accepting Moxa's classification for
  tracking purposes.
