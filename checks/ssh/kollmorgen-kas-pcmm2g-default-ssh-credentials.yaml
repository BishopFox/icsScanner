# PROMOTED from checks/candidates/kollmorgen-kas-pcmm2g-default-ssh-credentials.yaml, 2026-09-14
# (user: "build the kas pcmm2g check"). See the candidate file's own header for the full sourcing
# detail — summary here per this project's YAML-header convention.
#
# Kollmorgen (part of Regal Rexnord) KAS PCMM2G motion-controller modules ship with two full
# sudo-privileged shell accounts, "kas" and "admin", sharing an IDENTICAL default password —
# doubly confirmed: cracked directly from the recovered /etc/shadow SHA-256 crypt hash (extracted
# from the vendor's own official SWUpdate OS image, a plain unsigned-content cpio archive
# containing a full ext4 rootfs), and independently matched byte-for-byte against the exact same
# hash literal in Kollmorgen's own supplied Yocto build-source recipe
# (layers/meta-kas/recipes-core/images/kas-image-common.inc's EXTRA_USERS_PARAMS, which
# `useradd`s both accounts with the same $5$ hash and adds them to the sudo group). root is
# explicitly locked (`usermod -p '*' root`) in the same recipe — unaffected by this finding.
#
# Remotely reachable, confirmed not assumed: sshd.socket is present under systemd's
# sockets.target.wants (socket-activated, on by default); sshd_config leaves PasswordAuthentication
# at OpenSSH 8.9p1's compiled default of "yes" (only ChallengeResponseAuthentication is disabled);
# PAM's sshd stack routes through pam_unix.so against the standard /etc/shadow. No HTTP/web
# server was found on the image at all — SSH is the only confirmed network-facing surface.
#
# No CVE — undocumented factory-default behavior (not covered by any known advisory at time of
# writing).

check_id: ssh-kollmorgen-kas-pcmm2g-default-ssh-credentials
protocol: ssh
kind: native
module: checks.ssh.native.ssh_default_creds
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Kollmorgen"
  product: "PCMM2G"
params:
  credentials:
    - ["admin", "pcmm2g"]
    - ["kas", "pcmm2g"]
detection_hints:
  transport: tcp
  app_protocol: ssh
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No narrow wire-level signature is possible for this check — SSH encrypts the session immediately after key exchange, so the specific username/password pair this scanner sends is never visible as a plaintext byte pattern on the wire."
    patterns: []
  broad:
    description: "Repeated SSH authentication attempts against this device family from a single source in a short window — the vulnerability class (a credential-guessing pass), not a specific guessed value, since SSH's encryption prevents matching the actual username/password on the wire"
    patterns:
      - context: request
        regex: "SSH-2\\.0-"
references:
  - "Kollmorgen's own official firmware/build-source download package (user-supplied): KAS-PCMM2G-Cx-08-OS-1.0.0.00440-RT-5.00.0.98579.zip and KAS-PCMM2G-OS-Build-Sources-1.0.0.00440.zip, layers/meta-kas/recipes-core/images/kas-image-common.inc"
description: "Kollmorgen KAS PCMM2G motion-controller modules ship with two full sudo-privileged SSH accounts, 'admin' and 'kas', sharing an identical default password ('pcmm2g', the product family's own name) baked into every device by the vendor's own Yocto build recipe. SSH is on by default with password authentication enabled. Confirmed two independent ways: cracking the recovered /etc/shadow hash directly, and finding the identical hash literal in the vendor's own supplied build-source recipe. No CVE."
