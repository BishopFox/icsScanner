# Ingest review, 2026-09-23. Phoenix Contact mGuard industrial firewall/VPN batch
# (vendor firmware ingest) -- confirmed no prior candidate/check for
# "mguard" existed anywhere in this project before writing this file.
#
# THE FINDING, from Phoenix Contact's own official current "Configuration of the mGuard" user
# manual (um_en_mguard_9_0_105661_en_20.pdf, "This user manual is valid for the mGuard software
# release 9.0", fetched and read directly via pdftotext), Section 7.1.1 "Authentication >>
# Administrative Users >> Passwords", stated VERBATIM:
#     "Account: root ... User name (cannot be modified): root ... Default root password: root"
# The same section describes the root role as having "full rights to all parameters of the
# mGuard... only this authorization level allows unlimited access to the mGuard file system" --
# this is not a limited service account, it is the device's own highest-privilege identity.
#
# NETWORK EXPOSURE, confirmed directly from the same manual's "Management >> System Settings >>
# Shell Access" section, not assumed:
#     "NOTE: Local SSH access via the 'Internal' interface is permitted by default independently
#     of the activation of SSH remote access."
#     "Enable SSH access as user root ... Standard: enabled"
# I.e. two independent defaults compound: SSH on the Internal interface is reachable out of the
# box (no "remote access" toggle needed for the internal/LAN side), AND the root user's own SSH
# login is itself enabled by default ("Standard: enabled"). SSH access via the WAN/external
# interface additionally requires "Enable SSH remote access" to be turned on -- that toggle is
# NOT confirmed default-enabled, so this finding is scoped honestly to the Internal-interface
# reachability, not claimed as reachable from the WAN side out of the box.
#
# PRODUCT CONTEXT: mGuard is Phoenix Contact's flagship industrial firewall/VPN/router security
# appliance line (FL MGUARD RS2000/RS4000, TC MGUARD, FL MGUARD CENTERPORT, etc.), deployed
# specifically at OT network perimeters to PROVIDE security -- an attacker who reaches this
# device's Internal interface (e.g. already present on the LAN/OT segment it's meant to protect,
# a common lateral-movement scenario) and obtains full-filesystem root access could disable or
# repurpose the very security boundary the device exists to enforce. CVSS scored AV:A (Adjacent
# Network), not AV:N, specifically to reflect the confirmed Internal-interface-only default
# reachability -- not inflated to imply default WAN exposure, which was not confirmed.
#
# ADJACENT, NOT INDEPENDENTLY CONFIRMED THIS PASS: the SAME manual section also documents a web
# interface default of admin/mGuard (case-sensitive, "User name (cannot be modified): admin" /
# "Default password: mGuard"), independently corroborated in a SECOND, older official manual
# (um_en_mguard_devices_105656_en_10.pdf, FL MGUARD RS4000/RS2000 device manual) via its own
# "Login" screenshot section. NOT filed as part of this check or as a separate candidate yet --
# this project has repeatedly found an assumed HTTP Basic Auth mechanism to be wrong once real
# firmware is examined (most recently Teltonika RUT this same session), and the actual HTTP
# wire format was not independently confirmed against the real firmware/update packages in this
# ingest batch (time budget). Flagged here as a known, real, adjacent lead for a follow-up pass,
# not silently dropped.
#
# No CVE found for this specific issue (a targeted WebSearch this pass found real mGuard CVE
# history, e.g. CVE-2021-30076, but nothing describing this specific default-root-password/SSH
# combination).
#
# FOLLOW-UP 2026-09-23 (deeper re-pass, same ingest batch): investigated
# mguard-firmware_repositories_mpc_v8.9.4.zip / v9.0.0.zip's bundled MGUARDB-MIB.txt (the SNMP
# MIB) and found something worth documenting even though it was ruled OUT as a new finding: the
# MIB defines `mGuardRootPassword` (OID mGuardPasswords.1, "ROOT_PASSWORD") and
# `mGuardAdminPassword` (OID mGuardPasswords.2, "WWW_PASSWORD") as ACCESS read-write DisplayString
# objects -- meaning a plain SNMP GET, if SNMP monitoring is enabled with a known/guessable
# community string, would disclose the device's CURRENT root and web-admin passwords in
# cleartext, the same read-write-OID exposure shape as this project's own
# candidates/avocent-pm-pdu-snmp-readable-admin-password-default-community.yaml finding.
# CROSS-CHECKED AGAINST THE REAL PRIMARY ADVISORY (2026-09-23, following a direct user request to
# build a check for CVE-2024-43384 -- fetched certvde.com/en/advisories/VDE-2024-039/ directly
# this pass, not re-derived from the earlier paraphrase above, which turns out to have
# misattributed the mechanism):
#   VDE-2024-039 actually covers TWELVE CVEs across mGuard's firmware, not one. The one relevant
#   to SNMP is CVE-2024-43388 (CVSS 8.8, CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H) --
#   "A low privileged remote attacker with write permissions can reconfigure the SNMP service due
#   to improper input validation." That is a SNMP-service-RECONFIGURATION bug, not a
#   password-read bug -- the MGUARDB-MIB.txt read-write ROOT_PASSWORD/WWW_PASSWORD OIDs noted
#   above may or may not be its actual mechanism (not confirmed either way this pass).
#   CVE-2024-43384 ITSELF (CVSS 8.0) is a DIFFERENT CVE in the same advisory, with vector
#   CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:U/C:H/I:H/A:H -- PR:L AND UI:R together mean the attacker
#   already needs low-privileged access to the device AND a separate, higher-privileged user has
#   to take some action, before the root password is exposed. The advisory's own description
#   ("improper removal of sensitive information before storage or transfer") never mentions SNMP,
#   or any other specific mechanism -- the actual technical detail (which interface, which
#   operation) is not public.
#   CONCLUSION: CVE-2024-43384 is NOT buildable as a network check in this project's architecture
#   -- the same "privilege-escalation-after-auth, not a way in on its own" exclusion already
#   applied to Teltonika RUT's CVE-2023-32349/CVE-2023-32350 and TotalFlow's CVE-2022-0902 (see
#   those checks/candidates for the same reasoning). It requires credentials this scanner doesn't
#   already hold, a user-interaction step no scanner can trigger or wait for, and its own
#   root-cause mechanism isn't publicly documented well enough to probe for even if those two
#   preconditions could somehow be met. Not filed as a candidate either -- this is a third-party,
#   already-patched (8.9.3/10.4.1+) CVE this project didn't discover, not our own undisclosed
#   finding, so there's nothing to track toward disclosure.
#   Both firmware repository versions in this ingest batch (8.9.4, 9.0.0) are at or above the
#   8.9.3 patch level for CVE-2024-43384 and every other CVE in VDE-2024-039 regardless.

check_id: ssh-phoenix-contact-mguard-root-default-password
protocol: ssh
kind: native
module: checks.ssh.native.ssh_default_creds
severity: "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (8.8 HIGH)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Phoenix Contact"
  product: "mGuard MGUARD2/GT-GT/Centerport2-platform devices running firmware 8.9.x/9.0.x -- confirmed exact model list, from the firmware's own Release Notes.pdf Chapter 5 'mGuard Product Mapping' (2026-09-24 follow-up, direct user request): FL MGUARD RS2000 TX/TX VPN, RS2005 TX VPN, RS4000 TX/TX (+VPN), RS4004 TX/DTX (+VPN), PCI4000/PCIE4000 (+VPN), DELTA TX/TX (+VPN), SMART2 (+VPN), CORE TX (+VPN), GT/GT (+VPN), CENTERPORT/CENTERPORT VPN-1000; TC MGUARD RS2000/RS4000 3G/4G/4G-VZW/4G-ATT VPN. Does NOT cover the older, discontinued Intel IXP4xx platform (RS non-4000/2000, PCI/266, PCI/533, DELTA non-2, SMART non-2, BLADE) -- a different firmware family not in this ingest batch."
params:
  credentials:
    - ["root", "root"]
references:
  - "User-supplied ingest: um_en_mguard_9_0_105661_en_20.pdf, Phoenix Contact's own current 'Configuration of the mGuard' manual (software release 9.0), Section 7.1.1 'Authentication >> Administrative Users >> Passwords' and 'Management >> System Settings >> Shell Access', fetched and read directly via pdftotext"
  - "User-supplied ingest: um_en_mguard_devices_105656_en_10.pdf, FL MGUARD RS4000/RS2000 device manual, corroborating Login screenshot section"
  - "User-supplied ingest: 'Release Notes.pdf' bundled in mguard-firmware_repositories_mpc_v9.0.0.zip, Chapter 5 'mGuard Product Mapping', fetched and read directly via pdftotext -- exact model/order-number list for the MGUARD2/GT-GT/Centerport2 platforms this firmware applies to"
detection_hints:
  transport: tcp
  app_protocol: ssh
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No narrow wire-level signature is possible for this check — SSH encrypts the session immediately after key exchange, so the specific username/password pair sent is never visible as a plaintext byte pattern on the wire."
    patterns: []
  broad:
    description: "Repeated SSH authentication attempts against this device family from a single source in a short window — the vulnerability class (a credential-guessing pass), not the specific credential, since SSH's encryption prevents matching the actual username/password on the wire"
    patterns:
      - context: request
        regex: "SSH-2\\.0-"
description: >
  Phoenix Contact mGuard industrial firewall/VPN appliances ship a factory-default root account
  (root/root) documented directly in the vendor's own current official manual — "Default root
  password: root", root granting "unlimited access to the mGuard file system." SSH access on
  the device's Internal interface is enabled by default independently of any remote-access
  toggle, and the root user's own SSH login defaults to enabled ("Standard: enabled") — WAN-side
  SSH remote access additionally requires an explicit opt-in, not confirmed default-enabled, so
  this finding is scoped to Internal-interface reachability. CVSS 3.1: 8.8 HIGH
  (AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). The same manual also documents a web-UI default of
  admin/mGuard, not yet built here pending independent wire-format confirmation. No CVE found
  for this specific issue. disclosure_status: public — vendor's own documented factory default.
