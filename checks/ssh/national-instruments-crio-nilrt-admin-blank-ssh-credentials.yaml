# In-charter gap sweep (instrumentation), firmware-sourcing pass 2026-10-07. NI CompactRIO/sbRIO/PXI
# controllers run NI Linux Real-Time. Confirmed from NI's OWN open-source OS build (primary source,
# no gated firmware needed): the NI Linux RT yocto layer `ni/meta-nilrt`:
#   - recipes-ni/niacctbase/niacctbase.bb creates the default `admin` account with NO password
#     (ALLOW_EMPTY=1; the useradd line sets no -p hash; it even symlinks /home/root -> /home/admin).
#   - recipes-connectivity/openssh/openssh_%.bbappend rewrites sshd_config to
#     `PermitEmptyPasswords yes`, `PasswordAuthentication yes`, `PermitRootLogin yes`.
# => A factory/unconfigured (or freshly re-imaged / reset) NI Linux RT target accepts SSH login as
# `admin` with an EMPTY password. NI documents this and ships a hardening utility/guide precisely
# because it is the insecure default (ni/nilrt-snac + nilrt-snac-guide) -> disclosure_status: public.
#
# SCOPE / confidence=low: this is the factory/reset default state. A unit whose admin password was
# set during NI MAX / SystemLink provisioning will NOT match — same conditional-default framing as
# the NetBotz recovery-default check. The empty-password admin account + PermitEmptyPasswords is the
# shipped sshd default; that is what this check tests.
#
# OUI note: gated to NI via fingerprint_precondition vendor, enabled by correcting core/fingerprint.py
# OUI 00:80:2F (was mislabeled "GE Automation"; IEEE assigns it to National Instruments Corp).
# No CVE — documented default behavior, confirmed against NI's own open-source build recipes.

check_id: ssh-national-instruments-crio-nilrt-admin-blank-credentials
protocol: ssh
kind: native
module: checks.ssh.native.ssh_default_creds
destructive: true
risk_reason: ["login"]  # plain SSH login attempt; no device write
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "National Instruments Corp"
params:
  credentials:
    - ["admin", ""]
detection_hints:
  transport: tcp
  app_protocol: ssh
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No narrow wire-level signature is possible — SSH encrypts the session immediately after key exchange, so the admin/<empty> pair this scanner sends is never visible as a plaintext byte pattern on the wire."
    patterns: []
  broad:
    description: "SSH authentication attempts against NI Linux RT devices from a single source in a short window (credential-guessing pass); the actual username/empty-password cannot be matched on the wire because SSH encrypts it."
    patterns:
      - context: request
        regex: "SSH-2\\.0-"
references:
  - "NI Linux RT open-source build, ni/meta-nilrt: recipes-ni/niacctbase/niacctbase.bb (default admin account, ALLOW_EMPTY) + recipes-connectivity/openssh/openssh_%.bbappend (PermitEmptyPasswords/PermitRootLogin yes)"
  - "ni/nilrt-snac + nilrt-snac-guide (NI's own Secured Network-Attached Configuration hardening utility/guide — exists because the default is insecure)"
description: >
  National Instruments CompactRIO / sbRIO / PXI controllers running NI Linux Real-Time ship with a
  default `admin` account that has an empty password, and the default sshd config sets
  PermitEmptyPasswords/PasswordAuthentication/PermitRootLogin to yes — so a factory, re-imaged, or
  reset unit accepts an unauthenticated-equivalent SSH login as admin with no password. Confirmed
  from NI's own open-source NI Linux RT build recipes (ni/meta-nilrt). Conditional (confidence low):
  a unit whose admin password was set during NI MAX/SystemLink provisioning will not match. No CVE —
  documented, vendor-acknowledged default (NI publishes a dedicated hardening guide for it).
