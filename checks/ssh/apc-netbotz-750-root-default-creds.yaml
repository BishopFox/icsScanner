# Default-credentials sweep, 2026-08-25 — user supplied Schneider FAQ FA373416 ("NetBotz 750 |
# Resetting a Lost Root Account Password") directly. Brand-new product for this project: NetBotz
# 750 (NBRK0750 rack monitor, NBWL0755 wireless variant) — an APC/Schneider environmental
# monitoring appliance.
#
# Found inside a password-RESET procedure, not a "what's the default" FAQ, but the reset steps
# themselves state the real factory default plainly: "Log on as the Root user (root). When
# prompted for an existing password (5.3.0 onwards), the default is 'apc'." The FAQ's own Issue
# field frames this account as reachable "via console or SSH" — this check covers the SSH path
# specifically (console/serial access is out of this project's network-scanning scope).
#
# SCOPE: firmware 5.3.0 and above per the FAQ's own explicit qualifier ("(5.3.0 onwards)") —
# older firmware's default is not stated here and is not assumed to match.
#
# CORRECTED 2026-08-25 — NOT a virgin out-of-box default: a second Schneider FAQ ("NetBotz 700
# Series | Configuring Network Settings") describes the NORMAL first-time console setup flow and
# states plainly "Log on with the Root account user name (root) and password (you set the
# password on first use)" — meaning a genuinely never-configured appliance has NO factory-preset
# root password at all. "root:apc" specifically is what the DELIBERATE hardware reset-switch
# recovery procedure sets it to (per FA373416) — still a real, valid finding (any device that has
# gone through that documented recovery procedure and not since had its password changed uses
# root:apc), just not accurately described as a factory-shipped default. Description corrected
# accordingly.
#
# No CVE — documented behavior (recovery-procedure-set value, not a factory-shipped default).
#
# FIRMWARE-CONFIRMED 2026-11-19 (Schneider ingest sweep + independent re-verification): the current
# shipping image PROD_SIGNED_NBRK075x_Build_5.6.0.25 (root.img, ext4) BAKES root:apc into /etc/shadow —
# the $6$ root hash was verified by crypt.crypt('apc', hash) == hash (not just a john claim). sshd is
# enabled by default (sshd.socket symlinked in sockets.target.wants; /usr/sbin/sshd present) and
# sshd_config has PermitRootLogin yes; the firstTime scripts do NOT reset/randomize the root password.
# So on the current firmware apc is the BAKED default in the image itself, not only the reset-procedure
# value — this upgrades the earlier "not a factory-shipped default" hedge. The firmware update is
# CMS-signed (Schneider Root CA chain), so no unsigned-OTA angle. HONEST CAVEATS keeping this below
# high: the out-of-box host firewall (iptables-restore from the PERSISTENT partition, not in the image)
# can't be confirmed from firmware, and a first-use serial commissioning step may set/change the root
# password — both need a live unit. Confidence stays LOW (the scale is binary HIGH/LOW): the firmware
# confirmation strengthens the EVIDENCE, but the ceiling stays low given those unconfirmed caveats.

check_id: ssh-apc-netbotz-750-root-default-creds
protocol: ssh
kind: native
module: checks.ssh.native.ssh_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low  # binary HIGH/LOW scale; stays LOW — out-of-box firewall + possible first-use change not confirmable from firmware
fingerprint_precondition:
  vendor: "American Power Conversion"
params:
  credentials:
    - ["root", "apc"]
detection_hints:
  transport: tcp
  app_protocol: ssh
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No narrow wire-level signature is possible for this check — SSH encrypts the session immediately after key exchange, so the specific username/password pair this scanner sends is never visible as a plaintext byte pattern on the wire."
    patterns: []
  broad:
    description: "Repeated SSH authentication attempts against this device family from a single source in a short window — the vulnerability class (a credential-guessing pass), not a specific guessed value, since SSH's encryption prevents matching the actual username/password on the wire"
    patterns:
      - context: request
        regex: "SSH-2\\.0-"
references:
  - "Schneider Electric FAQ FA373416, \"NetBotz 750 | Resetting a Lost Root Account Password\" (user-supplied)"
  - "This project's firmware analysis 2026-11-19 (NetBotz 75x build 5.6.0.25, PROD_SIGNED_NBRK075x.sedp): root.img /etc/shadow root $6$ hash verified crypt('apc',hash)==hash; sshd.socket enabled in sockets.target.wants; sshd_config PermitRootLogin yes; no first-boot root reset; firmware CMS-signed."
description: "APC (American Power Conversion) NetBotz 750 (NBRK0750, NBWL0755) environmental monitoring appliances use the root SSH password 'apc'. Firmware-confirmed 2026-11-19: the current shipping image (build 5.6.0.25) literally bakes root:apc into /etc/shadow (hash verified to crack to 'apc') with sshd enabled by default and PermitRootLogin yes, and the first-boot scripts do not reset it — so apc is the baked default in the image, not merely the value the documented hardware reset-switch recovery procedure (FA373416) sets. This check attempts a single root:apc SSH login. Honest caveats: a deployed unit's out-of-box host firewall (iptables table on the persistent partition, not in the image) and any first-use serial password change are not confirmable from firmware and need a live unit; hence confidence stays low (binary high/low scale), not high. No CVE — documented behavior per Schneider's own FAQ, now corroborated by firmware."
