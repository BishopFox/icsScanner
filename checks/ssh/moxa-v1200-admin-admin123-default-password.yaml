# Built check 2026-10-06 (Phase 2), promoted from candidates/moxa-v1200-admin-admin123-default-password.yaml.
# CORRECTION vs the candidate: the candidate assumed protocol:http ("web console"). The V1200 series
# are Arm-based EN 50155 rail COMPUTERS running Moxa Industrial Linux (confirmed via Moxa's own V1200
# product page + datasheet: "comes with Moxa Industrial Linux"). MIL has NO default web admin console
# -- its admin/admin@123 default is the Linux account login over SSH / serial console. So this is an
# SSH default-credential check, NOT a web check, and needs no wire-format RE (SSH is standard).
# admin/admin@123 is the Moxa Industrial Linux v3 default (forced change on first login); paramiko's
# connect() reports auth SUCCESS before the change step, which is the finding. Same evidence basis and
# executor as the Phase-1a MIL moxa/moxa + security-dashboard root/moxa SSH checks: vendor-manual-
# documented credential (public) + a standard-protocol login attempt that returns NOT_APPLICABLE if
# the default was changed or SSH is disabled.
check_id: moxa-v1200-admin-admin123-default-password
protocol: ssh
kind: native
module: checks.ssh.native.ssh_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "Moxa V1200 series Arm rail computer (Moxa Industrial Linux; SSH, port 22)"
params:
  credentials:
    - ["admin", "admin@123"]
  default_port: 22
references:
  - "Moxa V1200 Series manual, v3.0 (user-supplied, pdftotext): default account admin / password admin@123, 'the sole default user available from the outset'."
  - "Moxa V1200 Series product page + datasheet (moxa.com, getmedia/fe2466d8-...-datasheet-v1.2.pdf): V1200 are Arm Cortex-A53 EN 50155 rail computers shipping Moxa Industrial Linux -> admin/admin@123 is the MIL v3 SSH/console login (no default web admin console)."
detection_hints:
  transport: tcp
  app_protocol: ssh
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No narrow wire-level signature is possible — SSH encrypts the session immediately after key exchange, so the admin/admin@123 username/password sent is never visible as a plaintext byte pattern on the wire."
    patterns: []
  broad:
    description: "Repeated SSH authentication attempts against a Moxa V1200 / Moxa Industrial Linux host from a single source in a short window — the vulnerability class (a default-login/credential-guessing pass), not the specific credential, which SSH's encryption hides."
    patterns:
      - context: request
        regex: "SSH-2\\.0-"
description: >
  Moxa V1200 series Arm-based EN 50155 rail computers ship Moxa Industrial Linux with a documented
  default login admin/admin@123 (the MIL v3 default, forced-change on first login; auth still
  succeeds, which is the finding). The login surface is SSH / serial console (MIL has no default web
  admin UI), so this is an SSH default-credential check. CVSS 3.1 9.8 CRITICAL. Built against
  checks/ssh/native/ssh_default_creds.py.
