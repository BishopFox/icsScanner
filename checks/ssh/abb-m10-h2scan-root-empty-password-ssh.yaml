# PROMOTED from checks/candidates/abb-m10-h2scan-usbkey-root-empty-password-ssh-unrestricted.yaml
# 2026-10-07 (candidate re-triage). Status-verified before arming: disclosure_status public (not
# undisclosed) and no existing built equivalent. Mechanism confirmed DIRECTLY from firmware (2 units):
#   - /etc/shadow: root::... — the root password field is LITERALLY EMPTY (not * or !),
#   - /etc/ssh/sshd_config: PermitRootLogin yes AND PermitEmptyPasswords yes (explicit overrides),
#   - sshd enabled at boot (rc2.d/rc5.d symlinks).
# => a fully unmitigated, network-exploitable empty-password root SSH login — unlike most empty-root
# findings in this sweep, where SSH/Telnet were confirmed BLOCKED. Reusable executor + empty-string
# password, same shape as the Phoenix TC ROUTER 4000 and NI cRIO blank-password SSH checks.
check_id: ssh-abb-m10-h2scan-root-empty-password
protocol: ssh
kind: native
module: checks.ssh.native.ssh_default_creds
destructive: true
risk_reason: ["login"]  # SSH login attempt (empty password); no device write
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "ABB"
  product: "M10 H2Scan (COMe-mBTi10)"
params:
  credentials:
    - ["root", ""]
detection_hints:
  transport: tcp
  app_protocol: ssh
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No narrow wire-level signature — SSH encrypts the session after key exchange, so the empty-password root login this scanner sends is not visible as a plaintext pattern."
    patterns: []
  broad:
    description: "SSH authentication attempts against an ABB M10 H2Scan from a single source in a short window (blank-password root login attempt)."
    patterns:
      - context: request
        regex: "SSH-2\\.0-"
references:
  - "This project's firmware analysis (2 units): /etc/shadow empty root field + /etc/ssh/sshd_config PermitRootLogin yes / PermitEmptyPasswords yes"
description: >
  ABB M10 H2Scan (COMe-mBTi10) ships root with an empty /etc/shadow password field AND an sshd_config
  that explicitly sets PermitRootLogin yes and PermitEmptyPasswords yes, with sshd enabled at boot —
  so an attacker who can reach SSH logs in as root with no password, fully unmitigated (confirmed on
  two firmware units). This check attempts a single empty-password root SSH login. No CVE — documented
  firmware behavior.
