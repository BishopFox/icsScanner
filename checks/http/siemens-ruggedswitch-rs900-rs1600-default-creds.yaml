# Default-credentials sweep, Phase 22 — scadasecuritybootcamp.com credential-list triage.
# Uses the generic checks/http/native/basic_auth_default_creds.py executor.
#
# RuggedCom was acquired by Siemens in 2012; the RuggedSwitch/RuggedCom ROS product line is now
# fully Siemens-branded (support hosted on industry.siemens.com) — using the existing "Siemens
# AG" fingerprint precondition/OUI entries rather than adding a separate RuggedCom-specific one.
#
# Sources (2 independent): scadasecuritybootcamp.com; the official RuggedCom ROS RS900/RS1600/
# RS8000 Product Family User Guide (mirrored on usermanual.wiki and manualmachine.com), which
# gives the default IP (192.168.254.254) alongside the default admin/admin web-UI login.
#
# No CVE — documented factory-default behavior. Note: this is a DIFFERENT Siemens product line
# from every other Siemens check in this sweep (S7-300 Basisk, SCALANCE X200) — RuggedCom kept
# its own hardware/firmware identity after acquisition, it just doesn't warrant its own OUI
# entry given Siemens' existing broad OUI coverage.

check_id: http-siemens-ruggedswitch-rs900-rs1600-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Siemens AG"
params:
  path: "/"
  credentials:
    - ["admin", "admin"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (admin:admin)"
    patterns:
      - context: request
        regex: "Authorization: Basic YWRtaW46YWRtaW4="
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "http://scadasecuritybootcamp.com/SCADA-Default-Password-List.php"
  - "https://usermanual.wiki/Ruggedcom/RuggedcomRs1600UsersManual525633.1322925101.pdf"
  - "https://manualmachine.com/ruggedcom/rs900/715393-user-manual/"
description: "Siemens RuggedSwitch RS900/RS1600 (RuggedCom ROS) industrial Ethernet switches ship with a factory-default admin/admin web-UI login — no CVE, documented factory-default behavior."
