# Default-credentials sweep, Phase 13. HTTP sibling of
# checks/telnet/carel-pcoweb-default-creds.yaml — see that file for the full source trail
# (RedTeam Pentesting RT-SA-2019-013, CVE-2019-13553). RedTeam's advisory maps admin:fadmin
# specifically to the HTTP web interface (manual section 9.2.1), distinct from the Telnet-only
# account set. A second HTTP-tier account, reserved:freserve, is noted in the advisory as
# OEM-modification-specific rather than universal and was NOT shipped here.

check_id: http-carel-pcoweb-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
cve_id: CVE-2019-13553
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
severity: critical
fingerprint_precondition:
  vendor: "Carel s.p.a."
params:
  path: "/"
  credentials:
    - ["admin", "fadmin"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (admin:fadmin)"
    patterns:
      - context: request
        regex: "Authorization: Basic YWRtaW46ZmFkbWlu"
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
advisory_url: "https://www.redteam-pentesting.de/en/advisories/rt-sa-2019-013/"  # promoted from references (canonical advisory)
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "https://www.redteam-pentesting.de/en/advisories/rt-sa-2019-013/"
description: "CAREL pCOWeb HVAC communication card ships with a hardcoded/default admin/fadmin HTTP web-UI login (CVE-2019-13553, CVSS 9.0) — end-of-life hardware, no firmware fix will be published."
