# Default-credentials sweep, Phase 15. Uses the generic
# checks/http/native/basic_auth_default_creds.py executor. Sibling:
# checks/telnet/deif-awc500-default-creds.yaml.
#
# Sources (2 independent): SCADAPASS, citing the official DEIF Wind Power AWC 500 "Getting
# Started" guide directly; corroborated by a dedicated Darius Freamon post, "DEIF Wind Power
# Technology AWC 500 Wind Turbine Multiple Default Accounts," which also notes (per the
# manual, dated 2013-06-25) that Telnet access works even after the root password has been
# changed via the web interface — a real hardcoded-backdoor-adjacent finding beyond the simple
# default-credential issue, worth flagging for a closer look in a future pass even though this
# check itself only tests the documented default.
#
# root:deif7800 = administrator level, default:1234 = user level — two distinct privilege
# tiers, both shipped. DEIF is a significant grid/renewable-energy controls vendor.
#
# No CVE — documented factory-default behavior.

check_id: http-deif-awc500-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "DEIF A/S"
params:
  path: "/"
  credentials:
    - ["root", "deif7800"]
    - ["default", "1234"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (root:deif7800, default:1234)"
    patterns:
      - context: request
        regex: "Authorization: Basic (cm9vdDpkZWlmNzgwMA==|ZGVmYXVsdDoxMjM0)"
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "https://dariusfreamon.wordpress.com/2015/05/15/deif-wind-power-technology-awc-500-wind-turbine-multiple-default-accounts/"
description: "DEIF AWC 500 Advanced Wind Turbine Controller ships with factory-default root/deif7800 (administrator) and default/1234 (user) web-UI logins — no CVE, documented factory-default behavior."
