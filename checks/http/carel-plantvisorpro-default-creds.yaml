# Default-credentials sweep, Phase 13. Uses the generic
# checks/http/native/basic_auth_default_creds.py executor.
#
# Sources (2 independent): SCADAPASS, citing an official CAREL-hosted quick guide PDF;
# corroborated by an independent WebSearch confirming admin:admin over HTTPS port 443, citing
# CAREL's own product documentation directly.
#
# No CVE — documented factory-default behavior. Different product from the pCOWeb communication
# card (PlantVisorPRO is a plant-supervision/monitoring application, a different device class).

check_id: http-carel-plantvisorpro-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Carel s.p.a."
params:
  path: "/"
  https: true
  default_port: 443
  credentials:
    - ["admin", "admin"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (admin:admin) (this device's web UI uses HTTPS — these bytes are only visible on the wire if TLS is terminated/inspected at the monitoring point, not to a passive plaintext capture)"
    patterns:
      - context: request
        regex: "Authorization: Basic YWRtaW46YWRtaW4="
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s) (this device's web UI uses HTTPS — these bytes are only visible on the wire if TLS is terminated/inspected at the monitoring point, not to a passive plaintext capture)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "https://www.carel.com/documents/10191/0/+040000081/023d426d-4127-4a8c-a994-968a88541753?version=1.0"
description: "CAREL PlantVisorPRO Locale (refrigeration/HVAC plant supervision) ships with a factory-default admin/admin HTTPS web-UI login — no CVE, documented factory-default behavior."
