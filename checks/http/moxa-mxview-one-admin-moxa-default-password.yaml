# Built check — 2026-10-06, promoted from checks/candidates/moxa-mxview-one-admin-moxa-default-password.yaml
# via "method 2" (run/extract the native x86-64 server software). The candidate's blocker was "no
# MXview One server software available this pass to reverse-engineer the login wire protocol."
# Resolved: the vendor's own Linux package (moxa-mxview-one-series-linux-version-software-package-
# v1.4.1.zip, user-supplied ingest) ships two Debian packages; `dpkg-deb -x` the main app
# (MXview_One_Linux_v1.4.1_24091211.deb) exposed the full web tier (usr/mxview/mxview-gateway, a
# Node.js backend + Angular frontend bundle). Both sides of the login were read directly (same
# both-sides-of-firmware rigor as the phoenix-contact-tc-extender check):
#   - BACKEND route mount (dist/bundle.js):
#       this.app.use("/api/tokens", this._noApiKey.bind(this));   // login needs NO API key
#       this.app.use("/api/tokens", new W(e,t,T).getRoutes());    // the token/login router
#     Password check is server-side PBKDF2 (verifyPassword); failure -> HTTP 401 Unauthorized.
#   - FRONTEND login payload (dist/public/*.js): POST to /api/tokens, Content-Type application/json,
#     body {username:..., password:...} (field names confirmed on both sides: backend validates
#     `username: i.string()`), success returns a Token body with accessToken/refreshToken.
#   - DEFAULT CREDENTIAL: admin/moxa, confirmed verbatim in the package's own Readme.txt
#     ("Step 6: ... default credentials are: Username: admin  Password: moxa") AND corroborated by
#     the product's own `/preferences/login/suppress/defaultPasswordNotification` route (MXview One
#     itself warns when the admin/moxa default is unchanged).
# WIRE FORMAT (for json_rest_login_default_creds.py): POST https://<host>/api/tokens, JSON
#   {"username":"admin","password":"moxa"} -> 201 + {accessToken/refreshToken/...} on success,
#   401 on failure. No CSRF token or pre-fetch step on the login endpoint (_noApiKey). Web served
#   over HTTPS on 443 (Readme: "navigate to https://[host IP]"; internal gateway also 8443).
# This is app-code-sourced (authoritative — the server's own route code + the real client payload),
# same evidence basis the project accepts for the phoenix-contact TC EXTENDER armed check. A live
# Docker bring-up of the full stack (postgres-15 + nodejs + seeded admin/moxa, systemd) was the
# intended extra confirmation; see project_open_tasks for its status.

check_id: moxa-mxview-one-admin-moxa-default-password
protocol: http
kind: native
module: checks.http.native.json_rest_login_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "MXview One (network management software, Linux), web console at https://<host>/"
params:
  path: "/api/tokens"
  username_field: "username"
  password_field: "password"
  credentials:
    - ["admin", "moxa"]
  success_status: 201
  success_json_keys: ["accessToken", "refreshToken", "token"]
  https: true
  default_port: 443
references:
  - "User-supplied ingest: moxa-mxview-one-series-linux-version-software-package-v1.4.1.zip. dpkg-deb -x of MXview_One_Linux_v1.4.1_24091211.deb exposed usr/mxview/mxview-gateway: backend dist/bundle.js mounts the login router at `/api/tokens` (this._noApiKey + new W().getRoutes()), server-side verifyPassword (PBKDF2), 401 on failure; frontend dist/public/*.js POSTs JSON {username,password} to /api/tokens and reads accessToken/refreshToken on success."
  - "Package Readme.txt (vendor): default credentials Username: admin / Password: moxa; web at https://[host IP]. Corroborated by the product's own /preferences/login/suppress/defaultPasswordNotification route."
detection_hints:
  transport: tcp
  app_protocol: https
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own JSON POST to /api/tokens carrying {\"username\":\"admin\",\"password\":\"moxa\"}"
    patterns:
      - context: request
        regex: "POST /api/tokens"
      - context: request
        regex: "\"username\"\\s*:\\s*\"admin\".*\"password\"\\s*:\\s*\"moxa\""
  broad:
    description: "Any POST to /api/tokens on a Moxa MXview One host"
    patterns:
      - context: request
        regex: "POST /api/tokens"
description: >
  Moxa MXview One (Linux network-management software) ships a documented default web-console login
  of admin/moxa (vendor Readme + the product's own default-password-notification feature). Its web
  API authenticates via POST https://<host>/api/tokens with JSON {username,password} (no API key /
  no CSRF on the login endpoint), returning HTTP 201 + an accessToken/refreshToken Token body on
  success and 401 on failure — login contract read directly from the vendor package's own backend
  route code (mxview-gateway dist/bundle.js) and frontend payload. CVSS 3.1 9.8 CRITICAL. Built
  against checks/http/native/json_rest_login_default_creds.py.
# LIVE-RUN 2026-10-06 (tools/live-harness/): stood up MXview One v1.4.1 in a systemd container
# (solved the PGDG postgresql-15 dependency puzzle). Install + control panel (https://host:7100)
# run; the MXview One app gateway's own runtime invocation confirms it serves HTTPS on port 443 at
# /api/tokens (this check's endpoint) with --dbpass=89191230 (same value as the mxview mosquitto
# finding). A full live admin/moxa POST capture additionally needs the control panel's site-init
# (DB create+seed) step -- see tools/live-harness/README.md. Check stands on both-sides-of-code
# evidence + this runtime confirmation.
