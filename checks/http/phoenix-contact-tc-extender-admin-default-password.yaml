# Built check — 2026-10-02, promoted from checks/candidates/
# phoenix-contact-tc-extender-default-admin-password.yaml (git-renamed, history preserved). That
# candidate's stated blocker was "no TC EXTENDER firmware was present in this ingest batch (PDF
# manual only) to confirm the exact web-login wire format." Resolved the same day: real current
# shipping firmware (FW_EXTENDER_v512_20260324.zip, firmware 512/2026-03-24, covering 2702255 TC
# EXTENDER 6004 ETH-2S and 2702253 TC EXTENDER 4001 ETH-1S) was reviewed via sidecar/cli.py
# analyze (unblob -> a real UBIFS rootfs at offset 537722 inside the .pxc image).
#
# THE FINDING, from Phoenix Contact's own official "TC EXTENDER" user manual
# (um_en_tc_extender_108102_en_02.pdf, Section 6.4.3.1 "Login page"): the device's web-based
# management ships TWO default accounts, stated verbatim:
#     User name: user  | Password: user   (Limited read and write access, no user management)
#     User name: admin | Password: admin  (Full read and write access, user management)
# A documented "2-2-5 method" physical reset procedure independently forces any unit back to IP
# 192.168.0.254 with admin/admin, regardless of prior reconfiguration, until next restart --
# a second path to the same default.
#
# WIRE FORMAT, confirmed 2026-10-02 from BOTH sides of the real firmware -- the server
# (home/web/html/pxc_json.php) and the actual client JS that builds the real request
# (home/web/html/js/helpfunctions.js's sendJsonDataObjectReturn, called from headline.js's
# login_data()), not inferred from one side alone:
#     POST /pxc_json.php
#     Content-Type: application/x-www-form-urlencoded (jQuery $.ajax default)
#     Body: cmd=<urlencoded JSON [{"obj":"usrLogin","data":{"uname":"...","pw":"..."}}]>
# Success response body (JSON): {"func":"usrLogin","loginState":1,"username":"...","acl":"..."}
# Failure response body (JSON): {"func":"usrLogin","loginState":0,"username":"","acl":""}
# pxc_json.php forwards uname/pw to a native backend object ("8194.0") via an internal
# c_transfer("admin","") RPC class -- that embedded "admin"/"" pair is a FIXED internal-transport
# credential for the PHP<->daemon IPC itself, NOT the web-login credential this check tests, and
# is out of scope here. sidecar's own shadow_passwd_crack routine independently confirmed the
# `user` system account's shadow hash (`user:$1$pJefShJL$CoX8T20vn1g.ug0jZIczM.`) cracks to the
# literal string "user", matching the manual's documented default for that role from the actual
# shipped firmware, not just the manual.
#
# NEW EXECUTOR BUILT FOR THIS CHECK: checks/http/native/json_envelope_post_default_creds.py --
# no existing executor matched this exact "one form field holds a JSON envelope, success read
# from a loginState field whose KEY is present on both success and failure" shape.
# json_rest_login_default_creds.py's success_json_keys only checks key PRESENCE, not a value
# match, so it can't distinguish loginState:1 from loginState:0 -- the new executor's
# success_json_field/success_json_value pair does an exact-value comparison instead.
#
# CVE CONTEXT: the same targeted WebSearch that found CISA ICSA-23-250-02 / SEC Consult's
# advisory for Phoenix Contact's sibling TC ROUTER / TC CLOUD CLIENT product line did not surface
# TC EXTENDER by name in that specific advisory -- treated as its own finding rather than assumed
# identical, though the shared "TC" product family naming and near-identical default-credential
# shape (admin/admin, user role) suggest a related lineage. No TC-EXTENDER-specific CVE found.
#
# SEVERITY: CVSS v3.1 scored via the installed `cvss` Python package:
#   Vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
#   Base Score: 9.8 (CRITICAL) -- full read/write configuration access to industrial network
#   extension hardware via a single well-known credential, independently re-reachable via a
#   documented physical reset procedure.
#
# OPEN QUESTIONS, honestly recorded: (1) whether current-production (2026) units still ship this
# credential as an unchanged factory default is unknown beyond what the vendor's own CURRENT
# manual documents; (2) `admin`'s own credential is taken on the manual's authority, not
# independently cracked from a shadow hash the way `user`'s was -- no `admin` Linux account exists
# in /etc/shadow at all (only `root` and `user`), consistent with "admin" being a web-application
# role name checked by the native backend daemon (object 8194.0), not a second Unix account; (3) a
# real, unresolved lead -- NOT folded into this finding -- was found in the same firmware: the
# device's own firewall bootstrap scripts (etc/iptables/local_base.sh, start_config.sh) both
# contain an unconditional `exit 0` before the lines that would lock down /etc/inetd.conf's
# legacy services (telnetd, rshd, rlogind, vsftpd, in.fingerd, in.identd) -- but a compiled binary
# (usr/bin/bg_control) also references "iptables" and may set the real runtime policy
# programmatically instead, so this is NOT asserted as a live firewall-bypass finding, only
# recorded as an open question for a future pass (would need bg_control decompiled or a live
# unit's listening ports checked).

check_id: http-phoenix-contact-tc-extender-admin-default-password
protocol: http
kind: native
module: checks.http.native.json_envelope_post_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Phoenix Contact"
  product: "TC EXTENDER 6004 ETH-2S (2702255) / TC EXTENDER 4001 ETH-1S (2702253) -- industrial Ethernet extender"
params:
  path: "/pxc_json.php"
  envelope_field: "cmd"
  obj_name: "usrLogin"
  username_field: "uname"
  password_field: "pw"
  credentials:
    - ["admin", "admin"]
    - ["user", "user"]
  success_json_field: "loginState"
  success_json_value: 1
  default_port: 80
references:
  - "User-supplied ingest: um_en_tc_extender_108102_en_02.pdf, official Phoenix Contact TC EXTENDER manual, Section 6.4.3.1 'Login page' and Section 6.4.2 'Alternative access to the web-based management system, the 2-2-5 method', fetched and read directly via pdftotext"
  - "User-supplied ingest: FW_EXTENDER_v512_20260324.zip (firmware 512, 2026-03-24, current shipping release for 2702255/2702253), extracted via sidecar/cli.py analyze (unblob -> UBIFS rootfs); home/web/html/pxc_json.php and home/web/html/js/helpfunctions.js + headline.js read directly to confirm the exact web-login request/response wire format; etc/shadow's `user` account hash independently cracked to the literal string 'user' via sidecar's own shadow_passwd_crack routine"
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own JSON-envelope POST to /pxc_json.php carrying the literal default credential (uname/pw both 'admin', or both 'user') inside the urlencoded 'cmd' field"
    patterns:
      - context: request
        regex: "POST /pxc_json\\.php"
      - context: request
        regex: "cmd=%5B%7B%22obj%22%3A\\+%3F%22usrLogin%22.*%22pw%22%3A\\+%3F%22(admin|user)%22"
  broad:
    description: "Any usrLogin-envelope POST to /pxc_json.php against this device -- the vulnerability class (default/weak webapp credentials), not the specific guessed value"
    patterns:
      - context: request
        regex: "POST /pxc_json\\.php"
      - context: request
        regex: "cmd=%5B%7B%22obj%22%3A\\+%3F%22usrLogin%22"
description: >
  Phoenix Contact TC EXTENDER (industrial Ethernet extension hardware) ships two factory-default
  web-management accounts, documented directly in the vendor's own manual: user/user (limited
  read/write, no user management) and admin/admin (full access, user management). A documented
  physical "2-2-5" reset procedure independently forces any unit back to IP 192.168.0.254 with
  admin/admin, regardless of prior reconfiguration, until next restart -- a second path to the
  same default. Confirmed from real current-shipping firmware (v512, 2026-03-24): the `user`
  account's shadow hash cracks to the literal "user", and the web-login wire format is fully
  confirmed from both server and client code -- POST /pxc_json.php,
  cmd=<urlencoded JSON [{"obj":"usrLogin","data":{"uname":...,"pw":...}}]>, success/failure read
  from a `loginState` field (1/0) in the JSON response. CVSS 3.1: 9.8 CRITICAL
  (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). disclosure_status: public -- the vendor's own manual
  already documents both defaults openly.
