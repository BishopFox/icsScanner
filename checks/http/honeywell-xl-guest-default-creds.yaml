# Default-credentials sweep, Phase 8 — surfaced by the SCADAPASS cross-reference against
# Honeywell (already "closed out" in Phase 4). Uses the generic
# checks/http/native/basic_auth_default_creds.py executor.
#
# Sources: SCADAPASS lists Guest:guest AND SysAdmin:honey for "Honeywell XL" with no citation
# URL on that row. Only Guest:guest is shipped here — an independent WebSearch corroborated
# Guest:guest specifically (converging router-default aggregator sites), but found NO
# independent corroboration for SysAdmin:honey at all, so that pair was dropped rather than
# guessed into the params list.
#
# DIFFERENT finding from checks/candidates/honeywell-xl-web-ii-hardcoded-password.yaml
# ("remad-1234", XL Web II specifically, source-confirmed via the researcher's own advisory but
# blocked on the withheld endpoint) — "Honeywell XL" here is the wider XL/Excel product line's
# own separate factory-default account, not a resolution of that candidate. Both may be real,
# independent facts about the same product family.
#
# confidence: low — single-tier corroboration (router-default aggregators only, no primary
# manual or vendor advisory found), matching this project's honest-tiering convention. No CVE.

check_id: http-honeywell-xl-guest-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Honeywell International"
params:
  path: "/"
  credentials:
    - ["Guest", "guest"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (Guest:guest)"
    patterns:
      - context: request
        regex: "Authorization: Basic R3Vlc3Q6Z3Vlc3Q="
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "https://www.192-168-1-1-ip.co/router/honeywell/honeywell-xl/14587/"
description: "Honeywell XL/Excel building controllers ship with a factory-default Guest/guest web-UI login — no CVE, documented factory-default behavior, single-tier source corroboration."
