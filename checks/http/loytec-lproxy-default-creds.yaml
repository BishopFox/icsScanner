# Default-credentials sweep, Phase 14. HTTP sibling of
# checks/http/loytec-multidevice-default-creds.yaml — L-Proxy CEA-709 Gateway is a DIFFERENT
# LOYTEC product with a DIFFERENT password (admin:admin, not admin:loytec4u) per SCADAPASS's own
# separate row, citing the same Darius Freamon post.

check_id: http-loytec-lproxy-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "LOYTEC electronics GmbH"
params:
  path: "/"
  credentials:
    - ["admin", "admin"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (admin:admin)"
    patterns:
      - context: request
        regex: "Authorization: Basic YWRtaW46YWRtaW4="
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "https://dariusfreamon.wordpress.com/2016/02/01/loytec-electronics-multiple-devices-web-interface-default-admin-credentials/"
description: "LOYTEC L-Proxy CEA-709 Gateway ships with a factory-default admin/admin web-UI login — no CVE, documented factory-default behavior."
