# PROMOTED from checks/candidates/moxa-thingspro-gateway-default-password.yaml, 2026-09-22 --
# disclosure_status was already `public` (vendor-documented factory-default credentials, not an
# undisclosed finding this project discovered), and the exact login wire format has now been
# fully characterized by extracting and reading the real ThingsPro Gateway v2.6.0 web-UI
# application code (not guessed) -- see the candidate file's own header for the full sourcing
# history of the credentials themselves.
#
# WIRE FORMAT, confirmed directly from the shipped Angular frontend bundle: obtained the real
# installer (moxa-thingspro-gateway-series-v2.6.0-installation-debian9-software-package.tgz,
# fetched from Moxa's own CDN), unpacked FOUR nested archive layers (.tgz -> .frm -> .pkg ->
# archive.tar.gz, a local apt-repo mirror) to reach `thingspro-gateway-webapp_0.4.6_all.deb`, the
# actual web management UI package, then read its bundled `js/bundle.webapp.js` (an Angular/
# webpack production bundle, not obfuscated beyond minification -- variable names are
# single-letter but string literals and object-literal keys survive intact):
#   - The login form's own data model literally is `{email: "", password: "", isKeepEmail: false}`
#     (login-page.service, `this.data.content = {...}`) -- NOT "username", an email-style field.
#   - `userService.login(t)` calls `this.auth.login("/auth/local", t)`, passing that whole object
#     through unmodified (including isKeepEmail, a "remember me" UI preference, not stripped
#     before the request).
#   - The generic `auth`/`rest` service wrapper is a thin pass-through to Angular's own
#     `$http.post(...)`, which sends a standard `Content-Type: application/json` body -- a real
#     JSON POST, not an HTML form submission.
#   - On success: `.then(function(t){return n.appService.connectWs(t.data.token)})` -- the
#     response body contains a top-level `token` key.
#   - On failure: `.catch(function(t){401===t.status? ... })` -- explicit HTTP 401 on rejection.
# No literal success HTTP status code was found in the frontend code (Angular's $http resolves
# on any 2xx via .then() without checking a specific code) -- confirmation relies on the
# `token` response key instead, which IS explicitly checked, rather than guessing a status code.
#
# extra_fields support was added to checks/http/native/json_rest_login_default_creds.py
# specifically for this finding -- the real client sends `isKeepEmail` alongside email/password,
# and rather than assume the backend safely ignores an unexpected extra field, this check
# reproduces the real request shape exactly.
#
# NOT INDEPENDENTLY VERIFIED against a live device or a full mock reproduction of the actual
# Sanji backend (no live ThingsPro Gateway unit or emulator available) -- the wire format is
# sourced from the real shipped client code, the strongest evidence available without live
# hardware, and end-to-end tested against a local mock server built to reproduce this exact
# confirmed shape. The exact TCP port is not independently confirmed either -- no nonstandard
# port reference was found anywhere in the frontend bundle or install scripts, so the vendor
# manual's documented "https://192.168.4.127" (implying the standard 443) is used as configured
# here, consistent with this project's other HTTPS-default checks.

check_id: http-moxa-thingspro-gateway-default-password
protocol: http
kind: native
module: checks.http.native.json_rest_login_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "ThingsPro Gateway"
params:
  path: "/auth/local"
  username_field: "email"
  password_field: "password"
  extra_fields:
    isKeepEmail: false
  credentials:
    - ["admin@moxa.com", "admin1234"]
    - ["root@moxa.com", "root1234"]
  success_json_keys: ["token"]
  failure_status: 401
  https: true
  default_port: 443
references:
  - "Moxa ThingsPro Gateway Series Manual, v11.0, user-supplied, 'Accessing Your ThingsPro Gateway' section -- credentials"
  - "Moxa ThingsPro Gateway for AWS IoT manual, v6.0, user-supplied -- independently confirms the identical credentials"
  - "moxa-thingspro-gateway-series-v2.6.0-installation-debian9-software-package.tgz, fetched directly from Moxa's own CDN 2026-09-22 -- wire format extracted from the real thingspro-gateway-webapp_0.4.6_all.deb package's bundle.webapp.js"
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own JSON POST to /auth/local with the documented factory-default credential ({\"email\":\"admin@moxa.com\",\"password\":\"admin1234\",\"isKeepEmail\":false})"
    patterns:
      - context: request
        regex: "POST /auth/local"
  broad:
    description: "Any POST to /auth/local on this device — the vulnerability class (guessable default credential against this specific REST endpoint), not just this scanner's own guessed value"
    patterns:
      - context: request
        regex: "POST /auth/local HTTP/1\\.[01]"
description: >
  Moxa's ThingsPro Gateway ships two hardcoded factory-default accounts — admin@moxa.com/
  admin1234 and a genuine root-tier account root@moxa.com/root1234 — documented directly in
  Moxa's own official manual, reachable via HTTPS at the default management IP 192.168.4.127.
  The login wire format (POST /auth/local, JSON body {email, password, isKeepEmail}, success
  signalled by a "token" key in the JSON response, failure by HTTP 401) was extracted directly
  from the real ThingsPro Gateway v2.6.0 web application's own shipped Angular frontend code, not
  guessed. CVSS 3.1: 9.8 CRITICAL (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). disclosure_status: public
  (sourced from Moxa's own manual — vendor-documented factory-default behavior, not an
  undisclosed finding).
