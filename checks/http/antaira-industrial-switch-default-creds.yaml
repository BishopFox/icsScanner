# Default-credentials sweep, Phase 20 — second Metoree category worked
# (us.metoree.com/categories/102285, "Industrial Ethernet Switch Manufacturers" — Metoree's
# other categories beyond PLCs, flagged as open in Phase 19). Uses the generic
# checks/http/native/basic_auth_default_creds.py executor.
#
# Source: official Antaira LNX-602N manual (ManualsLib-hosted, "Admin Password; IP
# Configuration" section, fetched directly) — quotes the setup wizard text verbatim: 'Key in
# the new username (The default is "admin")' / 'Key in the new password (The default is
# "admin")'. Corroborated by an independent WebSearch converging on the same admin:admin default
# across Antaira's broader industrial switch line, described as applying via both web and CLI
# (Telnet/console) management.
#
# No CVE — documented factory-default behavior.

check_id: http-antaira-industrial-switch-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Antaira Technologies, LLC"
params:
  path: "/"
  credentials:
    - ["admin", "admin"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (admin:admin)"
    patterns:
      - context: request
        regex: "Authorization: Basic YWRtaW46YWRtaW4="
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://us.metoree.com/categories/102285/"
  - "https://www.manualslib.com/manual/992012/Antaira-Lnx-602n.html?page=17"
description: "Antaira industrial managed Ethernet switches ship with a factory-default admin/admin web-UI login — no CVE, documented factory-default behavior."
