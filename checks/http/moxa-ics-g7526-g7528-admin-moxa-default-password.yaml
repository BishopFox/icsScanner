# Moxa ICS-G7526/G7528 managed-switch web default-login — built 2026-10-13, promoted from
# checks/candidates/moxa-ics-g7526a-g7528a-hardcoded-admin-password.yaml (kept as research record)
# after firmware review (moxa-ics-g7526-ics-g7528-series-firmware-v3.5.rom -> eCos image via the new
# moxa_rom sidecar handler). Documented-default class (admin/moxa) -> disclosure_status: public, a
# detection check (Moxa declines these as "documented, user-changeable defaults" but the exposure is
# real for operators still on the default; shipped per the Moxa-decline precedent).
#
# LOGIN WIRE FORMAT CONFIRMED FROM FIRMWARE (WebLink/eCos login page JS): a THIRD Moxa variant ("C")
# distinct from the executor's A(SetSHA256)/B(SetPass/MD5 stream-obfuscate): form account_password_form,
# POST /home.asp, with account=<user> (plaintext), logpwd=MD5(password+chall), chall=<client-chosen,
# echoed from the hidden "chall" field>. Driven by the moxa_web_login_default_creds executor's new
# password_hash: md5_concat mode (logpwd = md5_hex(password + challenge); account plaintext; the GET
# page's hidden chall field is read + resubmitted).
#
# confidence: low -- NOT live-verified. The exact login_path (the GET page that serves the form + the
# hidden `chall` field) is inferred as "/" (the unauthenticated root); adjust if a live unit differs.
# login_path verify 2026-10-13: the eCos server uses Location:%s redirects for unauth clients; the exact
# login-form GET path could NOT be pinned from firmware alone -> login_path:/ stays an inference (needs a live
# unit); confidence:low is correct.
# Default creds admin/moxa confirmed (prior Moxa work + firmware). Failure strings ("Password Failed",
# "No Such Account", "Server Time out") read directly from the firmware. CWE-1392. No CVE.

check_id: moxa-ics-g7526-g7528-admin-moxa-default-password
protocol: http
kind: native
module: checks.http.native.moxa_web_login_default_creds
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "Moxa ICS-G7526/G7528 (ICS-G7526A/G7528A) managed switch (web console)"
params:
  login_path: "/"
  action_path: "/home.asp"
  credentials:
    - ["admin", "moxa"]
  challenge_field: "chall"
  password_hash: "md5_concat"
  account_field: "account"
  password_field: "logpwd"
  transform_account: false
  send_account: true
  failure_indicators: ["Password Failed", "No Such Account", "Server Time out", "account_password_form"]
  success_is_absence_of_failure: true
  default_port: 80
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's POST /home.asp with account=admin + logpwd=md5('moxa'+chall) + the echoed chall field -- the Moxa ICS-G7526/G7528 variant-C challenge login with the default admin/moxa credential."
    patterns:
      - context: request
        regex: "POST /home\\.asp"
      - context: request
        regex: "logpwd="
  broad:
    description: "Repeated POSTs to /home.asp with account/logpwd/chall against a Moxa switch -- a credential-guessing pass; indistinguishable from a legitimate login on the wire."
    patterns:
      - context: request
        regex: "logpwd=.*chall="
references:
  - "moxa-ics-g7526-ics-g7528-series-firmware-v3.5.rom -> moxa_inner_image.bin (eCos): login form account_password_form, action /home.asp; JS theValue=MD5(op+chall) submitted as logpwd; hidden name=\"chall\"; failure strings 'Password Failed'/'No Such Account'. Default admin/moxa."
