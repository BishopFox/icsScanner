# Default-credentials sweep, Phase 11. Uses the generic
# checks/http/native/basic_auth_default_creds.py executor.
#
# Sources (2 independent): SCADAPASS, citing an Emerson community media-gallery page directly;
# corroborated by a dedicated Darius Freamon blog post, "Emerson Network Power Devices (now
# Vertivco) Multiple Default Passwords," covering this exact product family.
#
# No CVE — documented factory-default behavior. Note: this is IT/facilities power infrastructure
# (rack PDU) rather than classic process-control ICS, but it's the kind of OT/IT-boundary
# equipment that commonly sits in the same data-center/control-room network segment as real ICS
# gear — in scope for the same reason Avocent/Liebert web cards are.

check_id: http-emerson-mph2-rack-pdu-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Emerson Electric"
params:
  path: "/"
  credentials:
    - ["admin", "admin"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (admin:admin)"
    patterns:
      - context: request
        regex: "Authorization: Basic YWRtaW46YWRtaW4="
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "https://dariusfreamon.wordpress.com/2017/11/20/emerson-network-power-devices-now-vertivco-multiple-default-passwords/"
description: "Emerson Network Power MPH2 Rack PDU ships with a factory-default admin/admin web-UI login — no CVE, documented factory-default behavior."
