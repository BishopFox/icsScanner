# PROMOTED from checks/candidates/hms-anybus-atlas2plus-osiris-default-credentials-socketio-login.yaml,
# 2026-09-23 -- disclosure_status was already `public` (vendor-documented factory default, not an
# undisclosed finding) and the exact Socket.IO wire format was fully characterized directly from
# the shipped Angular bundle. The only blocker (no Socket.IO-capable executor existed) is resolved
# by checks/http/native/socketio_login_default_creds.py, built alongside this promotion. See the
# candidate file's own header for the full firmware-extraction and codebase-sharing evidence.
#
# HMS Industrial Networks' Anybus Atlas2 Plus (DIN-rail network monitoring/diagnostics gateway)
# and its sibling product Osiris/Mercury (confirmed, via extracted firmware, to be the SAME
# codebase branded at runtime from a machine-type flag) ship a factory-default web-UI login of
# admin/admin, documented identically in both products' own official user manuals. Osiris's
# manual additionally documents engineer/engineer and operator/operator as further default-active
# accounts (a fourth account, networkengineer, is explicitly disabled by default per the manual
# and excluded here). Default HTTPS management IP: 192.168.1.10 (Office interface).
#
# Login mechanism, read directly from the shipped main-es2015.*.js Angular bundle: the client
# emits a Socket.IO "login" event with {username, password, client: "angular js"}; the server
# replies via its OWN "login" event with {loggedIn: bool, sessionId: ...} -- not a REST call, not
# an HTML form, not HTTP Basic Auth.

check_id: http-hms-anybus-atlas2plus-osiris-default-credentials-socketio-login
protocol: http
kind: native
module: checks.http.native.socketio_login_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "HMS Industrial Networks (Anybus)"
  product: "Anybus Atlas2 Plus (DIN-rail network monitoring/diagnostics gateway) and Osiris/Mercury (same underlying platform)"
params:
  username_field: "username"
  password_field: "password"
  extra_fields:
    client: "angular js"
  success_key: "loggedIn"
  credentials:
    - ["admin", "admin"]
    - ["engineer", "engineer"]
    - ["operator", "operator"]
  https: true
  default_port: 443
references:
  - "User-supplied ingest: 20250114-atlas2-plus-user-manual.pdf, 'Anybus Atlas2 Plus - Next Generation User Manual' (December 2025), fetched and read directly via pdftotext"
  - "User-supplied ingest: osiris-user-manual-anybus-compressed.pdf, 'User Manual Osiris' (2023), sections 16.1.1-16.1.3, fetched and read directly via pdftotext"
  - "User-supplied ingest: atlas2plus_1.1.150-3681.zip -> Atlas2Plus_1.1.150-3681.upd, extracted via unsquashfs (RAUC bundle) then loop-mounted ext4 rootfs; login wire format read directly from the shipped main-es2015.*.js Angular bundle"
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own Socket.IO 'login' event carrying the documented factory-default credential ({\"username\":\"admin\",\"password\":\"admin\",\"client\":\"angular js\"})"
    patterns:
      - context: request
        regex: "42\\[\"login\","
  broad:
    description: "Any Socket.IO 'login' event emission against this device — the vulnerability class (guessable default credential against this specific event), not just this scanner's own guessed value. '42[\"login\",' is the Socket.IO v4 EVENT packet prefix (Engine.IO MESSAGE=4, Socket.IO EVENT=2) for an event named \"login\"."
    patterns:
      - context: request
        regex: "42\\[\"login\","
description: >
  HMS Industrial Networks' Anybus Atlas2 Plus and its sibling product Osiris/Mercury (confirmed
  to be the same codebase, branded at runtime) ship a factory-default web-UI login of
  admin/admin, engineer/engineer, and operator/operator, documented directly in both products'
  own official user manuals. Login is submitted over Socket.IO (client emits "login" with
  {username, password, client}, server replies via its own "login" event with {loggedIn,
  sessionId}) — confirmed directly from the shipped firmware's own Angular JS bundle, not
  assumed. A forced password change follows first login, mitigating an already-provisioned
  device but not a factory-reset or never-configured one. CVSS 3.1: 9.8 CRITICAL
  (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). No CVE — vendor-documented factory-default behavior,
  explicitly flagged by the vendor's own manual as something to change immediately.
