check_id: eaton-green-motion-appservice-basic-auth-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no lockout mechanism found in the firmware source reviewed
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Eaton"
  product: "Green Motion EV charging station (Livigno/cm3-dc/cm4-dc AppService REST API)"
params:
  credentials:
    - ["admin", "admin"]
  path: "/api/v1/Dictionaries"
  success_status: 200
  https: false
  default_port: 8082
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth header carrying the literal default credential against the AppService's own Dictionaries endpoint — verified directly against basic_auth_default_creds.py's own base64 encoding of admin:admin"
    patterns:
      - context: request
        regex: "GET /api/v1/Dictionaries"
      - context: request
        regex: "Authorization: Basic YWRtaW46YWRtaW4="
  broad:
    description: "Any request to the AppService's /api/v1/* REST namespace on TCP/8082 — the underlying charging-station application platform, not just this specific guessed credential"
    patterns:
      - context: request
        regex: "GET /api/v1/"
references:
  - "boxproxy/Webservice/BasicAuth.py, extracted directly from RC-v2106 - Livigno/cm3-dc-app2106.fup (gunzip -> tar -> unsquashfs, genuinely unencrypted), user-supplied ingest"
  - "boxproxy/Webservice/AppService.py, same firmware extraction — confirms port 8082, plain HTTP, 0.0.0.0 binding, and the check_routes_auth middleware's use of HTTP Basic Auth"
description: >
  Eaton Green Motion EV charging stations (Livigno firmware, cm3-dc/cm4-dc charging modules) run
  an "AppService" REST API on TCP port 8082, plain HTTP, bound to all interfaces (0.0.0.0) —
  confirmed by directly extracting and reading the actual Python source code from a genuinely
  unencrypted firmware update package (gunzip -> tar -> unsquashfs, no decryption needed). The
  service's own BasicAuth.py module hard-codes DEFAULT_USER='admin'/DEFAULT_PASS='admin' as the
  factory-default/recovery credential, verified via standard HTTP Basic Auth against a real,
  parameter-free endpoint (/api/v1/Dictionaries). High confidence: both the credential and the
  exact wire protocol/port/binding come directly from the device's own shipping firmware source
  code, not documentation or inference. Distinct from the sibling
  eaton-green-motion-ev-charger-default-password.yaml candidate (a different credential, "eaton",
  via a separate Commissioning Tool mechanism this check does not target).
