# Built check — 2026-10-01, promoted from checks/candidates/
# phoenix-contact-tc-dsl-router-x400-x500-hardcoded-admin-password.yaml (git-renamed, history
# preserved). The ORIGINAL candidate's open question #2 ("does the whole web UI require Basic
# Auth, or only specific paths") is now resolved by direct re-analysis of the same two firmware
# files, and is SPLIT OUT of this file: a separate, undisclosed hardcoded Basic Auth credential set
# gating /cgi-bin/p and /cgi-bin/p/adm was found in the same pass and is tracked instead at
# checks/candidates/phoenix-contact-tc-dsl-router-x400-x500-cgi-bin-p-hardcoded-basic-auth-credentials.yaml
# (held pending responsible disclosure) -- NOT this file's finding, which stays public.
#
# THE FINDING, cracked directly from the vendor's own shipped firmware, not guessed or assumed:
# Phoenix Contact's TC DSL ROUTER X400 A/B (2902709) and X500 A/B (2902710) ship a hardcoded
# `admin` account in `/etc/passwd` whose password cracks to the literal string "admin":
#     admin:$1$$CoERg7ynjYLsj2j4glJ34.:0:0:root:/root:/bin/ash
# Cracked via Python's `crypt` module (`crypt.crypt("admin", "$1$")` reproduces the exact stored
# MD5-crypt hash). CONFIRMED ACROSS TWO FIRMWARE VERSIONS SPANNING 3 YEARS, BYTE-IDENTICAL:
# Release_Upgrade_v1.06.2-r02-o.zip (v1.06.2, 2016-11-20) and Release_Upgrade_v1.06.4-02.zip
# (v1.06.4, 2019-09-02) -- the same hardcoded credential persisted unchanged for at least 3 years,
# despite both firmware versions documenting real, active security maintenance elsewhere (SSH/
# IPsec/OpenVPN/TLS CVE fixes).
#
# VENDOR'S OWN DOCUMENTATION CONFIRMS THIS IS A KNOWN, DOCUMENTED DEFAULT, not a hidden backdoor:
# Phoenix Contact's own official user manual (um_en_tc_dsl_router_105554_en_00.pdf, Author
# "PHOENIX CONTACT GmbH & Co. KG", CreationDate 2013-06-06, found via this project's own docscan
# credential-phrase scan during an onesight.solutions firmware/docs sourcing sweep 2026-09-30),
# Table 3-1 ("Access levels with user name and default password"), page 27, states in plain text:
#     User role                                        User name   Password
#     Read access to "Device Information" menu item.    user        public
#     Unrestricted access to all areas                  admin       admin
# This is a SECOND, fully independent, PRIMARY VENDOR SOURCE confirming admin/admin (not just this
# project's own /etc/passwd hash-cracking), plus a previously-unknown "user"/"public" read-only
# tier this project's hash-cracking alone never surfaced (password-less accounts don't show up in
# /etc/passwd hash-cracking). Phoenix Contact's manual explicitly tells operators to change the
# password during initial configuration -- the same shape as most other disclosure_status:public
# candidates in this project. disclosure_status: public accordingly; nothing left to responsibly
# disclose.
#
# WIRE FORMAT, re-confirmed 2026-10-01 via direct firmware analysis (not assumed): this device's
# native BusyBox httpd (`usr/sbin/httpd -> ../../bin/busybox`, v1.18.5) does NOT gate this login at
# the server-config level at all -- `/etc/httpd.conf`'s only Basic Auth directives protect
# /cgi-bin/p and /cgi-bin/p/adm with a DIFFERENT, undisclosed credential set (see the split-out
# candidate above); the main WBM entry point (`/cgi-bin/index.cgi`, served from `H:/wbm`, no
# `I:` index directive and no index.html in the web root, so the real URL is the CGI path
# directly) is UNPROTECTED by the server itself. `index.cgi` is a 3KB wrapper linking
# `libwbm.so`, which exports `get_auth`, `crypt_detect`, `crypt`, `crypt_cmp`, `base64_decode` --
# i.e. the WBM login (admin/admin, user/public) is verified by the APPLICATION itself, almost
# certainly via a self-issued HTTP Basic Auth challenge/response checked against the real
# /etc/passwd crypt hash, not BusyBox's native per-path mechanism. This project's existing
# checks/http/native/basic_auth_default_creds.py executor sends `Authorization: Basic` preemptively
# on every request regardless of whether a 401 challenge preceded it, which matches this
# architecture correctly -- `path` set to `/cgi-bin/index.cgi` (the real, evidenced endpoint)
# rather than a guessed bare "/".
#
# CVE CHECK: a targeted WebSearch found the SEC Consult command-injection advisory
# ("Authenticated Command Injection In Phoenix Contact TC Router & TC Cloud Client", a DIFFERENT
# vulnerability, cited only to corroborate /cgi-bin/p/... as a real externally-verified attack
# surface on this product family) and Phoenix Contact's own product pages, but no existing public
# disclosure describing this specific default admin/admin credential as its own named issue --
# though the vendor's own manual already fully discloses the default, so no disclosure is needed.
#
# SEVERITY: CVSS v3.1 scored via the installed `cvss` Python package (not hand-estimated):
#   Vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
#   Base Score: 9.8 (CRITICAL) -- full admin-role access to an internet-facing remote-access
#   router (VPN/port-forwarding capable) via a single vendor-documented, unchanged-for-years
#   default credential.
#
# OPEN QUESTIONS, honestly recorded: (1) whether current-production (2026) TC DSL Router units
# still ship this credential is unknown -- only firmware through the 2019 v1.06.4 release was
# available in this ingest batch; (2) the EXACT HTTP response this login flow produces (status
# code on success, whether a 401 challenge precedes it, cookie/session behavior afterward) was not
# independently captured against a live device or via full MIPS disassembly of libwbm.so --
# `success_status` below is the executor's own default (200), not independently confirmed for this
# specific device.

check_id: http-phoenix-contact-tc-dsl-router-x400-x500-admin-default-password
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Phoenix Contact"
  product: "TC DSL ROUTER X400 A/B (2902709) / X500 A/B (2902710)"
params:
  path: "/cgi-bin/index.cgi"
  credentials:
    - ["admin", "admin"]
    - ["user", "public"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (admin:admin, user:public) against /cgi-bin/index.cgi"
    patterns:
      - context: request
        regex: "GET /cgi-bin/index\\.cgi HTTP/1\\.[01]\\r\\n.*Authorization: Basic (YWRtaW46YWRtaW4=|dXNlcjpwdWJsaWM=)"
  broad:
    description: "Any HTTP Basic Auth attempt against this device's WBM entry point -- the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET /cgi-bin/index\\.cgi HTTP/1\\.[01]\\r\\n.*Authorization: Basic"
advisory_url: "https://sec-consult.com/vulnerability-lab/advisory/authenticated-command-injection-in-phoenix-contact-tc-router-tc-cloud-client/"  # promoted from references (canonical advisory)
references:
  - "User-supplied ingest: Release_Upgrade_v1.06.2-r02-o.zip (v1.06.2, 2016-11-20) -- gzip-wrapped tar -> mdm/fullimage.tar -> root-squashfs.img, unsquashfs'd directly, /etc/passwd read and cracked"
  - "User-supplied ingest: Release_Upgrade_v1.06.4-02.zip (v1.06.4, 2019-09-02) -- DER PKCS#7 SignedData, content extracted via 'openssl cms -verify -noverify', same fullimage.tar/root-squashfs.img structure, byte-identical /etc/passwd hash confirmed"
  - "https://sec-consult.com/vulnerability-lab/advisory/authenticated-command-injection-in-phoenix-contact-tc-router-tc-cloud-client/ -- cited for corroboration of the /cgi-bin/p/... attack surface on this product family only, NOT the source of this finding"
  - "um_en_tc_dsl_router_105554_en_00.pdf (Phoenix Contact's own official User Manual, 2013-06-06), Table 3-1 page 27 -- PRIMARY VENDOR SOURCE confirming both admin/admin and user/public as documented factory defaults"
description: >
  Phoenix Contact's TC DSL ROUTER X400 A/B and X500 A/B (2902709/2902710) -- internet-facing-
  capable remote-access routers with OpenVPN/IPsec/DynDNS/port-forwarding -- ship a documented
  factory-default WBM login: admin/admin (full access) and user/public (read-only Device
  Information). Confirmed via the vendor's own 2013 official user manual (Table 3-1) and
  independently via cracking the device's /etc/passwd admin hash, byte-identical across two
  firmware releases three years apart. The WBM login is verified by the application itself
  (libwbm.so's get_auth/crypt_cmp against the real /etc/passwd hash), not BusyBox httpd's native
  per-path auth, reached at /cgi-bin/index.cgi specifically (no bare "/" index exists). CVSS 3.1:
  9.8 CRITICAL (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). disclosure_status: public -- the vendor's own
  manual already fully discloses this default; nothing left to responsibly disclose.
