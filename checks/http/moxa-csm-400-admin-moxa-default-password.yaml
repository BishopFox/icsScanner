# Built check 2026-10-06 (Phase 2), promoted from candidates/moxa-csm-400-default-password.yaml.
# CSM-400 uses the OLDER Moxa web-login variant ("SetPass / MD5", the "NP6000" lib) -- same family as
# the re-armed NPort 6000 / MiiNePort checks, differing only in the account field NAME. Login wire
# format read DIRECTLY from the product's own firmware, moxa-csm-400-series-firmware-v1.2.rom
# (downloaded from Moxa's CDN; plaintext image, entropy 5.31):
#   <FORM name=InputPassword method=POST action=/ onSubmit="return SetPass(this);">
#     inputText("Account", ..., "admin");            // account field `Account`, default prefilled admin
#     inputPassword("Password", ...);                 // plaintext pass, cleared by SetPass()
#     <INPUT type=hidden name=MD5Password> <INPUT type=hidden name=FakeChallenge value=${FAKECHALLENGE}>
#     <INPUT type=submit value=Login name=Submit>
#   function SetPass(theform){ md = MD5(theform.FakeChallenge.value);
#       password.hex() XOR'd nibble-wise with md5-hex -> theform.MD5Password.value; }
#   onload=document.InputPassword.Account.focus();  success home = Home400.htm; fail = alert('Login Failed').
# i.e. md=MD5(challenge) (not SHA256), ONLY the password is obfuscated (into hidden MD5Password), the
# account is sent PLAINTEXT in `Account`. Default admin/moxa (CSM-400 manual, "Opening the Web
# Console"). Driven by the extended checks/http/native/moxa_web_login_default_creds.py (password_hash
# md5, account_field Account, transform_account false). Failure = login page re-served
# (InputPassword/MD5Password/FakeChallenge, or alert('Login Failed')), firmware-confirmed, absent from
# Home400.htm -> success_is_absence_of_failure.
check_id: moxa-csm-400-admin-moxa-default-password
protocol: http
kind: native
module: checks.http.native.moxa_web_login_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "Moxa CSM-400 series Ethernet-to-fiber media converter (web console; default IP 192.168.127.254)"
params:
  login_path: "/"
  action_path: "/"
  credentials:
    - ["admin", "moxa"]
  challenge_field: "FakeChallenge"
  password_hash: "md5"
  account_field: "Account"
  password_field: "MD5Password"
  transform_account: false
  extra_fields:
    Submit: "Login"
  failure_indicators: ["md5password", "fakechallenge", "inputpassword", "login failed"]
  success_is_absence_of_failure: true
  default_port: 80
references:
  - "Moxa CSM-400 manual, 'Opening the Web Console': default login admin/moxa at 192.168.127.254. Login wire format read directly from moxa-csm-400-series-firmware-v1.2.rom (downloaded from Moxa CDN): FORM InputPassword action=/ onSubmit=SetPass(this); account field `Account` plaintext (prefilled admin); hidden MD5Password + FakeChallenge; md=MD5(FakeChallenge); password obfuscated into MD5Password (nibble-wise XOR of password.hex() with md5-hex). SetSHA256/account_password_form absent (0 hits)."
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own Moxa SetPass/MD5 login POST to / carrying plaintext Account=admin + obfuscated MD5Password"
    patterns:
      - context: request
        regex: "Account=admin&.*MD5Password=[0-9a-f]+"
  broad:
    description: "A POST to / with a FakeChallenge field on a Moxa web console"
    patterns:
      - context: request
        regex: "FakeChallenge"
description: >
  Moxa CSM-400 series Ethernet-to-fiber media converter (web console, default IP 192.168.127.254)
  ships a documented default web-console login admin/moxa. The login uses Moxa's older "SetPass/MD5"
  challenge-obfuscation (md=MD5(FakeChallenge); only the password is obfuscated into a hidden
  MD5Password field; the `Account` is sent in plaintext) -- read directly from the product's own
  firmware. The executor GETs the FakeChallenge, obfuscates the password, POSTs Account=admin +
  MD5Password, and detects acceptance via absence of the re-served login form. CVSS 3.1 9.8 CRITICAL.
  Built against checks/http/native/moxa_web_login_default_creds.py (password_hash: md5).
