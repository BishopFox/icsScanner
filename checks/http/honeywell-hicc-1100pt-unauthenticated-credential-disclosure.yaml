# Native check — Honeywell HICC-1100PT IP camera: unauthenticated admin-credential disclosure.
# Promoted 2026-11-05 from the "Unauthenticated-disclosure check category" side-quest (lab-notes/
# side-quests.md), which had logged this as "the most immediately buildable of all" its examples. It
# is now a built check using the project's established unauthenticated-read idiom (cf.
# checks/fins/omron-fins-unauthenticated-access.yaml, checks/http/codesys-webvisu-unauthenticated.yaml).
#
# WHAT IT DETECTS: a fully-unauthenticated GET of the camera's readfile CGI
# (/cgi-bin/readfile.cgi?query=ADMINID) returns a plaintext JavaScript blob that discloses the admin
# credential directly, e.g.:  var Adm_ID="admin"; var Adm_Pass1="admin"; var Adm_Pass2="admin";
# The disclosure IS the vulnerability (CWE-200) — no follow-up login at /cgi-bin/chklogin.cgi is
# needed to confirm it. Source: Exploit-DB EDB-ID 40261 (a public PoC carrying the exact raw HTTP
# transaction — request and response both verified in the PoC, so no login mechanism had to be
# reverse-engineered).
#
# SAFE / READ-ONLY: one unauthenticated GET; destructive:false; never attempts a login or any write.
# Driven by the generic unauthenticated_http_body_get executor.
#
# CONFIRMED CRITERIA (conservative): HTTP 200 AND the body matches a non-empty Adm_ID value followed
# by an Adm_Pass1 field — i.e. the CGI actually disclosed a credential, not merely returned 200. The
# finding is the disclosure regardless of whether the disclosed value is still the admin/admin default.
#
# disclosure_status: public (EDB-ID 40261). confidence: low — the request/response shape is from a
# concrete public PoC (stronger than a general norm), but there is no live HICC-1100PT in this project
# to verify against and camera firmware varies; the CONFIRMED is nonetheless self-proving (the body
# literally contains the disclosed credential). No CVE is associated with EDB-ID 40261 as far as
# recorded here.
#
# SAFETY GATE: there is no reliable live discriminator for this camera model over HTTP, so this check
# requires an operator-supplied product hint ("HICC-1100PT") the same way the model-specific relay
# checks do (cf. checks/modbus/beckwith-m3425a-comm-channel-unlocked.yaml) — it never fires against an
# arbitrary HTTP host, only one the operator has identified as (or suspects to be) this camera.
#
# SCOPE NOTE (raised explicitly in the side-quest): this is a security IP camera, not a PLC/relay/HMI/
# gateway like most of this project. Honeywell is already a covered vendor for building-automation /
# physical-access-control products (XL Web II, NetAXS, XL Guest, Alerton), and an access-control
# camera is adjacent to that physical-security territory — a defensible fit, flagged here rather than
# assumed.

check_id: honeywell-hicc-1100pt-unauthenticated-credential-disclosure
protocol: http
kind: native
module: checks.http.native.unauthenticated_http_body_get
destructive: false
risk_reason: []
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Honeywell"
  product: "HICC-1100PT"
params:
  path: "/cgi-bin/readfile.cgi?query=ADMINID"
  body_regex: 'Adm_ID="[^"]+"[\s\S]*Adm_Pass1="'
  success_status: 200
  https: false
  default_port: 80
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0822   # External Remote Services — unauthenticated reach disclosing the credential
  analytic_story: "ICS Unauthenticated Access"
  narrow:
    description: "This scanner's single unauthenticated HTTP GET /cgi-bin/readfile.cgi?query=ADMINID against a Honeywell HICC-1100PT — no Authorization header. A 200 whose body sets var Adm_ID / Adm_Pass* proves the admin credential is disclosed to any unauthenticated client (CWE-200)."
    patterns:
      - context: request
        regex: "GET /cgi-bin/readfile\\.cgi\\?query=ADMINID"
  broad:
    description: "Unauthenticated GETs of /cgi-bin/readfile.cgi (any query) against a camera web server — enumeration of the readfile CGI that backs this disclosure; read-only and otherwise indistinguishable from a legitimate client read."
    patterns:
      - context: request
        regex: "GET /cgi-bin/readfile\\.cgi"
references:
  - "Exploit-DB EDB-ID 40261 — Honeywell IP-Camera HICC-1100PT: unauthenticated /cgi-bin/readfile.cgi?query=ADMINID discloses var Adm_ID/Adm_Pass* (admin/admin by default)."
  - "checks/http/native/unauthenticated_http_body_get.py — the read-only body-marker GET executor this check drives."
