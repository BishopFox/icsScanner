# Default-credentials sweep, Phase 17 — final SCADAPASS closeout pass. Uses the generic
# checks/http/native/basic_auth_default_creds.py executor.
#
# SCOPE NOTE: initially mis-triaged as "solar, out of scope" during Phase 16 planning without
# actually researching it — caught and corrected during this closeout pass. PIKO inverters are
# grid-tied industrial/commercial-scale power electronics (the SCADAPASS row explicitly
# describes them as "solar inverter, storage system," and the sibling SMA Sunny WebBox check
# explicitly self-describes as "ICS device for data logging" in the same row shape) — genuinely
# in scope, same category as DEIF's wind turbine controller (Phase 15) once actually checked.
#
# Sources (2 independent): SCADAPASS, citing the official Kostal Solar manual directly;
# corroborated by a dedicated Darius Freamon post, "Kostal Solar PIKO-Inverters Default Admin
# Credentials."
#
# KNOWN FINGERPRINT-GATE GAP (same pattern as eWON/Digi/Heatmiser/Falcon/Sinapsi): no
# Kostal-specific OUI entry was found in the official IEEE registry. No OUI was guessed.
#
# No CVE — documented factory-default behavior.

check_id: http-kostal-solar-piko-inverter-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Kostal Solar"
params:
  path: "/"
  credentials:
    - ["pvserver", "pvwr"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (pvserver:pvwr)"
    patterns:
      - context: request
        regex: "Authorization: Basic cHZzZXJ2ZXI6cHZ3cg=="
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "https://dariusfreamon.wordpress.com/2014/01/08/kostal-solar-piko-inverters-default-admin-credentials/"
description: "Kostal Solar PIKO grid-tied inverters/storage systems ship with a factory-default pvserver/pvwr web-UI login — no CVE, documented factory-default behavior."
