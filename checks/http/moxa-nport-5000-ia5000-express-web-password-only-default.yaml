# Built check 2026-10-06 (Phase 4), promoted from candidates/moxa-nport-5000-ia5000-express-default-password.yaml.
# WEB surface (the candidate was filed protocol:telnet; this arms the HTTP login, which was fully
# reverse-engineered from firmware this pass — the telnet/console prompt sequence remains un-captured
# and is left for a separate check). Login wire format read DIRECTLY from
# moxa-nport-ia5000-series-firmware-v1.8.rom (downloaded from Moxa's CDN; *FRM image, raw embedded
# HTML/JS):
#   <form name=InputPassword action=home.htm onsubmit="return SetPass(this)">
#     <input type=password name=Password> <input type=hidden name=token_text>
#     <input type=hidden name=FakeChallenge> <input type=hidden name=EncPasswd>   (NO username field)
#   function SetPass(t){ m = MD5(t.FakeChallenge.value);
#       w = password.hex();                                   // ascii.lastIndexOf == ord()
#       p = nibblewiseXOR(w, m);                              // like variants A/B
#       n = MD5(p); t.EncPasswd.value = n; t.Password.value=""; }   // variant C: EXTRA MD5 wrap
#   The form has no method= attribute -> submitted via GET (query string) to home.htm.
# This is a THIRD Moxa web-login variant ("SetPass + MD5 wrap", password-only). Default password
# "moxa" (NPort 5000 manual + firmware factory-default config table). Driven by the extended
# checks/http/native/moxa_web_login_default_creds.py (password_hash md5, wrap_md5, send_account false,
# password_field EncPasswd, method GET). Failure = login page re-served (InputPassword/FakeChallenge),
# firmware-confirmed and absent from the post-login main menu -> success_is_absence_of_failure.
check_id: moxa-nport-5000-ia5000-express-web-password-only-default
protocol: http
kind: native
module: checks.http.native.moxa_web_login_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "NPort 5100/5200/IA5000 and NPort 5x50AI-M12 / NPort Express DE-211/DE-311 (password-only web console)"
params:
  login_path: "/"
  action_path: "/home.htm"
  credentials:
    - ["", "moxa"]
  challenge_field: "FakeChallenge"
  password_hash: "md5"
  password_field: "EncPasswd"
  send_account: false
  wrap_md5: true
  method: "GET"
  failure_indicators: ["inputpassword", "fakechallenge", "input password"]
  success_is_absence_of_failure: true
  default_port: 80
references:
  - "Moxa NPort 5000 Series User Manual v7.6 (user-supplied, pdftotext): NPort 5100/5200/IA5000 use a PASSWORD-ONLY login, default password 'moxa'."
  - "Login wire format read directly from moxa-nport-ia5000-series-firmware-v1.8.rom (downloaded from Moxa CDN): FORM InputPassword action=home.htm (GET) onSubmit=SetPass(this); single Password field (no username); hidden FakeChallenge + EncPasswd; SetPass: m=MD5(FakeChallenge), p=nibbleXOR(password.hex(),m), EncPasswd=MD5(p)."
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own Moxa SetPass+MD5-wrap login GET to /home.htm carrying EncPasswd (password-only)"
    patterns:
      - context: request
        regex: "GET /home.htm\\?.*EncPasswd=[0-9a-f]+"
  broad:
    description: "A GET to /home.htm with a FakeChallenge field on a Moxa NPort web console"
    patterns:
      - context: request
        regex: "FakeChallenge"
description: >
  Moxa NPort 5100/5200/IA5000 serial device servers (and the firmware-confirmed NPort 5x50AI-M12 and
  NPort Express DE-211/DE-311 lines) ship a password-only web console with default password "moxa".
  The login uses Moxa's third web-login variant ("SetPass + MD5 wrap"): md=MD5(FakeChallenge), the
  password.hex() is nibble-wise XOR'd with md, then wrapped in a final MD5 into EncPasswd and
  submitted via GET to home.htm (no username field) — read directly from the product's own firmware.
  The executor GETs the FakeChallenge, computes EncPasswd for "moxa", submits, and detects acceptance
  via absence of the re-served login form. CVSS 3.1 9.8 CRITICAL. Built against
  checks/http/native/moxa_web_login_default_creds.py (password_hash md5, wrap_md5, method GET).
