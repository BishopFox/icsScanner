# Built 2026-10-25 from the product's OWN firmware (moxa-mgate-w5108-w5208-series-firmware-v2.0.rom,
# user moxa ingest; v2.0 is COMPRESSED/unpackable, v2.4 is encrypted and was not used). The extracted
# squashfs bin/webs carries the IDENTICAL variant-D "/goform/webLogin" SetCookie() scheme confirmed on
# MGate 5118 (SHA256(XOR(ChallengeText,password)); account UserName plaintext; AccountName508/
# Password508 cookies) -- verified present in THIS product's firmware (SHA256(XOR / ChallengeText /
# action="/goform/webLogin" / AccountName508 / Password508 / name="Passwd" / SetCookie all found).
# Per-product confirmed, not assumed. admin/moxa = Moxa's documented MGate default (public). Driven by
# checks/http/native/moxa_web_login_default_creds.py (password_hash: sha256_xor). Documented-default
# coverage (Moxa declined the Sept-2026 report); not a novel disclosure. See the MGate 5118 check for
# the full firmware-sourced algorithm write-up.
check_id: moxa-mgate-w5108-w5208-series-admin-moxa-default-password
protocol: http
kind: native
module: checks.http.native.moxa_web_login_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "Moxa MGate W5108/W5208 wireless protocol gateway (web console; fw v2.0, /goform/webLogin)"
params:
  login_path: "/"
  action_path: "/goform/webLogin"
  credentials:
    - ["admin", "moxa"]
  challenge_field: "ChallengeText"
  password_hash: "sha256_xor"
  account_field: "UserName"
  password_field: "Passwd"
  transform_account: false
  account_cookie: "AccountName508"
  password_cookie: "Password508"
  failure_indicators: ["username_sel", "challengetext", "/goform/weblogin"]
  success_is_absence_of_failure: true
  default_port: 80
references:
  - "Login wire format confirmed from moxa-mgate-w5108-w5208-series-firmware-v2.0.rom (user moxa ingest, 2026-10-25): identical variant-D /goform/webLogin SetCookie() scheme as MGate 5118 (SHA256(XOR(ChallengeText,password)), UserName plaintext, AccountName508/Password508 cookies)."
  - "Moxa MGate W5108/W5208 documented default web login admin/moxa (Moxa product manual)."
  - "Moxa PSIRT declined the Sept-2026 multi-product report as user-changeable documented defaults — scanner coverage of the documented default, not a novel disclosure."
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own Moxa variant-D login POST to /goform/webLogin carrying plaintext UserName=admin + a SHA256 Passwd, with AccountName508/Password508 cookies."
    patterns:
      - context: request
        regex: "/goform/webLogin"
  broad:
    description: "A POST to /goform/webLogin with a ChallengeText field / AccountName508 cookie on a Moxa web console (default-credential login attempt)."
    patterns:
      - context: request
        regex: "AccountName508="
description: >
  Moxa MGate W5108/W5208 wireless protocol gateway (web console; fw v2.0) ships Moxa's documented
  default web login admin/moxa, using the same firmware-confirmed variant-D /goform/webLogin scheme as
  the MGate 5118 (password obfuscated as SHA256(XOR(ChallengeText, password)); account/obfuscated-
  password mirrored into AccountName508/Password508 cookies). CVSS 3.1 9.8 CRITICAL. Documented-default
  coverage (Moxa declined the 2026-09 report as a user-changeable documented default); not a novel
  disclosure. Built against checks/http/native/moxa_web_login_default_creds.py (password_hash: sha256_xor).
