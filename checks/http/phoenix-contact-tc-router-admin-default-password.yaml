# Built check — 2026-10-01, promoted from checks/candidates/
# phoenix-contact-tc-router-default-admin-password.yaml (git-renamed, history preserved). That
# candidate's stated blocker was "no TC ROUTER firmware was present in this ingest batch (PDF
# manual only) to confirm the exact web-login wire format." Resolved the same day: a new block of
# Phoenix Contact firmware was added to this project's ingest, including real TC-ROUTER (TCR3002T-
# 4G) and 1101-TX/TX (CC1101T-TXTX) firmware -- both branded "TC-ROUTER" directly in their own
# /etc/banner strings, both on the same shared platform already confirmed for the sibling TC DSL
# Router built check.
#
# THE FINDING, from Phoenix Contact's own official "TC ROUTER" user manual
# (um_en_tc_dsl_router_105554_en_00.pdf, Section 3.10.1 "User (change password)" and the "Login
# window"/"Restoring access data" sections): the device's web-based management (WBM) ships TWO
# default accounts, stated verbatim in a table:
#     User role: admin  | User name: admin | Password: admin  (Unrestricted access to all areas)
#     User role: user   | User name: user  | Password: public (Read access to "Device Information" only)
# Default IP address: 192.168.0.1 / 255.255.255.0 -- also explicitly documented as the value the
# device's physical reset button restores it to, i.e. reachable again on any unit after a simple
# physical reset, not just out-of-the-box.
#
# WIRE FORMAT, confirmed 2026-10-01 via direct re-analysis of real TCR3002T-4G and CC1101T-TXTX
# firmware (not assumed from the DSL Router's own architecture alone): both ship `wbm/cgi-bin/
# index.cgi`, a small wrapper linking `libwbm.so`, which exports `get_auth`, `crypt`, `crypt_cmp`,
# `base64_decode` -- the IDENTICAL app-level WBM login mechanism already confirmed on the sibling
# TC DSL Router check (a self-issued HTTP Basic Auth challenge/response verified against the
# device's own /etc/shadow crypt hash, not BusyBox httpd's native per-path auth). TCR3002T-4G's
# own `admin` account (UID 2, GID 0, root-equivalent) cracks to the literal string "admin"
# (`admin:$1$mR5KEx9G$4tCeTbCF22KIrDo7a3h9.0`), matching the manual's documented default exactly.
# No separate OS-level "user" account exists on either device -- the user/public role is handled
# entirely inside libwbm.so's own role-name checking (consistent with "admin"/"factory" appearing
# as adjacent literal role-name strings in the sibling DSL Router's libwbm.so), not a second Linux
# account, so it cannot be independently cracked the same way -- taken on the vendor manual's own
# authority for that credential pair.
#
# CVE CONTEXT (already partially public, not a novel discovery): a targeted WebSearch found
# CISA ICSA-23-250-02 and SEC Consult's own advisory covering Phoenix Contact TC ROUTER / TC
# CLOUD CLIENT (CVE-2020-9435 hardcoded HTTPS certificate, CVE-2020-9436 authenticated command
# injection, outdated BusyBox) -- SecurityWeek's coverage of that advisory explicitly names
# "default credentials, if not changed" as part of the real-world attack chain enabling those
# other bugs. This check's specific admin/admin + user/public factory-default table is not itself
# a separately CVE-numbered item, but it is the same vendor-documented default that advisory's own
# attack-vector description depends on -- disclosure_status: public on that basis (vendor's own
# manual + a directly-relevant public advisory both already describe this default openly), not
# undisclosed.
#
# NOT the same finding as the undisclosed `/cgi-bin/p` Basic Auth backdoor confirmed on this same
# platform (see checks/candidates/
# phoenix-contact-router-platform-cgi-bin-p-hardcoded-basic-auth-credentials.yaml) -- that is a
# separate, server-enforced credential set gating backend CGI endpoints, held undisclosed. This
# check is the documented, app-level WBM frontend login only.
#
# SEVERITY: CVSS v3.1 scored via the installed `cvss` Python package:
#   Vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
#   Base Score: 9.8 (CRITICAL) -- full read/write router/firewall configuration access via a
#   single well-known credential, restorable via physical reset on any unit.
#
# OPEN QUESTIONS, honestly recorded: (1) whether current-production (2026) units of either
# confirmed hardware model still ship this credential is unknown -- newest firmware examined is
# 2024-11-26 for both; (2) the EXACT HTTP response this login flow produces (status code on
# success, whether a 401 challenge precedes it) was not independently captured against a live
# device, matching the same open question already recorded on the sibling TC DSL Router check --
# `success_status` below is the executor's own default (200), not independently confirmed.

check_id: http-phoenix-contact-tc-router-admin-default-password
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Phoenix Contact"
  product: "TC ROUTER (cellular/DSL remote-access router family) -- confirmed on TC-ROUTER (TCR3002T-4G) and 1101-TX/TX (CC1101T-TXTX), plausibly the wider TC ROUTER lineup per the vendor's own shared manual/branding"
params:
  path: "/cgi-bin/index.cgi"
  credentials:
    - ["admin", "admin"]
    - ["user", "public"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (admin:admin, user:public) against /cgi-bin/index.cgi"
    patterns:
      - context: request
        regex: "GET /cgi-bin/index\\.cgi HTTP/1\\.[01]\\r\\n.*Authorization: Basic (YWRtaW46YWRtaW4=|dXNlcjpwdWJsaWM=)"
  broad:
    description: "Any HTTP Basic Auth attempt against this device's WBM entry point -- the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET /cgi-bin/index\\.cgi HTTP/1\\.[01]\\r\\n.*Authorization: Basic"
references:
  - "User-supplied ingest: um_en_tc_dsl_router_105554_en_00.pdf, official Phoenix Contact TC ROUTER manual, Section 3.10.1 'User (change password)' and 'Restoring access data', fetched and read directly via pdftotext"
  - "https://www.cisa.gov/news-events/ics-advisories/icsa-23-250-02"
  - "https://sec-consult.com/vulnerability-lab/advisory/authenticated-command-injection-in-phoenix-contact-tc-router-tc-cloud-client/"
  - "User-supplied ingest: FW_TCR3002T_v3.08.3_20241126.zip -- wbm/cgi-bin/index.cgi + libwbm.so (get_auth/crypt/crypt_cmp) confirmed directly; /etc/shadow admin hash cracks to 'admin', matching the manual exactly"
  - "User-supplied ingest: FW-CC1101T-TXTX_v3.07.3_20241126.zip -- identical wbm/cgi-bin/index.cgi + libwbm.so architecture independently confirmed on a second hardware model"
description: >
  Phoenix Contact's TC ROUTER family (cellular/DSL remote-access routers; confirmed directly on
  TC-ROUTER/TCR3002T-4G and 1101-TX/TX/CC1101T-TXTX firmware) ships two factory-default
  web-management accounts, documented in the vendor's own manual: admin/admin (unrestricted
  access) and user/public (read-only Device Information), reachable at /cgi-bin/index.cgi via the
  app-level WBM login (libwbm.so's get_auth/crypt_cmp, self-issued Basic Auth, verified against
  the device's own /etc/shadow hash -- confirmed cracking to the literal string "admin" on
  TCR3002T-4G, matching the documented default exactly). Default IP 192.168.0.1 -- also the value
  a physical reset button restores, so this default is reachable again on any unit after a simple
  reset, not just out-of-the-box. Related to (but not identical to) the vendor-documented
  default-credential attack vector cited in CISA ICSA-23-250-02 / SEC Consult's advisory on the
  same product line (CVE-2020-9435/9436). CVSS 3.1: 9.8 CRITICAL
  (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). disclosure_status: public -- the vendor's own manual and
  a public advisory both already describe this default.
