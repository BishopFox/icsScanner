# Default-credentials sweep, 2026-08-30. Uses the generic
# checks/http/native/basic_auth_default_creds.py executor.
#
# RESOLVED from checks/candidates/endress-hauser-fieldgate-fxa520-default-creds.yaml — that
# candidate flagged SCADAPASS's super:super value as uncorroborated (a dedicated WebSearch had
# instead surfaced a different, related product's credential, Fieldgate Viewer: admin:0000).
# User supplied Endress+Hauser's own current "Fieldgate FXA520" Operating Instructions
# (BA00051S, two revisions: 1514 and 1615) directly — both state, repeated at least 5 separate
# times across different commissioning scenarios (LAN, dial-up, GPRS): "Enter the User Name:
# super / Enter the Password: super (if not changed during set-up)". SCADAPASS's value is
# correct for the FXA520 itself; the admin:0000 credential the earlier search found belongs to
# the separate Fieldgate Viewer software, a genuinely different product, not this device.
#
# MECHANISM: confirmed as HTTP Basic Auth, not a custom form — the manual's own wording ("The
# Connect to dialog appears... Press OK to register the entries") matches a browser's native
# Basic-Auth credential prompt, not a page-rendered login form (contrast with the ENTES EMG/GEM
# candidate's "type the WEB access password ... on page you will see" phrasing, which is a
# genuine custom form).
#
# No CVE — documented factory-default behavior. Default IP 192.168.254.1 (LAN) / 192.168.253.1
# (service cable) per the manual — not itself a credential, not encoded in params.

check_id: http-endress-hauser-fieldgate-fxa520-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no lockout or device-write documented in either manual revision
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Endress+Hauser Flowtec AG"
  product: "Fieldgate FXA520"
params:
  path: "/"
  credentials:
    - ["super", "super"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempt using the documented factory credential (super:super)"
    patterns:
      - context: request
        regex: "Authorization: Basic c3VwZXI6c3VwZXI="
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "Endress+Hauser Fieldgate FXA520 Operating Instructions, BA00051S (revisions 1514 and 1615), user-supplied — repeated in at least 5 separate commissioning-scenario sections"
description: "Endress+Hauser Fieldgate FXA520 remote I/O gateway ships with a factory-default HTTP Basic Auth web-UI login of super:super — confirmed directly and repeatedly across two revisions of Endress+Hauser's own Operating Instructions manual, resolving an earlier corroboration gap (a prior search had only found a different product's credential, Fieldgate Viewer: admin:0000). No CVE — documented factory-default behavior."
