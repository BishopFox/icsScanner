# Built check 2026-10-06 (Phase 1b); CORRECTED 2026-10-06 (Phase 2 firmware re-verification).
# This product uses the OLDER Moxa web-login variant ("SetPass / MD5", the "NP6000" login lib), NOT
# the newer SetSHA256 scheme. Confirmed by reverse-engineering the product's OWN firmware,
# moxa-nport-6000-series-firmware-v1.21.rom (re-downloaded from Moxa's CDN, raw/unencrypted JS):
#   <FORM name=InputPassword method=POST action=/ onSubmit="return SetPass(this);">
#   function SetPass(theform){ ... md = MD5(theform.FakeChallenge.value);
#       for each char of Password: p += ascii.lastIndexOf(c).toString(16);   // == password.hex()
#       for i: md5_pass += hex[ nibble(p[i]) XOR nibble(md[i]) ];            // nibble-wise XOR
#       theform.MD5Password.value = md5_pass; theform.Password.value=""; }
#   onload=document.InputPassword.Username.focus()   // the account field is plaintext `Username`.
# i.e. md = MD5(challenge) (not SHA256), ONLY the password is obfuscated (into hidden `MD5Password`),
# and the username is sent in PLAINTEXT. The prior Phase-1b version of this check used the SHA256
# algorithm, transformed BOTH fields, posted account/password, and keyed failure on
# account_password_form/NOTIFY_MSG -- NONE of which exist in this firmware (SetSHA256=0,
# account_password_form=0); it would never have authenticated. Now driven by the extended
# moxa_web_login_default_creds.py (password_hash: md5, account_field Username, transform_account
# false). Failure signal = the login page re-served (MD5Password/FakeChallenge/InputPassword present,
# absent from the post-login main.htm), firmware-confirmed -> success_is_absence_of_failure.
check_id: moxa-nport-6000-series-admin-moxa-default-password
protocol: http
kind: native
module: checks.http.native.moxa_web_login_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "Moxa NPort 6000 series serial device server (web console; fw <=1.21)"
params:
  login_path: "/"
  action_path: "/"
  credentials:
    - ["admin", "moxa"]
  challenge_field: "FakeChallenge"
  password_hash: "md5"
  account_field: "Username"
  password_field: "MD5Password"
  transform_account: false
  failure_indicators: ["md5password", "fakechallenge", "inputpassword"]
  success_is_absence_of_failure: true
  default_port: 80
references:
  - "Moxa NPort 6000 manual: fw <=1.21 default admin/moxa. Login wire format read directly from moxa-nport-6000-series-firmware-v1.21.rom (downloaded from Moxa CDN): FORM InputPassword action=/ onSubmit=SetPass(this); md=MD5(FakeChallenge); password obfuscated into MD5Password (nibble-wise XOR of password.hex() with md5-hex); username field `Username` sent plaintext. SetSHA256/account_password_form absent (0 hits)."
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own Moxa SetPass/MD5 login POST to / carrying plaintext Username=admin + obfuscated MD5Password"
    patterns:
      - context: request
        regex: "Username=admin&.*MD5Password=[0-9a-f]+"
  broad:
    description: "A POST to / with a FakeChallenge field on a Moxa web console"
    patterns:
      - context: request
        regex: "FakeChallenge"
description: >
  Moxa NPort 6000 series serial device server (web console; fw <=1.21) ships a documented default
  web-console login admin/moxa. The login uses Moxa's older "SetPass/MD5" challenge-obfuscation
  (md=MD5(FakeChallenge); only the password is obfuscated into a hidden MD5Password field; the
  `Username` is sent in plaintext) -- read directly from the product's own firmware. The executor
  GETs the FakeChallenge, obfuscates the password, POSTs Username=admin + MD5Password, and detects
  acceptance via absence of the re-served login form. CVSS 3.1 9.8 CRITICAL. Built against
  checks/http/native/moxa_web_login_default_creds.py (password_hash: md5).
