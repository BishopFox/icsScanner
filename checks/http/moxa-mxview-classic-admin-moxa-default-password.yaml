# Built check — 2026-10-06, promoted from checks/candidates/moxa-mxview-classic-admin-default-password.yaml
# via the live-harness extract-and-read method (tools/live-harness/). The classic MXview NMS
# (moxa-mxview-series-software-package-v3.2.13.zip, user-supplied) is a Windows Inno Setup installer;
# innoextract exposed its web tier, which is the SAME Node `mxview-gateway` (v1.10.8) as MXview One
# -- dist/bundle.js mounts the login router at `/api/tokens` (loginRoutes), and the gateway launches
# with `--gp=443 --gpHttp=80` (HTTPS 443). So the login contract is identical to MXview One:
#   POST https://<host>/api/tokens  JSON {username,password}  -> 201 + accessToken/refreshToken, 401 fail.
# DEFAULT CREDENTIAL (Moxa's own "MXview Network Management Software User's Manual", v11.1 and v2.5,
# quoted in the candidate): "The default account is admin ... For MXview version 2.7 and later, the
# default password is moxa." v3.2.13 is well past 2.7 -> admin/moxa. (Manual also lists user + guest
# accounts.) Armed on both-sides-of-code evidence (gateway route + Angular frontend), same basis as
# MXview One and the phoenix-contact TC EXTENDER checks. Classic MXview is Windows-only, so no Linux
# live-run; the shared-gateway code evidence + MXview One's runtime confirmation of /api/tokens on 443
# carry it.

check_id: moxa-mxview-classic-admin-moxa-default-password
protocol: http
kind: native
module: checks.http.native.json_rest_login_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "MXview (classic) network management software v2.7+ (incl. v3.2.13), web console https://<host>/"
params:
  path: "/api/tokens"
  username_field: "username"
  password_field: "password"
  credentials:
    - ["admin", "moxa"]
  success_status: 201
  success_json_keys: ["accessToken", "refreshToken", "token"]
  https: true
  default_port: 443
references:
  - "User-supplied ingest: moxa-mxview-series-software-package-v3.2.13.zip (MXview_V3.2.13_Build_24032018.exe, Inno Setup); innoextract -> mxview-gateway v1.10.8 (same Node web tier as MXview One): dist/bundle.js mounts the login router at /api/tokens (loginRoutes), gateway launched with --gp=443 (HTTPS). Login contract = POST /api/tokens JSON {username,password} -> 201+token / 401."
  - "Moxa 'MXview Network Management Software User's Manual' (v11.1, v2.5): default account 'admin'; default password 'moxa' for v2.7 and later (blank for 2.6 and earlier)."
detection_hints:
  transport: tcp
  app_protocol: https
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own JSON POST to /api/tokens carrying {\"username\":\"admin\",\"password\":\"moxa\"}"
    patterns:
      - context: request
        regex: "POST /api/tokens"
      - context: request
        regex: "\"username\"\\s*:\\s*\"admin\".*\"password\"\\s*:\\s*\"moxa\""
  broad:
    description: "Any POST to /api/tokens on a Moxa MXview host"
    patterns:
      - context: request
        regex: "POST /api/tokens"
description: >
  Moxa MXview (classic) NMS web console ships default login admin/moxa (vendor manual, v2.7+). Its
  web tier is the same Node mxview-gateway as MXview One, authenticating via POST
  https://<host>/api/tokens with JSON {username,password} -> HTTP 201 + accessToken/refreshToken on
  success, 401 on failure (login contract read from the gateway's own route code + Angular frontend
  via innoextract of the v3.2.13 installer). CVSS 3.1 9.8 CRITICAL. Built against
  checks/http/native/json_rest_login_default_creds.py.
