# Default-credentials sweep, Phase 15. Uses the generic
# checks/http/native/basic_auth_default_creds.py executor.
#
# Sources (2 independent): SCADAPASS, citing the official Heatmiser Netmonitor user guide PDF;
# corroborated by a dedicated Darius Freamon post, "Heatmiser NetMonitor – Multiple
# Vulnerabilities," confirming admin:admin across multiple firmware versions (1.04 through 3.8).
#
# KNOWN FINGERPRINT-GATE GAP (same pattern as eWON/Digi, Phases 11-12): no Heatmiser-specific
# OUI entry was found in the official IEEE registry — loads and runs correctly but can't yet
# pass the fingerprint gate against real hardware. No OUI was guessed to paper over this.
#
# No CVE — documented factory-default behavior (separate cleartext-password-disclosure issues
# are also noted by the Freamon post but are a different vulnerability class, not covered here).

check_id: http-heatmiser-netmonitor-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Heatmiser"
params:
  path: "/"
  credentials:
    - ["admin", "admin"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (admin:admin)"
    patterns:
      - context: request
        regex: "Authorization: Basic YWRtaW46YWRtaW4="
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "https://dariusfreamon.wordpress.com/2013/10/09/heatmiser-netmonitor-multiple-vulnerabilities/"
description: "Heatmiser Netmonitor (heating-system internet gateway) ships with a factory-default admin/admin web-UI login across multiple firmware versions — no CVE, documented factory-default behavior."
