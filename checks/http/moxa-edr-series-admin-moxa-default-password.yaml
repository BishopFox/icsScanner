# Moxa EDR secure-router web default-login — built 2026-10-13, promoted from
# checks/candidates/moxa-edr-series-secure-router-default-admin-password.yaml (research record) after
# firmware review (EDR-G902 v5.7 Login.asp via the moxa_rom handler). Documented-default class ->
# disclosure_status: public, a DETECTION check. NOTE low disclosure value: the EDR hardcoded-cred
# issue is already disclosed+FIXED (Moxa MPSA-220202; this fw is the fixed version) -- this just detects
# a unit still on the factory default.
#
# WIRE FORMAT CONFIRMED (firmware): a FIFTH Moxa login variant -- form InputPassword, action /init.asp,
# plaintext Username field + a COOKIE PASSWORD=sha256(password) (the password hash rides in a cookie,
# not a form field; radius_enable gate sends raw password under RADIUS). Driven by the new
# moxa_cookie_sha256_login_default_creds executor. Success/failure by the device's OWN confirmed
# response strings ("Login Success" / "Authentication fail", read from firmware -- not guessed).
# confidence: low -- not live-verified; the form method (POST assumed) is the one soft param.

check_id: moxa-edr-series-admin-moxa-default-password
protocol: http
kind: native
module: checks.http.native.moxa_cookie_sha256_login_default_creds
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "Moxa EDR-810 / EDR-G902 / EDR-G903 industrial secure router (web console)"
params:
  action_path: "/init.asp"
  credentials:
    - ["admin", "moxa"]
    - ["admin", ""]
  username_field: "Username"
  cookie_name: "PASSWORD"
  method: "POST"
  success_indicators: ["Login Success"]
  failure_indicators: ["Authentication fail", "Invalid", "incorrect"]
  default_port: 80
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's POST /init.asp with Username=admin and a Cookie: PASSWORD=<sha256(password)> -- the Moxa EDR cookie-based sha256 login with the default admin/moxa credential."
    patterns:
      - context: request
        regex: "POST /init\\.asp"
      - context: request
        regex: "Cookie: PASSWORD="
  broad:
    description: "Repeated POSTs to /init.asp with a PASSWORD cookie against a Moxa EDR -- a credential-guessing pass; indistinguishable from a legitimate login on the wire."
    patterns:
      - context: request
        regex: "POST /init\\.asp"
references:
  - "moxa-edr-g902-series-firmware-v5.7.27.rom -> jffs2/cramfs rootfs: Login.asp form InputPassword action /init.asp; JS document.cookie='PASSWORD='+sha256(Password); Username field plaintext; response strings 'Login Success'/'Authentication fail'. EDR hardcoded creds already fixed in MPSA-220202."
