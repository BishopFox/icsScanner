# Default-credentials sweep, Phase 14. Uses the generic
# checks/http/native/basic_auth_default_creds.py executor. First real check for ProSoft
# Technology — the vendor OUI (00:20:4A) has been in core/fingerprint.py since an earlier
# milestone but this is the first check to actually use it.
#
# Source: SCADAPASS, citing the official ProSoft Technology ICX30-HWC Industrial Cellular
# Gateway user manual PDF directly. Single-source-tier — confidence: low.
#
# No CVE — documented factory-default behavior.

check_id: http-prosoft-icx30-hwc-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "ProSoft Technology"
params:
  path: "/"
  credentials:
    - ["admin", "password"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (admin:password)"
    patterns:
      - context: request
        regex: "Authorization: Basic YWRtaW46cGFzc3dvcmQ="
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "http://www.prosoft-technology.com/content/download/8772/168219/version/9/file/ICX30_HWC_User_Manual.pdf"
description: "ProSoft Technology ICX30-HWC Industrial Cellular Gateway ships with a factory-default admin/password web-UI login — no CVE, documented factory-default behavior."
