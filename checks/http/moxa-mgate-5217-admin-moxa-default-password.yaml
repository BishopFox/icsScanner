# Built 2026-10-25. Armed from the product's OWN firmware (moxa-firmware-for-mgate-5217-series-
# firmware-v1.5.rom, user-supplied moxa ingest) — NOT a family assumption. This matters: the Moxa
# web-login family splits into TWO incompatible variants (see lab-notes/moxa-web-login-wire-format.md),
# and assuming the variant from a sibling already produced a never-authenticating NPort-6000 check
# once. For MGate 5217, variant A was read directly from firmware:
#   <form method=post name="account_password_form" action="/" onsubmit="return loginLoad()">
#   function setInfo(){ theform=document.account_password_form;
#       theform.account.value  = SetSHA256(theform, theform.account.value);
#       theform.password.value = SetSHA256(theform, theform.password.value);
#       theform.submit(); }
#   function SetSHA256(theform,raw){ md = SHA256(theform.FakeChallenge.value); ... }
#   on failure the device re-serves account_password_form / ${NOTIFY_MSG} / ${NOTIFY_STATE}.
# i.e. variant A (SetSHA256): md=SHA256(FakeChallenge); BOTH account and password are obfuscated and
# POSTed to "/". Default admin/moxa is Moxa's documented MGate factory default (public; user changes
# it on first login) — the server-side credential itself is not in the client JS, consistent with the
# documented value. This is a documented-default scanner check (Moxa declined the Sept-2026 report as
# "user-changeable documented defaults"); not a novel disclosure.
#
# Driven by the existing checks/http/native/moxa_web_login_default_creds.py (variant-A defaults:
# password_hash sha256, account_field account, password_field password, transform_account true).
# SCOPE: this check is MGate-5217-specific. Other MGate 5000-series images in the ingest
# (5101/5102/5103/5105/5109/5111/5114/5118 v2.5+/5119/5121/5122/5123/5134/5135/5192/5216/5435) ship
# ENCRYPTED firmware (entropy 8.0, no readable login) so their per-product variant is UNCONFIRMED —
# they remain candidates, NOT armed off this one. See candidate moxa-mgate-5000-series.
check_id: moxa-mgate-5217-admin-moxa-default-password
protocol: http
kind: native
module: checks.http.native.moxa_web_login_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]  # single documented-default web login attempt; no device write
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "Moxa MGate 5217 protocol gateway (web console; fw v1.5)"
params:
  login_path: "/"
  action_path: "/"
  credentials:
    - ["admin", "moxa"]
  challenge_field: "FakeChallenge"
  password_hash: "sha256"
  account_field: "account"
  password_field: "password"
  transform_account: true
  failure_indicators: ["account_password_form", "notify_msg", "notify_state"]
  success_is_absence_of_failure: true
  default_port: 80
references:
  - "Login wire format read directly from moxa-firmware-for-mgate-5217-series-firmware-v1.5.rom (user-supplied Moxa ingest, 2026-10-25): form account_password_form, action=/, SetSHA256 obfuscation of both account+password with md=SHA256(FakeChallenge); failure = re-served account_password_form/NOTIFY_MSG/NOTIFY_STATE. Variant A, firmware-confirmed for THIS product."
  - "Moxa MGate 5217 documented default web login admin/moxa (Moxa product manual; user prompted to change on first login)."
  - "Moxa PSIRT declined the Sept-2026 multi-product report as user-changeable documented defaults — this check provides scanner coverage of the documented default, not a novel disclosure."
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own Moxa SetSHA256 (variant A) login POST to / carrying SHA256-obfuscated account + password with a FakeChallenge field."
    patterns:
      - context: request
        regex: "account=[0-9a-f]+&password=[0-9a-f]+"
  broad:
    description: "A POST to / with a FakeChallenge field on a Moxa web console (default-credential login attempt)."
    patterns:
      - context: request
        regex: "FakeChallenge"
description: >
  Moxa MGate 5217 protocol gateway (web console; fw v1.5) ships Moxa's documented default web login
  admin/moxa. The login uses Moxa's newer "SetSHA256" challenge-obfuscation (md=SHA256(FakeChallenge);
  BOTH account and password are obfuscated and POSTed to /) — read directly from the product's own
  firmware (variant A, confirmed, not assumed from a sibling). The executor GETs the FakeChallenge,
  obfuscates admin/moxa, POSTs, and detects acceptance via absence of the re-served login form
  (account_password_form/NOTIFY_MSG). CVSS 3.1 9.8 CRITICAL. Documented-default coverage (Moxa
  declined the 2026-09 report as a user-changeable documented default); not a novel disclosure.
  Built against checks/http/native/moxa_web_login_default_creds.py (variant A / sha256).
