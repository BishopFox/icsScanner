# Built check 2026-10-06 (Phase 1b); CORRECTED 2026-10-06 (Phase 2 firmware re-verification).
# This product uses the OLDER Moxa web-login variant ("SetPass / MD5", the "NP6000" login lib), NOT
# the newer SetSHA256 scheme. Confirmed by reverse-engineering the product's OWN firmware,
# moxa-miineport-e3-series-firmware-v1.2.rom (re-downloaded from Moxa's CDN; *FRM image with
# raw/unencrypted embedded HTML/JS):
#   <FORM name=InputPassword ... action=Login.htm>  <input type=text name=Username>
#     <input type=hidden name=MD5Password> <input type=hidden name=FakeChallenge ...>
#   function SetPass(theform){ md = MD5(theform.FakeChallenge.value); ...
#       theform.MD5Password.value = md5_pass; }   (guarded by ${?SUPPORT_ENHANCED_LOGIN})
# i.e. md = MD5(challenge) (not SHA256), ONLY the password is obfuscated into hidden `MD5Password`,
# and the username is sent in PLAINTEXT as `Username`. The prior Phase-1b version used SHA256,
# transformed both fields, posted account/password, and keyed failure on account_password_form/
# NOTIFY_MSG -- NONE present in this firmware (SetSHA256=0, account_password_form=0); it would never
# have authenticated. Prior reference cited a miineport-E1-v1.9 "SetSHA256" confirmation that the
# actual E3 v1.2 firmware contradicts. Now driven by the extended moxa_web_login_default_creds.py.
check_id: moxa-miineport-series-admin-moxa-default-password
protocol: http
kind: native
module: checks.http.native.moxa_web_login_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "Moxa MiiNePort embedded device server (E1/E2/E3 web console)"
params:
  login_path: "/"
  action_path: "/Login.htm"
  credentials:
    - ["admin", "moxa"]
  challenge_field: "FakeChallenge"
  password_hash: "md5"
  account_field: "Username"
  password_field: "MD5Password"
  transform_account: false
  failure_indicators: ["md5password", "fakechallenge", "inputpassword"]
  success_is_absence_of_failure: true
  default_port: 80
references:
  - "Moxa MiiNePort manuals: default password moxa. Login wire format read directly from moxa-miineport-e3-series-firmware-v1.2.rom (downloaded from Moxa CDN): FORM InputPassword action=Login.htm; plaintext text input `Username`; hidden MD5Password + FakeChallenge; function SetPass() with md=MD5(FakeChallenge). SetSHA256/account_password_form absent (0 hits)."
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own Moxa SetPass/MD5 login POST to /Login.htm carrying plaintext Username=admin + obfuscated MD5Password"
    patterns:
      - context: request
        regex: "Username=admin&.*MD5Password=[0-9a-f]+"
  broad:
    description: "A POST with a FakeChallenge field on a Moxa web console"
    patterns:
      - context: request
        regex: "FakeChallenge"
description: >
  Moxa MiiNePort embedded serial device server (E1/E2/E3 web console) ships a documented default
  web-console login admin/moxa. The login uses Moxa's older "SetPass/MD5" challenge-obfuscation
  (md=MD5(FakeChallenge); only the password is obfuscated into a hidden MD5Password field; the
  `Username` is sent in plaintext) -- read directly from moxa-miineport-e3-series-firmware-v1.2.rom.
  The executor GETs the FakeChallenge, obfuscates the password, POSTs Username=admin + MD5Password
  to /Login.htm, and detects acceptance via absence of the re-served login form. CVSS 3.1 9.8
  CRITICAL. Built against checks/http/native/moxa_web_login_default_creds.py (password_hash: md5).
