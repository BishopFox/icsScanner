# Default-credentials sweep, Phase 11. HTTP sibling of the IntelliSlot Telnet check — a
# DIFFERENT Liebert web card product line, same Liebert:Liebert credential per SCADAPASS's own
# separate row, citing the official Emerson Network Power documentation (sl-52610.pdf).
# Corroborated by the same Darius Freamon "Emerson Network Power Devices... Multiple Default
# Passwords" post used for the MPH2 Rack PDU check, which covers this device family broadly.

check_id: http-emerson-liebert-opencomms-web-card-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Emerson Electric"
params:
  path: "/"
  credentials:
    - ["Liebert", "Liebert"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (Liebert:Liebert)"
    patterns:
      - context: request
        regex: "Authorization: Basic TGllYmVydDpMaWViZXJ0"
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "https://dariusfreamon.wordpress.com/2017/11/20/emerson-network-power-devices-now-vertivco-multiple-default-passwords/"
description: "Emerson Liebert OpenComms Web Card (UPS/power monitoring) ships with a factory-default Liebert/Liebert web-UI login — no CVE, documented factory-default behavior."
