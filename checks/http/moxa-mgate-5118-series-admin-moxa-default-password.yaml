# Built 2026-10-25 from the product's OWN firmware (moxa-mgate-5118-series-firmware-v2.0.rom, user
# moxa ingest; the v2.0 image is COMPRESSED/unpackable -- the v2.5+ image is encrypted and was not
# used). Login wire format read directly from the extracted squashfs bin/webs:
#   <FORM name="login" method="POST" action="/goform/webLogin" onsubmit="SetCookie();">
#     UserName_sel (text) -> hidden UserName (plaintext);  Passwd (password input);
#     <Input type=hidden name="ChallengeText" value="<% webGetChallengeText(); %>">
#   function SetCookie(){ ...
#     document.all.UserName.value = login.UserName_sel.value;      // account PLAINTEXT
#     theValue = SHA256( XOR(ChallengeText, Passwd) );             // VARIANT D: xor-then-hash
#     document.all.Passwd.value = theValue;
#     cookie "AccountName508" = <username>;  cookie "Password508" = theValue; }
#   XOR(): byte-wise XOR of ascii.lastIndexOf() indices (==ord(c) for printable), challenge tail
#   passes through; output length == len(challenge); then webtoolkit SHA256 (lowercase hex).
# This is DISTINCT from variant A (SetSHA256: md=SHA256(chall) then nibble-XOR of password-hex) and
# from variant B (SetPass/MD5) -- do NOT arm a MGate off a sibling's variant (5217=A, 5118=D). Driven
# by the extended checks/http/native/moxa_web_login_default_creds.py (password_hash: sha256_xor;
# account plaintext; account_cookie/password_cookie). admin/moxa = Moxa's documented MGate default
# (public; changed on first login). Documented-default coverage (Moxa declined the Sept-2026 report as
# user-changeable documented defaults); not a novel disclosure. Same scheme confirmed on MGate
# w5108/w5208 v2.0 (its own check). Failure = the login form re-served (UserName_sel/ChallengeText/
# /goform/webLogin), firmware-confirmed -> success_is_absence_of_failure.
check_id: moxa-mgate-5118-series-admin-moxa-default-password
protocol: http
kind: native
module: checks.http.native.moxa_web_login_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "Moxa MGate 5118 protocol gateway (web console; fw v2.0, /goform/webLogin)"
params:
  login_path: "/"
  action_path: "/goform/webLogin"
  credentials:
    - ["admin", "moxa"]
  challenge_field: "ChallengeText"
  password_hash: "sha256_xor"
  account_field: "UserName"
  password_field: "Passwd"
  transform_account: false
  account_cookie: "AccountName508"
  password_cookie: "Password508"
  failure_indicators: ["username_sel", "challengetext", "/goform/weblogin"]
  success_is_absence_of_failure: true
  default_port: 80
references:
  - "Login wire format read directly from moxa-mgate-5118-series-firmware-v2.0.rom (user moxa ingest, 2026-10-25): form name=login action=/goform/webLogin; SetCookie() sets Passwd=SHA256(XOR(ChallengeText,password)), account UserName plaintext, cookies AccountName508/Password508. Variant D, firmware-confirmed for THIS product."
  - "Moxa MGate 5118 documented default web login admin/moxa (Moxa product manual; user prompted to change on first login)."
  - "Moxa PSIRT declined the Sept-2026 multi-product report as user-changeable documented defaults — scanner coverage of the documented default, not a novel disclosure."
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own Moxa variant-D login POST to /goform/webLogin carrying plaintext UserName=admin + a SHA256 Passwd, with AccountName508/Password508 cookies."
    patterns:
      - context: request
        regex: "/goform/webLogin"
  broad:
    description: "A POST to /goform/webLogin with a ChallengeText field / AccountName508 cookie on a Moxa web console (default-credential login attempt)."
    patterns:
      - context: request
        regex: "AccountName508="
description: >
  Moxa MGate 5118 series protocol gateway (web console; fw v2.0) ships Moxa's documented default web
  login admin/moxa. The login (form action /goform/webLogin) obfuscates the password as
  SHA256(XOR(ChallengeText, password)) and mirrors the account/obfuscated-password into
  AccountName508/Password508 cookies -- read directly from the product's own firmware (variant D,
  confirmed, not assumed from a sibling). The executor GETs ChallengeText, computes the value, POSTs
  UserName=admin + Passwd + cookies, and detects acceptance via absence of the re-served login form.
  CVSS 3.1 9.8 CRITICAL. Documented-default coverage (Moxa declined the 2026-09 report as a
  user-changeable documented default); not a novel disclosure. Built against
  checks/http/native/moxa_web_login_default_creds.py (password_hash: sha256_xor).
