# Default-credentials sweep, Phase 11 (Emerson, Advantech, Endress+Hauser, eWON — SCADAPASS
# rows beyond the original 11-vendor backlog, first pass into the ~70 still-untouched vendors).
# Uses the generic checks/http/native/basic_auth_default_creds.py executor.
#
# Sources (2 independent): SCADAPASS gives admin:default/maint:default/oper:default/exec:default,
# citing the official Rosemount/Emerson 1420 manual (00809-0200-4420.pdf); an independent
# WebSearch confirmed three of the four accounts directly from Emerson's own current reference
# manual — exec (Executive), maint (Maintenance), oper (Operator), each with initial password
# "default" — but did NOT separately confirm a distinct "admin" account alongside those three.
# Shipped only the three independently-confirmed accounts; "admin:default" dropped rather than
# guessed to be a fourth real account vs. a mislabeling of one of the other three.
#
# No CVE — documented factory-default behavior.

check_id: http-emerson-smart-wireless-gateway-1420-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Emerson Electric"
params:
  path: "/"
  credentials:
    - ["exec", "default"]
    - ["maint", "default"]
    - ["oper", "default"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (exec:default, maint:default, oper:default)"
    patterns:
      - context: request
        regex: "Authorization: Basic (ZXhlYzpkZWZhdWx0|bWFpbnQ6ZGVmYXVsdA==|b3BlcjpkZWZhdWx0)"
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "https://www.emerson.com/documents/automation/manual-smart-wireless-gateway-en-87246.pdf"
description: "Emerson/Rosemount Smart Wireless Gateway 1420 ships with factory-default exec/maint/oper accounts, each with initial password 'default' — no CVE, documented factory-default behavior."
