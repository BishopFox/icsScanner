# PROMOTED from checks/candidates/moxa-mar-2000-hardcoded-admin-webapp-password.yaml, 2026-09-24.
# See the candidate file's own header for the full extraction chain (a real Debian 6.0.8 armel
# rootfs pulled out of a layered .frm firmware container, Node.js/Express source read directly).
#
# MOXA PSIRT RESPONSE 2026-09-24 (case closed, no CVE/advisory): Moxa reviewed this finding (part
# of an 8-finding batch sent 2026-09-19, acknowledged 2026-09-21) and declined to treat it as a
# vulnerability, classifying all 8 as "documented, user-changeable default credentials." This
# project's own evidence does not support that characterization for this specific finding: the
# admin/admin credential was read directly from the application's own shipped source code
# (`defaultData()` in `lib/models/user.js`, which programmatically seeds the account at
# bootstrap) -- not a customer-facing manual. Promoted to a built check per user direction
# 2026-09-24, accepting Moxa's `disclosure_status: public` classification for tracking purposes
# while preserving this evidence trail unchanged.
#
# Moxa's MAR-2000 Mobile Automation Router ships a Node.js/Express.js web management application
# (Moxa's internal "mirf"/"sanji" model framework) whose own bootstrap code creates a
# factory-default "System Administrator" account, username admin, password admin -- read
# directly from source (bcrypt-hashed for storage, but the seeded plaintext value is a
# well-known, published default, not cracked). Listens on port 80, bound to all interfaces
# (Node's default when no host is passed to `.listen()`), started unconditionally at boot via
# `/etc/init.d/mirfd` (S06mirfd, default runlevel 2).
#
# WIRE FORMAT, confirmed directly from `lib/routes.js`/`lib/controllers/api.js`: `POST /api/login`
# with a JSON body `{"username": "...", "password": "..."}`. Success: HTTP 200 with a JSON body
# containing a freshly-generated `accessToken` field (set by `createAccessToken()` before the
# success response is sent) -- present ONLY on the success path, a strong positive signal beyond
# the status code alone. Failure: `res.json(401, {message: err})`.
#
# Firmware examined is a 2015 build (MAR2000_debian-6.0.8_rootfs_V1.0_Build_15010909) -- current
# firmware was not available to confirm this default persists on actively-shipping units; a
# `setupWizard` field in the same schema suggests a first-run password-change prompt may exist,
# not confirmed either way from the code reviewed.

check_id: http-moxa-mar-2000-hardcoded-admin-webapp-password
protocol: http
kind: native
module: checks.http.native.json_rest_login_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "MAR-2000 (Mobile Automation Router)"
params:
  path: "/api/login"
  username_field: "username"
  password_field: "password"
  credentials:
    - ["admin", "admin"]
  success_status: 200
  failure_status: 401
  success_json_keys: ["accessToken"]
  default_port: 80
references:
  - "moxa-mar-2000-series-firmware-v1.0.zip, user-supplied ingest, .frm gzip stream fully decompressed to a tar archive containing a Debian 6.0.8 rootfs tarball, home/model/webapp/lib/models/user.js's defaultData() and lib/controllers/api.js's login handler read directly in the clear"
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own JSON POST to /api/login carrying the literal default credential ({\"username\":\"admin\",\"password\":\"admin\"})"
    patterns:
      - context: request
        regex: "POST /api/login"
      - context: request
        regex: "\"username\"\\s*:\\s*\"admin\".*\"password\"\\s*:\\s*\"admin\""
  broad:
    description: "Any JSON POST to /api/login against this device — the vulnerability class (default/weak webapp credentials), not the specific guessed value"
    patterns:
      - context: request
        regex: "POST /api/login"
description: >
  Moxa's MAR-2000 Mobile Automation Router ships a Node.js/Express.js web management application
  whose own bootstrap code creates a factory-default "System Administrator" account (admin/admin)
  -- read directly from the application's own source, not cracked or guessed. Listens on port 80,
  bound to all interfaces, started unconditionally at boot. Login is POST /api/login with a JSON
  body; success returns HTTP 200 with an accessToken field present only on success. CVSS 3.1: 9.8
  CRITICAL (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). No CVE found. Sent to Moxa PSIRT 2026-09-19,
  acknowledged 2026-09-21, DECLINED 2026-09-24 (Moxa classifies this as a documented,
  user-changeable default; this project's own evidence, the application's own source code, does
  not support that characterization). disclosure_status: public per user direction 2026-09-24.
