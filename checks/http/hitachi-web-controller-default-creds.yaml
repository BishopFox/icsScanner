# Default-credentials sweep, Phase 16. Uses the generic
# checks/http/native/basic_auth_default_creds.py executor.
#
# Sources (2 independent): SCADAPASS, citing an official Hitachi controller manual PDF
# (fhpsa.com-hosted — filename pattern "EH-W..." suggesting an air-conditioning/HVAC web
# controller line); corroborated by an independent WebSearch converging on admin:1111
# specifically for "Hitachi Web Controller."
#
# NOTE ON PRODUCT IDENTITY: "Web Controller" is a generic name in the source — the specific
# Hitachi division/model wasn't pinned down further in this pass, but the credential and port
# are consistently confirmed across sources regardless. Hitachi Industry & Control Solutions,
# Ltd. was picked as the closest fingerprint match among several Hitachi industrial OUI entries
# already in core/fingerprint.py.
#
# No CVE — documented factory-default behavior.

check_id: http-hitachi-web-controller-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Hitachi Industry & Control Solutions, Ltd."
params:
  path: "/"
  credentials:
    - ["admin", "1111"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (admin:1111)"
    patterns:
      - context: request
        regex: "Authorization: Basic YWRtaW46MTExMQ=="
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "http://www.fhpsa.com/01_Biblioteca/03_Manuales/EH-W_NJI441E(X).pdf"
description: "Hitachi Web Controller (HVAC/building controller) ships with a factory-default admin/1111 web-UI login — no CVE, documented factory-default behavior."
