# Default-credentials sweep, Phase 8 — surfaced by the SCADAPASS cross-reference. HTTP variant
# of the 9300-RADES/9300-8EDM industrial modem/switch (Zyxel-derived hardware under Rockwell
# branding, per the "ZYPCOM" password naming). Uses the generic
# checks/http/native/basic_auth_default_creds.py executor. Sibling checks:
# checks/telnet/rockwell-9300-rades-8edm-default-creds.yaml,
# checks/ftp/rockwell-9300-rades-8edm-default-creds.yaml.
#
# Sources (2 independent): SCADAPASS, citing the official Rockwell 9300-RADES/9300-8EDM
# technical reference manuals; corroborated by an independent WebSearch converging on ZYPCOM as
# the Telnet default password and noting it's referenced in the official technical
# documentation. No CVE — documented factory-default behavior.

check_id: http-rockwell-9300-rades-8edm-default-creds
protocol: http
kind: native
module: checks.http.native.basic_auth_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Rockwell Automation"
params:
  path: "/"
  credentials:
    - ["", "ZYPCOM"]
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own HTTP Basic Auth attempts using the documented factory credential(s) (:ZYPCOM)"
    patterns:
      - context: request
        regex: "Authorization: Basic OlpZUENPTQ=="
  broad:
    description: "Any HTTP Basic Auth attempt against this device's web UI at / — the vulnerability class (factory-default credentials on this product), not the specific guessed value(s)"
    patterns:
      - context: request
        regex: "GET / HTTP/1\\.[01]\\r\\nAuthorization: Basic"
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "http://literature.rockwellautomation.com/idc/groups/literature/documents/um/gmsc10-um004_-en-e.pdf"
description: "9300-RADES/9300-8EDM industrial modems/switches ship with a factory-default blank-username/ZYPCOM web-UI login — no CVE, documented factory-default behavior."
