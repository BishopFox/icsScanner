# Candidate promoted directly to a real check — 2026-09-17. User asked to build the ioLogik E1200
# candidate after it was resolved against real firmware in the previous ingest batch (see
# checks/candidates/moxa-iologik-e1200-e1500-railway-remote-io.yaml for the full source trail:
# Moxa's own official manuals, plus direct firmware confirmation of both the credential and the
# wire protocol). Confirmed no prior check for this specific finding existed before writing this
# file.
#
# THE FINDING: Moxa's ioLogik E1200 Series User Manual (v15.2/v16.2, user-supplied) states the
# Web Console's factory-default password is the literal string "moxa" (password-only, no username
# field) on firmware 3.3 and later -- confirmed directly against real firmware in this project's
# own ingest review (moxa-iologik-e1200-series-iologik-e1210-e1210-t-firmware-v4.0.1kp and the
# e1260 sibling, both v4.0), which ship the literal standalone string "moxa\x00\x00\x00\x00" in
# their compiled firmware plus a `defaultPwd` flag the device itself uses to warn when still on
# this factory default.
#
# THE WIRE PROTOCOL, reverse-engineered directly from the same firmware's own HTML/JS (not
# guessed): the login is a custom SHA256(password+token) challenge-response form, NOT HTTP Basic
# Auth and NOT a plaintext credential POST -- see
# checks/http/native/iologik_challenge_response_default_creds.py's own docstring for the full
# extraction (the exact FORM markup, the SetPass() JS function, and the literal
# "<P>Invalid password !</P>" failure string, all read directly out of the firmware image).
#
# SCOPE: the core E1200 line (E1210/E1211/E1213/E1214/E1240/E1241/E1242/E1260/E1262), firmware
# 3.3+ (v4.0 confirmed directly). Explicitly does NOT cover the E1200H/E1200W hardware variants --
# their firmware was checked directly and does NOT contain the literal "moxa" default (same page
# shape, MD5 instead of SHA256 -- see the candidate file for detail). E1500 sharing this default
# is not independently verified and is not claimed here.

check_id: http-moxa-iologik-e1200-default-password
protocol: http
kind: native
module: checks.http.native.iologik_challenge_response_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no documented lockout mechanism found for this form
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "ioLogik E1210/E1211/E1213/E1214/E1240/E1241/E1242/E1260/E1262 (core E1200 line, firmware 3.3+) -- NOT E1200H/E1200W"
params:
  credentials:
    - ["", "moxa"]
  path: "/home.htm"
  hash_algo: "sha256"
  https: false
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No narrow wire-level signature is possible for this check -- the actual credential sent is SHA256(password+token), a per-request hash that never contains the literal password on the wire, and the token itself changes on every page load."
    patterns: []
  broad:
    description: "A POST to /home.htm carrying Token/PdHdn/Password/Submit form fields against this device -- the vulnerability class (default/weak ioLogik web-console credential), not a specific guessable wire pattern"
    patterns:
      - context: request
        regex: "POST /home\\.htm"
      - context: request
        regex: "name=\"?Token\"?"
references:
  - "Moxa ioLogik E1200 Series User Manual, v15.2 and v16.2, user-supplied"
  - "moxa-iologik-e1200-series-iologik-e1210-e1210-t-firmware-v4.0.1kp, moxa-iologik-e1200-series-iologik-e1260-e1260-t-firmware-v4.0.1kp, user-supplied ingest, literal 'moxa' default-password string + full challenge-response login flow (FORM markup, SetPass() JS, Invalid-password failure string) read directly from firmware strings"
description: >
  Moxa ioLogik E1200 Series Railway Remote I/O modules ship a factory-default web-console password
  of the literal string "moxa" (password-only login, no username) on firmware 3.3 and later --
  confirmed directly from Moxa's own manual and independently verified against real firmware. The
  login uses a custom SHA256(password+token) challenge-response form rather than HTTP Basic Auth
  or a plaintext POST; this check fetches the per-request token from the login page, computes the
  hash, and submits it exactly as the device's own JavaScript would. Does not cover the
  E1200H/E1200W hardware variants (checked directly, do not share this default) or the E1500
  (not independently verified). No CVE -- documented factory-default behavior.
