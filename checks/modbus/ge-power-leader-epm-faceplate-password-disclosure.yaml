# Native check — GE POWER LEADER EPM (meter) discloses its 6-digit LOCAL FACEPLATE PASSWORD over an
# unauthenticated Modbus read (CWE-200). Built 2026-11-05 from the "unauthenticated-disclosure"
# side-quest (lab-notes/side-quests.md, the GEH-6508B / register-3029 example), using GE's own
# official manual GEH-6508B "POWER LEADER Modbus Concentrator Protocol Reference" (user-supplied PDF,
# read via pdftotext — not search-summarized). See the executor module docstring for the full
# derivation; the key facts, all verified against the manual's own worked example (not assumed):
#   - register 3029 = faceplate password ONLY in the PLEPM table (means other things on other POWER
#     LEADER devices), so the check first reads PLEPM Product Id (reg 0 == 0x0E) as a live model gate;
#   - the manual's FC03 example (3010 -> start address 0x0BC2) proves register# == wire start address,
#     so 3029 is read as 0x0BD5 with NO off-by-one (unlike the Beckwith M-3425A map);
#   - encoding is ONE byte per digit, byte = 0xD5 - digit (0->D5h ... 9->CCh); "12-34-56 -> D4D3D2D1D0CF"
#     = 6 bytes = 3 registers (3029-3031), decoded directly to the working password.
#
# READ-ONLY / SAFE (destructive: false): exactly two FC03 reads (Product Id, then the password
# registers), never a write. confidence: low — addressing + encoding are manual-verified and the
# decode is unit-tested against the manual's worked example, but there is no live PLEPM in this
# project to confirm against, and reaching a specific meter behind a concentrator depends on the
# operator targeting the right Modbus unit id (params.unit_id; default 0xFF). disclosure_status:
# public (documented behavior; GEH-6508B is a public GE manual). No CVE.
#
# PRECONDITION: a lightweight modbus_identity probe (real Modbus stack); the PLEPM Product Id read is
# the actual model gate, performed live inside the check — a CONFIRMED requires reg 0 == 0x0E AND all
# six password bytes decoding to valid digits, so it cannot false-positive on a non-PLEPM Modbus host.

check_id: ge-power-leader-epm-faceplate-password-disclosure
protocol: modbus
kind: native
module: checks.modbus.native.ge_power_leader_epm_faceplate_password_disclosure
destructive: false
risk_reason: []
disclosure_status: public
confidence: low
fingerprint_precondition:
  protocol_probe: modbus_identity
params:
  unit_id: 0xFF          # Modbus unit/device id; set to the meter's address (33-247) behind a concentrator
  verify_product_id: true
  timeout: 5.0
detection_hints:
  transport: tcp
  app_protocol: modbus
  mitre_attack_id: T0812   # Default Credentials family (this project's convention for a Modbus credential/security-state read)
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own FC03 read of PLEPM registers 3029-3031 (start address 0x0BD5, count 3) — the faceplate-password registers. A benign read, but the specific reconnaissance signature for this check (unit-id byte in the preceding MBAP varies, so only the FC03+address+count PDU is matched)."
    patterns:
      - context: request
        regex: "\\x03\\x0b\\xd5\\x00\\x03"
  broad:
    description: "Any Modbus FC03 read whose start address is 0x0BD5 (register 3029) — enumeration of the PLEPM faceplate-password registers regardless of unit id or count; read-only and otherwise indistinguishable from legitimate Modbus polling."
    patterns:
      - context: request
        regex: "\\x03\\x0b\\xd5"
references:
  - "GEH-6508B — GE 'POWER LEADER Modbus Concentrator Protocol Reference' (user-supplied PDF): PLEPM table register 3029 'Local faceplate password', encoding scheme 0->D5h..9->CCh, worked example 12-34-56 -> D4D3D2D1D0CFh; FC03 worked example 3010 -> start address 0x0BC2; PLEPM Product Id (reg 0) 'Always 0Eh'."
  - "checks/modbus/native/ge_power_leader_epm_faceplate_password_disclosure.py — the read-only FC03 executor + decode this check drives."
