# GROUND-TRUTH WIRE FORMAT (2026-10-06, method 1 = native vendor-client capture, see
# lab-notes/moxa-mxio-v3-wire-format.md): compiled the SDK's own libmxio_2500_x64.so into a C++
# harness and drove MXIO_Connect(admin/moxa) against a capturing TCP listener on 10124. CAPTURED a
# real handshake frame and CORRECTED the frame format: it is `[message] + CRC16-LE(message)` — a
# Modbus RTU CRC16 over the ENTIRE message, trailing it little-endian (confirmed bidirectionally,
# our listener's recomputed CRC matched the client's). This supersedes the earlier static-analysis
# inference (CRC over bytes 0-9 / command code overwritten at 10-11). Handshake frame:
#   44 41 43 3f 00 01 07 00 00 00 8c 77 01 | f5 ce   ("DAC?"..TID=0..type=01 | CRC16-LE(0..12))
# Service/port/credential (TCP 10124, admin/moxa) all confirmed. REMAINING: the client validates the
# device's handshake ACK before sending the VerifyUserNamePwd login frame; the exact ACK isn't
# recoverable from the client (PLT thunks) — needs one live-device capture, OR link the SDK and call
# MXIO_Connect() directly (now buildable here). Still not armed as a standalone check.
# PHASE 4 CONCLUSION (2026-10-06): re-confirmed the blocker is real and NOT closable from available
# artifacts. For a scanner (client -> real device) the handshake-ACK isn't the issue (a real device
# sends a valid ACK); what's missing is the VerifyUserNamePwd CREDENTIAL FRAME byte layout + its
# response interpretation, which the client never emitted against our listener (it stops at ACK
# validation) and which sits behind PLT-thunked CModuleRTU/CRTUTCP internals in the .so (the .so
# itself ships inside the installer .sh, not loose). Two viable finishes, both out of reach this pass:
#   (1) one packet capture of a real ioLogik 2500 login (no device available), or
#   (2) embed/link the vendor x86-64 .so as a check dependency (rejected: the project's executors are
#       pure-Python + portable; shipping a proprietary x86-64-only blob as a scanner dependency is not
#       acceptable here).
# Per the rigor gate, NOT armed on a guessed binary frame. Remains a documented candidate; service +
# port + credential + framing are confirmed, only the credential-frame submission is open.
