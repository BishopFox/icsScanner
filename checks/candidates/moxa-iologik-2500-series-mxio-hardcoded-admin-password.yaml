# THE FINDING: all 10 available ioLogik 2500-series firmware images (Ethernet v2.3/3.0/4.2/4.3,
# GPRS v2.3, HSPA v2.3/3.0, cellular-HSPA v4.0, Wi-Fi v2.3/3.0 -- Moxa's cellular/GPRS/HSPA/Wi-Fi
# remote I/O RTU line) contain a literal, base64-encoded factory-default credential pair embedded
# in a repeated per-model config template:
#   ...="YWRtaW4=" Password="bW94YQ==" ...="ioLogik 1312-T"...
#   base64-decoded: admin / moxa
# This exact same byte pattern appears 14 times in EVERY firmware image checked (once per
# supported ioLogik 25xx hardware SKU listed in that unified firmware's model table), and is
# IDENTICAL across all 10 files spanning firmware versions 2.3 through 4.3 -- i.e. this default
# has been unchanged across at least 3 major firmware generations and every WAN-backhaul variant
# (wired Ethernet, GPRS, HSPA cellular, Wi-Fi) of this product.
#
# CONTEXT / MECHANISM -- PARTIALLY INVESTIGATED, MXIO HYPOTHESIS RULED OUT: the surrounding config
# template is a compressed XML/INI-style per-model default block (a proprietary Moxa compression
# scheme mixing dictionary back-references with literal ASCII runs -- not fully reverse-engineered
# this pass, but the literal substrings decode cleanly regardless). Initially suspected this was
# Moxa's proprietary "MXIO" remote I/O client library/protocol's credential (the sibling ioLogik
# E1200 series documents a separate "MXIO Library" "Authentication: Enable/Disable" toggle on its
# web UI) -- but this was CHECKED AND RULED OUT: `moxa-mxio-linux-kernel-4.x-library-v2.12.tgz`
# (the actual MXIO C SDK, also in this ingest batch) was extracted and its example client code
# (`EthernetE1200.cpp`, `activetag.cpp`) shows the real `MXEIO_E1K_Connect`/
# `MXIO_Connect_ActiveTag` API calls take a PASSWORD-ONLY parameter (`char Password[8]`, no
# username/account field anywhere in the SDK) -- consistent with E1200's own password-only web
# console, but NOT consistent with the admin+password PAIR found in the 2500-series firmware.
# The admin/moxa pair is therefore likely a DIFFERENT service's credential on this product
# (unidentified this pass -- candidates include a web console, FTP, or a cloud-sync/push feature
# referenced elsewhere in the same firmware's strings), not MXIO specifically. Filed with the
# mechanism honestly marked unresolved rather than asserting the disproven MXIO theory.
#
# NOT CONFIRMED THIS PASS: (1) which specific service/protocol actually checks this credential;
# (2) the exact TCP port/wire protocol; (3) whether it is enabled by default (its mere presence in
# a firmware config template is not proof of default network exposure, though every other
# Moxa credential-table finding this session that looked like this turned out to be a live,
# default-enabled service).
#
# SIGNIFICANCE: unlike most of this session's Moxa managed-switch/embedded-computer findings
# (LAN-facing only), several of these ioLogik 2500 firmware variants are for CELLULAR (GPRS/HSPA)
# and Wi-Fi backhaul -- i.e. some deployed units may be reachable over a cellular WAN connection,
# not just a local industrial network, changing the practical exposure profile.
#
# SEVERITY: CVSS v3.1 scored via the same scripted formula used throughout this session. Network
# vector reachability is the credential's clearly intended purpose (remote I/O access) but is not
# independently port/protocol-confirmed, so this is scored provisionally pending that
# confirmation, consistent with how this session handles credible-but-not-fully-verified network
# exposure:
#   Vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
#   Base Score: 9.8 (CRITICAL) -- full remote I/O read/write access via a hardcoded, unchanged
#   default credential, if MXIO (or an equivalent web/API surface using the same pair) is
#   reachable and authentication is enabled by default, as its existence implies.
#
# UPDATE 2026-09-18: MECHANISM RESOLVED -- CORRECTS THE EARLIER "MXIO ruled out" CONCLUSION ABOVE.
# The earlier pass tested the WRONG MXIO library (the general-purpose/E1200-targeted SDK, whose
# public API is password-only) and wrongly generalized that conclusion to the whole MXIO family.
# A newly-ingested file, `moxa-mxio-iologik-2500-linux-library-v3.0.tgz`, is Moxa's own OFFICIAL
# client SDK SPECIFICALLY for the ioLogik 2500 series (class `CMXIO_V3_2500`, "MXIO_V3" -- a
# DIFFERENT, newer API version from the one examined previously). Its own bundled example source,
# `x86_x64/example/Connect/Singleton/Singleton.cpp`, resolves every open question from the
# original filing:
#     CMXIO_V3_2500::MX_ACCOUNT_DATA AccountData;
#     sprintf(AccountData.szUserName,"%s", (char*)"admin");
#     sprintf(AccountData.szPwd,"%s", (char*)"moxa");
#     ...
#     iRet = g_pMXIO_V3_2500->MXIO_Connect(IPAddress, wPort, dwTimeout, &MxMACAddr, &AccountData, &ihConnection);
# i.e. Moxa's OWN official SDK sample code uses the literal string pair "admin"/"moxa" as its
# MX_ACCOUNT_DATA (szUserName/szPwd) example value for `MXIO_Connect()` -- an exact match to the
# base64-decoded credential found embedded in all 10 ioLogik 2500 firmware images. The port is
# resolved too: the example's `wPort` defaults to the SDK's own named constant
# `MXIO_V3_AGENT_PORT`, defined in the SDK's own Doxygen-generated header documentation
# (`_m_x_i_o___v3__2500_8h.html`) as `#define MXIO_V3_AGENT_PORT 10124` -- i.e. this is the
# "MXIO_V3 agent" protocol on TCP port 10124, a proprietary binary protocol (not HTTP/FTP), and
# `admin`/`moxa` is confirmed as the intended, vendor-sample-code default account/password pair
# for it.
#
# NOT YET REVERSE-ENGINEERED: the actual MXIO_V3_AGENT wire protocol bytes (the SDK ships only a
# compiled library + this Doxygen API reference, not the agent-side server source) -- so while the
# service, port, and credential are now all confirmed, a standalone (non-SDK) PoC or scanner check
# would still need either the vendor SDK linked in, or a packet capture against a live unit, to
# build. This project has no existing generic "MXIO_V3 agent" protocol executor.
#
# SEVERITY: confidence raised low -> high now that the mechanism is fully identified and directly
# corroborated by the vendor's own SDK sample code (not just a suggestive base64 string).
#   Vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
#   Base Score: 9.8 (CRITICAL) -- full remote I/O read/write access via a hardcoded, vendor-
#   sample-confirmed default credential over the device's own proprietary MXIO_V3_AGENT protocol.
#
# STILL NOT YET BUILDABLE AS A LIVE CHECK -- HELD PENDING RESPONSIBLE DISCLOSURE, same convention
# as the other undisclosed Moxa findings this session. Would need either the vendor's own MXIO_V3
# SDK linked into a check, or the raw wire protocol reverse-engineered from a capture, before a
# standalone scanner check could be built. No CVE found for this specific issue; not covered by
# SCADAPASS or any public source found.
#
# WIRE-PROTOCOL RESEARCH PASS 2026-10-01, per explicit user direction to pursue this as a "cheap,
# mechanism-already-known" bucket-1 item -- REASSESSED MID-PASS, HONESTLY: the API-level mechanism
# (port, credential, struct names) was already confirmed above, but the RAW TCP WIRE BYTES were
# not, and turned out to be a genuinely deeper reverse-engineering task than initially scoped, not
# a quick build. Extracted the installer (`MXIO_ioLogik_2500_x86_x64_3.0.0.sh`, a classic makeself
# archive -- carved the `__ARCHIVE_FOLLOWS__` payload by hand, same technique as this project's
# other self-extracting-archive work this session) to get the real, NOT-STRIPPED
# `libmxio_2500_x64.so` (the Windows SDK examined earlier only shipped headers/docs, not this
# library). Its full C++ symbol table gives real, concrete progress:
#   - The actual login call chain: `MXIO_Connect` -> `MXRTU_ConnectEx` (TCP connect) ->
#     `MXRTU_SendClientTypeToDevice` -> `MXRTU_VerifyUserNamePwd` -> internally,
#     `CModuleRTU::VerifyWriteAccountInfo(unsigned short, _PGM_VERIFY_WRITE_ACCOUNT_REQ,
#     _PGM_VERIFY_WRITE_ACCOUNT_ACK*)` -- a NAMED request/ack struct pair for the real wire
#     command, not a guess.
#   - Disassembly of the request-struct construction (the struct is passed BY VALUE, so its field
#     layout is visible in how the caller populates it on the stack) suggests a short (~19-24
#     byte), tightly packed binary structure with a leading 16-bit field whose observed value is
#     0x76c0 -- a strong command-code/opcode candidate, not yet independently confirmed.
#   - `CMxrtuSockEIO::SendCommand` (the generic transport under all MXRTU commands) references
#     specific magic byte comparisons (0xfc, 0x99, 0x95 seen in the disassembly) suggestive of a
#     byte-stuffing/escape-style framing layer (common in Moxa's serial-to-TCP "RTU gateway"
#     protocol family, consistent with the "CMxrtuSockEIO"/"MXRTU" naming itself implying a
#     serial-RTU-over-TCP heritage) -- NOT decoded field-by-field this pass.
# HONEST STOPPING POINT: this binary has no DWARF debug info (only the symbol table survived), so
# further progress needs either a proper decompiler (not available in this environment) or a live
# device/packet capture to empirically confirm field semantics -- continuing via raw `objdump`
# disassembly alone has a poor effort-to-confidence ratio past this point. The command/struct
# names above are real and useful for a FUTURE pass (far better starting point than "unknown wire
# protocol"), but this project's own rigor standard ("never assert wire format without checking")
# means a check should NOT be built from this alone -- the exact byte layout isn't confirmed
# confidently enough yet. Not promoted to checks/; still a candidate, now with a much narrower,
# more specific remaining gap than before this pass.
#
# DECOMPILER PASS 2026-10-02: the "needs a proper decompiler" line above is resolved -- installed
# standalone Ghidra 12.1.4 (headless, via `analyzeHeadless` + a small Java GhidraScript; an
# earlier attempt to add r2ghidra to the project's existing radare2 install failed outright --
# r2pm's r2ghidra package only builds against a git-master radare2, incompatible with the Ubuntu-
# packaged 5.5.0 actually installed here, a real version-coupling problem, not a quick fix).
# Decompiling the SAME `libmxio_2500_x64.so` functions already named above turned "struct layout
# inferred from raw mov instructions" into actual readable pseudocode, and resolved most of the
# remaining mechanism:
#   - `CModuleRTU::DataEncDecrypt(char*, int)` -- FULLY CONFIRMED, trivially simple: XORs every
#     byte of its input with the constant 0xAA. Called on BOTH the username and password before
#     they're placed in the request payload -- the credential is NOT sent in plaintext, but the
#     "encryption" is a fixed single-byte XOR, not a real cipher.
#   - `CRTUTCP::SetHeaderData(_PGM_HEADER*, unsigned short)` -- FULLY CONFIRMED (direct pointer-
#     offset writes, no stack-variable ambiguity within this function itself): writes a 4-byte
#     magic value `0x3f434144` (bytes 44 41 43 3f, i.e. ASCII "DAC?") at offset 0, a 2-byte
#     per-connection session/client ID at offset 4 (copied from a field set earlier by
#     MXRTU_SendClientTypeToDevice), a 2-byte field at offset 6 that increments by 4 per call
#     (purpose not fully confirmed -- a header-length or protocol-version tag is the leading
#     guess), a 2-byte AUTO-INCREMENTING transaction/sequence ID at offset 8 (per-connection
#     state, wraps 0xFFFF->0 -- a Modbus-style TID), and the passed-in command code at offset 10.
#     This confirms command code 0x76c0 is real: it's threaded cleanly from
#     VerifyWriteAccountInfo's own leading `unsigned short` parameter all the way down to this
#     exact header field, not inferred from an isolated register value.
#   - `modbus_rtu_crc16` -- confirmed by name and call shape to be the standard, well-documented
#     Modbus RTU CRC16 algorithm (not a proprietary checksum) -- reused somewhere in the framing,
#     covering at least the header.
#   - ONE GENUINE REMAINING AMBIGUITY, caught by deliberately cross-checking Ghidra's decompiled
#     C against the RAW disassembly rather than trusting it blindly (a real, concrete example of
#     why that discipline matters, not a hypothetical one): Ghidra's decompiled `SendCommand` C
#     text names a local variable that LOOKS like "payload_length + 2" being fed into the CRC
#     call, but the actual raw instruction immediately before that call is `lea 0x6(%rax),%esi`
#     -- i.e. the real CRC-length argument is `SetHeaderData's own return value (in RAX) + 6`,
#     not an independently-tracked payload-length variable at all. Ghidra's own stack-slot
#     splitting named two DIFFERENT things with deceptively similar-looking decompiled C, and
#     reading the pseudocode alone would have produced a confidently wrong frame layout. Given
#     this, the overall frame's exact total length, and whether the CRC covers header-only vs.
#     header+payload, is NOT asserted here -- it needs either continued raw-register-level
#     tracing past this specific point, or a live device/packet capture, before a byte-exact
#     implementation should be built.
#
# NET EFFECT: a dramatically stronger evidence base than the objdump-only pass (XOR key
# confirmed, header magic/fields confirmed byte-by-byte, command code independently corroborated
# via clean dataflow rather than an isolated register read) -- but still deliberately NOT promoted
# to checks/, both because disclosure_status here depends on the wider 8-finding Moxa batch
# context above and because the one remaining frame-layout ambiguity is real, not a formality.
#
# CONTINUED TRACE 2026-10-02: resolved the frame-layout ambiguity above, and found something
# genuinely more interesting underneath it. Tracing raw registers all the way from the
# SetHeaderData call through the actual CMxrtuSockEIO::SendCommand call (the real socket write)
# confirms:
#   - The CRC16-covered region is a FIXED 10 bytes, not dependent on the TID value as the previous
#     pass's register trace had suggested (that was itself a misread -- the `+6` offset comes from
#     a constant header field set to 4 on a fresh zeroed buffer, not from the register the
#     previous pass assumed; a second, independent example of why re-tracing raw registers rather
#     than trusting an earlier interpretation matters). The checksummed bytes are exactly: magic
#     "DAC?"(4) + sessionID(2) + the constant field(2) + TID(2) = 10 bytes.
#   - The 2-byte CRC16 result is written DIRECTLY INTO the buffer at offsets 10-11 -- the EXACT
#     SAME bytes where the command code (0x76c0) had been copied moments earlier as part of a
#     combined TID+cmdcode 4-byte copy. The CRC write OVERWRITES the command code before the
#     packet is ever sent -- confirmed by tracing every instruction between the two writes, not
#     inferred.
#   - The buffer actually handed to `CMxrtuSockEIO::SendCommand` (the real send call) is exactly
#     this same 12-byte region (header[0..9] + CRC[10..11]), with the already-XOR'd-and-packed
#     payload (built earlier in VerifyWriteAccountInfo, confirmed via a SEPARATE buffer allocation
#     `pcVar4 = operator_new__(uVar14)`) appended immediately after.
#   - CONCLUSION: the outer per-connection header's "command code" field is CONFIRMED ABSENT from
#     the actual wire frame in this code path -- it never reaches the socket. Command/request-type
#     identification almost certainly happens via the PAYLOAD's OWN leading byte instead: the
#     earlier decompile of VerifyWriteAccountInfo's payload-construction code showed its first
#     field (the request struct's own first byte) explicitly compared against the literal value
#     `0x02` in a conditional branch, exactly the shape of a self-describing payload tag -- this is
#     a strong, but not yet independently confirmed, explanation. The header's 0x76c0 value
#     appears to be either vestigial for this specific command class, or used for client-side
#     dispatch/logging only, never actually serving a wire-protocol role here.
#
# FINAL WIRE FORMAT, as confirmed by this pass (CRC region and overwrite behavior byte-exact; the
# payload's own internal tag-byte semantics are the one piece still not independently confirmed):
#     bytes 0-3:   magic "DAC?" (0x44 0x41 0x43 0x3f)
#     bytes 4-5:   per-connection session/client ID
#     bytes 6-7:   constant field, value 4 observed (purpose not fully confirmed)
#     bytes 8-9:   auto-incrementing transaction ID (Modbus-style TID)
#     bytes 10-11: Modbus RTU CRC16 of bytes 0-9 (overwrites where the command code was staged)
#     bytes 12+:   payload -- for VerifyWriteAccountInfo, XOR-0xAA'd username/password plus a
#                  leading self-describing type byte (value 0x02 seen in one branch), not the
#                  outer header's own command code
# GENUINE STOPPING POINT: this is now a real, substantially evidence-backed wire format -- far
# beyond "unknown proprietary protocol" -- but the payload's own internal field layout (beyond the
# leading type byte) still has the same kind of CONCAT/SUB pass-by-value messiness in Ghidra's
# decompile that this file's earlier pass flagged, and wasn't re-traced at the raw-register level
# this pass. A live device/packet capture would resolve the remainder faster than more static
# tracing at this point -- recommended next step if this candidate is picked up again, rather than
# continuing indefinitely with register-level tracing alone.

