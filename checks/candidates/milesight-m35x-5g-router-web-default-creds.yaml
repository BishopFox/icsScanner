  - "CVE-2023-43261 (VulnCheck write-up) — Milesight/Ursalink UR5X/UR32/UR35/UR41 router httpd: unauthenticated GET /login discloses model/rtver JSON; login is a JSON API ({core:user,function:login,values:{username,password}})"
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
description: >
  Milesight M350 / M351-5G industrial cellular routers ship a documented default web login
  (username `root`, password `2wsx#EDC`, http://192.168.1.1), plus a default Wi-Fi passphrase
  `12345678` and a default IPsec PSK — confirmed from Milesight's own manuals. Public vendor-
  documented factory default (not a CVE). Fingerprint gate is now in place (protocol_probe
  milesight_router_identity, grounded on CVE-2023-43261). Not yet armed: the JSON login endpoint
  path+method is not confirmed from the public writeup, and the SSH/Telnet paths' acceptance of the
