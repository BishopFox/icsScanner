# Candidate stub — 2026-09-18. Ingest triage, 8th Moxa batch, MASSIVELY broadened in the 10th
# batch (the final/largest Moxa dump) once the underlying shared switch OS turned out to span
# dozens of product lines. Confirmed no prior candidate/check for this finding existed before
# writing this file.
# REVERTED FROM ARMED 2026-10-06 (Phase 2): briefly armed in Phase 1b (commit 41b70b6) as a
# SetSHA256 web check. Its Phase-1b reference claimed "SetSHA256 (account_password_form) confirmed in
# moxa-tn-4500a-series-firmware-v4.2.rom" -- but that firmware was NOT actually re-verified this pass,
# and the sibling Phase-1b claims (NPort 6000, MiiNePort) proved FALSE on re-download (both are the
# MD5 SetPass variant, not SetSHA256). This huge switch family also spans MX-ROS v3 devices whose web
# login is a modern JSON/REST stack, NOT the embedded SetSHA256/SetPass form at all. Scheme per
# sub-line is UNCONFIRMED. Per the rigor gate, reverted to candidate -- do not arm an unverified wire
# format across dozens of product lines. TO ARM: download+extract representative firmware for each
# sub-family (e.g. a classic MDS/TN managed switch vs. an MX-ROS MRX), read each login, and arm the
# matching executor(s); likely splits into >1 check.
#
# THE FINDING, from a very large number of Moxa's own official manuals (all user-supplied,
# fetched/read directly via pdftotext) -- admin/moxa is the shared, PERSISTENT (recommendation-
# only, not forced) factory-default login for **MX-ROS**, Moxa's own managed-switch/AP operating
# system, confirmed independently across EVERY one of the following product-line manuals this
# session (near-identical wording in each, "By default, the password assigned to the Moxa switch
# is moxa" / "The default username is admin and the default password is moxa"):
#   MDS-G4000 / MRX-G4064 (batch 8), Next-generation OS v4.x Layer 2 (batch 8),
#   MX-ROS v3 (the OS's own manual, batch 10), TN-4500A/TN-5500A, TN-4900, TN-G4500/TN-G6500,
#   TSN-G5000 (both CLI and Web Interface manuals), PT-7528/PT-7728/PT-7828,
#   PT-G503 (PRP/HSR RedBox), PT-G7728/PT-G7828, TAP-213, TAP-323, TAP-6226,
#   WAC-1001, WAC-2004.
# This is no longer reasonably describable as a "switch family" finding -- it is an OS-wide
# default spanning managed switches, PRP/HSR redundancy boxes, TSN switches, and wireless
# APs/bridges/controllers, all built on the same MX-ROS codebase.
#
# EXPLICITLY DOES NOT APPLY, confirmed directly (not assumed) from their own manuals: **TAP-M310R**
# ("There is no default user account and password. Enter the username, password, and email
# address...") and **WAC-M300** ("There is no default user account and password. Enter the
# username and password for the admin...") -- both force a first-use account creation instead,
# a newer/different security posture than the rest of the MX-ROS family. NOT folded into this
# candidate's scope.
#
# THE WIRE PROTOCOL -- RESOLVED THIS PASS, closing the "not yet buildable" gap the original
# (narrower) version of this candidate left open. `moxa-tn-4500a-series-firmware-v4.2.rom`
# (gzip-wrapped, UNENCRYPTED, dated 2026-04-02 -- genuinely current shipping firmware) was
# decompressed and read directly: the login page is a PLAIN, un-obfuscated HTML form --
#     <form method="post" autocomplete="new-password" name="account_password_form"
#           action="/home.asp" target="_top" onSubmit="SetCookie()">
#     <input type="text" name="account" maxlength="16" class="input_field">
#     <input type="password" autocomplete="new-password" name="password" maxlength="16"
#            class="input_field">
# `SetCookie()` (misleadingly named) only calls a server-side `<%ShowTouchLasttime();%>` template
# tag -- it is NOT a credential-hashing function like the MGate/NPort family's `SetSHA256()`. The
# credentials are submitted as PLAIN form fields, `account` and `password`, via a normal POST to
# `/home.asp` -- a genuinely SIMPLER mechanism than every other Moxa web login reverse-engineered
# this session, and directly buildable with ZERO NEW CODE via the existing
# `checks/http/native/form_post_default_creds.py` executor. Success/failure signal: the firmware
# sets a `sysnotify_loginStatus` cookie to the literal string `"fail"` on a failed attempt
# (`web_cookie_create('sysnotify_loginStatus','fail')`, confirmed directly in the firmware's own
# string table) -- a real, checkable negative signal; the positive (successful-login) cookie value
# was not captured verbatim this pass (only the failure and an "initial" state were found), so the
# exact `success_body_field`/cookie-value criterion `form_post_default_creds.py` would need is
# still one small step from fully specified.
#
# NETWORK EXPOSURE: explicitly documented as identical across "web, serial, Telnet" consoles
# throughout this whole manual set. HTTPS is the default web console scheme where both HTTP/HTTPS
# are supported (HTTP auto-redirects). Default management IP: 192.168.127.253 (repeated across
# every manual in this family).
#
# STILL NOT BUILT this pass, despite the protocol now being resolved -- this remains a
# documentation/candidate update, not a shipped check, consistent with this session's "research
# now, build only when asked" posture for this specific batch; flagged clearly as READY TO BUILD
# (unlike the MGate/NPort family, which still needs real SHA256+XOR reimplementation work) the
# moment a live check is wanted, pending only confirming the exact success-cookie value.
#
# SEVERITY: CVSS v3.1 scored via the same scripted formula used throughout this session:
#   Vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
#   Base Score: 9.8 (CRITICAL) -- full administrative access to a wide family of managed
#   industrial network infrastructure via a vendor-documented, persistent-until-manually-changed
#   default credential, reachable over HTTP(S)/Telnet/serial by default.

check_id: candidate-moxa-mds-mrx-switch-admin-moxa-default-password
protocol: http
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "MX-ROS-based Moxa network infrastructure: MDS-G4000/MDS-G4000-4XGS/MRX-G4064, TN-4500A/TN-5500A, TN-4900, TN-G4500/TN-G6500, TSN-G5000, PT-7528/PT-7728/PT-7828/PT-G503/PT-G7728/PT-G7828, SDS-3000/SDS-G3000, TAP-213/TAP-323/TAP-6226, WAC-1001/WAC-2004 -- EXCLUDES TAP-M310R and WAC-M300, confirmed to force first-use setup instead"
references:
  - "Moxa Managed Switch Next-generation OS (v4.x) Layer 2 User Manual, v1.4, user-supplied"
  - "Moxa Managed Switch MRX V2.x User Manual, v1.0, user-supplied"
  - "Moxa MX-ROS v3 Manual, v1.16, user-supplied"
  - "Moxa TN-4500A/5500A, TN-4900, TN-G4500/G6500, TSN-G5000 (CLI + Web Interface), PT-7528/7728/7828, PT-G503, PT-G7728/7828, TAP-213/323/6226, WAC-1001/2004 manuals, all user-supplied -- identical admin/moxa wording confirmed in each"
  - "moxa-tn-4500a-series-firmware-v4.2.rom, user-supplied ingest, unencrypted, dated 2026-04-02 -- login wire protocol (plain form POST, account/password fields, /home.asp) read directly from firmware strings"
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own POST to /home.asp carrying the literal default credential in plain account/password fields — verified directly against the firmware's own form markup"
    patterns:
      - context: request
        regex: "POST /home\\.asp"
      - context: request
        regex: "account=admin&password=moxa"
  broad:
    description: "Any POST to /home.asp carrying account/password form fields against this device family — the vulnerability class (default/weak MX-ROS credentials), not the specific guessed value"
    patterns:
      - context: request
        regex: "POST /home\\.asp"
# UPDATE 2026-09-18 (10th/final batch, additional corroboration): "Moxa Industrial Smart Ethernet
# Switch" manual (v3.2) and "Moxa Managed Ethernet Switch" (v9.7) / PT-7528/7728/7828 (v9.9)
# manuals all independently confirm the identical admin/moxa wording, adding no new scope.
#
# GENUINELY NEW DETAIL THIS UPDATE -- VERSION-GATED PASSWORD CHANGE: the TAP-6226 (v3.0) and
# WAC-1001 (v5.1_1) / WAC-2004 (v5.0) manuals each carry an explicit firmware-version-gated note
# not seen in the other MX-ROS manuals: "Firmware Version 1.6 password: moxa; Firmware Versions
# 1.0 to 1.5 password: root" -- i.e. on these three wireless AP/bridge products specifically, OLDER
# firmware (<=1.5) shipped with the SAME "root" default password already documented for the
# IA-series/ioPAC embedded-Linux line (checks/ssh/moxa-ia-series-default-creds.yaml), and only
# firmware 1.6+ switched to the more common "moxa" default. Genuinely useful for a live check: a
# credential-list check against these three specific products should try BOTH admin/moxa AND
# admin/root, since the firmware version in the field is not knowable in advance from a scan alone.
#
# CONFIRMED EXCLUSIONS, re-verified this batch: TAP-M310R manual states plainly "There is no
# default user account and password" and WAC-M300 manual states the same — both independently
# re-read this pass, corroborating the original exclusion above with a second direct read.
#
# HONEST DISCREPANCY FLAGGED, NOT SILENTLY RESOLVED: Moxa's own "Security Hardening Guide for the
# Rail Wi-Fi 4 Series" tech note (v1.0, user-supplied) states "The default login credentials are:
# Username: moxa / Password: admin" -- i.e. the username and password REVERSED from every other
# MX-ROS manual in this family (which consistently document admin/moxa). "Rail Wi-Fi 4 Series"
# plausibly refers to the same TAP-213/WAC-2004-class rail products already in scope above, but
# this specific tech note was not cross-referenced against a specific model number, and the
# reversed credential shape was not independently verified against firmware. Filed here as an
# open discrepancy (possible documentation error in the tech note, or a genuinely different
# credential for this specific hardening-guide context) rather than assumed to be the same finding
# — do NOT build a live check assuming username=moxa/password=admin without further verification.

description: >
  Moxa's MX-ROS-based network infrastructure line — managed switches (MDS-G4000/MRX-G4064,
  TN-4500A/5500A, TN-4900, TN-G4500/G6500, PT-7528/7728/7828), TSN switches (TSN-G5000), PRP/HSR
  redundancy boxes (PT-G503, PT-G7728/7828), and wireless APs/controllers (TAP-213/323/6226,
  WAC-1001/2004) — all share a persistent factory-default credential, admin/moxa, documented
  identically across a very large number of Moxa's own official manuals. TAP-6226/WAC-1001/
  WAC-2004 firmware v1.0-1.5 specifically shipped admin/root instead, changing to admin/moxa only
  in firmware v1.6+ — a live check against these three products should try both. The login wire protocol
  was reverse-engineered this pass from real, current (2026), unencrypted TN-4500A firmware: a
  PLAIN, un-obfuscated HTML form POST to /home.asp with `account`/`password` fields — no hashing
  or obfuscation, unlike the MGate/NPort/MiiNePort family's SHA256+XOR scheme. Directly buildable
  with zero new code via the existing form_post_default_creds.py executor once the exact
  success-signal cookie value is confirmed (the failure value, "fail", is already known). TAP-M310R
  and WAC-M300 are explicitly confirmed NOT to share this default (forced first-use setup instead).
  CVSS 3.1: 9.8 CRITICAL (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). Disclosure status: public (sourced
  from Moxa's own manuals and corroborated directly by firmware).

