# executable (no `kind`).
#
# OMNI Flow Computers (OMNI 3000/6000/7000 series, oil/gas custody-transfer flow computers) —
# Administrator default password "OMNI" for connecting via the vendor's OMNICOM software,
# confirmed across two independent sources (a Scribd-hosted OMNI 3000/6000-E User Guide excerpt,
# and a separate search result describing the same Administrator/OMNI default). The device's own
# security model explicitly covers "access via front panel, serial port, and Ethernet port" —
# i.e. this credential IS enforced over a network connection, not just locally.
#
# NOT BUILT: OMNICOM is a proprietary Windows configuration application; no documented wire
# protocol was found for its Ethernet-port authentication exchange. Same class of blocker already
# accepted for Beckwith Electric's M-3425A/IPScom candidate and AutomationDirect's CLICK PLC
# candidate (Phase 18) — real credential, not pursued without a protocol spec or an existing
# open-source implementation to build against.
#
# 3RD SOURCE, STRONG CORROBORATION 2026-08-19 (user supplied OMNI's own official Installation/
# Operation manual, doc 50-0000-0001/Rev B, page 17 read directly): the manual's own "68-6001 CPU
# Module" section documents a front-panel RAM-reset recovery procedure. After the operator
# triggers "Reset All RAM" from the physical keypad menu, the device's OWN LCD DISPLAYS the
# literal text "RAM invalid use OMNI as password…." — a genuine, vendor-documented, in-product
# instruction naming the exact credential — then the manual states plainly: "Proceed to enter
# OMNI as the password then download your configuration using OMNICOM." Confidence raised low ->
# high accordingly.
#
# 4TH SOURCE, DEFINITIVE, SAME DAY (user supplied OMNI's own official "3000/6000-E Firmware and
# Software User Guide," Copyright 2016, read directly): a dedicated section, "2.3.2 Password",
# states as plainly as this sweep has ever sourced anything: "The factory default Administrator
# password is OMNI." Entered case-insensitively (upper or lower case). Confirms: one
# Administrator + sixteen configurable Users exist; ALL User passwords are BLANK/disabled by
# factory default (only Administrator is active out of the box); the Administrator password
# "cannot be blank" (guaranteeing it stays at the documented default unless deliberately
# changed). This credential is now about as well-sourced as anything in this entire sweep.
#
# IMPORTANT STRUCTURAL RESOLUTION, same document: this User Guide ALSO documents a completely
# SEPARATE "2.2 Modbus Passwords" mechanism — per-communication-port, 8-character alphanumeric,
# 3 tiers (Level A = full access, Level B = operator/diagnostic read-mostly, Level C =
# read/view-only). This CONFIRMS (not just infers from register size, as this candidate's own
# earlier entry reasoned) that Modbus point 4850's "Online Password" (see the Volume 4 register-
# map finding below) is a GENUINELY DIFFERENT credential system from the OMNICOM Administrator/
# OMNI password documented here — same document, two distinct, explicitly-named mechanisms. No
# default VALUE is given anywhere in this document for the Modbus Level A/B/C passwords either —
# that gap stands exactly as before.
#
# STILL BLOCKED: none of the 4 sources found so far describe OMNICOM's underlying network wire
# protocol/handshake (TCP port, message format, packet sequence) — every source describes the
# software's functional UX (what the login dialog looks like, what the LCD says), not its wire
# mechanics. The credential value is airtight; the engineering blocker (no OMNICOM protocol
# implementation) is completely unchanged by any of this.
#
# CHECKED 2026-08-19 (user supplied OMNI's own official "OMNI Flow Computer Modbus Database:
# Overview" bulletin, TB-970802B, read directly via pdftotext): this document does NOT resolve
# the OMNICOM blocker — it is purely a register-layout/data-type reference for the device's
# SEPARATE Modbus interface (function codes 01/03/04/05/06/0F, address structure) and contains
# ZERO mentions of "password," "security," "access level," or "OMNICOM" anywhere. It references
# a further document, "Volume 4 'Modbus Database Address and Index Numbers'," for the actual
# register/address list.
#
# FOLLOW-UP 2026-08-19, SAME DAY: user supplied that exact Volume 4 document (OMNI 6000/OMNI 3000
# User Manual, "Modbus Database Addresses and Index Numbers", from a third-party mirror,
# VirusTotal-scanned clean per the user). This is REAL WIRE-MECHANISM PROGRESS, distinct from
# (and NOT a resolution of) the OMNICOM Administrator/OMNI credential above:
#   - Modbus point 4850, "Online Password / EPROM Checksum" — a genuine dual-function register:
#     WRITE sends a password value; READ returns the EPROM checksum instead (an unrelated value).
#   - Exception code 05, "PASSWORD NEEDED" — documented in the same manual's exception-response
#     table, returned when a password-protected write is attempted without first supplying a
#     valid password to 4850.
#   - This gives a real, buildable wire MECHANISM (write a candidate password to 4850, then
#     attempt a write to a password-protected point and check whether exception 05 still occurs)
#     — but NO DEFAULT VALUE for this specific password is stated anywhere in this document.
#   - IMPORTANT, NOT YET RESOLVED: this "Online Password" is almost certainly a DIFFERENT
#     credential from the OMNICOM Administrator/OMNI value sourced earlier, not the same one
#     under a new name. Point 4850 is ONE 16-bit register (max value 65535) — every other
#     ASCII-text field in this same document (Company Name, Station Location) uses 2 characters
#     per register across MULTIPLE registers, so a genuine 4-character ASCII value like "OMNI"
#     would not fit in one register. This strongly suggests 4850's "Online Password" is a
#     NUMERIC PIN-style value, structurally distinct from OMNICOM's ASCII Administrator password
#     — flagging this explicitly so a future pass doesn't wrongly assume they're the same
#     credential just because both are called "password," the same discipline already applied to
#     the TB-080001D print-server and Omnicomm-the-Russian-company distinctions below.
#   - NOT BUILT: the actual default value for the Modbus-level Online Password is still unknown.
#     Needs either a source stating the factory-default numeric value, or a live device to
#     observe it against (e.g. trying 0/blank first, the most common numeric-PIN factory default
#     pattern elsewhere in this sweep).
#
# Separately: a technical bulletin (TB-080001D, "Network Printing") mentions a DIFFERENT
# lowercase "omni" password for Telnet remote configuration — but on closer reading this is for
# an attached network PRINT-SERVER module specifically, not the flow computer's own main
# Administrator login. Deliberately NOT conflated with the Administrator/OMNI credential above —
# flagging the distinction so a future pass doesn't merge two different subsystems' credentials.
#
# ANOTHER, COMPLETELY UNRELATED naming collision worth flagging explicitly, confirmed 2026-08-19:
# "OmniComm" (note the extra syllable/spelling — Omnicomm, not OmniCom/OMNICOM) is a real,
# separate Russian company (Omnicomm-World, active since 1998) making GPS/GLONASS vehicle
# telematics and fuel-level monitoring equipment (Omnicomm LLS capacitive fuel sensors, Omnicomm
# Online fleet platform) with its OWN real protocol — the Omnicomm LLS protocol, described as a
# de facto industry standard specifically for capacitive fuel-level sensors. This has ZERO
# relation to OMNI Flow Computers (a Texas oil/gas custody-transfer flow-computer vendor) or its
# OMNICOM configuration software — different company, different country, different industry,
# different product class (vehicle/fuel telematics vs. stationary industrial flow measurement).
# Flagging explicitly so a future search for "omnicom"/"omnicomm" protocol material doesn't
# accidentally merge these two unrelated vendors, the same discipline already applied to the
# TB-080001D print-server distinction above.
#
# CROSS-REFERENCE, 2026-08-30: Omnicomm's OWN product line now has its own separate research
# thread — a real Modbus "Password" register on their fuel-level sensors, not built (no default
# value, reachability unconfirmed). See
# checks/candidates/omnicomm-fls-modbus-password-register.yaml. That file is about Omnicomm's own
# device, unrelated to OMNI Flow Computers — do not merge the two findings just because they were
# discovered via the same research thread.
#
# FOLLOW-UP 2026-09-22 (firmware-gap sourcing pass): checked whether the actual OMNICOM software
# is obtainable to reverse-engineer its wire protocol directly. CONFIRMED NEGATIVE, from the
# vendor's own current position, not just a search gap: OMNICOM is no longer distributed via
# public download from the OMNI Flow Computers website at all — obtaining it now requires
# contacting OMNI's support team directly (281.240.6161), i.e. this is not a login-gate this
# project could work around, it is simply not publicly available. One third-party site
# (vohauipr.com) advertises an "OmniCom V1.3 Software Trial" download — deliberately NOT
# downloaded or pursued: an unverified third-party host distributing a Windows installer for
# industrial control-system configuration software is a real malware-risk vector (same caution
# already applied this session to unofficial Huawei firmware mirrors), not a legitimate
# substitute for the vendor's own distribution channel. This closes the "acquire the software"
# angle as a dead end through normal means — the OMNICOM wire-protocol blocker remains exactly as
# before, now confirmed not resolvable via public download rather than merely unresolved.

