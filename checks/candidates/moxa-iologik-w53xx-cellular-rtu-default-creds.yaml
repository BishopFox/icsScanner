# networking technique), not that the device runs an actual Telnet SERVER with a login prompt on
# those ports. SCADAPASS's "Telnet on port 9900/9000: root:root" row is very likely a
# misreading of exactly this troubleshooting instruction, not a real finding — same conclusion
# this project already reached elsewhere for a mis-transcribed row (e.g. the EGX400/PowerLogic
# "8000" username case). No Telnet mention anywhere else in this manual.
#
# ADMINISTRATOR:BLANK HALF — genuinely confirmed, but for a different, non-network access
# method: the manual's own "Connecting to ioAdmin via Ethernet Console" section (2.3) states
# "When you install the ioLogik for the first time, the password will be blank and you can
# simply click Login" — but this is via "ioAdmin," Moxa's own Windows configuration utility,
# accessed either through a direct RJ45 Ethernet CONSOLE port cable ("direct connection... to a
# host computer, rather than remotely over the network") or an auto-search over a normal
# network using ioAdmin's own proprietary discovery/configuration protocol (not a standard
# HTTP/Telnet/FTP/Modbus service this project's executors can speak). Not buildable without a
# reverse-engineered wire format for ioAdmin's own protocol — a genuinely different, larger
# undertaking than confirming a value for an existing executor.
#
# CLOSED: Telnet root:root portion treated as a likely-false SCADAPASS row; administrator:blank
# portion confirmed but architecturally unreachable by this project's current executors.

