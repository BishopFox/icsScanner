  - "Moxa \"The Security Hardening Guide for the MGate 5000 Series\" tech note, v2.6, user-supplied, sections 3 and 3.4 (default admin/moxa credential) and 3.1 (default-enabled HTTP/80 + HTTPS/443 web console)"
  - "moxa-mgate-mb3180-firmware-v2.7.rom, user-supplied ingest, raw (uncompressed) firmware, Login.html/loginframe.html login flow + SetSHA256()/ascii-table/xor() JS read directly from firmware strings"
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "Not yet determined -- the exact POST body (SHA256+XOR-obfuscated account/password fields, plus an uncharacterized CSRF_TOKEN) was not reverse-engineered into a working implementation this pass."
    patterns: []
  broad:
    description: "A POST to / carrying account/password/FakeChallenge form fields against this device — the vulnerability class (a documented, unchanged default web-console credential), not a specific guessable wire pattern"
    patterns:
      - context: request
        regex: "name=\"?FakeChallenge\"?"
description: >
  Moxa's MGate 5000 Series protocol gateways (Modbus/PROFIBUS/EtherNet IP/PROFINET/serial
  gateways — MB3180/3280/3480/3660, 4101-MB-PBS, 5101-PBM-MN, EIP3170/3270, W5108/W5208 all
  present as firmware in this ingest batch) ship a documented factory-default web-console
  credential, admin/moxa, per Moxa's own official Security Hardening Guide — explicitly NOT
  applicable to the newer 512x/513x/5435/5192 sub-models, which the same guide says use a
  first-login setup flow instead. HTTP (80) and HTTPS (443) web consoles are both enabled by
  default. The login wire protocol (reverse-engineered directly from real MB3180 firmware) is a
  custom, non-standard SHA256-keyed XOR obfuscation applied to BOTH the username and password
  fields, plus a separate, uncharacterized CSRF token — genuinely more involved than this
  project's other Moxa web-login findings, not yet fully reverse-engineered into a working check.
  CVSS 3.1: 9.8 CRITICAL (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). Disclosure status: public (sourced
  from Moxa's own hardening guide, not a novel undisclosed finding).

