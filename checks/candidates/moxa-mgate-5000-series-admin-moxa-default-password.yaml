# i.e. this is a PUBLICLY DOCUMENTED default, not a novel discovery -- filed disclosure_status:
# public, same posture as the AWK-1121 (admin/root) and EDS-508A (admin/BLANK) checks, which are
# also sourced from Moxa's own manuals rather than firmware reverse-engineering alone.
#
# SCOPE, precisely as the guide itself states it: applies to the general MGate 5000 Series line.
# EXPLICITLY DOES NOT apply to the newer MGate 5121/5122/5123/5134/5135/5435/5192 Series, which
# the SAME document says use a first-login setup flow instead (no factory-preset password) --
# not assumed to share the default, the guide itself draws this exact line.
#
# NETWORK EXPOSURE, from the same guide's own "TCP/UDP Ports and Recommended Services" table:
# HTTP server ENABLED by default (TCP/80, "Web console"), HTTPS server ENABLED by default
# (TCP/443, "Secured web console"). Telnet server is DISABLED by default (TCP/23). SNMP agent
# ENABLED by default (UDP/161).
#
# THE WIRE PROTOCOL, reverse-engineered directly from real firmware (moxa-mgate-mb3180-firmware-
# v2.7.rom, gzip-uncompressed/raw HTML embedded directly in the .rom, no encryption) -- a
# GENUINELY MORE COMPLEX scheme than any other Moxa web login examined this session, not just
# "the same ioLogik-style SHA256+token trick with different field names":
#   1. The login page (`Login.html`) contains `<form name="account_password_form" method="post"
#      action="/" onsubmit="return loginLoad()">` with plain `account`/`password` fields, PLUS a
#      hidden `<INPUT type="hidden" name="FakeChallenge" value="${FAKECHALLENGE}">` (a real
#      per-page-load server-substituted challenge) and a `${CSRF_TOKEN}` template placeholder
#      immediately after it (a SEPARATE anti-CSRF mechanism, not yet extracted/characterized this
#      pass).
#   2. `onsubmit="return loginLoad()"` does NOT submit the form -- it loads a second document,
#      `/loginframe.html`, into a hidden iframe (`id="loginframe"`) and returns false, cancelling
#      the natural POST.
#   3. The real submission is triggered separately by `setInfo()` (called from within
#      `loginframe.html` once it's ready -- the exact trigger point wasn't traced this pass):
#          theform.account.value  = SetSHA256(theform, account_value);
#          theform.password.value = SetSHA256(theform, theform.password.value);
#          theform.submit();
#      i.e. BOTH the account name and the password are transformed before the real POST -- this
#      is not a "password-only hash" scheme like the ioLogik family, the username is obfuscated
#      too.
#   4. `SetSHA256(theform, raw_data)`, found directly in the firmware's own JS (the exact ASCII
#      table matches, near-verbatim, the SAME "01234567890123456789...126-char" lookup table this
#      session already found in the ioLogik E1200 family's own login JS -- confirming this is a
#      shared internal Moxa JS library reused across product lines, not independently invented
#      per product):
#          md = SHA256(FakeChallenge value)                          // hex string, 64 chars
#          for each character c in raw_data:
#              q = ascii_table.lastIndexOf(c)                         // 0-96
#              p += q.toString(16)                                    // hex, NOT zero-padded
#          for each hex digit p[i] (i < md.length, cycling via i%md.length once longer than md):
#              result_digit = hex_digit(xor(hexval(p[i]), hexval(md[i])))
#          return result string
#      i.e. a custom, non-standard, unsalted XOR-stream obfuscation keyed by SHA256(challenge) --
#      NOT a real HMAC or a simple hash comparison. Weak cryptographically, but genuinely more
#      work to replicate byte-for-byte in a scanner than any wire format this project has reverse-
#      engineered so far this session.
#
# NOT YET BUILDABLE AS A LIVE CHECK: the CSRF_TOKEN mechanism referenced immediately after
# FakeChallenge in the same form was not extracted/characterized this pass (need to find where/
# how it's generated and whether it's required on submission), and the exact trigger point for
# setInfo() (what in loginframe.html actually calls it, and what timing/state it depends on)
# wasn't traced. A live check would need both resolved, plus a from-scratch reimplementation of
# SetSHA256() in Python (straightforward given the exact algorithm above, just not done this
# pass) — a genuinely larger lift than this session's other login-flow candidates, flagged
# honestly rather than either skipped or half-built.
#
