# ingest/ directory contained "DBSS_111x_FW_XX_V1-1_9AKK107680A6150_Rev_B.raucb" — an ABB/
# Busch-Jaeger firmware update bundle for the "DBSS 111x" product line, internally codenamed
# "Caterpillar" per its own RAUC manifest (`compatible=BJE Caterpillar`, version 1.20.12, built
# 2021-06-01). Confirmed no prior DBSS/Caterpillar candidate/check existed before writing this file
