description: >
  An ABB/Busch-Jaeger "DBSS 111x" (internal codename "Caterpillar") building-automation gateway's
  firmware ships root and ftp system accounts with genuinely EMPTY /etc/shadow password fields.
  However, this project directly confirmed that neither SSH nor Telnet (the two systemd
  socket-activated services that could exploit these accounts) is enabled by default — neither
  socket unit has a symlink in sockets.target.wants, and Telnet additionally requires a
  development-only kernel command-line flag. The one network-facing service confirmed enabled by
  default (a .NET Core REST API, "caterpillarwww.service") runs as an unprivileged, non-root user
  and was not decompiled to check for its own default credential. A partially-mitigated finding,
  reported with the same reachability rigor as this sweep's NETA-21 case. Not yet buildable: no
  fingerprint precondition exists for this product, and the .NET REST API's own auth mechanism was
  not traced.
