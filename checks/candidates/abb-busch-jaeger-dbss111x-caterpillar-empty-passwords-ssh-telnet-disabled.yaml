# product name for "DBSS 111x" not independently confirmed this pass (the bundled service names —
# `knxrouter`, `influxdb`, `caterpillarwww` — suggest a KNX-integration/data-logging building-
# automation gateway, consistent with the free@home/Busch-Jaeger building-automation cluster this
# sweep has covered elsewhere, but this project has not pinned down the exact retail name).
#
# THE FILE, despite its `.raucb` extension, is a plain, UNENCRYPTED SquashFS filesystem (confirmed
# directly via `file`: "Squashfs filesystem, little endian, version 4.0, zlib compressed") — the
# same RAUC bundle structure already seen in this sweep's SSC600 finding (barebox.img + fit.img +
# manifest.raucm + rootfs.img). `unsquashfs -d` extracts it directly, no decryption needed.
# `manifest.raucm`'s own `[image.rootfs]` section shows a PLAIN, unsigned SHA256 checksum for
# `rootfs.img` (1,056,837,632 bytes) — the same "checksums not cryptographically signed" pattern
# independently confirmed for SSC600's CVE-2024-8036 mechanism, though this pass did not repeat
# that full certificate-serial-matching analysis for this specific device (out of scope/budget for
# this firing; noted here only as a structural observation for a future pass).
#
# `rootfs.img` is a real ext4 filesystem (confirmed via `file`), read directly with `debugfs -R
# "cat <path>"` (no mount needed, same technique used throughout this sweep for ext4 images).
#
# THE FINDING, confirmed directly, not inferred: `/etc/shadow` contains
#   root::12215:0:99999:7:::
#   ftp::0:0:99999:7:::
# — BOTH the root account AND a real "ftp" system account (`ftp:x:11:101:ftp user:/home:/bin/false`
# in /etc/passwd) have LITERALLY EMPTY password fields. Every other account in the same file
# (daemon, sshd) correctly uses `*` to mean "cannot log in with a password" — root and ftp are the
# two accounts this system deliberately leaves blank.
#
# REACHABILITY — thoroughly traced, both a real exposure and real mitigating factors found,
# reported honestly in both directions rather than picking one narrative:
#   1. This is a MODERN systemd-based image (not a legacy sysvinit/BusyBox rootfs like most of this
#      sweep's other ABB-Welcome/Busch-Jaeger findings) — both `/usr/sbin/sshd` and
#      `/usr/sbin/telnetd` are present, and BOTH are wired as systemd SOCKET-ACTIVATED services
#      (`sshd.socket`+`sshd@.service`, `telnetd.socket`+`telnetd@.service`), not simple rc.d
#      scripts. `sshd_config` was read directly and shows `PermitRootLogin yes` UNCOMMENTED
#      (explicitly overriding OpenSSH's own "prohibit-password" default) — a real, deliberate
#      configuration choice by the vendor, though `PasswordAuthentication`/`PermitEmptyPasswords`
#      are both left commented (falling back to sshd's own compiled defaults, `PermitEmptyPasswords
#      no` — so SSH itself should still reject a blank password even with root login allowed,
#      similar in spirit to the NETA-21 finding in this same sweep, though this project did not
#      independently extract this specific sshd binary's compiled default to double-confirm, as it
#      did for NETA-21's dropbear).
#   2. CRITICALLY: neither `sshd.socket` nor `telnetd.socket` appears in
#      `/etc/systemd/system/sockets.target.wants/` (the only entry there is
#      `systemd-networkd.socket`, confirmed directly by listing that exact directory) — meaning
#      NEITHER service is actually enabled by default in this image, regardless of their
#      `[Install] WantedBy=sockets.target` declarations (a systemd unit's WantedBy line only takes
#      effect once the corresponding .wants symlink actually exists). `telnetd.socket` additionally
#      carries its own belt-and-suspenders restriction: `ConditionKernelCommandLine=ptxdist-devel`
#      — it refuses to start at all unless the kernel was booted with a development-only command-
#      line flag, on top of not being enabled either way.
#   3. The ACTUAL enabled, network-facing service on this device (confirmed via a real static
#      symlink at `/lib/systemd/system/multi-user.target.wants/caterpillarwww.service`, read
#      directly) is `caterpillarwww.service` — a .NET Core REST API web server
#      (`ExecStart=/opt/dotnet/dotnet LocalRestApi.dll`, `WorkingDirectory=/www`), running as an
#      UNPRIVILEGED `caterpillar` user (`User=caterpillar`, NOT root), not root. This is almost
#      certainly the device's real web-configuration interface. This project did NOT decompile
#      `LocalRestApi.dll` (a .NET assembly — a genuine escalation beyond this firing's time/tool
#      budget) to determine whether it independently checks credentials against the same OS-level
#      accounts (unlikely, given it deliberately runs unprivileged) or maintains its own separate
#      user/credential store with its own default. NOT traced, stated honestly rather than assumed
#      either way.
#
# NET EFFECT: root and ftp's empty passwords are real, but — per direct evidence, not assumption —
# the two obvious OS-level network shell paths that would exploit them (SSH, Telnet) are BOTH
# disabled by default in this image, and the one service confirmed enabled by default
# (caterpillarwww) runs unprivileged and almost certainly does not consult these same OS accounts.
# This is a partially-mitigated finding, reported with the same rigor as this sweep's NETA-21 case:
# real credential, honestly-traced reachability gap rather than an assumed exploit path.
#
# NOT YET BUILDABLE: no fingerprint precondition exists for this product in this project, and the
# one remaining open question (whether caterpillarwww.service's .NET REST API has its own default
# credential) needs either a live device capture or a dedicated .NET-decompilation pass this firing
# did not have budget for.
#
