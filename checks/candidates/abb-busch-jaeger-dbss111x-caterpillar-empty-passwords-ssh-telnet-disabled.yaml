# DBSS_111x and panel43 — now THREE independent product lines (a KNX/data-logging gateway, a touch
# panel, and the central SysAP hub) confirmed sharing one base image/build pipeline.
# REACHABILITY on THIS device is the most conclusively traced yet in this family:
#   - `telnetd.socket` again carries `ConditionKernelCommandLine=ptxdist-devel` — same dev-only
