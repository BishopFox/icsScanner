# base image/pipeline around the same date, despite differing packaging formats. panel43's
# `telnetd.socket` carries the IDENTICAL `ConditionKernelCommandLine=ptxdist-devel` gate seen here
# (byte-for-byte same unit file content) — confirming this is a deliberate, STANDARDIZED
# vendor-wide security control applied consistently across at least two independent Busch-Jaeger
# product lines (this device's `sockets.target.wants/telnetd.socket` symlink DOES exist, unlike
# DBSS_111x's absent one, but the same kernel-command-line condition still blocks it from actually
# starting in a normal production boot either way). Not filed as a separate candidate — same
