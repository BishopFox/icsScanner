#     admin:$1$rfrSHPq/$/Zm7UP.8cLKqEwRY0kI3c1:20328:0:99999:7:::
#   CRACKED DIRECTLY (Python `crypt.crypt()` against the recovered salt): admin's password is
#   literally **"admin"** (username == password). `etc/passwd` confirms this is a real,
#   interactive account: `admin:x:10000:10000::/home/admin:/bin/sh` — not a service account.
#
