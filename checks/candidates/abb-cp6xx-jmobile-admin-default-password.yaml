# not confirm whether enabling such a toggle would start sshd using this same credential.
#
# NOT YET BUILDABLE: this project has no fingerprint precondition for ABB CP6xx / JMobile-based
# panels, and the exact web-login request flow (the Node "authsession" service's wire protocol) was
# not traced. Once a fingerprint and the actual JMuConfig login POST format are confirmed (e.g. via
# a live device capture), this would be a real default-credentials check.

