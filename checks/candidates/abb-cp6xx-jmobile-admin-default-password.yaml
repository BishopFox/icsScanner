# in this batch (UN60, UN65, UN78 — covering CP604 through CP6621, essentially the entire CP6xx
# product line) now independently confirmed to share the exact same admin:admin credential. This is
# conclusively a shared, vendor-wide default credential across the whole CP6xx line, not scoped to
