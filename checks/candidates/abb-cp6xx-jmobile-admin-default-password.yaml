# bundled `Release_Notes_BSP_UN60_UN65_V5.1.709.pdf` (read directly via pdftotext) contains the
# vendor's own changelog line: "Old password should be not necessary to change admin's default
# password" — ABB's own release notes independently confirm "admin's default password" is a real,
# named, documented concept for this exact product line's "admin" user, corroborating (without the
# document itself stating the literal value) the credential this project cracked directly from the
# firmware.
#
# REACHABILITY, confirmed as a real HTTP-facing PAM login gate, not assumed: `/etc/pam.d/login`
# and `/etc/pam.d/common-auth` (both real, standard PAM stacks using `pam_unix.so` against the
# same `/etc/shadow`) gate any local console login with this credential. Separately,
# `/etc/pam.d/nginx_authreq` is a REAL PAM service file (also `pam_unix.so`-backed) present
# alongside the device's own generated nginx config (`etc/nginx/sites-available/jmuconfig.sh`,
# read directly), which reverse-proxies the panel's own "JMuConfig" web configuration interface
# and applies a `custom_auth "Restricted Area - login required";` directive to its `/rest/`
# location — consistent with an nginx PAM-basic-auth module using that exact "nginx_authreq"
# service name. NOT fully traced this pass, stated honestly: the main JMuConfig web LOGIN page
# itself is handled by a separate Node.js "authsession" service (`proxy_pass http://nodejs`), which
# may maintain its own separate user/credential store rather than reading `/etc/shadow` directly —
# this project did NOT conclusively confirm whether logging into the main web UI with
# "admin"/"admin" actually succeeds, only that the SAME named Unix account (with this cracked
# password) gates local console login and at least one PAM-authenticated HTTP location.
#
# A REAL, STATED CAVEAT: `sshd` is present (binary + `/etc/init.d/sshd` + full `/etc/ssh/sshd_config`)
# but has NO rc.d runlevel symlinks in ANY runlevel in this rootfs — i.e. NOT started by default at
# boot (unlike the Busch-Jaeger 8136 finding, where telnetd's boot-time enablement was fully
# proven). CP6xx panels are documented (via this same release-notes file, e.g. "Set Allow only
