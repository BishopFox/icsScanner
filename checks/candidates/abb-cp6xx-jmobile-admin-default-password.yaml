#
# THE FILE unpacks (plain zip, no encryption at the outer or BSP-autoupdate layer) to
# `ABB_CP604-...-6605_BSP_5.1.709_autoupdate.zip`, which contains two REAL Linux root filesystem
# tarballs (`un60-xxxx-mainos-5.1.709.rootfs.tar.gz` / `...-configos-...`), each accompanied by a
# `.sig` file (an update-signing mechanism, not filesystem-level encryption — `tar xzf` extracts
# real files directly, no decryption needed).
#
# THE FINDING, confirmed directly, not inferred:
#   `etc/shadow` (mainos rootfs) shows root, sshd, ntp, avahi, messagebus, and app accounts all
#   LOCKED (`*` or `!` in the password field — cannot log in with a password) — this device does
#   NOT have the same class of bug as the Busch-Jaeger 8136/Welcome-Panel-ASI03 findings (no
