# multi-user runlevel, which (via standard `/bin/login` behavior against this same `/etc/passwd`)
# WOULD accept root with an empty password. This is a physical-access finding (requires a serial
# cable to the device's own UART), not a remote network finding.
#
# NOT FULLY TRACED, stated honestly rather than assumed either way: this device's real
# network-facing management surface is a Django-based web UI (`/opt/abb/www/webapp.wsgi`, served
# by Apache, boot-enabled via `/etc/rc*.d/S91apache2`), whose login flow
