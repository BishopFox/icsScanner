# credential, or whether it validates against the same OS-level `/etc/passwd` (which would make it
# exploitable via the empty root password despite SSH being blocked). The bundled `webui.sqlite`
# database contains only a `django_session` table, no populated `auth_user` table, in this
# pre-first-boot factory image — consistent with user accounts being provisioned at a later
# runtime step this pass did not observe.
#
# NOT YET BUILDABLE: this project has no fingerprint precondition for ABB NETA-21, and the actual
# exploitable path (the DataHub-backed web login) was not conclusively traced. The confirmed empty
# root password is real but, per the analysis above, is NOT exploitable via this device's own
