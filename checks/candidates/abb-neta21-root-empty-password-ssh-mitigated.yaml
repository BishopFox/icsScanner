# FMZAA340). Same result: `root::0:0:root:/home/root:/bin/sh` (empty password) and
# `DROPBEAR_EXTRA_ARGS="-w"` only. ALL THREE NETA-21 firmware builds supplied in this batch
# (spanning 2025-01-10 through 2025-12-05, roughly a full year) now independently confirmed to
# carry the identical empty root password and identical SSH mitigation — this is conclusively a
# stable, long-standing product-line characteristic, not a one-off build artifact.
#
# THE FILE (`FMZAA338.NTU`) is NOT a standard archive by extension, but IS a real, directly-
# extractable GNU tar stream once a 128-byte proprietary lead-in is skipped (confirmed directly:
# the standard "ustar" POSIX tar magic string is found at byte offset 385 = 257 [the standard
# magic-field offset within a 512-byte tar header] + 128 — i.e. a real tar header begins exactly
# 128 bytes into the file). `tar` then lists/extracts cleanly: `info.bz2`, `migration.bz2`,
# `uImage` (U-Boot kernel image, "MoretonOS"/Linux 2.6.32/ARM), `cpio.gzu` (U-Boot-wrapped initramfs),
# and `rootfs` — a real, UNENCRYPTED JFFS2 filesystem image (confirmed via `file`), extracted
# directly with the open-source `jefferson` JFFS2 parser (pip-installed this pass, a single small
# package, matching this project's lean-tooling firmware-extraction precedent). No decryption
# needed at any step; this 128-byte lead-in is packaging-tool boilerplate, not encryption.
#
# THE FINDING, confirmed directly, not inferred: `/etc/passwd` contains
#   root::0:0:root:/home/root:/bin/sh
# — the password field (2nd colon-separated field) is LITERALLY EMPTY, and there is NO
# `/etc/shadow` file in this filesystem at all (checked directly, confirmed absent) — meaning any
# login path that reads `/etc/passwd` directly (standard behavior when no shadow database exists)
# accepts root with ZERO characters as the password, no cracking needed.
#
# A REAL, DIRECTLY-VERIFIED MITIGATING FACTOR (not glossed over, not assumed): the ONLY
# network-facing shell service enabled by default is `dropbear` (a real runlevel-enabled service:
# `/etc/rc2.d/S18dropbear` through `/etc/rc5.d/S18dropbear`, confirmed present and correctly
# ordered), and `/etc/default/dropbear` sets `DROPBEAR_EXTRA_ARGS="-w"`. Extracted the ACTUAL
# compiled `dropbearmulti` binary's own embedded usage strings directly (not assumed from generic
# dropbear documentation) and confirmed: `-w` = "Disallow root logins", and separately `-B` =
# "Allow blank password logins" (NOT present in this device's args) — the SAME binary's own
# strings also show "User '%s' has blank password, rejected", confirming blank-password logins are
# REJECTED BY DEFAULT unless `-B` is explicitly passed. Therefore: root's empty password is NOT
# exploitable via this device's SSH service, under TWO independent, directly-confirmed mechanisms
# (root login disallowed via `-w`; blank passwords rejected by default regardless). `telnetd` is
# present in the filesystem (`/usr/sbin/telnetd`) but has NO rc.d runlevel symlink anywhere —
# confirmed NOT started by default.
#
