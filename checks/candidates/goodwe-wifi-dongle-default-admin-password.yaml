# Candidate stub — 2026-09-28. GitHub-specific sweep of the solar-inverter cluster (following the
# 2026-09-28 competitor-vendor-research-targets.md sourcing sweep, which flagged GoodWe as one of
# the acquisition-ready solar vendors and pointed at github.com/srudin/GoodweWifiFirmware and
