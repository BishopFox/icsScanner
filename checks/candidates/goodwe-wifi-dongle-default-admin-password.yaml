# candidate/check existed anywhere in this project before writing this file.
#
# THE FINDING: GoodWe's Wi-Fi/LAN Kit, Wi-Fi Kit, and Wi-Fi Box communication dongles (the network
# adapter that connects GoodWe solar inverters to a home network/the cloud, and is also used to
# push firmware updates to the inverter) ship with THREE separate fixed default credentials:
#   1. The dongle's own Wi-Fi access-point password (network name "Solar-WiFi<serial-suffix>"):
#      default password 12345678.
#   2. The dongle's local web configuration page (served at 10.10.100.253 or 10.10.10.253 once
#      connected to that AP): default web username admin, default password admin.
#   3. A SEPARATE "Owner or Installer" login inside the GoodWe SolarGo mobile app (a different
#      credential from the web page above): initial password 1234.
#
# SOURCING -- confirmed directly from GoodWe's OWN primary-source PDF, not a search summary or a
# single community post: `GW_WiFi Configuration Instruction-EN.pdf`, fetched directly from
# GoodWe's own domain (en.goodwe.com/Ftp/EN/Downloads/User Manual/) and read via pdftotext. Exact
# matching text: "Default password: 12345678" (Wi-Fi AP), "default web User Name: admin, default
# Password: admin" (web page), "Log in as an Owner or an Installer. Initial password: 1234" (app).
# ALSO independently corroborated by github.com/srudin/GoodweWifiFirmware's own README (a
# community firmware-upgrade guide, cloned to this project's goodwe ingest _re-repos/ folder),
# which states the same admin/admin + 12345678 pair and adds a field-experience detail not in the
# manual itself: "(and I think there's no way to change [the admin/admin web password])" -- an
# unverified community claim about un-changeability, recorded honestly as unconfirmed rather than
# asserted as fact (the vendor's own manual's "Password Setting" section implies it CAN be
# changed via the web UI, so this specific claim may be user error rather than a real limitation --
# not resolved this pass).
#
# NETWORK REACHABILITY: the web login at 10.10.100.253 (AP mode) or the dongle's LAN/WAN IP once
# joined to a home network is a real, live HTTP service -- this project's usual live-check shape,
# not a physical-access-only finding like some other candidates in this document.
#
# BUILDABILITY -- likely buildable with an EXISTING executor, one detail still needs confirming:
# the manual's screenshots (not extracted this pass, pdftotext strips layout) show a standard
# username+password web form; whether the dongle's HTTP server gates this via a classic
# `application/x-www-form-urlencoded` POST (-> checks/http/native/form_post_default_creds.py) or
# an HTTP Basic Auth challenge (-> checks/http/native/basic_auth_default_creds.py) was not
# determined from the PDF text alone -- would need either a live device, a packet capture, or
# inspection of the dongle's actual HTML/JS (not present in either cloned RE repo, which both
# target the inverter's own RS485/Modbus side or the firmware-upload flow, not the login page's
# wire format specifically). Whichever it is, no NEW executor capability is needed -- this is a
# capability GAP IN CONFIRMATION, not a code-gap like the Sungrow WiNet-S candidate.

