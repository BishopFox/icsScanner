# Candidate stub — default-credentials sweep, Phase 13. NOT executable (no `kind`). RESEARCH
# GAP — possible architecture mismatch with this project's HTTP Basic Auth executor.
#
# SCADAPASS gives password-only defaults (no username field at all) for two ENTES Modbus/GPRS
# gateway families, both HTTP port 80: EMG-10/EMG-02/EMG-12 (password = emg10/emg02/emg12
# matching the model number) and GEM-05/GEM-10/10SH (password "gem10"). Unlike this sweep's other
# "blank username" cases (e.g. Schneider CVE-2011-4859's USER:USER, Rockwell 9300-RADES's
# blank:ZYPCOM), these ENTES rows give NO username at all, even a blank one — consistent across
# both product families, which suggests these devices may use a genuinely password-only HTTP
# login form rather than HTTP Basic Auth with an empty username. If so,
# checks/http/native/basic_auth_default_creds.py's Basic-Auth model wouldn't apply at all
# regardless of the password value, and a different check class (form-based POST, not Basic
# Auth) would be needed — not built without confirming which, per the same reasoning already
# applied when a check's HTTP auth mechanism is uncertain elsewhere in this sweep.

# MECHANISM CONFIRMED, VALUE RE-CONFIRMED, 2026-08-30: user supplied ENTES' own current EMG/GEM
# manual ("08102020_emg_gem_ing_kontrol.pdf") directly. Its own "Table 4: Factory Settings of
# EMG/GEM Devices" states plainly: "Web Password: Model name of each device" — an official
# primary-source confirmation of SCADAPASS's value (emg10/emg02/emg12/gem10, matching each
# device's own model name, lowercase). Section 4 ("Accessing Device Settings Through WEB
# Interface") confirms the mechanism: step I loads the device's IP in a browser; step II shows
# "On page you will see, type the WEB access password of the device" — a single password FIELD
# on a page, no username field anywhere in the described flow, confirming this is a genuinely
# password-only custom HTML FORM, not HTTP Basic Auth (which would show a browser-native
# credential dialog immediately on connecting, never described as "a page you see"). This
# project's `checks/http/native/form_post_default_creds.py` (built 2026-08-19, already supports
# `password_only: true`) is the right executor — no new code needed.
#
# STILL NOT BUILT — three specific wire-level facts are needed and this manual's own screenshots
# (Figures 31-33) didn't extract as text (images, not text) so none of the three could be
# confirmed: (1) the exact login POST path (e.g. "/login.cgi"), (2) the password field's HTML
# `name` attribute, (3) a `success_status` or `success_indicators` string (this executor
# deliberately REFUSES to guess at either — see its own module docstring). Also note: web
# interface is NOT supported on GEM-05 or MY EMG-02 at all (serial/GPRS-only for those two SKUs).
# Same "confirmed value and mechanism CLASS, missing exact field names" gap already logged for
# the Yaskawa V1000 candidate — needs a live capture or the raw HTML page source, not another
# instruction-manual read.

