# Candidate stub — default-credentials sweep, Emerson-marine follow-up (2026-08-18, user: "also
# include emerson and hawk marine for marine industrial controls"). NOT executable (no `kind`).
#
# Emerson/Bristol ControlWave RTU (a PLC/RTU/DCS-class SCADA controller, per Emerson's own
# product page) — default credential SYSTEM/666666, 2-way corroborated (Industrial Monitor
# Direct's knowledgebase article, and an independent PLCtalk.net practitioner forum thread from a
# working field integrator, September 2020 — matching this sweep's established bar for accepting
# forum-sourced credentials when a second independent source agrees). Some older pre-Emerson
# Bristol Babcock units reportedly use "6" instead — not independently confirmed, flagged only.
#
# MARINE RELEVANCE, honestly caveated: ControlWave is NOT primarily marine-branded — it's a
# general energy/water/pipeline SCADA RTU platform. Its marine connection is real but
# circumstantial: Emerson markets ControlWave-class control/monitoring systems for vessel
# ballast/bilge/cargo tank valve remote control and tank gauging (per Emerson's own marine-
# automation materials), so a ControlWave unit could genuinely be found in that role, but it is
# not the dedicated marine-branded product line the way AVENTICS Marex is (see the separate
# marex candidate). Recorded here as a real Emerson finding with a plausible-but-not-guaranteed
# marine deployment context, not force-fit as "the" marine answer.
#
# Reachable over Ethernet/TCP-IP: ControlWave defaults to UDP port 1234 for its RTU
# communication, per its own Designer Programmer's Handbook.
#
# STATUS UPGRADED 2026-08-18 — no longer "no protocol spec exists." User supplied a local copy of
# Emerson's own official "BSAP Communication Application Programmer's Reference" (D301401X012,
# January 2021, downloaded from emerson.com), explicitly confirmed applicable to ControlWave
# devices (§1.1: "The same BSAP commands, message request, and response formats apply to BSAP
# communications used in ControlWave devices"). §8.2.1 "Standard Security Code Validation (Simple
# Mode)" gives the COMPLETE byte-level wire format for the plaintext password-check mechanism,
# with a worked example:
#   Request:  A0H, SEQ(2), src_fn(1), status(1), FUN=70H, XFC=05, XSFC=01,
#             SEC_CODE(8-14: up to 6 ASCII chars + NULL terminator, variable length)
#   Response: src_fn(1,from request), SEQ(2), A0H, status(1), PES(1), SES(1), VER(2),
#             FUN=70H, XFC=05, XSFC=01, SEC_LEVEL(1)
#   Success = PES 000/SES 000 with a non-zero SEC_LEVEL assigned; failure (code not in the
#   ACCOL security table) = PES -005/SES -001.
# §8.2.2/8.2.3 cover an encrypted "Secure Mode" (GET KEY + LOGIN REQUEST) requiring a key-derived
# password encryption whose algorithm is NOT given in this document — but §8.2.2's own note
# states that if the controller ISN'T using Secure Mode (plaintext password storage — the
# default/unhardened case, and the only case a factory-default credential like SYSTEM/666666
# would plausibly still apply to), a GET KEY attempt just returns error -5. Simple Mode alone is
# therefore sufficient to test this factory-default credential — no need to solve Secure Mode's
# encryption to build this check.
#
# STILL BLOCKED, one real gap remaining: this document explicitly disclaims covering "the
# internal messages used for the Bristol Internet Protocol (IP) driver used in Open BSI 3.0 (or
# newer)" — i.e. the exact UDP/port-1234 framing that wraps this Extended Request message for
# ControlWave's Ethernet interface is NOT specified here (only the underlying Link-Level/serial
# framing is, in Appendix A). User separately pointed at CISA's own open-source Zeek/Spicy BSAP
# protocol dissector (github.com/cisagov/icsnpp-bsap, `src/consts.pac`/`bsap-protocol.pac`/
# `bsap-analyzer.pac`) as a likely source for the missing IP-layer framing — this is a real,
# actively-maintained passive dissector (parses captured BSAP traffic for Zeek logging), a strong
# source per this project's source-quality hierarchy, but its actual `.pac` grammar content
# was NOT YET READ in this pass — a network outage on the research side (WebFetch and `gh api`
# both failing) blocked fetching it before this session's document review ended. Next step, not
# yet done: read that dissector's protocol/const definitions to confirm the UDP encapsulation,
# then build the check.

