# UPDATE 2026-09-17 (ingest batch 6): DIRECTLY VERIFIED against real firmware, resolving most of
# the open questions above (in a more complicated direction than "just build it", see below).
# `moxa-iologik-e1200-series-iologik-e1210-e1210-t-firmware-v4.0.1kp` and the sibling
# `...-e1260-e1260-t-firmware-v4.0.1kp` (both eCos RTOS, Moxa "DAC!"-framed container format) ship
# the literal standalone string "moxa\x00\x00\x00\x00" in their compiled firmware -- the hardcoded
# factory-default password, matching the manual's "3.3+" claim, now confirmed directly rather than
# from documentation alone. A hidden `<INPUT type="hidden" name="defaultPwd">` field plus inline
# JavaScript (`if(x==1){alert("WARNING! It is recommended to change default password...")}`)
# confirms the device itself tracks and warns when still on this factory default.
#
# LOGIN MECHANISM RESOLVED: it is a CUSTOM CHALLENGE-RESPONSE form, NOT HTTP Basic Auth and NOT a
# plaintext credential POST. The password field is client-side masked/hidden, and submission
# computes `SHA256(password + Token)` (older E1200H/E1200W firmware uses MD5 instead of SHA256,
# see below) where Token comes from a prior page load's hidden `<LOGIN_TOKEN>` field -- i.e. a
# scanner would need to first GET the login page to obtain the current token, then compute the
# hash client-side before POSTing. This is MORE complex than a zero-code reuse of the generic HTTP
# default-creds executor; would need a small dedicated native module (fetch token, hash, submit)
# to build as a live check -- not attempted this pass, flagged as a genuine follow-up.
#
# E1200H/E1200W VARIANTS DIFFER: `moxa-iologik-e1200h-series-e1261h-t-firmware-v1.1.1kp` and
# `moxa-iologik-e1200w-series-e1261w-t-firmware-v1.1.1kp` (Hazardous-location and Wireless
# variants) use the SAME "Input Password" page CONCEPT but a GENUINELY SIMPLER, DIFFERENT wire
# protocol from the core E1200 line, AND do NOT contain the literal "moxa" default-password
# string anywhere in the firmware image -- NOT assumed to share the "moxa" default.
#
# UPDATE 2026-09-17 (user asked to also build a live check for E1200H/E1200W; the protocol was
# examined in full to answer that, but a live check was NOT built -- see the decision below):
# read directly out of `moxa-iologik-e1200h-series-e1261h-t-firmware-v1.1.1kp`'s own HTML/JS:
#     function SetPass(b){
#       var a=getCookie("ChallID");           // read but NEVER used in the hash below -- dead code
#       var c=MD5(b.Password.value);          // straight MD5(password), no token/challenge mixed in
#       setCookie("MoxaPass",c,null);         // sets the session cookie client-side, pre-submit
#       b.Password.value=c; return true
#     }
#     <FORM name=InputPassword method=GET action=home.htm onSubmit="return SetPass(this);">
#     <P>Password : <INPUT type=password name=Password size=8 maxlength=8></P>
#     <P><INPUT type=submit value=Submit name=Submit></P>
# i.e. no hidden Token field exists on this page at all, the form method is GET (not POST), and
# the wire request is simply `GET /home.htm?Password=MD5(password)&Submit=Submit` -- SIMPLER than
# the core E1200's SHA256(password+token) scheme, not just "MD5 instead of SHA256" as first
# suspected. `getCookie("ChallID")` is read into a variable that is then never referenced again --
# genuinely dead code, not a hash ingredient we missed.
#
# NO DEFAULT CREDENTIAL VALUE CONFIRMED for this simpler protocol: searched the firmware directly
