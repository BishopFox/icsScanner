#
# SCADAPASS's PORT WAS WRONG, now corrected from a primary source: the manual's own port table
# lists port 80/TCP as "Web console service" — port 9020/TCP is actually "Peer-to-peer (default)"
# (a completely different feature, I/O signal forwarding between paired units, confirmed
# separately at "The default local listen port number is 9020"), not the web login at all.
# SCADAPASS's "HTTP on Port 9020" framing was a real error; the corrected value is HTTP port 80.
#
# STILL NOT BUILT: (1) the exact login mechanism (HTTP Basic Auth vs. a custom HTML form) isn't
