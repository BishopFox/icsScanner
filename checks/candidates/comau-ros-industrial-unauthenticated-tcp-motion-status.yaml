description: >
  A real-time, unauthenticated TCP/IP interface exists for commanding COMAU robot motion (via
  PDL2 programs implementing a ROS-Industrial-style driver) -- confirmed via a Comau-co-authored
  academic paper and a real open-source reference implementation whose actual PDL2 source was
  read directly. Motion-command port (1212 in this implementation) accepts joint-position
  trajectory points with zero authentication; a SEPARATE status-only port (1214) passively
  broadcasts robot state (e-stop, drives-powered, mode, in-motion) to any connecting client with
  no request needed at all -- the safest possible verification target if this is ever built.
  NOT a factory default -- requires an integrator to have loaded and be running these specific
  PDL2 programs. Not built: physical-actuation risk squarely matches this project's
  scripts/safety_critical/ trigger; a concrete safe design (status-port-only, motion-port never
  implemented) is sketched but awaiting an explicit human decision before implementation.
