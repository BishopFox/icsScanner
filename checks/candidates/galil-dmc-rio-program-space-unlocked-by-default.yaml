# controllers/distributed I/O used across industrial automation, lab/research instrumentation, and
# semiconductor equipment. NOT executable (no `kind`). Confirmed no prior candidate/check existed
# for this vendor before writing this file.
#
# ACQUISITION/FORMAT — all 14 packages are plain zips, no gating. Firmware images are Motorola
# S-Record (`file` auto-identifies this correctly; `.hex` extension is misleading — these are NOT
# Intel HEX despite the name), a fully open, unencrypted, directly-decodable ASCII text format —
# decoded directly with a small Python S1/S2/S3-record parser, no disassembly needed. Two of the
# 14 (rio-47000/rio-57000) use a binary variant that wasn't decoded this pass (not needed — see
# below, the finding was confirmed from the vendor's own official documentation instead of RE).
#
# CONFIRMED, directly from Galil's own official "DMC-40x0 Firmware Command Reference" (01/25/2017
# edition, fetched and read directly via pdftotext, not search-summarized — a WebSearch pass first
# surfaced this as a plausible finding, then was independently verified against the primary
# source before writing anything here, per this project's sourcing discipline):
#   - The `PW` command sets a password; its own documented default value is the EMPTY STRING
#     (parameter table: "str 0 chars 8 chars Default: \"\""). A fresh/never-configured controller
#     has NO password set.
#   - The SEPARATE `^L^K` (Lock) command is what actually engages protection, using whatever
#     password PW last set: "Locks user access to the application program. When locked, the ED,
#     UL, LS, and TR commands will give privilege error #106." Since no password exists by
#     default, `^L^K` was never meaningfully engaged either — a fresh controller's ED/UL/LS/TR
#     commands (which create, read, list, and modify the stored motion-control program) are
#     reachable with NO authentication of any kind.
#   - `^L^K` ALSO provides a genuinely SAFE, read-only, documented QUERY form: "^L^K ? will
#     return a 0 if the controller is not locked, and a 1 if it is locked." This is the natural
#     confirmation primitive — it never touches the program space, never risks the
#     create/destroy capability ED itself carries, and is explicitly described as a plain status
#     query by the vendor.
#   - Transport: TCP port 23, an interactive Telnet-style ASCII command shell (confirmed:
#     "IHA TCP PORT 23..." example, and ED's own description: "used when using Telnet style
#     interface"). No static factory-default IP — "The controller defaults to DHCP."
#   - The manual's own product-applicability line names the EXACT affected family directly:
#     "PW applies to DMC40x0,DMC42x0,DMC41x3,RIO47xxx,DMC18x6,DMC30010,DMC500x0,DMC52xx0" —
#     matching, by direct cross-reference, 8 of the 14 supplied packages: dmc-4000 (DMC40x0),
#     dmc-4200 (DMC42x0), dmc-4103 (DMC41x3), rio-47000 (RIO47xxx), dmc-1806 (DMC18x6), dmc-30000/
#     dmc-31000 firmware (DMC30010 family), dmc-50000 (DMC500x0), dmc-52000 (DMC52xx0). The
#     REMAINING 6 (dmc-1405, dmc-2103, dmc-2105, dmc-2200, edd-37000, rio-57000) are NOT named on
#     this line — older/simpler controller families that may use a different (or no) Ethernet/
#     security model; NOT assumed to share this finding without their own confirmation. Their own
#     decoded firmware images were grepped for "password"/"telnet"/"http"/"ftp"/"admin" for
#     completeness — the same generic "Invalid password"/"Passwords not identical" error-table
#     strings appear (this is a shared firmware error-code table across the whole DMC family, not
#     independent evidence), nothing product-specific beyond what the manual itself already
#     confirms for the 8 named families.
#
# NOT YET BUILDABLE — genuinely new protocol support needed, not just a params-only reuse of an
# existing module: this project has NO Galil ASCII-command fingerprint probe yet (needed to gate
# `fingerprint_precondition` safely — sending even a benign query to an unrelated Telnet-speaking
# device without first confirming it's actually a Galil controller would be irresponsible). The
# actual confirmation primitive itself is simple and safe once that gate exists: open TCP:23, send
# `^L^K ?\r` (literal Ctrl-L Ctrl-K bytes, 0x0C 0x0B, followed by " ?\r" per the command's own
# documented usage), read the response — "0" confirms the finding (unlocked, no auth), "1" means
# a password IS configured and engaged (NOT_APPLICABLE). Risk tier, once built: this queries
# read-only state and never touches ED/UL/LS/TR itself, so ADVERSE tier (`risk_reason: ["login"]`)
# or even a non-destructive disclosure-style check is plausible — needs the same kind of explicit
# go-ahead this session has required for every new-protocol executor addition (SNMPv3, the
# LPE9403 JSON-POST executor, the M221 UMAS check, the ICS Electronics reachability check).
#
# Firmware/hygiene note: none of the 14 zip archives or decoded firmware images is committed to
