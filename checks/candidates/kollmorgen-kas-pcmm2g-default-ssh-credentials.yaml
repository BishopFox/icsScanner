# THE FINDING, doubly confirmed (independent crack + the vendor's own build recipe — not a
# single-source guess):
#   1. Unpacked `KAS-PCMM2G-Cx-08-OS-1.0.0.00440-RT-5.00.0.98579.zip` — a SWUpdate (.swu) OS
#      update image, plain unsigned-content cpio archive (public_key.bin/signed_key.bin sign the
#      UPDATE, they do not encrypt it — the payload itself is fully readable), containing a full
#      1.5GB ext4 root filesystem (`kas-image-kas-pcmm2g.ext4.gz`). Extracted with `debugfs -R
#      "rdump"` (this project's established mount-free technique). `/etc/passwd` shows TWO real,
#      enabled, sudo-group shell accounts: `kas` (uid 1000) and `admin` (uid 1001), both
#      `/bin/sh`. `/etc/shadow` shows BOTH share the IDENTICAL SHA-256 crypt hash:
#      `$5$z6dHiIfuy6pee1jd$sUBLGXY7toh5CMg6WQQAa2kMreC8tk6MFwtzV3IVNo8`. `root` is explicitly
#      locked (`*`).
#   2. Cracked directly (Python's `crypt.crypt()` against the recovered salt, a small targeted
#      wordlist including the product's own name) — the plaintext is **`pcmm2g`**, i.e. the
#      product family name itself.
#   3. INDEPENDENTLY CONFIRMED from the vendor's own supplied Yocto build sources
#      (`KAS-PCMM2G-OS-Build-Sources-1.0.0.00440.zip`,
#      `layers/meta-kas/recipes-core/images/kas-image-common.inc`), verbatim:
#        # Password hash generated with the following command:
#        # printf "%q" $(mkpasswd -m sha256crypt INSERT_PASSWORD_HERE)
#        PASSWD_HASH = "\$5\$z6dHiIfuy6pee1jd\$sUBLGXY7toh5CMg6WQQAa2kMreC8tk6MFwtzV3IVNo8"
#        inherit extrausers
#        EXTRA_USERS_PARAMS = "\
#            usermod -p '*' root; \
#            useradd -m -p '${PASSWD_HASH}' -G sudo kas; \
#            useradd -m -p '${PASSWD_HASH}' -G sudo admin; \
#            "
#      This is the actual recipe that builds every shipped PCMM2G image — the SAME hash on every
#      device by construction, not a per-unit or randomized value. Matches the cracked hash
#      byte-for-byte.
#
# REMOTELY REACHABLE, confirmed, not assumed: `/etc/systemd/system/sockets.target.wants/
# sshd.socket` is present (socket-activated OpenSSH, on by default, no separate opt-in needed).
# `sshd_config` does not disable password auth (only `ChallengeResponseAuthentication no` is set;
# `PasswordAuthentication` is left at OpenSSH 8.9p1's compiled default of "yes"). `/etc/pam.d/
# sshd` -> `common-auth` -> `pam_unix.so` confirms standard `/etc/shadow` password verification,
# not some other auth backend that would make the crypt hash moot. No HTTP/web server was found
# on this image (`var/www` empty, no lighttpd/nginx/httpd) — SSH is the confirmed surface, not a
# guess about "some service."
#
# SCOPE, deliberately conservative: only PCMM2G (the specific product this exact firmware image
