# partial). NOT executable (no `kind`). Distinct from BOTH existing WinCC candidates:
# CVE-2010-2772-siemens-wincc.yaml (a WinCC/PCS 7 MSSQL backend credential) and
# siemens-wincc-7x-application-login-default.yaml (classic WinCC 7.x's own application login,
# sourced from a low-tier community CSV). This one is SIMATIC HMI panels (Comfort/Basic Panels,
# Industrial Thin Clients) running WinCC Runtime Professional/Advanced — a genuinely different
# product line, sourced from official Siemens primary documents, not a third-party CSV.
#
# Source: TWO independent official Siemens PDFs, both fetched and read directly (pdftotext, not
# a search summary), word-for-word identical on the relevant point:
#   1. "SIMATIC HMI WinCC Runtime Professional Readme System Manual" (V12,
#      support.industry.siemens.com/cs/attachments/67797516)
#   2. "SIMATIC HMI WinCC Runtime Advanced Readme System Manual" (V13 SP1, 12/2014,
#      support.industry.siemens.com/cs/attachments/104509915)
# Both state, under a "Passwords" heading: "The default password for the Sm@rtServer and for
# the integrated Web server is '100'." (V13 SP1's wording adds: preset on HMI devices with
# version V11 or V12 specifically; "A default password is not preset for HMI devices with
# version V13" — an explicit, honest negative for the newer version, not glossed over.)
# The SAME "Passwords" section also states: "For the user 'Administrator', the default password
# is 'administrator'" — presented as a second, separate default (a WinCC Runtime user-
# administration account), not confirmed to gate the same Sm@rtServer/Web-server login.
# A third-party corroboration was also found (not fetched in full — Cloudflare/JS-gated to
# automated fetch both via WebFetch and curl): Fortinet FortiGuard Labs publishes an IPS
# signature literally named "Siemens.SIMATIC.HMI.Default.Password.Security.Issue" — a named
# commercial security vendor treating this as a real, worth-detecting issue independently
# confirms this isn't obscure/disputed, even though the page's own full text wasn't extractable.
#
# Network surface confirmed real and reachable: both readmes' own port tables list HTTP (80) and
# HTTPS (443) as INBOUND ports for "Sm@rtServer," explicitly "available when Sm@rtService is
# activated" — this is a genuine network-facing web server, not a local-only setting.
#
# NOT YET BUILDABLE — the exact HTTP authentication mechanism and username (if any) for the
# Sm@rtServer/Web-server login were not confirmed in this pass. Both manual passages describe
# only a PASSWORD ("the password... is '100'"), never naming a username for this specific login
# — unlike the separate "Administrator"/"administrator" pair one line below it, which does name a
# user. A getting-started guide for the related Sm@rtAccess/VNC connection type (SIMATIC ITC
# Getting Started - Smart Server, item 63445531) confirms Sm@rtServer/Sm@rtAccess supports
# password-only authentication in general (VNC view/full-control password pairs, no username
# field at all) — consistent with, but not directly confirming, the HTTP web-server case
# specifically. Siemens's own support-forum thread that likely answers this exactly
# ("Removing password from web server access," support.industry.siemens.com/forum/WW/en/posts/
# removing-password-from-web-server-access/229751) 403'd to both WebFetch and curl — the
# standard Siemens-portal automated-fetch block seen throughout this project's history.
#
# Action needed before building: confirm whether the Sm@rtServer/integrated-Web-server HTTP
# login is (a) Basic Auth with a blank/fixed username, (b) a custom HTML form, or (c) VNC-only
# with no HTTP auth prompt at all (the port-table entry could just be serving static HTML pages
# gated by a *different* mechanism than the VNC password) — a live capture against a real HMI
# panel, or a user-supplied copy of the forum thread above, would resolve this cleanly. This
# project's existing "don't guess wire format" discipline applies — do not hardcode a Basic-Auth
# assumption here the way the SCALANCE X-200 check did, since that check's manual explicitly
# named admin/admin (a real user+pass pair), while this one names only a bare password.

# UPDATE 2026-09-14 (user supplied the official "Remote Access HMI Panels" support package,
# Entry-ID 109476153, V16): does NOT resolve the HTTP Sm@rtServer/Web-server login mechanism
# above — but the same download surfaced a DISTINCT, related finding worth recording separately.
# The "Remote_Panels_RTAdv_V16_Tool" sub-package (a small PC-side toolset, not device firmware)
# contains SmartServiceMonitor.exe/.ini and SetPasswordTool.exe. The shipped
# SmartServiceMonitor.ini contains, in cleartext:
#   RuntimeAccessUri=http://127.0.0.1/soap/RuntimeAccess
#   Username = SoapUser
#   Password =nfVnoN8Llk4=n
# This is a SOAP-based monitoring interface (queries VNC/Sm@rtAccess connection counts/clients on
# a target panel), gated by the SAME "RuntimeAccess" user-authorization role the official
# "Remote Access HMI Panels - HTML pages" manual documents (confirmed via pdftotext: "the user
# authorization 'RuntimeAccess' for the logged in..."). SetPasswordTool.exe (strings confirmed:
# "Please provide a password for accessing the SOAP web service as user...", "File '%s' updated
# with provided password!") exists specifically to let an admin CHANGE this value — strongly
# implying the shipped ini value ships as-is, unchanged, on any deployment where that step is
# skipped. Decode-checked directly: "nfVnoN8Llk4=n" base64-decodes cleanly to 8 raw non-printable
# bytes (9d f5 67 a0 df 0b 96 4e) — NOT a plaintext password, an encrypted/obfuscated blob only
# SmartServiceMonitor.exe/SetPasswordTool.exe's own (unreverse-engineered) cipher can interpret.
# This materially weakens the finding: downloading this file does not, by itself, hand an
# attacker a usable credential — it would take reversing that binary's encryption scheme first,
# not attempted this pass. NOT YET BUILDABLE, genuinely unresolved: (1) the ini's own default
# target is loopback (127.0.0.1), and it's unconfirmed whether a real panel's own RuntimeAccess
# SOAP endpoint is reachable over the network from a non-localhost client at all, vs. this being a
# local-PC-only monitoring convenience; (2) the encrypted password blob's cipher/key is unknown;
# (3) unconfirmed whether real-world deployments commonly leave a
# "SoapUser" account configured on the panel side matching this ini default, vs. always creating
# a site-specific account per the Webserver manual's own "create further users" guidance. Distinct
# enough from the "100"/"administrator" Sm@rtServer/Web-server passwords above (different
# component: SOAP monitoring vs. HTTP/VNC access) to track here as a sibling lead, not a
# duplicate.

# UPDATE 2026-09-16 (new mixed-vendor ingest batch, "STEP_7_Basic_V13_2_enUS.pdf" — "STEP 7 Basic
# V13 SP2 System Manual," 03/2017, read directly via pdftotext): a THIRD independent official
# Siemens source confirms the "Administrator"/"administrator" default, word-for-word identical to
# the two readmes already cited above: section "1.4 WinCC Basic" -> "Passwords" -> "Various
# passwords are set by default in WinCC. For security reasons, you should change these passwords.
# For the user 'Administrator', the default password is 'administrator'." This ALSO broadens the
# finding's confirmed scope: "WinCC Basic" (bundled with STEP 7 BASIC, the engineering software
# tier for SIMATIC BASIC PANELS specifically) is a distinct, cheaper HMI runtime tier from the
# WinCC Runtime Professional/Advanced already covered (used on Comfort Panels) — this is now
# confirmed across three independent official manuals spanning both the Basic and Comfort/
# Professional-Advanced panel tiers, not just one product line. The Sm@rtServer/Web-server "100"
# password and the HTTP-auth-mechanism blocker above are NOT mentioned in this particular manual
# (it only documents the Administrator/administrator pair) — no new information toward that half
# of the candidate.

