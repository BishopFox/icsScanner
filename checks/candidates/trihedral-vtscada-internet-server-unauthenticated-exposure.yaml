description: >
  Trihedral VTScada's built-in Internet Server / Thin-Client ("VTScada Anywhere") web interface is
  commonly network-exposed (municipal water + dam SCADA); vendor docs state the login is HTTP Basic
  (Base64) and the sole access protection. The exposure class carries public unauthenticated CVEs --
  CVE-2016-4532 (path-traversal arbitrary file read), CVE-2016-4523 (WAP DoS, in CISA KEV),
  CVE-2022-3181 (HTTP crash, 7.5). The identity probe (probe_vtscada_http_identity) is BUILT and
  grounded on the VTScada 12.3.01 runtime binary's own `Server: VTScada`/`VTS/<version>` header +
  X-VTScadaAuth CORS marker; it parses the version. This candidate is the armed EXPOSURE CHECK that
  would gate on that probe: a benign READ-ONLY confirmation that an exposed VTScada Internet Server
  runs a CVE-affected version (version-gated, CODESYS-WebVisu / Node-RED shape). Still a candidate
  pending the detection-shape decision (version-range gating) and a live-response sanity check; it
  must NEVER exercise the traversal or any DoS.
