# Candidate stub — 2026-09-28. Solar-inverter cluster firmware/RE-repo sourcing pass (following
# the 2026-09-28 competitor-vendor-research-targets.md sweep that flagged Huawei/Sungrow as the
# highest-yield acquisition-ready gap). Confirmed no prior Sungrow candidate/check existed
# anywhere in this project before writing this file.
# BLOCKER TAG: code-gap -- this project has no executor that speaks a raw WebSocket JSON-message
# login handshake (connect -> receive token -> login with token+creds -> receive session token).
# The closest existing executors, checks/http/native/json_rest_login_default_creds.py (plain HTTP
# POST/response) and socketio_login_default_creds.py (Engine.IO/Socket.IO framing), both speak a
# DIFFERENT wire shape than WiNet-S's plain-WebSocket JSON-text-message protocol -- neither can
# drive this login without new code. Evidence itself is NOT the gap here (see below); this is a
# capability gap, same tag/reasoning this project already uses elsewhere for a characterized-but-
# untooled finding.
#
# THE FINDING: Sungrow's WiNet-S / WiNet-S2 communication dongle (the network adapter used to
# connect Sungrow string/hybrid inverters -- SH-RT and SG-HX/CX series among others -- to Ethernet
# or Wi-Fi for monitoring, Modbus-TCP forwarding, and firmware updates) ships a fixed
# administrator account:
#     username: admin
#     password: pw8888
# A second, lower-privilege account (user / pw1111) is also documented but only by ONE of the
# three sources below -- not independently corroborated this pass, recorded honestly rather than
# asserted with the same confidence as the admin pair.
#
# SOURCING -- three INDEPENDENT community sources agree on admin/pw8888, one of them actual working
# source code (this project's own "named RE tool w/ source" tier, one level below a vendor spec):
#   1. github.com/shcshc76/sungrow (cloned to this project's sungrow ingest _re-repos/ folder),
#      README.md: "Winet-S / Benutzer: admin / Password: pw8888" + "Benutzer: user / Password:
#      pw1111" (German-language personal research notes, Modbus register maps included).
#   2. github.com/bjeanes/modbus-mqtt.rs, sungrow-winets/src/lib.rs (a real, compiling Rust crate
#      implementing a WiNet-S client): `static DEFAULT_USERNAME: &str = "admin";` /
#      `static DEFAULT_PASSWORD: &str = "pw8888";`, with an inline comment: "these are Sungrow's
#      default passwords on the WiNet-S, but they are user-changeable." The crate's own
#      sungrow-winets/NOTES.md documents the full wire protocol (see below), captured from a real
#      device, not guessed.
#   3. github.com/mkaiser/Sungrow-SHx-Inverter-Modbus-Home-Assistant (a real,
#      actively-maintained Home Assistant integration with its own issue tracker), doc/faq.md:
#      "use the administrator's credentials: admin / pw8888 (cannot be changed by the user :/ ...)"
#      -- and separately, under "Connect the inverter via Ethernet": the SAME admin/pw8888 pair
#      also gates the isolarcloud mobile app's direct local Wi-Fi/LAN "Local Access" menu on the
#      inverter itself (Support -> Local Access -> admin/pw8888 -> More -> Communication Settings),
#      used to enable the inverter's own Ethernet port for Modbus-TCP. This means the same
#      credential pair is not WiNet-S-dongle-specific -- it also gates at least one connection mode
#      on inverters with built-in networking, a broader scope than the dongle alone.
#
# OPEN QUESTION, deliberately not resolved by assumption (matches this project's own convention,
# e.g. the Eaton E-Series candidate's local-only-vs-network open question): source #2's code
# comment states the password is "user-changeable"; source #3's FAQ states outright it "cannot be
# changed by the user." Both are real, current community sources describing the same product line
# -- possibly a firmware-version or product-variant difference (WiNet-S vs WiNet-S2, or an
# inverter-integrated LAN port vs. the standalone dongle), not resolved this pass. Recorded as an
# open question, not silently picked one way.
#
# PROTOCOL -- fully characterized from sungrow-winets/src/lib.rs and NOTES.md (real captured wire
# traffic, not guessed):
#   1. Open a plain WebSocket to `ws://<host>:8082/ws/home/overview`.
#   2. Send `{"lang":"en_us","token":"","service":"connect"}` -> response includes a `token` field
#      (a UUID) under `result_data`.
#   3. Send `{"lang":"en_us","token":"<token from step 2>","service":"login","username":"admin",
#      "passwd":"pw8888"}` -> on success, `result_code: 1` and a NEW session `token` in
#      `result_data`; `result_code` != 1 (with a `result_msg`) on failure (e.g. bad credentials, or
#      code 100 for "normal user limit" -- the WiNet-S appears to cap concurrent sessions).
#   4. That session token is then used as a query/body parameter (`token=<...>`) against plain
#      HTTP endpoints on the SAME host, no port specified in the client (i.e. default port 80):
#      `GET /inverter/list`, `GET /device/getParam?...&token=...`, `POST /device/setParam` (which
#      can WRITE Modbus holding registers via the dongle -- a real destructive-capability path once
#      authenticated, beyond just reading data).
# This is architecturally a "websocket JSON-message login, then token-authenticated HTTP calls"
# shape -- distinct from every existing checks/http/native/*.py executor's wire format. Building a
# new `websocket_json_login_default_creds.py` (or extending an existing executor to speak this
# framing) would be a genuinely reusable capability, not a one-off, matching this project's
# established build-the-missing-capability convention (same reasoning already used for
# json_rest_login_default_creds.py and socketio_login_default_creds.py themselves).
#
# CONTEXT -- why this vendor was hard to source at all: a separate, differently-named GitHub
# account, github.com/sungrow-firmware (a single repo literally named "firmware"), is now fully
# GITHUB-BLOCKED under a DMCA takedown Sungrow itself filed 2024-11-07 (confirmed by reading
# github.com/github/dmca/2024/11/2024-11-05-sungrow.md directly) -- Sungrow's own notice states
# the repo held "Sungrow's proprietary firmware ... distributed only to authorized clients under
# specific licensing terms." That repo is NOT the source of this finding and was deliberately not
# pursued further (see this project's own research notes on that specific repo) -- this candidate
# is sourced entirely from the three separate, still-public, non-firmware-redistributing community
# repos above, which document the LOGIN CREDENTIAL, not Sungrow's copyrighted firmware image
# itself.
#
# WHAT WOULD UNBLOCK THIS: building a websocket-capable JSON-login executor (see PROTOCOL above --
# the wire format is already fully specified from real captured traffic, no further RE needed) OR
# a live WiNet-S device / Sungrow inverter to test against directly. No firmware acquisition
# needed for THIS specific finding -- distinguish from the DMCA'd repo above, which held the
# inverter's own firmware image, a different artifact than the dongle's login credential.

