# each other, distinct from every other candidate filed in this Eaton batch.
#
# FINDING 1 — "Password to change settings on a PXR20D.pdf" (read via pdftotext): "The default
# password is 0000." PXR20D is an Eaton electronic trip unit (used on Eaton Magnum/Power Defense-
# family low-voltage circuit breakers, inferred from Eaton's "PXR" trip-unit product naming — not
# independently confirmed via a datasheet this pass). A local front-panel numeric PIN, the same
# 4-digit-PIN shape already established elsewhere in this project (Trane UC800 "2718", SICAM FCM
# "1111"/"2222"). Some Eaton trip units of this family support Modbus communication modules as an
# option — whether "0000" also gates any network-reachable function, or is purely local-keypad, is
# NOT resolved this pass (same open question already recorded for the E-Series Relay sibling
# candidate) — recorded honestly rather than assumed.
#
# FINDING 2 — "DA1 Master Password.pdf" and "DC1 Master Password.pdf" (read via pdftotext): DA1
# and DC1 are Eaton AC variable-frequency drives (VFDs). Both use a NUMERIC "password LEVEL"
# scheme gating access to increasingly sensitive parameter groups, not a username/password login:
#     DA1: Password Level 2 default value 101 (parameter P2-40), Level 3 default value 201
#          (parameter P6-30) — each level unlocking progressively more parameter groups (P1-P5
#          at Level 2, all groups P1-P9 at Level 3).
#     DC1: Password Level 2 default value 101 (parameter P-37), Level 3 = (P-37's value) + 100,
#          i.e. also 201 by default — an IDENTICAL default-value scheme to DA1, just addressed via
#          a different parameter number.
# This is architecturally the same class of finding as this project's existing Danfoss/similar VFD
# parameter-access-code candidates elsewhere in this research thread (if any exist — not cross-
# checked this pass) — a local drive-keypad numeric unlock code, not a network credential.
#
# NOT YET BUILDABLE, uniformly: all three are LOCAL keypad/front-panel mechanisms with no
# confirmed network-reachable wire protocol in any source checked this pass — filed as
# `protocol: local-only` physical_access_reference entries, matching this project's existing
# local-panel-passcode candidate pattern (Trane UC800, SICAM FCM/AK3, the Eaton E-Series Relay
# sibling candidate) rather than as network checks.

