fingerprint_precondition:
  vendor: "Omicron electronics"
references:
  - "https://www.manualslib.com/manual/1243124/Omicron-Cmc-356.html?page=35"
description: >
  OMICRON CMC 356 relay test set — the default WiFi password for the test set's own wireless
  network (used by the CMC Swift control app) is the device's serial number, concatenated with
  itself (repeated twice). Confirmed via the actual user manual.
  OUT OF SCOPE for this tool for two independent reasons, not a research gap: (1) this is 802.11
  WiFi association, not a TCP/IP service this scanner's model (remote checks against a
  host:port) can test — a fundamentally different network layer and out of scope by design,
  same category as the Honeywell Safety Manager serial-interface case. (2) Even setting that
  aside, the password is DERIVED PER-DEVICE from its serial number, not a fixed universal
  string like every other check in this sweep — a generic scanner has no way to know a specific
  target's serial number in advance, so this doesn't fit the "try known default credentials"
  model at all, even in principle. Recorded for completeness only.
