#     password: password
# This is a SEPARATE credential from Ignition's own Gateway web login — it specifically gates the
# OPC UA server component. Ignition is one of the most widely-deployed SCADA/HMI platforms
# globally (Inductive Automation, not previously covered anywhere in this project) — a high
# real-world-value target despite being software rather than embedded device firmware.
#
# NEAR-BUILDABLE: this project already has working OPC-UA client infrastructure using the
# `asyncua` Python library — see `checks/opcua/native/anon_write_dryrun.py`,
# `anon_write_live.py`, and `_common.py` (built for the OpenPLC v4 anonymous-write finding). Those
# existing checks connect ANONYMOUSLY; this finding needs a session that authenticates with an
# explicit username/password instead (`Client.set_user()`/`Client.set_password()` before
# `connect()`, per asyncua's own API) — a smaller, more contained addition than most of this
# sweep's findings, which mostly need entirely new protocol support from scratch. Not built this
# pass per the user's own "file candidates" (not "build checks") request this turn.
#
# SECONDARY, DISTINCT FINDING on the same product, recorded for completeness but NOT this
# candidate's own primary shape: CVE-2026-77393 (CVSS 8.8) — Ignition's "Create Project Role(s)"
