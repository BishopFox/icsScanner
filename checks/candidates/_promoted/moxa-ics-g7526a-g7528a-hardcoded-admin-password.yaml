description: >
  Moxa's ICS-G7526A/ICS-G7528A managed industrial Ethernet switches (2023 and 2025 firmware
  builds both confirmed, byte-identical) ship a hardcoded factory-default password, found directly
  in the vendor's own firmware NVRAM default-config table (not cracked or guessed): admin/moxa and
  user/moxa. This is a newer hardware/firmware generation than the older ICS-G7526/ICS-G7528 (2015
  firmware, confirmed to still use the older admin/BLANK + user/BLANK default already documented
  for the sibling EDS-508A/505A and EOM-104/EOM-G103 products) -- the same "blank password on
  older firmware, literal 'moxa' password on newer firmware" generational pattern already observed
  this session for the EDR Secure Router line, now confirmed on a third distinct Moxa product
  category. HTTP admin web login is believed on-by-default (consistent with every other Moxa
  managed-switch product this session, and the presence of an unauthenticated-reachable
  password-policy configuration page) but not independently confirmed via a parsed default-config
  flag; Telnet/SSH default enablement state was not determined this pass. CVSS 3.1: 9.8 CRITICAL
  (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). No CVE found for this specific issue. Held as
  disclosure_status:disclosed-pending-fix -- sent to Moxa PSIRT 2026-09-19, acknowledged
  2026-09-21 (no case number assigned yet, general "reviewing" reply) -- this is a CURRENT,
  actively-maintained firmware generation (2025), unlike most other undisclosed findings this
  session which affect older/legacy product lines. CONFIRMED WIDER SCOPE: the identical default
  was independently found on IKS-G6524A (byte-identical firmware to ICS-G7526A/G7528A), IKS-G6824A
  (a different, newer build, same table), and IKS-6728A (a genuinely different binary codebase,
  "iks6700a" vs. "icsg7528a" -- the default spans at least two separate firmware families). The
  corresponding older (non-"A") IKS-6726-8PoE firmware confirms the same blank-password/"moxa"-
  password generational split already seen on the ICS-G7526/G7528 and EDR product lines.
