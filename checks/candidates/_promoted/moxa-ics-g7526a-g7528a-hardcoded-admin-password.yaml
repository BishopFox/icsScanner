# FIRMWARE REVIEW 2026-10-13 (icsg7528.bin from moxa-ics-g7526-ics-g7528-series-firmware-v3.5.rom:
# 32-byte Moxa header + gzip -> eCos image). LOGIN WIRE FORMAT NOW CONFIRMED (unblocks this candidate):
#   form name=account_password_form  method=post  action=/home.asp
#   fields: account=<username plaintext>, logpwd=MD5(<password>+chall), chall=<client-generated, hidden>
#   (JS: var op=password; theValue=MD5(op+chall); theName='logpwd'; chall=Math.round(random*10000)). This is a
#   CHALLENGE SOURCE PINNED 2026-10-13: the `chall` is CLIENT-CHOSEN (hidden field defaults value="0";
#   JS sets var chall = Math.round(Math.random()*10000)) and is POSTed alongside logpwd. The server
#   recomputes MD5(stored_pw + submitted_chall) -- a FAKE challenge, like Moxa variants A/B. So the
#   executor 'variant C' = pick any chall, POST: account=<user>, logpwd=md5_hex(password+chall),
#   chall=<same>, to /home.asp. Needs a new 'md5_concat' password_hash mode in
#   moxa_web_login_default_creds.py (A/B use a stream-obfuscate; C is a plain concat+md5). READY TO BUILD.
#   THIRD Moxa login variant vs moxa_web_login_default_creds' A(sha256-obfuscate)/B(md5-obfuscate): here it is a
#   plain MD5(password+chall) with a CLIENT-chosen challenge echoed in a hidden field -> executor needs a small
#   'variant C' (concat+md5, client challenge) to arm. Default creds admin/moxa already confirmed (prior work).
