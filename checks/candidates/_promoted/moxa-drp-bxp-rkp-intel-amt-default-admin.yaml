# Intel AMT/MEBx candidate/check existed anywhere in this project before writing this file.
#
# THE FINDING, confirmed directly from "moxa-drp-bxp-rkp-series-win-11-pro-2022-2024-2025-
# manual-v1.1.pdf" (read via pdftotext): Moxa's DRP/BXP/RKP series industrial embedded
# computers/panel PCs (vPro-capable models, e.g. BXP-C101, RKP-C220) ship with Intel AMT
# (Active Management Technology) enabled, gated by MEBx (Management Engine BIOS Extension):
#     "Type the Intel(R) ME default password: 'admin'." (initial MEBx/BIOS-level setup)
#     "Open a web browser and type the Intel(R) AMT IP Address... The default username is admin."
#     (the AMT web interface, https://IP:16993 on BXP-C101/RKP-C220, http://IP:16992 on others)
#
# THIS IS NOT A MOXA-SPECIFIC DESIGN CHOICE, honestly noted: "admin" is Intel's own well-known,
# widely-documented factory default for AMT/MEBx across the ENTIRE Intel vPro product line,
# independent of which OEM ships the hardware. It is filed here as a Moxa-scoped candidate
# because this is the specific product family this project's ingest batch documents, not because
# Moxa introduced the behavior -- the same finding would apply to any other vPro-enabled
# industrial PC vendor this project might ingest in the future. Worth generalizing into a
# vendor-agnostic candidate/check (the same way this project's existing
# `checks/snmp/snmp-community-default-creds.yaml` narrows via a protocol probe rather than a
# vendor/product fingerprint) if/when a second vPro-based product turns up in a future batch.
#
# HONEST CAVEAT on real-world exploitability: the MEBx password MUST be changed to a strong value
# during the very first BIOS-level setup step before AMT provisioning can proceed (the manual's
# own strong-password requirements are enforced at that point) -- so "admin" is a one-time
# bootstrap credential for local BIOS access, not necessarily a value that survives normal
# commissioning on a properly-set-up unit. However, the finding is significant because: (a) it
# describes the ACTUAL default state of unprovisioned hardware (a real exposure window during
# receipt/commissioning, before an operator has completed setup), and (b) if an operator
# provisions AMT web access with a weak/reused password, or a unit is factory-reset without
# reprovisioning, the well-known "admin" default becomes directly relevant again.
#
# NOT YET BUILDABLE AS A LIVE CHECK: Intel AMT's own web interface (ports 16992/16993) uses HTTP
# Digest authentication by default (a well-documented AMT behavior, not independently re-verified
# from a live device this pass) -- this project has no existing HTTP Digest Auth native module
# (only Basic Auth, form-POST, and JSON-POST variants exist in checks/http/native/). Building this
# would need either confirming Digest auth is genuinely what's used (vs. e.g. Basic Auth on some
# AMT firmware versions) and a new native module, or reusing an existing generic HTTP library's
# digest-auth support if this project adopts one -- not attempted this pass.

