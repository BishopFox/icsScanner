  - "ROBOTIS e-Manual — DARwIn-OP/OP development, RoboPlus Motion connection (ROBOTIS-GIT/emanual docs/en/platform/op/development.md): sets IP + port 6501, TCP/IP, connect — no authentication step in the procedure. Vendor-authoritative corroboration of the no-auth 6501 connection."
  - "core/fingerprint.py probe_robotis_motion_identity — the TCP-6501 'v' version-query identity gate (added 2026-11-12); wire format recovered from RoboPlus Motion 1.0.29.1 Common.dll CMComm.ConnectBoard."
description: >
  The ROBOTIS RoboPlus Motion control server on TCP 6501 (documented host: the DARwIn-OP / ROBOTIS-OP2
  humanoid, factory IP 192.168.123.1) identifies the controller and accepts motion commands with no
  authentication (CWE-306), as publicly reported by IOActive in 2017. Detection is gated on the
  non-actuating robotis_motion_identity probe, which sends only the official client's benign "v"
  version query and parses the braced model:version reply — a model:version frame returned without any
  credential exchange both fingerprints the controller and demonstrates the missing-auth exposure. The
  wire format was recovered verbatim from RoboPlus Motion 1.0.29.1 (Common.dll CMComm.ConnectBoard),
  not guessed. Stays a non-executable candidate until (1) the handshake is confirmed against current
  ROBOTIS-OP2 firmware / a live unit and (2) the connect+"v" query is confirmed not to trigger motion
  on any firmware; an armed check must perform ONLY the version read, and any actuation proof-of-impact
  belongs in scripts/safety_critical/, never an armed check.
