# THE FINDING, confirmed directly from "moxa-csm-400-series-manual-v1.0.pdf" (Edition 1.0, May
# 2017, read via pdftotext), section "Opening the Web Console": the CSM-400 Series (an
# Ethernet-to-optical-fiber media converter, part of Moxa's "NRack System" managed chassis) ships
# with a default Web Console login at the default IP 192.168.127.254:
#     "The default login username is admin and the password is moxa."
# The manual also documents that the ONLY password-recovery path is the physical reset button
# (factory-defaults reset), reinforcing this is a genuinely fixed, unrotated default absent manual
# intervention.
#
# NOT YET BUILDABLE: the exact HTTP auth mechanism is unconfirmed, and this pass leans towards NOT
# assuming Basic Auth (unlike the older Moxa AirWorks AWK-1121/OnCell G3100 checks, which were
# built as Basic Auth from similarly terse manual language). Two things argue against a simple
# Basic-Auth assumption here: (1) the manual's own "Browser Cookie Settings" and "Trusted Site
# Settings" sections (IE-era, ActiveX/ Java-applet-console conventions) imply a session-
# cookie-based custom login, which Basic Auth would not need; (2) the shipped firmware
# (`moxa-csm-400-series-firmware-v1.2.rom`) contains real, uncompressed HTML fragments recoverable
# via `binwalk` (HTML document header/footer signatures at several offsets) -- these were NOT
# deep-dived this pass to pull the actual login form markup, so the wire format remains an open,
# resolvable question rather than a hard blocker (unlike CCG-1500's genuinely encrypted firmware).
# A follow-up pass extracting and reading those HTML fragments directly could resolve this and
# potentially make this buildable.
#
# No CVE — documented factory-default behavior.

