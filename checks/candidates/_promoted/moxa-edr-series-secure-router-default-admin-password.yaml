description: >
  Moxa's EDR Secure Router / firewall line ships a documented (found directly in the vendor's own
  plaintext boot script, /etc/chg_passwd.sh, not cracked or guessed) default credential for the
  root-equivalent (UID 0) "admin" and "user" accounts on a factory-fresh device: the literal
  string "moxa" on the newer CramFS-based firmware generation (confirmed: EDR-G902), or a
  completely BLANK password on the older JFFS2-based generation (confirmed: EDR-810, independently
  corroborated by that firmware's own shipped /etc/shadow showing an empty password field). The
  embedded web admin server is confirmed to start unconditionally at boot on both firmware
  samples. CVSS 3.1: 9.8 CRITICAL (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). No CVE found for this
  specific issue. Held as disclosure_status:disclosed-pending-fix -- sent to Moxa PSIRT 2026-09-19,
  acknowledged 2026-09-21 (no case number assigned yet, general "reviewing" reply).
  Does NOT apply to the newer v3.28 firmware generation (EDR-8010/EDR-G9004/EDR-G9010,
  EDF-G1002-BP), which is comprehensively encrypted and was not analyzed for this specific issue.
