# PROMOTED 2026-10-13 -> checks/http/moxa-edr-series-admin-moxa-default-password.yaml (variant-E cookie-sha256; low value, MPSA-220202 already fixed the creds). Research record.
# FIRMWARE WIRE FORMAT CONFIRMED 2026-10-13 (EDR-G902 v5.7 Login.asp, via moxa_rom handler): a FOURTH
# Moxa login variant (D): form InputPassword, field Username (plaintext) + a COOKIE PASSWORD=sha256(password)
# (NO challenge; radius_enable gate -> plaintext if RADIUS). Submits Username to the login action + the
# PASSWORD cookie. NOT handled by moxa_web_login_default_creds (which puts the hash in a form FIELD, not a
# cookie). Arming EDR needs a small cookie-sha256 executor variant. Documented-default class (Moxa declines);
# default moxa/blank. Prior-art: EDR hardcoded creds already disclosed+FIXED (MPSA-220202; this fw is the fixed
# version) -> LOW disclosure value; detection-only if built. READY-TO-ARM pending the cookie-variant executor.
#
# Candidate stub — 2026-09-17. Ingest triage of a follow-up Moxa batch (EDR/EDF secure router
# BLOCKER TAG (2026-09-22 triage pass): precondition-gap -- Web login wire protocol not fully reverse-engineered, and unclear whether to target the older (JFFS2, blank password) or newer (CramFS, moxa password) firmware generation -- needs comparing multiple firmware samples.
# VERIFIED NEGATIVE (2026-10-06, Phase 2): downloaded moxa-edr-810-series-firmware-v5.12.45.rom
# from Moxa's CDN (getmedia/53207d61-...). It is an ARM zImage + gzip + JFFS2 filesystem at 0x400000
# (binwalk-confirmed), entropy 7.72. grep for account_password_form/SetSHA256/FakeChallenge = 0 hits.
# => EDR is NOT a member of the shared MGate "SetSHA256" web-login family; it CANNOT be armed by
# reusing checks/http/native/moxa_web_login_default_creds.py (the Phase-1b path). The EDR web login
# is its own scheme (JFFS2-embedded Login.asp) and needs independent RE (jefferson-extract the JFFS2
# -> read the login JS) before any check. Reclassified out of Phase-2-quick-win into Phase-4 RE.
# firmware). Confirmed no prior candidate/check for this product line/finding existed before
# writing this file. Genuinely different product category from the DA-66x/68x embedded computers
# already covered elsewhere this session -- these are Moxa's "EDR" Secure Router / firewall line.
#
# THE FINDING, read directly from the vendor's own PLAINTEXT boot script (not cracked, not
# inferred -- the literal shell logic that sets the default password at first boot):
#   `moxa-edr-g902-series-firmware-v5.7.27.rom` (CramFS, big-endian, extracted with
#   `fsck.cramfs --extract`) ships `/etc/chg_passwd.sh`, which on a device with no saved
#   `/mnt/ramdisk/cfg/password.CFG` (i.e. a genuinely fresh/unconfigured unit) runs:
#       (echo "moxa";sleep 2;echo "moxa") | passwd admin
#       (echo "moxa";sleep 2;echo "moxa") | passwd user
#   i.e. THE DEFAULT ADMIN PASSWORD IS THE LITERAL STRING "moxa" -- documented in the vendor's own
#   shipped code, not guessed. Both `admin` and `user` in `/etc/passwd` have UID 0 (root-
#   equivalent) with shell `/etc/cli.sh` (a router-style management CLI).
#   `moxa-edr-810-series-firmware-v5.12.45.rom` (JFFS2, little-endian, extracted with
#   `jefferson`) ships the SAME script, but with the two conditional branches inverted -- on a
#   fresh device it instead sets a completely BLANK password for both `admin` and `user` (`(echo
#   "";sleep 2;echo "") | passwd admin`). This is directly corroborated by the actual shipped
#   `/etc/shadow` in that same image: `admin::12341:...` and `user::12341:...` -- empty password
#   field, confirmed independently of the script logic. Both scripts agree that a saved config
#   file whose value is literally the string "NULL" also produces a blank password, and any other
#   saved value is used as-is -- i.e. this is genuinely about the FACTORY-FRESH default, not a
#   theoretical edge case.
#
# NETWORK EXPOSURE: the embedded web admin server (`/magicP/WebServer/webs`, a compiled binary
# with a real `/Login.asp` page, `PASSWORD=` POST field, login-lockout tracking, and RADIUS-auth
# support -- confirmed via strings) is started UNCONDITIONALLY in `/etc/restart.sh`
# (`cd /magicP/WebServer; ./webs &`, no config check) -- this is the one vector confirmed enabled
# by default on both firmware samples. Telnet is fully configured in `/etc/inetd.conf`
# (`telnet stream tcp nowait admin /usr/bin/tcpsvd /usr/sbin/telnetd`) and SSH server binaries
# (`/sbin/sshd` + `/etc/sshd_config` on EDR-810; an OpenSSH `sshd` system account on EDR-G902) are
# present, but NEITHER `inetd` NOR `sshd` has an rc3.d startup symlink on either firmware sample
# (only `ipsec` and `rmnologin` do) -- honestly NOT claimed as enabled-by-default, since these
# routers' own many `/magicP/agent_*` background daemons (a custom config-driven service-
# enablement layer, not classic sysvinit) could plausibly start them conditionally based on a
# user-configurable toggle not captured in this static analysis.
#
# `moxa-edr-g903-series-firmware-v5.7.27.rom` is the same CramFS architecture, same build era, and
# nearly identical size/file-count to the confirmed EDR-G902 sample (binwalk-verified structure
# match) -- very likely shares the identical chg_passwd.sh logic, but NOT independently
# re-extracted and confirmed this pass (avoiding redundant effort on a near-certain duplicate,
# consistent with how DA-662-I/DA-663 were handled via md5 comparison rather than full
# re-extraction once byte-identical source was already confirmed elsewhere this session).
#
# NOT CHECKED THIS PASS: the newer v3.28 firmware generation for other EDR models
# (EDR-8010/EDR-G9004/EDR-G9010, and the EDF-G1002-BP firewall from the prior batch) is
# comprehensively encrypted (entropy ~8.0, confirmed for EDF-G1002-BP and by extension expected
# for the same-versioned EDR siblings) -- a genuine cryptographic dead end, this candidate does
# NOT claim those specific models/firmware versions are affected.
#
# SEVERITY: CVSS v3.1 scored via the same scripted formula used throughout this session:
#   Vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
#   Base Score: 9.8 (CRITICAL) -- a root-equivalent (UID 0) account, network-reachable via the
