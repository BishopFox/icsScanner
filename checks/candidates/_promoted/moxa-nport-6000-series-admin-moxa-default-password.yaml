#
# THE FINDING, from Moxa's own official "NPort 6000 Series User Manual" (v18.1, user-supplied,
# fetched/read directly via pdftotext) -- a PRECISE, VERSION-GATED default, stated multiple times
# in near-identical wording throughout the manual:
#   "For firmware version 1.21 and before: The default login username is admin and the default
#   password is moxa."
#   "For firmware version 2.0 and after: Set up the username and password for the first user...
#   Every time you reset the device to the default setting, you will need to set the username or
#   password before you log in to the device."
# i.e. Moxa itself documents this as FIXED starting in firmware 2.0 (mandatory first-user setup,
# no factory-preset credential at all) -- same shape as the SICAM CPC80 <=rev07/>=rev14 boundary
# already on file in this project, and as precise a version cutoff as this project has found for
# any Moxa product.
#
# DIRECTLY VERIFIED against BOTH sides of this boundary, real firmware in this same ingest batch:
#   - `moxa-nport-6000-series-firmware-v1.21.rom` (the exact boundary version, unencrypted, raw
#     HTML embedded directly): confirmed the literal factory-default config table entry
#     `moxa\x00\x00\x00\x00public\x00\x00private\x00...` (account/SNMP-community defaults stored
#     together, the same pattern already seen for many other Moxa products this session) --
#     "moxa" is the literal, compiled-in default password, not cracked or inferred. The device's
#     own "Console Settings" web page template shows both the HTTP console AND Telnet console
#     defaulting to Enable (`checked` on the Enable radio button in the raw, unconfigured
#     template) -- both consoles reachable by default. The SAME shared internal Moxa login JS
#     library already fully characterized for the MGate 5000 Series in the previous batch
#     (`Login.html`/`account_password_form`/`FakeChallenge`/`SetSHA256()`) is confirmed present
#     here too (matching literal strings found via grep) -- same SHA256+XOR web-login obfuscation
#     scheme, not yet reimplemented as a live check for the same reason as the MGate candidate.
#   - `moxa-nport-6000-series-firmware-v2.3.rom` (well past the 2.0 boundary): confirmed via
#     `binwalk`/entropy analysis to be GENUINELY ENCRYPTED (entropy ~8.0, custom "NP6K"-magic
#     container) -- consistent with, though not direct proof of, the documented fix; the
#     encryption itself independently corroborates that this is a materially hardened later
#     firmware generation, matching the manual's own framing of 2.0+ as the secured line.
#
# SCOPE: explicitly bounded to firmware <=1.21. This candidate does NOT claim v2.0+ is affected --
# the manual and the encrypted firmware both independently indicate it is not.
#
# SEVERITY: CVSS v3.1 scored via the same scripted formula used throughout this session:
#   Vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
#   Base Score: 9.8 (CRITICAL) -- full administrative access via a vendor-documented, version-
#   bounded default credential, HTTP and Telnet both reachable by default.
#
# RELATED PRODUCT, SAME admin+password SHAPE: Moxa's own "NPort IA and IAW5000A-I/O" manual
