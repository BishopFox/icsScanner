description: >
  Moxa's NPort 6000 Series serial device servers, on firmware v1.21 and earlier ONLY, ship a
  factory-default login of admin/moxa — documented directly and precisely version-bounded in
  Moxa's own official manual ("firmware version 1.21 and before"), and independently confirmed
  directly from real v1.21 firmware (a literal factory-default config table entry, not cracked).
  Both HTTP and Telnet consoles are enabled by default. Firmware v2.0 and later removes this
  default entirely, forcing a first-user setup instead — confirmed encrypted (a further hardening
  step) in a real v2.3 sample examined alongside the vulnerable v1.21 sample. The web login uses
  the same custom SHA256+XOR-obfuscation scheme already reverse-engineered for the MGate 5000
  Series in the prior batch (a shared internal Moxa JS library). CVSS 3.1: 9.8 CRITICAL
  (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H), scoped strictly to firmware <=1.21. Disclosure status:
  public (sourced from Moxa's own manual, corroborated directly by firmware).

