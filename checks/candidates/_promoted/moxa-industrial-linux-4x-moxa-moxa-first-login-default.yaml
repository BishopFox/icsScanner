protocol: ssh
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "Moxa Industrial Linux 4.x (Debian 13) Arm-based Computer platform (e.g. UC-3434A-T-LTE-WiFi and other MIL4-branded units); MC-1200 series (firmware-confirmed, 2020-dated live-boot image)"
references:
  - "Moxa Industrial Linux 4.x (Debian 13) Manual for Arm-based Computers, v1.0, user-supplied, 'Managing User Accounts' / 'Default User Account and Password Policy' section"
  - "Moxa MC-1100 Series Linux Software UM, v1.0, user-supplied, 'Account Management' section -- same credential, weaker (non-blocking) change-recommendation wording"
detection_hints:
  transport: tcp
  app_protocol: ssh
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No narrow wire-level signature is possible for this check — SSH encrypts the session immediately after key exchange, so the specific username/password pair sent is never visible as a plaintext byte pattern on the wire."
    patterns: []
  broad:
    description: "Repeated SSH authentication attempts against this device family from a single source in a short window — the vulnerability class (a credential-guessing pass), not the specific credential, since SSH's encryption prevents matching the actual username/password on the wire"
    patterns:
      - context: request
        regex: "SSH-2\\.0-"
description: >
  Moxa's current Industrial Linux 4.x (Debian 13) Arm-based Computer platform documents its own
  factory-default login as moxa/moxa (both serial console and SSH), explicitly enforced as a
  first-login-only default — the device requires a password change before continuing to log in.
  The "moxa" account is a sudo-group member (root login itself is disabled until manually
  configured). Genuinely different risk shape from a persistent default: only genuinely
  never-yet-commissioned units are exploitable via this credential. Prompted a re-examination of
  checks/candidates/moxa-iothinx-4530-moxa-sudo-default-password.yaml's own cracked shadow entry
  (lastchg=0, the standard Linux "force change at next login" convention), which was very likely
  the SAME mechanism, not a persistent credential as originally framed — that file has been
  updated with this caveat. CVSS 3.1: 9.8 CRITICAL (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H), scored
  for the documented vulnerability class with the first-login-only scope explicitly noted. No CVE
  — documented, intentional factory-default behavior. Not yet built as a live check: whether
  SSH password auth against a forced-must-change account reports success or a distinct failure
  mode through this project's existing paramiko-based executor is unverified without live
  hardware.

