  device's own serial number via a fixed, publicly-known MD5-based algorithm plus a deterministic
  character-substitution transform -- independently re-run and verified this pass, not just
  described. This "installer" account gates the gateway's own local HTTP API on the home network
  (confirmed via multiple independent community projects targeting that same local interface),
  making it a more directly valuable finding than this project's other physical-keypad-only
  derived-password candidates once buildable. Not yet buildable: the exact HTTP login wire format
  was not characterized this pass, and the mechanism's currency is a genuine open question --
  the source repo's own README states Enphase moved to a cloud-authorized local-access scheme
  starting with firmware v7, so this derived-password approach may only apply to older field
