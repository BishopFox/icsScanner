# Candidate stub — 2026-09-28. GitHub-specific sweep of the solar-inverter cluster. Confirmed no
# prior Enphase candidate/check existed anywhere in this project before writing this file.
#
# THE FINDING: Enphase Envoy/Envoy-S gateways gate an elevated "installer" account behind a
# DERIVED (not fixed) password, computed from the gateway's own serial number via a fixed,
# publicly-known algorithm -- the same "derived/computed rather than static" shape this project
# already has precedent for (scripts/mac_derived_password.py, scripts/rt1_sitemanager_mac_password.py,
# scripts/jci_metasys_local_display_password.py + its own candidate,
# checks/candidates/johnson-controls-metasys-local-controller-display-derived-password.yaml).
#
# SOURCING: github.com/sarnau/EnphaseEnergy (cloned to this project's enphase ingest
# _re-repos/ folder), passwordCalc.py -- real, WORKING, independently re-run code, not just a
# description. The core primitive (verified by re-running it directly this pass, digest
# reproduced exactly):
#     MD5("[e]" + username + "@" + realm + "#" + serialNumber + " EnPhAsE eNeRgY ")
#   with username=b"installer", realm defaulting to b"enphaseenergy.com". The actual installer
# PASSWORD is then a second deterministic transform (`emupwGetMobilePasswd`) applied to that MD5
# hex digest: the last 8 hex characters are read in reverse, and each character is re-mapped
# through a stateful counter-based substitution (digits '0'/'1' get replaced by a letter computed
# from a running count of how many '0'/'1' characters have appeared so far in the digest, with
# specific counter resets at 3/6/9 for zeros and 9/15 for ones; every other hex character passes
# through unchanged) -- a real, if unusual, KDF-like construction, not a guess. This project's own
# author independently re-ran the MD5 step this pass and reproduced the exact same digest the
# repo's own sample serial number produces, confirming the code is genuine and not a broken/stale
# reverse-engineering attempt.
#
# WHY THIS IS NETWORK-REACHABLE, unlike the JCI Metasys sibling candidate: the JCI derived
# password gates a purely physical LCD keypad with no network service behind it at all. Enphase's
# "installer" account, by contrast, gates elevated access to the Envoy gateway's own LOCAL HTTP
# API/web interface on the home network (confirmed via the same GitHub search pass surfacing
# multiple community "local Envoy API" projects -- github.com/jdeath/enphase_local,
# github.com/evilzenscientist/envoyAPI, github.com/paullockaby/enphase-proxy -- all of which
# access this exact gateway over HTTP on the LAN, not a physical interface). This makes the
# Enphase finding a genuinely higher-value target than the JCI one once buildable.
#
# NOT YET BUILDABLE, and NOT a small gap: this candidate's evidence (the password-DERIVATION
# algorithm) is solid, but the actual LOGIN WIRE FORMAT -- how the derived password is presented to
# the Envoy's HTTP interface (HTTP Basic Auth against a specific path? A form POST? Digest auth?)
# -- was NOT characterized by this pass, and note the repo's own README's opening warning: "Enphase
# changed the authorization with version 7 - you are now required to authorize local access via
# their cloud server" -- meaning this derived-password mechanism may be OBSOLETE on current
# firmware (v7+), replaced by a cloud-issued JWT token scheme (matching what the "envoyAPI"/
# "enphase_local" project READMEs describe elsewhere in this same search pass). Scope/currency is
# a real open question, not resolved this pass: this could be a strong finding for pre-v7 Envoy
# units still in the field, or a stale/dead algorithm for anything current -- needs a live device
# or a firmware-version-specific confirmation before being treated as a general finding.
#
# A COMPANION `scripts/enphase_envoy_installer_password.py` (mirroring the existing
# scripts/jci_metasys_local_display_password.py pattern: a calculator, optionally with a --try
# mode once the wire format above is confirmed) is the natural next build step but was NOT written
# this pass -- flagged for a dedicated follow-up rather than built speculatively while the wire
# format and firmware-version-currency questions above remain open.

