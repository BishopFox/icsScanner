# Candidate — 2026-10-05. New-vendor ingest: vendor firmware ingest (Nidec Control Techniques
# industrial drives). Verified via `grep -rliE "nidec|control.?techniques|unidrive|si-ethernet"
# checks/` that nothing covered this vendor/finding before writing.
#
# THE FINDING (CWE-1392 use of default credentials / CWE-798): Nidec Control Techniques' SI-Ethernet
# option module and the Unidrive M "onboard Ethernet" interface ship an embedded web server whose
# default administrator account is username "admin" / password "admin". This gates the drive's web
# management pages (diagnostics, key parameters, and user-account management). The admin account
# cannot be deleted (its password may be changed).
#
# DUAL-SOURCE CONFIRMATION (not inferred from one place):
#  (1) FIRMWARE, user-supplied ingest `Ethernet_and_profinet_V02223002.zip` -> nested
#      `Ethernet_and_profinet_V02223002.img`: contains the web-login HANDLER and user database --
#      strings `~/login.html`, `~/noAccess.html`, `login=`, `/fs/wwwusers` (web user DB), add/edit/
#      list-user handlers, session handling ("No available sessions or bad details.", "Session
#      Count limit reached"), and the default user `admin`.
#  (2) VENDOR DOCUMENTATION (authoritative), the official Control Techniques / Nidec "SI-Ethernet and
#      Unidrive M Onboard Ethernet User Guide" (iss4, 0478-0137-04), fetched from nidec-netherlands.nl
#      and read directly with pdftotext (NOT trusted from a search summary -- a web-search paraphrase
#      wrongly claimed "root/ut72", contradicted by both the UG and the firmware). UG §7.6 states
#      verbatim (line 14891): "The default administrator account username is 'admin' with the
#      password 'admin'." Default IP (no DHCP) 192.168.1.100; connect via http://<drive-ip>.
#
# AFFECTED (per the UG): Unidrive M onboard Ethernet (M700/M701/M702) and the SI-Ethernet option
# module fitted to Control Techniques drives (Unidrive M/SP, Commander, Digitax families).
#
# REACHABILITY CAVEAT (stated honestly, not buried): the web pages are NOT part of the Ethernet
# firmware -- per UG §7.6 they must be separately deployed to the module with the "Web Page
# Deployment Tool", and web-page support requires Ethernet interface firmware >= V01.06.00.22. So
# the admin/admin login is reachable ONLY on modules where the optional web pages have been
# deployed; it is not present on a module whose web pages were never loaded. Where deployed, it is
# an unauthenticated-network-reachable HTTP login on the drive's Ethernet port.
#
# LOGIN MECHANISM -- RESOLVED 2026-10-05 via Ghidra (headless 12.1.4, firmware imported as MIPS32LE
# / PIC32 at base 0x9d000000; the .img is flat PIC32 program-flash code, KSEG0 0x9d000000, confirmed
# by the lui $s7,0x9d00 relocation prologue + the 0x000eb858=filesize / 0x9d000040 header fields).
# Traced the full login call chain:
#   FUN_9d098de8 (POST dispatcher; matches action tokens login=/logout=/add=/edit=/delete=/list=/ecmp=)
#     -> on "login=": skip 6 bytes, URL-decode the value (FUN_9d099cc4 = %XX decoder)
#     -> validate (FUN_9d09ae5c): tokenize the decoded blob on ',' (0x2c) (FUN_9d09b73c -> FUN_9d09a8c0),
#        resolve the username among UP TO 5 accounts (FUN_9d09acbc, loop <5), compare against 50-byte
#        (0x32) per-user records in RAM (FUN_9d0d7db4 @ gp-0x7ffcd2e4); 200 = authenticated.
#   Separately a token= CSRF field (FUN_9d0994c8) and a session-limited server ("No available
#   sessions or bad details." / "Session Count limit reached").
# => The login is NOT a standard two-field form. It is a SINGLE `login=` field carrying a URL-encoded,
#    COMMA-DELIMITED credential blob (admin,admin[,...]) plus a `token=` CSRF value obtained from a
#    prior request, over a session-limited server. The generic form_post_default_creds.py (which
#    sends username_field=X&password_field=Y) CANNOT replicate this. Arming needs a CUSTOM STATEFUL
#    executor: (1) GET the login page to obtain a fresh token, (2) POST
#    `login=<urlencode("admin,admin"[,...])>&token=<...>`, (3) treat HTTP 200 / session-grant as
#    success (vs "No available sessions or bad details."). REMAINING UNKNOWNS (murky $gp-relative
#    decompile of the leaf helpers): exact comma-field ORDER (user,pass vs more fields) and whether
#    the password is hashed client-side -- UG says the password is case-sensitive and compared, which
#    points to plaintext-in-blob, but confirm the field order/encoding against a live unit or a
#    captured login before trusting an armed check. Do NOT ship a guessed field order.
#
# FORM-FIELD INVESTIGATION (2026-10-05, user asked to find the web form fields -- result: PARTIAL,
# arming still blocked). Attempted three ways:
#  (a) Firmware `.img` handler (most authoritative available): extracted the handler's full POST
#      field/action vocabulary. The POST handlers key on ACTION tokens `login=` / `logout=` / `add=`
#      / `edit=` / `delete=` / `list=` / `ecmp=`, carry a CSRF/session `token=`, and use COMPACT
#      field names (`P0` `Cp` `cc` `b0` `e0` `I0` `Q0` `R0` `S0` `CT` `bp`). So the login POST is of
#      the shape `login=...&<compact user field>=...&<compact pass field>=...&token=...`. BUT the
#      firmware carries NO literal `user=`/`username=`/`password=`/`pwd=` tokens and NO HTML form, so
#      WHICH compact field is username vs password (and the exact POST path + success marker) is NOT
#      determinable from strings -- would need disassembly of the handler (unknown embedded CPU) or
#      the actual form.
#  (b) Vendor UG §7.6.5 "SIGN IN": confirms admin/admin and that a sign-in screen exists, but the
#      form is a screenshot image -- no HTML field names.
#  (c) Web search (x3): the deployed login.html is not independently published.
#  (d) UNIDRIVE M CONNECT MINED (2026-10-05, 2nd attempt after the nidec ingest grew to include the
#      Connect-Setup installers): extracted Connect-Setup V02.18/V02.20/V03.01 (596MB WiX Burn
#      bundles). Tried 7z (got only the installer stub), a manual WiX CAB carve, AND the sidecar's
#      unblob which went deep (3576 files, through the WiX attached CAB -> a1/a3 -> nested 7z/MSI).
#      NO SI-Ethernet login.html / "SIGN IN" web template anywhere in Connect -- only installer-UI
#      HTML (DHtmlHeader.html) and a help-links JSON. CONCLUSION: the Web Page Deployment Tool does
#      not ship the drive's login page as a static file in the installer (it templates/generates the
#      pages, or they live in a component not present in these downloads). Also confirmed: ALL
#      Ethernet firmware versions in the ingest (Ethernet_and_profinet V0222xxxx, UniM_Eth V01/V02,
#      SM_Ethernet) reference ~/login.html but ship /fs/www EMPTY -- none bake in the form.
#  STILL NEEDED TO ARM (narrowed): a LIVE UNIT / packet capture of a real login (most reliable), or
#  Ghidra disassembly of the .img login handler (unknown embedded CPU) to map the compact fields.
#  The deployed-web-page route is a dead end -- the pages are not a shippable static artifact we can
#  obtain. Do NOT arm with guessed compact-field mappings -- a wrong field name silently never
#  authenticates.
#
# SEVERITY, CVSS v3.1: AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H = 9.8 CRITICAL for the default-credential
# web-admin access (full control of the drive's management interface: parameters, user accounts),
# conditioned on the web pages being deployed and the Ethernet interface being network-reachable
# (typical for a drive on an OT/machine network). Documented-default, so public, not a disclosure
# target.

check_id: candidate-nidec-control-techniques-si-ethernet-default-admin-web-password
protocol: http
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Nidec Control Techniques"
  product: "SI-Ethernet option module + Unidrive M onboard Ethernet (Unidrive M700/M701/M702, SI-Ethernet on Unidrive M/SP, Commander, Digitax); web pages deployed, Ethernet fw >= V01.06.00.22"
references:
  - "User-supplied ingest: Ethernet_and_profinet_V02223002.zip -> Ethernet_and_profinet_V02223002.img. Web-login handler + user DB read directly: ~/login.html, ~/noAccess.html, login=, /fs/wwwusers, default user 'admin', session handling."
  - "Control Techniques / Nidec 'SI-Ethernet and Unidrive M Onboard Ethernet User Guide' iss4 (0478-0137-04), nidec-netherlands.nl, read via pdftotext. §7.6 line 14891: \"The default administrator account username is 'admin' with the password 'admin'.\" Default IP 192.168.1.100. Web pages deployed separately (Web Page Deployment Tool); web support requires fw >= V01.06.00.22."
  - "NOTE: a web-search summary claiming default 'root'/'ut72' was WRONG -- contradicted by both the firmware (user 'admin') and the vendor UG (admin/admin); not used."
# NOT YET ARMED -- params skeleton for checks/http/native/form_post_default_creds.py. The login FORM
# (field names, POST path) is deployed separately and is not in the firmware; confirm from the
# deployed web pages or a live unit before promoting. Keep disclosure_status public (documented).
# NOTE: form_post_default_creds.py does NOT fit (see LOGIN MECHANISM). A CUSTOM stateful executor is
# required. Sketch of its flow (Ghidra-derived):
executor_sketch:
  step1: "GET the web root / login page over HTTP; capture the CSRF 'token' value the page embeds."
  step2: "POST body: login=<urlencode('admin,admin')>&token=<captured>  (comma-delimited blob in ONE 'login=' field; URL-decoded + comma-tokenized server-side)."
  step3: "success = HTTP 200 / session granted; failure keyword = 'No available sessions or bad details.'"
  credentials: [["admin", "admin"]]
  unknowns: "exact comma-field order + client-side hashing (if any) — confirm vs a live unit/capture before arming."
description: >
  Nidec Control Techniques SI-Ethernet option module and Unidrive M onboard Ethernet interface ship
  an embedded web server with a default administrator login of admin/admin, confirmed both in the
  firmware (Ethernet_and_profinet_V02223002.img -- login handler, /fs/wwwusers user DB, default
  'admin' user) and verbatim in the official vendor User Guide (§7.6: "default administrator account
  username is 'admin' with the password 'admin'"; default IP 192.168.1.100). This grants full web
  management access (drive parameters + user-account management) to anyone who can reach the drive's
  Ethernet port, where the optional web pages have been deployed (web support requires Ethernet fw
  >= V01.06.00.22; the pages deploy separately via the Web Page Deployment Tool -- an honest
  reachability caveat). Form-based login (HTTP POST + session cookie, not Basic). CVSS 3.1
  AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H = 9.8 CRITICAL, conditioned on web-page deployment and network
  reachability. Documented default -> disclosure_status public (no responsible-disclosure needed).
  Buildable with form_post_default_creds.py once the deployed login form's path/field-names/success
  marker are confirmed (not recoverable from the firmware alone -- the login.html form deploys
  separately). Affected: Unidrive M700/M701/M702 onboard Ethernet + SI-Ethernet on CT drive families.
