# Candidate stub — 2026-09-16. Ingest triage of a new 126-file batch (Siemens/Yaskawa manuals).
# `winac_rtx_2010_manual_en-US_en-US.pdf` — Siemens's own official "WinAC RTX (F) 2010, Operating
# Instructions" (A5E00486536-04, 07/2010), read directly via pdftotext. WinAC RTX (F) is a real,
# still-referenced Siemens software-PLC runtime product (the "(F)" denotes the fail-safe variant)
# that executes a STEP 7 program on a Windows PC in place of a physical S7 CPU. Confirmed no prior
# WinAC candidate/check existed before writing this file (grepped the full checks/ tree for
# "winac" — no hits).
#
# THE FINDING, section 5.3.5 "Security" tab, verbatim: "Enter your password. The default password
# is an empty field." and, in the "Change password" dialog's own note: "The default password is an
# empty field without characters. To enter the default password, press the Enter key." This gates
# the WinAC RTX "Controller Panel" — a local Windows GUI application, not the runtime's own network
# protocol interface — for operations including changing the controller's operating mode and
# archiving/restoring the loaded STEP 7 user program.
#
# SCOPE, honestly bounded: this password protects the LOCAL "Controller Panel" GUI application on
# the SAME Windows PC hosting the WinAC RTX runtime — not a network-facing login. An attacker would
# already need local (interactive or remote-desktop/RDP-class) access to that Windows host to reach
# this dialog at all, making it a much lower-value finding than this project's network-facing
# checks. It is nonetheless a real, vendor-documented empty-by-default credential on a real ICS
# product (a software PLC runtime, not just an engineering tool), filed the same way as this
# project's existing local-console/panel-passcode candidates (Trane UC800, GE Multilin, SICAM FCM,
# SICAM AK3) rather than discarded. Filed as `protocol: local-only`, not a network check — this
# scanner has no mechanism to probe a local Windows GUI dialog and building one would be out of
# this project's own network-scanning charter.
#
# NOT YET CONFIRMED: whether the WinAC RTX runtime's OWN S7comm/network interface (the actual PLC
# protocol other devices/engineering stations would use to communicate with it, separate from this
# local Controller Panel GUI) has any related access-control gap — not examined this pass, out of
# scope for this specific finding.

