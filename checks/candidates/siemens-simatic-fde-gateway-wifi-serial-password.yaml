# Candidate stub — 2026-09-14. User supplied the official SIMATIC FDE Gateway V1 firmware update
# bundle (fde_gateway_v1.1.zip: bundle_data.json + firmware.bin + user_data.bin + app_config.json)
# for review as part of the firmware-extraction methodology
# (01-METHODOLOGY-AND-CHECKLISTS.md). NOT executable (no `kind`) — see disposition below; this is
# a RULED-OUT/OUT-OF-SCOPE record, not a "not yet buildable, needs more data" one.
#
# Product: SIMATIC FDE ("Field Data Enablement") Gateway V1, a current (2023) Siemens IIoT edge
# gateway — connects legacy RS232/USS field devices (e.g. G120 drives) to MQTT/cloud/Industrial
# Edge. Official Equipment Manual fetched and read directly, not a search summary
# (cache.industry.siemens.com/dl/files/683/109820683/att_1142054/v3/FDE_Gateway_V1_en-US.pdf, the
# same cache-URL pattern proven throughout this sweep for bypassing the JS-gated HTML product
# pages).
#
# TWO SEPARATE FINDINGS, both real, both requiring careful non-conflation:
#
# 1. WEB APPLICATION LAYER (the actual "Web" firmware component, `user_data.bin` in the bundle):
#    CONFIRMED NO FACTORY DEFAULT CREDENTIAL EXISTS. The manual's own "First logon" section
#    (§6.1) states plainly: on first connection, "a registration window is displayed, prompting
#    you to specify a password... Choose a password and enter it twice in the form... Click
#    'Sign up'." This is a genuine "operator sets the password on first use, no shared default"
#    design — same disposition already recorded for SIPROTEC 5 elsewhere in this sweep (see
#    siemens-siprotec4-web-monitor-default-password.yaml's own "Ruled out" note for that
#    precedent). CONFIRMED NEGATIVE for this project's actual default-credentials check class —
#    not a gap, not blocked, genuinely nothing to build here.
#
# 2. WI-FI ACCESS POINT (a SEPARATE, EARLIER step than the web app login): to even reach the web
#    app's https://192.168.4.1 in the first place, the manual states the device hosts its own
#    Wi-Fi access point (SSID `fde_gateway_[last 6 hex digits of the WiFi MAC address]`), and its
#    connection password is "the serial number" printed on the device's own physical nameplate —
#    quoted worked example straight from the manual: "Serial number V-R5A11111 ... Password:
#    V-R5A11111." This IS a real, predictable-if-you-can-read-the-nameplate default credential —
#    but for Wi-Fi/802.11 association (a WPA2 PSK), not a TCP/IP network service. OUT OF SCOPE for
#    this project's active scanner: icsScanner's charter and every existing check operate over
#    reachable TCP/IP (00-PROJECT-CHARTER.md's Scope) — there is no 802.11/RF association
#    capability in this project, and testing this would require physical RF proximity to the
#    device, not network reachability. Recorded here for completeness (a real finding, not
#    invented) rather than silently dropped, matching this sweep's own "physical/local-access
#    findings get documented as explicitly out of scope" convention (see the CVE-2022-38465
#    candidate filed the same session for the same disposition class).
#
# FIRMWARE ENCRYPTION, noted for completeness, NOT the actual blocker here (finding #1 above
# already rules this candidate out regardless): both `firmware.bin` and `user_data.bin` are
# high-entropy (unblob: zero recognized chunks across either file, Shannon entropy mean ~99.8%)
# and each asset in `bundle_data.json`'s manifest carries its own ECDSA (DER-encoded) signature —
# a genuinely signed+encrypted update bundle, the SECOND Siemens product this sweep has found
# using this class of protection (after the SCALANCE S615), suggesting newer/Edge-branded Siemens
# products trend toward encrypted firmware more than older switch/RTU lines do. No decryption
# attempted, consistent with this project's encryption-gate policy — moot here regardless since
# finding #1 already closes this candidate out.

