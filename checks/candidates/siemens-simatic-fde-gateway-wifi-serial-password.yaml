physical_access_reference:
  summary: "SIMATIC FDE Gateway V1 — the device's own Wi-Fi access point (needed to reach its commissioning web UI in the first place) uses the device's serial number, printed on its physical nameplate, as the WPA2 connection password. RF/802.11-layer, not a network-reachable finding — no default credential exists on the web application itself (forced self-registration on first use)."
  steps:
    - "Read the device nameplate: note the serial number (starts with 'S', the actual serial begins at the next character) and the WiFi MAC address."
    - "Join the device's Wi-Fi access point, SSID fde_gateway_[last 6 hex digits of the WiFi MAC address] (e.g. SSID fde_gateway_10c8b2 for MAC 10:df:fc:10:c8:b2)."
    - "Use the serial number as the WPA2 password (e.g. serial V-R5A11111 -> password V-R5A11111)."
    - "Browse to https://192.168.4.1 — the web app itself has NO default credential; first connection forces registering a new password via a 'Sign up' form. There is nothing to guess at this layer."
