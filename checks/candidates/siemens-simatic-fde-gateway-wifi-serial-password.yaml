description: >
  SIMATIC FDE Gateway V1's web-management application has NO factory default credential —
  confirmed directly from Siemens's own Equipment Manual: first connection forces the operator to
  register a new password, no shared default exists. RULED OUT for this project's default-
  credentials check class. A real but architecturally out-of-scope finding exists one layer
  earlier: the device's own Wi-Fi access point's WPA2 password is documented as the device's
  serial number (printed on its physical nameplate) — not testable by this project, which has no
  802.11/RF capability and operates over reachable TCP/IP only. Firmware is genuinely encrypted
  (signed ECDSA bundle, ~99.8% mean entropy, zero chunks recognized by unblob) but this is moot:
  finding #1 already closes this candidate regardless of firmware access.
