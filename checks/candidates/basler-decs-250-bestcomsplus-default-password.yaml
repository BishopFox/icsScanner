# Candidate stub — second ips.us/store.ips.us document batch (57 files, W1002287-345), 2026-08-28.
# NOT executable (no `kind`). First-ever Basler Electric coverage in this project with an actual
# disclosed default value — a previous pass (Phase ~27, see default-credentials-sweep.md's "Basler
# Electric, ERLPhase, National Switchgear — no traction" note) found Basler's BE1-700/BESTlogic
# uses a 6-level hierarchical access system but explicitly could not locate a default value. This
# batch resolves that class of gap for a DIFFERENT Basler product line.
#
# CONFIRMED, read directly from Basler's own DECS-250 Digital Excitation Control System
# Instruction Manual (9440300990, `ingest/W1002336.pdf`), Section 24 "Security":
#   "When prompted, enter a username of 'A' and a password of 'A' and log on. This factory-default
#   username and password allows administrator-level access. It is highly recommended that this
#   factory-default password be changed immediately to prevent undesired access."
# This exact sentence appears twice in the manual (once for User Name Setup, once for Port Access
# Setup) — both configuration screens are gated by the same A/A administrator login. Access levels
# below Admin (Design, Settings, Operator, Control, Read, None) exist per Table 24-1, but Admin
# (rank 1, full access including security setup, comms settings, and software upgrades) is the
# level the factory-default A/A credential itself grants — this is not a low-privilege fallback.
#
# NETWORK REACHABILITY: DECS-250 has a real Ethernet port (copper 100Base-T or fiber 100Base-FX,
# depending on style number) confirmed used for both (a) Modbus TCP polling (registered port 502,
# manual states this explicitly) and (b) BESTCOMSPlus's own proprietary connection protocol for
# configuration/settings upload-download — the SAME protocol whose login prompt is gated by the
# A/A credential above ("Connect to the DECS-250 through the USB or Ethernet port... enter a
# username of 'A' and a password of 'A'"). This is a genuinely network-reachable, not
# local-panel-only, finding.
#
# NOT BUILT — the one missing piece: the manual documents Modbus TCP's own port (502) but never
# states what TCP port BESTCOMSPlus's own proprietary login protocol listens on for its
# Ethernet-based username/password exchange — those are two separate protocols sharing the same
# physical port, and only one of them (Modbus) has its wire-level port disclosed. Needs either (a)
# a packet capture against a real or simulated DECS-250 (same live-capture method already used for
# the Schneider Vampset/GetSet findings), or (b) a BESTCOMSPlus-aware open-source client/protocol
# analysis (same "find a real client implementation" method used for the TM/Fanuc/Denso/Mecademic
# safety-critical tools) — neither attempted yet.
#
# Corroborating source, same batch: `ingest/W1002338.pdf` (BESTCOMSPlus software revision history)
# confirms password/security features (password expiration, "0 = No Password Expiration" setting,
# logic-section password protection) are actively maintained across BESTCOMSPlus versions — the
# security model described in the DECS-250 manual is a live, evolving feature, not a legacy
# leftover. No default-value content of its own.

