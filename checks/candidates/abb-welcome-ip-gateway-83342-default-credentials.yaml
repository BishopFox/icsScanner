#
# THE PACKAGE ships TWO separate root-filesystem tar images with materially DIFFERENT security
# postures — both extracted directly (plain POSIX tar, zero encryption) and read directly, not
# guessed:
#
# 1) `..._factory_filesystem.img` (labeled "factory" — very likely a manufacturing/production-
#    line test image, not necessarily what a real deployed unit runs day to day — this
#    distinction is treated carefully below, not glossed over):
#      `/etc/stupid-ftpd.conf` (a real, minimal FTP daemon, port 21 per its own default config)
#      contains, verbatim:
#        user=root  *    /    5   A
#      Per the SAME config file's own documented format ("<passwd> password or * for anonymous
#      access", "<flags> A - allows EVERYTHING(!)"): username "root" logs in with NO PASSWORD
#      (anonymous), granted access to the ENTIRE FTP server root (chrooted to /mnt, per
#      `serverroot=/mnt`), with EVERY permission flag (download/upload/overwrite/erase/all) —
#      confirmed directly from the shipped config file's own plain-text content, not inferred.
#      `/etc/passwd` in this same image shows `root:x:...` / `appweb:x:...` — "x" placeholders
#      with NO corresponding /etc/shadow file present at all in this image.
#
# 2) `..._customer_filesystem.img` (the OTHER image in the same package — presumed the actual
#    deployed/end-customer runtime, though this project has not independently confirmed which of
#    the two images a real shipped unit boots): does NOT contain the same stupid-ftpd.conf file
#    at all (checked directly — absent, not just unconfirmed). Its `/etc/passwd` DOES carry real
#    MD5-crypt password hashes for both accounts:
#      root:$1$$BLEyl7SSjwTyFsQn8w5R3.:0:0::/root:/bin/sh
#      appweb:$1$$9eE6.P3jTvBMc.7fRdCHw.:500:500:Linux User,,,:/home/appweb:/bin/sh
#    CRACKED DIRECTLY (Python's `crypt.crypt()` against the recovered empty-salt "$1$$" prefix,
#    same technique already used successfully this session for the Kollmorgen PCMM2G finding):
#      appweb -> password is literally "appweb" (username == password).
#    root's hash was NOT cracked against a reasonably broad wordlist this pass — not claimed
#    solved, reported honestly as still unknown.
#    `appweb`'s account has a real home directory and `/bin/sh` login shell (not a service-only
#    "nologin" account) — a real, interactive Unix account, not just a web-server process owner.
#    `/usr/sbin/telnetd` is present in this same filesystem image, though this pass did NOT
#    conclusively trace its exact activation (not found directly invoked in `/etc/init.d/rcS` or
#    `/etc/inittab`, which instead show a serial-console getty using a CUSTOM login binary,
#    `/usr/app/mylogin` — telnetd may be started by a different script this pass did not locate).
#    Not claimed as a confirmed network-reachable path without that missing piece.
#
# BECAUSE the exact same firmware IMAGE FILE is what ABB distributes to every customer flashing
# this exact version, the cracked appweb:appweb credential is not a one-off — it is the SAME
# credential on every unit running this firmware build, unless overridden post-deployment (not
# confirmed either way — a real, stated limit, not glossed over).
#
# NOT YET BUILDABLE: this project has no fingerprint precondition or protocol probe for ABB-
