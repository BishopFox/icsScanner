description: >
  ABB-Welcome / Busch-Welcome IP-Gateway 83342 firmware ships two rootfs images with different
  security postures. The "factory" image configures its embedded FTP daemon (stupid-ftpd, port
  21) with "user=root * / 5 A" — anonymous (no password) root-level FTP access with full
  read/write/delete rights over its entire server root, confirmed directly from the shipped
  plain-text config. The "customer" image lacks that FTP config but carries a real password hash
  for its "appweb" interactive shell account, independently cracked to the literal value
  "appweb" (username equals password) — the same credential on every unit running this exact
  firmware build. A third, independently confirmable finding: ABB's own official product manual
  documents the Web-Interface's out-of-box and post-reset default login as admin/admin, with no
  forced change. Still not buildable as a live check: the web login is a custom HTML form (not
  HTTP Basic Auth) and the exact POST wire format isn't in the manual; the FTP/appweb paths'
  exact network-reachable service was also not conclusively traced. A live/emulated device, or
  the original firmware's web-application files (no longer in ingest/), would resolve either gap.
