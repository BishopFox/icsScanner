# Candidate stub — default-credentials sweep, direct-name VFD-brand research (2026-08-18, user:
# "continue with...direct-name VFD research (ABB/Danfoss/Yaskawa/Siemens Sinamics)"). NOT
# executable (no `kind`).
#
# ABB drives (ACS580 and others) fitted with the FENA-01/-11/-21 Ethernet adapter module —
# on-board web configuration page, username "admin", password = the last 6 digits of the
# module's own MAC address, uppercase, no hyphens (e.g. MAC 00-1C-01-00-2F-73 -> password
# 002F73). Confirmed directly from ABB's own official FENA user's manual (library.e.abb.com) and
# a dedicated ABB support document explicitly titled "WHAT IS THE PASSWORD FOR THE WEB PAGE IN
# THE FENA-01_11_21?" — about as strong and unambiguous a primary source as this sweep gets.
#
# STRUCTURALLY DIFFERENT credential shape, same category as this session's MHI/Marex WiFi-serial
# findings and the Fanox no-Ethernet finding: this is NOT a fixed shared string. It's derived
# per-device from the MAC address — which this project's OWN `core/fingerprint.py` OUI-lookup
# machinery already reads for vendor identification, so in principle the derivation is
# computable if the check could observe the target's MAC address. In practice this project's
# scanner operates over IP (Layer 3) against remote targets, not Layer 2 — it has no existing
# mechanism to read an arbitrary target's MAC address unless it happens to be on the same local
# broadcast domain (ARP), which cannot be assumed for a general-purpose network scan the way this
# project's other credential checks can.
#
# NOT BUILT: would require (a) a new capability to resolve a target's real MAC address over IP,
# which doesn't reliably exist for a routed/remote target, and (b) even where available (same-
# subnet only), a genuinely new authentication mechanism (compute password from MAC, not a fixed
# list) unlike every other check in this project's params schema. A real, well-sourced finding,
# but the biggest architectural mismatch of anything found in this session's VFD research.
#
# detection_hints: filled in anyway, 2026-08-26 — same reasoning as the sibling PM5500 MAC-
# derived candidate. Narrow is structurally inapplicable (no single fixed value exists to name);
# broad IS real, and cleaner here than PM5500's own case: "admin:" is exactly 6 bytes — 2 complete
# base64 3-byte groups — so its encoding (`YWRtaW46`) is a byte-for-byte stable prefix of
# `base64("admin:" + password)` regardless of what the MAC-derived password actually is, verified
# directly (not assumed) by computing the real encoding for two different sample passwords and
# confirming both share the identical 8-character prefix.

check_id: candidate-abb-fena-mac-derived-password
protocol: http
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "ABB"
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No single fixed probe exists here — this credential is DERIVED per-target from the device's own MAC address, so there is no one specific value a narrow signature could name. Honest absence, same shape as the sibling PM5500 MAC-derived-password candidate."
    patterns: []
  broad:
    description: "Any HTTP Basic Auth login attempt with username 'admin' and a 6-hex-character password — the shape this MAC-derived password always takes (last 6 hex digits of the MAC, uppercase, no separators), regardless of which specific MAC/device it was computed from. The base64 prefix is stable because 'admin:' is exactly 6 bytes (2 complete 3-byte groups) — verified by computing the real encoding for two sample passwords, both sharing the identical prefix."
    patterns:
      - context: request
        regex: "Authorization: Basic YWRtaW46[A-Za-z0-9+/]{8}"
references:
  - "https://library.e.abb.com/public/c6f853a8631f4b3bb8e80a4c005043dc/LVD-EOTN98U-EN_REVA.pdf"
  - "https://library.e.abb.com/public/d6a31af1808043ba8ef53980031041ea/EN_FENA01_11_21_UM_E_A4.pdf"
description: >
  ABB drives with a FENA-01/-11/-21 Ethernet adapter module default to username "admin", password
  = the module's own MAC address's last 6 hex digits, uppercase — confirmed directly from ABB's
  own manual and a dedicated support document. Not buildable: this project's scanner has no
  reliable way to resolve an arbitrary remote target's MAC address over IP, and computing a
  password from one would be a genuinely new authentication mechanism unlike every other check's
  fixed-credential-list params schema.

not_automatable_reference:
  credential: "admin / <last 6 hex digits of the module MAC, uppercase, no hyphens>"
  source: "ABB FENA user's manual + ABB support note 'WHAT IS THE PASSWORD FOR THE WEB PAGE IN THE FENA-01_11_21?'"
  category: "derived-credential-architectural"
  reason: >-
    The password is derived per-device from the adapter's own MAC address, not a fixed shared
    string. Computing it requires reading the target's MAC, which a routed/remote TCP/IP scan
    cannot obtain (MAC is only visible on the same L2 broadcast domain via ARP). Both a
    MAC-resolution capability and a compute-from-MAC credential model are outside this scanner's
    fixed-credential-list architecture.
