description: >
  Eaton PXGX/PXGMS UPS network (Power Xpert Gateway) cards ship with firmware-version-gated
  default credentials, confirmed directly across three of Eaton's own official support documents:
  legacy firmware (PXGX <=2.4.01, PXGMS <2.3.7) uses admin/admin; current firmware (PXGX >=2.6.05,
  PXGMS >=2.3.7) uses admin/<card MAC address, uppercase, no separators> — an EXACT byte-for-byte
  match to this project's existing MAC-derived-password algorithm already implemented for a
  different vendor (Schneider PowerLogic, scripts/mac_derived_password.py). Default IPs
  (169.254.0.101 current firmware, 192.168.200.101 legacy) and a dip-switch factory-reset
  procedure (restoring admin/admin, forced password change on next login per current firmware)
  are also confirmed. High confidence on the credential/derivation itself; not yet a check because
  the exact HTTP login request shape (Basic Auth vs. custom form) isn't confirmed from any source
  checked this pass — needs the card's own firmware or a live device/capture to close that one gap.
