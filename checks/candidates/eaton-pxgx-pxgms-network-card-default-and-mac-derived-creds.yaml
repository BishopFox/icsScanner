  product: "PXGX / PXGMS UPS network card (Power Xpert Gateway)"
references:
  - "What are the default credentials for a PXGS_PXGMS network card_.pdf, user-supplied Eaton knowledgehub export, read directly via pdftotext"
  - "Change the IP Address of the Power Xpert Gateway X-Slot UPS Card network.pdf, user-supplied Eaton knowledgehub export, read directly via pdftotext"
  - "PXGX_PXGMS admin password reset.pdf, user-supplied Eaton knowledgehub export, read directly via pdftotext"
