physical_access_reference:
  summary: "Siemens SICAM A8000 devices (both the older CPC80 module at 'fixed' firmware revisions >= 14, and the current CPCI85/'SICORE'-based hardware) ship with their SICAM WEB 'administrator' account carrying NO PASSWORD ASSIGNED AT ALL in the factory-default state, while the SICAM WEB HTTPS/HTTP interface itself is reachable over the network by default. The account is not just weakly protected — it is genuinely UNCLAIMED until whoever connects first defines a password for it, which (per the vendor's own operator-facing documentation) appears to succeed for essentially any submitted value."
  steps:
    - "Reach the target SICAM A8000 device's SICAM WEB interface (HTTP/HTTPS, default IP 172.16.0.3 or the site's configured address) before the legitimate operator completes first-login setup."
    - "At the login prompt, authenticate as 'administrator' and submit any compliant password (8-54 characters)."
    - "Per the vendor's own documented flow, this claims the administrator account with the submitted password, granting full engineering access — this step is NOT a safe/reversible test and should only ever be performed with explicit authorization, since it permanently alters the device's credential state."
  network_note: "Unlike the SICAM AK3 candidate's own no-password Administrator account (gated behind a USB-first, network-disabled-by-default posture), this finding's network path (SICAM WEB over LAN1) is reachable by default on current SICAM A8000 hardware per the vendor's own factory-settings tables — this is a live, present-day exposure window during commissioning, not a legacy/patched issue."
description: >
  Siemens SICAM A8000 devices — both the CPC80 module at 'fixed' firmware revisions (>= 14, where
  the sibling sicam-a8000-cpc80-web-default-creds check's own static "1703" credential no longer
  applies) and the current CPCI85/"SICORE"-based hardware generation — ship with their SICAM WEB
  "administrator" account carrying NO PASSWORD ASSIGNED AT ALL by default, confirmed directly in
  two current (2025/2026) official Siemens manuals' own text and factory-settings tables. The
  SICAM WEB web interface itself is reachable over the network by default (not an opt-in feature).
  This is a genuinely unclaimed-account / first-login-race condition, not a guessable static
  credential — the vendor's own documentation implies that whoever authenticates as "administrator"
  first, with any compliant password, claims the account permanently. This is filed as a
  physical/network Field Reference entry, explicitly NOT built as an automated check: probing it
  would require an actual login attempt that, on a genuinely vulnerable device, permanently and
  irreversibly claims the administrator account — a destructive side effect this project's
  safety-first scanning charter does not allow in the automated check pipeline. Also resolves an
  open uncertainty in the sibling SICAM AK3 candidate about whether the newer SICORE/CPCI85
  hardware moved away from the "no password" default design — it has not; RBAC exists as an
  optional feature, not the shipped default.
