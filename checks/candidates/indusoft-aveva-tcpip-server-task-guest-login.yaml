description: >
  AVEVA InduSoft Web Studio / InTouch Edge HMI "TCP/IP Server Task" agent (port 1234) accepts an
  authentication bypass via a known default value — either a fixed-hash Guest login or a
  "DistributedToken|<hash>" blank-Main-Password bypass — per Tenable TRA-2018-34
  (CVE-2018-17914/CVE-2018-17916). The wire protocol is now byte-exact confirmed (STX/cmd-byte/
  ETX framing, FF-FE-FF-length-prefixed UTF-16LE string fields) and the DistributedToken bypass
  variant's full login frame is verified byte-for-byte from the advisory's own raw PoC — zero
  guessing needed on the request side. NOT BUILT: neither Tenable source ever documents or
  verifies a success/failure response signature for command 69 (both PoCs blindly chain into a
  separate buffer-overflow attack without checking), so a check could only report
  FINGERPRINT_ONLY at best, and even that risks a false read without a confirmed response
  signature. Needs explicit human sign-off before building given this gap, same bar as this
  project's other Milestone-4-adjacent decisions.
