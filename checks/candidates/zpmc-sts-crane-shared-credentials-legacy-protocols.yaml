# Candidate stub — industry-vertical sweep (port/crane), continuation of Phase 62, 2026-09-03.
# BLOCKER TAG (2026-09-22 triage pass): firmware-gap -- Not resolvable by ordinary firmware/hardware acquisition -- the credential value is withheld in a classified (SSI) U.S. Coast Guard assessment, a hard access barrier.
# NOT executable (no `kind`). RESEARCH GAP, same compound-blocker shape as the GE Mark VIe
# power-generation candidate filed earlier in this same sweep.
#
# A real, government-documented finding, not a vendor blog claim: ZPMC (Shanghai Zhenhua Heavy
# Industries) ship-to-shore container cranes — ~80% of U.S. port STS crane installed base —
# were the subject of a joint House Homeland Security Committee / Select Committee on the CCP
# investigation (Mar 2024, 51-page report, fetched and pdftotext'd directly from
# chinaselectcommittee.house.gov) confirming undisclosed cellular modems "connected to Linux
# computers on port cranes" and not part of any ordered configuration. The report itself
# (grepped in full) contains NO password/credential/Telnet/CVE detail — it documents the modems'
# existence and provenance dispute, nothing at the protocol/credential level.
#
# The credential-relevant detail comes from a SEPARATE source: a U.S. Coast Guard Cyber Command
# OT security assessment, reported second-hand via breakbulk.news (Coast Guard warning coverage)
# and referenced by Tripwire — direct fetch of the Tripwire piece 403'd in this pass, so this is
# resting on ONE accessible secondary source, not the primary assessment itself:
#   - "continued use of outdated protocols such as Telnet and SMBv1"
#   - "shared account credentials" (explicit phrase, not paraphrased)
#   - "improper network segmentation" enabling lateral movement
#   - crane control systems interface to PLCs/cameras/landside servers via "PROFINET and LPDP"
#   - the cellular modems themselves are called out separately as an added remote-access vector
#
# TWO compound blockers, neither resolved by this pass (same shape as GE Mark VIe):
#   1. No actual credential VALUE is disclosed anywhere in public reporting — "shared account
#      credentials" describes a hygiene failure (one account reused across many
#      operators/devices), not a static factory-default string this project could test for.
#   2. The actual primary source — Coast Guard MARSEC Directive 105-4 (Feb 2024) and its
#      successor 105-5 (Nov 2024) — is explicitly Security Sensitive Information (SSI),
#      distributed only to vetted stakeholders, confirmed via the Federal Register notice of
#      105-4's issuance. This is a HARD, not just practical, blocker: the technical detail this
#      candidate needs is deliberately non-public by government classification, not merely
#      hard to find.
#
# Not pursued further in this pass. If revisited: the Federal Register 105-4 notice
# (federalregister.gov/documents/2024/02/23/2024-03822) is the correct primary-source citation
# for the directive's existence/scope even though its content stays SSI; a live device or a
# leaked/FOIA'd copy of the Coast Guard assessment would be the only path to an actual credential
# value.

