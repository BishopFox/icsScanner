# Candidate stub — 2026-09-18. NOT executable (no `kind`). ARCHITECTURALLY OUT OF SCOPE
# (physical/console access, not network) — same category as the CAREL local-panel-passcode
# family and Carel's own local-only precedent in this registry.
#
# Source: Moxa's own official "Moxa Industrial Linux 4.x (Debian 13) Manual for Arm-based
# Computers" (v1.0, user-supplied, fetched/read directly via pdftotext), "Administrator Password"
# section (bootloader chapter): "For the Secure Model, the administrator password to access the
# bootloader menu is set by default. The Default Administrator Password is the unique Serial
# Number (S/N) printed on the sticker of Moxa Arm-based computer." The SAME section's own WARNING
# block states: "Since the serial number can be easily found under various circumstances, setting
# an administrator password is mandatory" -- i.e. Moxa itself flags this default as weak and
# recommends changing it. For "Standard Model" units, the bootloader menu has NO password
# protection at all by default.
#
# SCOPE: bootloader-menu access on Moxa's current Arm-based Computer line running Industrial
# Linux 4.x -- reached via physical serial console or a boot-time key sequence, not a network
# service. Per-unit (the S/N is unique to each device, printed on its own physical label), not a
# single shared credential like the OS-level "moxa/moxa" default (see the sibling candidate,
# moxa-industrial-linux-4x-moxa-moxa-first-login-default.yaml, for that separate finding) -- but
# a real, vendor-acknowledged weakness since the S/N is often readable from packaging, asset
# tags, or other non-console sources without needing to already have console access.

