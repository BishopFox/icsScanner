#
# - **Fanuc — RESOLVED AND BUILT.** A real, functioning, open-source Fanuc "Socket Messaging" (SM)
#   client — codeberg.org/hojak/FaRoC — was found and read directly: its own `connect()` source
#   opens a plain TCP socket, reads one response (a KAREL-program greeting), and sends/receives
#   commands with NO credential exchanged at any point. Its own `ping()` method sends the literal
#   command `ping___` (padded to a fixed 127-byte frame, no checksum) and expects the string
#   "pong" back — a genuinely safe, zero-motion-capability connectivity check. Port 24087
#   confirmed as the client's own default. Built:
#   `scripts/safety_critical/fanuc_sm_plan.py` + `fanuc_sm_confirm.py` + `_fanuc_sm_protocol.py`.
#   Requires a specific KAREL TP program ("FAROC_SERVER"/"FAROC") running — opt-in/integrator-
#   configured, same shape as TMflow's Listen Node. `tests/smoke_test_safety_critical_fanuc_sm.py`,
#   20 assertions.
#
# - **Denso b-CAP (TCP 5007) — RESOLVED AND BUILT.** User supplied
#   github.com/DENSORobot/orin_bcap — Denso Wave's OWN official b-CAP client library. Read
#   `bcapclient.py` directly: connection setup sends no credential, and `service_start("")` (func
#   ID 1) is the b-CAP session-initialization call every session makes first — it names no
#   controller/robot/variable object and carries zero motion capability. The exact request bytes
#   were captured by running Denso's own `_serialize()` against a mocked socket (not hand-derived
#   — see `_denso_bcap_protocol.py`'s docstring for the exact reproduction command), avoiding any
#   risk of a transcription error in Denso's materially more complex binary/VARIANT-typed framing
#   compared to Fanuc/TMflow's plain ASCII protocols. Response success is read straight from
#   Denso's own `HResult.succeeded()` rule (hresult >= 0). Built:
#   `scripts/safety_critical/denso_bcap_plan.py` + `denso_bcap_confirm.py` +
#   `_denso_bcap_protocol.py`. `tests/smoke_test_safety_critical_denso_bcap.py`, 21 assertions.
#
# - **Mecademic (TCP 10000) — RESOLVED AND BUILT.** User supplied
#   github.com/Mecademic/mecademicpy — Mecademic's OWN official Python client. Read
#   `_robot_base.py`/`mx_robot_def.py`/`robot_classes.py` directly: control port 10000
#   (`MX_ROBOT_TCP_PORT_CONTROL`), an unsolicited NULL-terminated `[3000][...]` welcome message on
#   connect with no credential involved, and the literal ASCII command `GetStatusRobot` (NULL-
#   terminated, no arguments) — a genuine read-only status query, replied to with
#   `[2007][...]` (`MX_ST_GET_STATUS_ROBOT`). Built: `scripts/safety_critical/mecademic_plan.py` +
#   `mecademic_confirm.py` + `_mecademic_protocol.py`. `tests/smoke_test_safety_critical_mecademic.py`,
