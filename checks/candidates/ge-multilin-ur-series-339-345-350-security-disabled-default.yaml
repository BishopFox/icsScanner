  confirmed identically, likely more of the same platform family) ship from the factory with
  password security DISABLED and Remote Setpoint/Remote Control passwords set to a blank (Null)
  value — full remote write/control access over native Ethernet or RS485 (Modbus, DNP3.0, IEC
  60870-5-103/104, IEC 61850 GOOSE) requires no credential at all until an operator opts in to
  password security. Resolves a previously-logged blocker for 345/350 (no default value had been
  found) — the actual blocker now is the missing Modbus/DNP3 register address for remotely
  checking/toggling this state, not the underlying fact. Not built as an active check or script
