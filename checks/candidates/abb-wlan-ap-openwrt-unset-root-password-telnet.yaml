# Candidate stub — 2026-09-15. Three ingest/ files, never previously opened — `8186_31_500_SW_
# BLOCKER TAG (2026-09-22 triage pass, UPDATED same day after sourcing pass below): was
# precondition-gap (commercial product/model name unconfirmed) -- RESOLVED, confirmed as
# Busch-Jaeger's "WLAN-Accesspoint" line, model 8186/31 (-101 sub-variant) and the PoE 8186/41
# variant, flush-mount (Unterputz/UP) Wi-Fi access points for in-wall installation, IEEE
# 802.11b/g/n 2.4GHz. Real remaining blocker, narrower now: this project's fingerprint_precondition
# schema needs either an OUI (MAC-prefix) vendor/product match or a protocol_probe -- neither was
# established this pass (no live device or OUI-registry lookup performed; the firmware itself,
# already reviewed and removed from ingest/, doesn't embed a hardcoded default MAC to check). This
# candidate is otherwise the MOST directly buildable of the whole ABB cluster touched this pass --
# the vulnerability itself is fully traced end-to-end from the device's own scripts, not
# inferential -- once a fingerprint precondition exists (an IEEE OUI-registry lookup for
# Busch-Jaeger/ABB's actual assigned MAC prefix would resolve this cleanly, not attempted this
# pass on top of the product-name search already spent). A follow-up attempt to find the actual
# IEEE-registered OUI directly (WebFetch on the IEEE registry itself was blocked, HTTP 418; a
# WebSearch found only generic OUI-lookup-tool pages, no Busch-Jaeger/ABB match) did not resolve
# it either -- worth noting the underlying hardware is a MIPS/Atheros ar71xx OpenWrt target, so
# the real registered OUI may belong to a contract ODM manufacturer rather than Busch-Jaeger/ABB
# directly, a real possibility for why a vendor-name search comes up empty, not just missed.
# 1003.zip` (-> acw-abb-1003.bin), `8186_x1_500_SW_2000.zip` (-> acw-abb-2000.bin), `8186_x1_SW_
# 2000.zip` (-> acw-bje-2000.bin) — are u-boot legacy uImage firmware for an **ABB Wi-Fi access
# point** (confirmed directly from the device's own `/etc/config/system` — `option hostname
# 'ABB-WLAN-AP'`), two branding variants (ABB/BJE) across two firmware dates (2013, 2014).
# Confirmed no prior ABB-WLAN-AP/acw-abb/acw-bje candidate or check existed before writing this
# file. This is a genuinely new device class for this project — a real Wi-Fi access point, not a
# building-automation panel/gateway like the rest of this batch.
#
# THE FILE is a u-boot uImage with a stock OpenWrt Linux/MIPS kernel (LZMA-compressed, per its own
# header) followed immediately, at a fixed offset (1048576 bytes = 1MB, confirmed identical across
# all 3 samples), by a real SquashFS root filesystem (found via its `hsqs` magic, not assumed —
# `dd`-carved out and `unsquashfs`'d directly, no decryption needed at any step). The device runs
# stock **OpenWrt "Attitude Adjustment" 12.09** (`ar71xx/generic` target, confirmed from
# `/etc/openwrt_release` and the login banner) — this is NOT a custom ABB Linux distribution like
# most other devices in this sweep, it's vanilla upstream OpenWrt.
#
# THE FINDING, traced end-to-end through the device's OWN scripts, read directly, not assumed from
# general OpenWrt knowledge:
#   1. `/etc/shadow`'s root entry: `root:x:0:0:99999:7:::` — the password field is the literal
#      placeholder `x` (OpenWrt's own convention for "no password set"), confirmed IDENTICAL
#      across all 3 firmware samples (both ABB- and BJE-branded, both firmware dates).
#   2. `/etc/init.d/telnet` (read directly from this exact firmware, not from upstream OpenWrt
#      source) implements OpenWrt's documented "bootstrap" behavior: its `has_root_pwd()` function
#      strips a leading `!`/`x` character from the shadow/passwd password field and checks if
#      anything remains — for THIS shipped state, nothing does, so `has_root_pwd()` returns false
#      for both `/etc/passwd` and `/etc/shadow`. `start()` therefore launches
#      `/usr/sbin/telnetd -l /bin/login.sh` (confirmed present in `etc/rc.d/S50telnet`, an ENABLED
#      default-runlevel symlink in all 3 samples — not merely installed, actually started).
#   3. `/bin/login.sh` (also read directly from this firmware) checks the SAME `^root:[!x]\?:`
#      pattern — if root still has no real password, it prints a warning ("Use 'passwd' to set
#      your login password, this will disable telnet and enable SSH") and then executes
#      `exec /bin/ash --login` — i.e. hands over a REAL, INTERACTIVE ROOT SHELL with ZERO
#      authentication, by design, as OpenWrt's own documented first-boot bootstrap mechanism.
#   4. `dropbear` (SSH) is ALSO in the enabled default runlevel (`S50dropbear`) with
#      `option PasswordAuth 'on'` and `option RootPasswordAuth 'on'` in `/etc/config/dropbear` —
#      but since root has no password set, SSH password auth cannot succeed either way (there's
#      no password to match); this does not weaken the telnet finding, but is noted for
#      completeness. `uhttpd` (the web/LuCI admin interface) is also enabled (`S50uhttpd`) — not
#      independently checked for its own default-access behavior this pass.
#   NET EFFECT: unless an operator has run `passwd` at least once (which, per the login script's
#   own printed warning, ALSO disables telnet going forward), any of these ABB/BJE-branded WLAN
#   access points is reachable via an completely unauthenticated root shell over Telnet. This is
#   OpenWrt's own well-documented, intentional out-of-box behavior (not an ABB-introduced defect),
#   but ABB shipped this stock behavior unmodified on a commercial product, and real-world
#   experience with rebranded router/AP products is that this initial-setup step is frequently
#   skipped by installers or end customers.
#
# NOT YET BUILDABLE: this project has no fingerprint precondition for "ABB-WLAN-AP" specifically
# (no OUI research done this pass), and the exact commercial product name/model number behind the
# "8186" ingest filenames and "acw-*" firmware naming was not independently identified beyond what
# the device's own hostname string confirms.

