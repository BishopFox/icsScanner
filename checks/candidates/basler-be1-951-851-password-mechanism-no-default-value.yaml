# DIFFERENT product line and outcome) — filed separately rather than merged into that file per
# [[feedback_candidate_status_staleness]]'s lesson that consolidated multi-model files are the
# highest-risk pattern for prose going stale; these two Basler findings have genuinely different
# confidence/buildability status and should stay independently trackable.
#
# Sources: BE1-951 and BE1-851 Overcurrent Protection Systems Instruction Manuals, multiple
# revisions of each read directly (`ingest/W1002333.pdf` BE1-951 Rev L, `ingest/W1002334.pdf`
# BE1-951 Rev N, `ingest/W1002330.pdf` BE1-851 Rev unspecified, `ingest/W1002331.pdf` BE1-851
# Rev N) — all four describe the IDENTICAL password-protection mechanism verbatim, confirming this
# is a stable, vendor-wide BESTCOMS-software convention across both relay families and multiple
# firmware revisions, not a one-off.
#
# CONFIRMED mechanism: BESTCOMS (the BE1-951/851 configuration software, predecessor to
# BESTCOMSPlus used by the newer DECS-250) implements a 4-way password scheme — Global, Settings,
# Reports, and Control access, each independently password-protectable per communication port
# (front RS-232/HMI, rear RS-232, rear RS-485). Per the manual's own Table 9-1: "User defined
# alphanumeric string with a maximum of 8 characters. A setting of 0 (zero) disables password
# protection." Read-only access never requires a password on any tier ("READ-ONLY. This is the
# default access privilege when no passwords are active").
#
# NOT CONFIRMED — the actual factory-shipped state: the manual states that a Password setting of
# 0 disables protection, and separately states "If you select Show Passwords and the default
# passwords have not been changed, all four passwords appear" (implying an initial/default state
# exists distinct from a user-set one) — but NEVER explicitly states what that initial value
# actually is (0/disabled, or some non-zero factory string). This is the same "mechanism
# documented, exact shipped value withheld" gap already logged for PowerAct Pro and several other
# candidates in this project — a genuine sourcing gap, not a guess either way. If the factory
# state genuinely is Password=0 (protection disabled), this would be a real
# missing-authentication-by-default finding for full write/control access to a protection relay;
# if it ships with a real non-zero value, that value is simply not in any manual checked so far.
#
# Also documents the GS-PW ASCII command (`GS-PW<t>[=<password>,<com ports>]`, t=G/S/C/R) as the
# serial-terminal equivalent of the BESTCOMS GUI path — same credential model, same missing value.
#
# NOT BUILT: no confirmed factory-default value to test. Next step, if pursued: find a
# BESTCOMS-specific FAQ/support document (same pattern that resolved several Schneider FAQ-only
# gaps this session) or a live/simulated relay to observe the out-of-box GS-PW response.

