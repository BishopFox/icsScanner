# per-user auth/priv protocol negotiation). SNMPv3 USM requires engine-ID discovery, HMAC-MD5/SHA
# key localization, and DES/AES priv-protocol handling — real new executor work, not a
# params-only reuse of the existing module. No SNMPv3 executor exists in this project yet.
#
# Also unconfirmed: whether this exact credential is a genuine shared factory default across all
