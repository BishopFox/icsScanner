# Candidate stub — 2026-09-30. Review of the 38 Phoenix Contact firmware files the firmware-
# sidecar pipeline's file-count safety guard had refused outright (see sidecar/targeted_extract.py
# + `sidecar gated`, built earlier this same session). Confirmed via `grep -rli` across checks/
# that no prior candidate/check covers PLCnext's User Management (Um) store before writing this.
#
# THE FINDING: Phoenix Contact's PLCnext Technology-based controllers (confirmed on AXC F 1152 and
# RFC 4072S, firmware 2026.0.5 LTS -- the newest release of each at ingest time) ship their RAUC
# firmware bundle's rootfs with an IDENTICAL, byte-for-byte factory User Management config:
#     opt/plcnext/projects/Default/System/Um/Users.config:
#       <User UserName="admin" PasswordHash="" IsLocked="false">
#         <MemberOf rolename="Admin"/>
#       </User>
# The admin account's PasswordHash is a literal EMPTY STRING, and IsLocked is explicitly "false"
# (not true) -- this is the WBM (Web-Based Management)/RSC-service account referenced throughout
# etc/plcnext/device/Services/Wbm/* and var/www/plcnext/wbm/*, NOT the OS-level Linux account (the
# OS's own /etc/shadow root and admin entries are correctly locked with "!" -- PLCnext's real auth
# boundary is this XML-based Um store, a separate subsystem from Linux PAM).
#
# TECHNIQUE: extracted via sidecar/targeted_extract.py's list-then-pull workflow (zero full
# recursive unpack, no crash risk) -- each firmware .zip contains a RAUC bundle (a squashfs
# container wrapping an ext4 rootfs image plus bootloader/hook files); 7z reads ext4 natively
# (confirmed: 16,854 real paths listed from the AXC F 1152 image alone), so the Um config was
# pulled as a single named path with no filesystem mounting and no root privileges needed.
#
# CORROBORATION ACROSS PRODUCT FAMILIES: the exact same Users.config (same PasswordHash="", same
# IsLocked="false", same XML structure) was independently extracted and confirmed from BOTH
# AXC_F_1152_FW_2026_0_5_LTS.zip and RFC_4072S_FW_2026_0_5_LTS.zip -- two different PLCnext
# hardware product lines, both at their current newest firmware release. This is a
# PLCnext-PLATFORM-WIDE pattern, not a one-off misconfiguration in a single product's build.
# (36 more gated Phoenix Contact firmware files -- other AXC_F/RFC/BPC/EPC variants and versions
# -- were NOT individually checked this pass given time budget; high likelihood the same pattern
# holds across the whole PLCnext-based lineup, but this is NOT asserted as confirmed beyond the
# two files actually read.)
#
# VENDOR'S OWN DOCUMENTATION CORROBORATES THIS IS A KNOWN, NAMED MECHANISM, not a hidden bug:
# AXC F 1152's own change-notes PDF (`ah_en_axc_f_1152_change_notes_109476_en_34.pdf`, read via
# pdftotext) explicitly references, across multiple firmware versions, a WBM "default password"
# change workflow and a "PASSWORD POLICY" / "Password ruleset" configuration tab -- e.g. "The
# workflow of changing the default password was incorrect. The explanation in the dialog was
# unclear" (a bug-fix entry, meaning the dialog/workflow itself is real and vendor-documented,
# just previously had a UX defect). This is Phoenix Contact's own intentional first-use
# provisioning design: ship with no password set, force one to be chosen via the WBM on first
# configuration -- the SAME general shape as this project's existing Eaton ETR-5000 candidate
# ("delivered with maximum 'open' settings... recommend you change the password during initial
# configuration"), not a secret the vendor is unaware of.
#
# disclosure_status: public -- reclassified from an initial undisclosed assumption given the
# vendor's own release notes directly reference this exact default-password workflow by name (same
# reclassification logic already applied this session to the Phoenix Contact TC DSL Router
# candidate once its vendor manual was found).
#
# OPEN QUESTION, honestly recorded, NOT resolved this pass: whether the WBM/RSC web services
# actually enforce "no functional access until a password is set" (a safe, correctly-implemented
# first-use gate) or whether some RSC service/API endpoint is reachable with the admin role and an
# EMPTY password BEFORE that first-use flow completes (a real, exploitable gap). Static firmware
# analysis alone cannot answer this -- it requires either a live PLCnext device at factory defaults
# (attempt WBM/RSC login with admin + empty password) or reading the WBM/RSC authentication
# service's own source/bytecode logic for how it treats an empty PasswordHash during login
# (NOT done this pass; `var/www/plcnext/wbm/*.js` and the RSC service binaries were seen in the
# filesystem listing but not opened).
#
# NOT YET BUILDABLE: no existing executor targets PLCnext's WBM/RSC login flow (protocol/wire
# format not characterized this pass), and the open question above is a prerequisite to knowing
# whether this is even a real, live-exploitable finding versus a correctly-gated factory state.
#
# UPDATE 2026-10-25 (firmware-sweep triage, AXC F 1152 FW 2026.0.5 LTS — the newest LTS):
#  * CURRENCY CONFIRMED: Users.config in the CURRENT 2026.0.5 LTS rootfs STILL ships
#    <User UserName="admin" PasswordHash="" IsLocked="false"> AND now carries an explicit
#    <UserAuthentication isrequired="true"/> element. So (a) the empty-admin-hash factory state
#    persists in current firmware, and (b) authentication is declared required at the config level
#    (consistent with a first-use gate, not auth-disabled). Extracted crash-safe: zip -> .raucb
#    (squashfs) -> axcf1152-image-base-*.ext4 -> debugfs -R "cat ..." (read-only, no mount).
#  * WBM AUTH ARCHITECTURE characterized from var/www/plcnext/wbm/main.*.js (Angular SPA): the WBM
#    uses an OAuth2 token flow -- /_auth_api/{authorize,token,introspect,prolong,revoke} -- and
#    queries two Um endpoints: **/arp_api/wbm/um/authentication_state** and /wbm/um/user_passsword_info
#    ("passsword" triple-s typo is literally in the firmware). The presence of an
#    `authentication_state` endpoint (the WBM asks the device whether it is provisioned / whether a
#    password must be set BEFORE login) LEANS toward the safe-by-design reading of the open question
#    above: the server tracks provisioning state rather than silently accepting admin+empty.
#  * STILL NOT RESOLVED / NOT PROVEN: this is still not proof that the Um/RSC backend rejects
#    admin+empty-password pre-provisioning -- enforcement is server-side in a compiled ARP/Um service
#    (not in the Angular JS). Definitively closing it needs either (i) the Um authentication service
#    binary RE, or (ii) a live factory-default device: GET /arp_api/wbm/um/authentication_state
#    unauth (does it reveal unprovisioned state?) then attempt the OAuth /_auth_api/token flow with
#    admin + empty password. NEITHER done -- out of proportionate effort now (PLCnext heavily studied;
#    Phoenix Contact PSIRT already actively engaged on the 5-finding router/mGuard report in flight).
#  * POTENTIAL FUTURE SCANNER VALUE (NOT armed, disclosure-gated): if /arp_api/wbm/um/authentication_state
#    is unauth-GETtable, it is a clean PLCnext-WBM fingerprint + a safe "is this unit still at
#    factory-unprovisioned (no admin password set)" exposure check. Verify unauth-readability on a
#    live unit before building; do NOT arm without that + the disclosure gate.

