# BLOCKER TAG (2026-09-22 triage pass): firmware-gap -- This project has no Green Motion firmware or Commissioning Tool binary in any ingest batch to characterize the connection mechanism.
# candidate/check existed anywhere in this project before writing this file.
#
# THE FINDING, confirmed directly from "green-motion-building-and-green-motion-fleet-
# commissioning-guide-IL191013EN.pdf" (Eaton Instruction Leaflet, effective January 2024, read via
# pdftotext): Eaton Green Motion Building / Green Motion Fleet EV charging stations are
# commissioned via a PC "Commissioning Tool" application ("eaton green motion building and fleet
# commissioning tool.exe") that connects to the charger using its serial number (from a QR code
# on the unit) plus a password:
#     "Default password to log in is 'eaton'. It is recommended that this default password be
#     updated to a stronger password upon installation."
# The same document's reset procedure independently confirms the value a second time: "You can
# reset to default password (default password: eaton)."
#
# MITIGATING FACTOR, current firmware: "Users will be forced to update the default password to a
# stronger password" upon first successful connection — the same "real exposure window during
# initial commissioning, not a value that survives normal setup" shape already recorded for
# several other Eaton products in this research thread (Network-M2, SICAM WEB elsewhere in this
# project).
#
# NOT YET BUILDABLE: the exact connection mechanism between the Commissioning Tool and the EV
# charge station is not characterized at the protocol level in this document — the guide's own
# troubleshooting section (a Windows Firewall "Allow Access" prompt for the Commissioning Tool
# .exe) implies a LOCAL NETWORK connection (LAN or possibly a direct Wi-Fi link, since the same
# document separately describes provisioning the charger's own Wi-Fi credentials), but no port
# number, protocol name, or wire format is documented. This project has no Green Motion firmware
# or Commissioning Tool binary in any ingest batch to characterize it further.
#
# WHAT WOULD UNBLOCK THIS: the actual "eaton green motion building and fleet commissioning tool"
# Windows application (not currently in any ingest batch) — inspecting its own network calls
# (similar to how this project has previously found protocol detail directly in application
# binaries/frontends elsewhere, e.g. the SICAM WEB Cmd_LogOn discovery) would likely reveal the
# exact wire protocol, or a live Green Motion charger / packet capture would serve the same
# purpose.

# UPDATE 2026-09-16 (fourth/final Eaton ingest batch): a genuinely DIFFERENT, DIRECTLY BUILDABLE
# credential/mechanism was found on the same product family by extracting and reading real
# firmware source code ("RC-v2106 - Livigno/cm3-dc-app2106.fup" -- gunzip -> tar -> a genuinely
# unencrypted SquashFS image -- readable Python 3): the charging station's own onboard "AppService"
# REST API (TCP port 8082, plain HTTP, bound to 0.0.0.0) is gated by HTTP Basic Auth with a
# hard-coded factory-default admin/admin credential (`boxproxy/Webservice/BasicAuth.py`:
# `DEFAULT_USER = 'admin'`, `DEFAULT_PASS = 'admin'`). This is NOT the same mechanism as this
# candidate's own "eaton" Commissioning Tool password above -- no literal "eaton" string was found
# anywhere in this firmware component, so the two credentials likely belong to genuinely separate
# services/mechanisms (or possibly different product generations) rather than being the same
# finding described two ways. Filed as its own real check, since the credential, protocol, port,
# and binding were all confirmed directly from the device's own shipping source code:
# `checks/http/eaton-green-motion-appservice-basic-auth-default-creds.yaml`. This candidate
# (the "eaton" / Commissioning Tool finding) remains open and separately unresolved.
#
# SOURCING ATTEMPT 2026-09-22 (firmware-gap re-pass): confirmed via WebSearch that the actual
# "eaton green motion building and fleet commissioning tool" application is a public, no-login
# download directly on Eaton's own Green Motion Building/Fleet product pages (a ~775KB ZIP,
# dated 05/06/2023) -- not gated behind a portal or account, and separately confirmed (same
# search) that the tool connects over a direct RJ45/Ethernet LAN cable, ruling out a cloud-API
# mechanism and supporting this candidate's existing "local network connection" inference. NOT
# OBTAINED this pass, though: eaton.com itself was unreachable from this sandbox for every fetch
# attempt (two WebFetch calls timed out at 60s; a direct curl connectivity test to
# https://www.eaton.com got a bare connection failure while the same test against archive.org
# succeeded immediately) -- a real environment/network obstacle specific to this domain, NOT a
# login gate. The download exists and is real; getting it just needs a normal browser/network
# path this sandbox doesn't have right now. Worth the user grabbing it directly if this candidate
# stays a priority.

