# **RESOLVED: the network port is TCP 2001**, plus HTTP/HTTPS on 80/443. Found directly in a
# NEWER, previously-unfetched Siemens document -- "SICAM RTUs, SICAM AK 3 System Description"
# (MC2-025-2.08, Edition 02.2026, cache.industry.siemens.com/dl/files/291/109762291/att_1367887,
# fetched via curl+pdftotext per this project's PDF-triage convention, not a search summary). Its
# own "Supported Ports" table states, verbatim, three times across different module port tables:
#   "Port 2001: 'Remote operation for SICAM TOOLBOX II'"
#   "Port 80: HTTP ... 'Remote operation for SICAM TOOLBOX II'"
#   "Port 443: HTTPS ... 'Remote operation for SICAM TOOLBOX II'"
# Ports 80/443 carry a footnote marker ("1)") whose exact qualifying text didn't extract cleanly
# from this PDF (likely a licensing/optional-module condition, not confirmed) -- port 2001 carries
# no such footnote, making it the more likely primary/always-available protocol port once "Remote
# operation" itself is enabled. This is a genuine, primary-source resolution of the single
# specific gap that blocked this candidate since it was first filed -- the wire protocol running
# on 2001 itself (proprietary TOOLBOX II binary protocol, presumed) is still not characterized,
# and this project has no executor for it.
