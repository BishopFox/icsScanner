physical_access_reference:
  summary: "Siemens SICAM AK 3 substation-automation RTUs ship with their standard 'Administrator' user account carrying NO PASSWORD AT ALL by default, and the device's local USB/serial connection to SICAM TOOLBOX II (the engineering tool that account authenticates against) is ENABLED BY DEFAULT -- confirmed directly in two independent official Siemens manuals' own factory-settings tables, and corroborated by the user's own hands-on device testing."
  steps:
    - "Connect a USB cable between a PC running SICAM TOOLBOX II and the SICAM AK 3 device's front-panel USB port (Mini-B connector on the CP-2016/CP-2019 master control element)."
    - "Open SICAM TOOLBOX II and connect to the device via the serial/USB connection."
    - "At the login prompt, use username 'Administrator' with no password."
    - "If unchanged from factory default, this grants full engineering access to the device's configuration."
