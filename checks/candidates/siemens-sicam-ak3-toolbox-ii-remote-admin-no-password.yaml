description: >
  Siemens SICAM AK 3 substation-automation RTUs ship with their standard "Administrator" user
  account carrying NO PASSWORD AT ALL by default — confirmed directly, stated twice, in the
  vendor's own official user manual, and independently reconfirmed in a second, newer System
  Description manual's own factory-settings table. The device's local USB/serial connection to
  SICAM TOOLBOX II is enabled by default (confirmed in both manuals, and by the user's own
  hands-on test), making this a real, reachable-out-of-the-box physical-access finding, filed the
  same way as this project's existing Trane UC800/GE Multilin/SICAM FCM local-panel-credential
  candidates. A separate network path also exists (TCP 2001 plus HTTP/HTTPS 80/443, all
  documented as "Remote operation for SICAM TOOLBOX II" — resolving this candidate's original
  "exact port unknown" blocker) but is disabled by default until an operator enables it, and its
  wire protocol remains uncharacterized, so it is not built as a network check. NOTE: a separate,
  already publicly disclosed vulnerability (CVE-2021-45106, CVSS 9.9, hardcoded Oracle DB
  credentials on SICAM TOOLBOX II's own server software, port 1522/TCP) exists in this same
  product family but is a distinct finding, not this candidate's own.
