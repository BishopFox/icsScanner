# Candidate stub — 2026-09-14. User supplied "BHB_SICAM_AK_3_ENG.pdf" — Siemens's own official
# "SICAM RTUs, SICAM AK 3 User Manual" (DC2-028-2.04, Edition 04.2019), fetched and read directly
# via pdftotext (14617 lines), not a search summary. SICAM AK 3 is a Siemens substation-
# automation RTU (CP-2016/CP-2019 control processor modules on a PS-263x rack) — a real, older
# but still-documented member of the same SICAM RTU family as the already-existing
# `checks/candidates/siemens-sicam-rtu-unauthenticated-web-diagnostic-pages.yaml` (a DIFFERENT,
# still-unidentified diagnostic-page finding — not the same thing, don't conflate). Confirmed no
# prior SICAM AK3-specific candidate/check existed before writing this file.
#
# THE FINDING, confirmed directly, stated TWICE in the manual's own text, in two separate
# sections, not a single ambiguous mention:
#   1. §4.1.1.2 "Password": "The preset password is equal to the predefined user type." — i.e.
#      each built-in user type's PRESET password is a fixed, name-derived value (e.g. the
#      "admin" user type's preset password is "admin") — a hint says "The preset password must
#      be changed after the first login," but this is operator GUIDANCE in the manual, not a
#      technical control this project has confirmed the device itself enforces.
#   2. §5.5 "Secure Factory Reset" — an explicit table, "Comparison of Factory Settings with
#      Default Settings," listing BOTH the post-factory-reset state AND the normal freshly-
#      commissioned state ("new AU, configured with SICAM TOOLBOX II"). The "Standard user" row
#      reads, IDENTICALLY in both columns: "Administrator (no password set)". This is the
#      stronger, unambiguous statement: the device's own standard Administrator account has NO
#      PASSWORD AT ALL by default — not "admin/admin", literally no password configured — in
#      BOTH the reset state and the normal as-shipped/as-commissioned state.
#
# REACHABILITY, confirmed as a real network surface, not assumed: §3.2.1.2 "Remote operation,
# LAN/WAN via Ethernet (TCP/IP)" documents that SICAM TOOLBOX II (Siemens's own engineering tool)
# connects to a real SICAM AK 3 device over actual TCP/IP (via the device's X0/X1 Ethernet ports,
# shown crossing a "Zone A / Zone B" network boundary in the manual's own diagram) — this is the
# SAME login (Administrator, no password) that gates local USB-cable engineering access. This is
# a genuine remote/network engineering-protocol login, not a local-console-only mechanism.
#
# REAL, STATED CAVEAT: the same §5.5 factory-settings table separately lists "Remote operation:
# disabled" as the DEFAULT state for both columns — meaning a freshly-commissioned or freshly-
# reset device does NOT accept the TCP/IP engineering connection until an operator explicitly
# enables it. Once enabled (a realistic, common configuration for a remotely-managed substation
# RTU, which is much of the reason Ethernet ports exist on this hardware at all), the no-password
# Administrator account is what gates that connection, per the same table.
#
# NOT YET BUILDABLE: the manual does not state the exact TCP port or wire protocol SICAM TOOLBOX
# II's "Remote operation" uses to reach the device (searched explicitly — no port number appears
# anywhere in this 14617-line document; the one "Firewall"/"web.engineering" section found is
# about a SEPARATE feature, a Windows Terminal-Services web portal for the ENGINEERING PC side,
# not the device's own listening service). Building a check would require either a live device
# capture of this specific protocol, or a more specific companion document (e.g. a firewall/port
# list guide) this pass didn't have. This project's own SICAM TOOLBOX II Ethernet protocol is
# also not currently supported by any existing fingerprint probe or executor.

# FOLLOW-UP 2026-09-15 (user supplied real SICAM TOOLBOX II update/masterdata packages --
# `TBIIUpdate_V05.zip`, `TBIIUpdate_V0602.zip` [+ a byte-identical "(1)" duplicate],
# `TBIILiveUpdate_V0602.zip`, `Content_V0602.zip` -- hoping to find the missing TCP port/wire
# protocol for "Remote operation"): `Content.csv` confirmed these are TOOLBOX II's own
# peripheral-module firmware catalog (DNP3/Modbus-TCP/IEC 60870-5-101/103/104/PROFIBUS-DP/
# IEC 61850 protocol-converter modules for the SICAM RTU family) plus TOOLBOX II's OWN internal
# Oracle-schema SQL migration scripts (schema literally named `TBII_ADMIN` -- confirms "TBII" =
# "SICAM TOOLBOX II", not a separate product). Opened the two modules most likely to carry the
# actual network wire-protocol code: the CPC ("Central Processing/Communication") module and an
# ET24 ("Ethernet Interface IEC60870-5-104") module.
#   - The CPC module's main firmware is zlib-compressed Intel HEX encoding real PowerPC-class
#     compiled machine code (decoded and decompressed directly -- both steps succeeded cleanly,
#     no vendor encryption here, unlike the SCALANCE S615/M800 firmware in the sibling candidate).
#     Moderate entropy (6.44, consistent with genuine compiled code, not ciphertext), but a
#     `strings` scan found zero readable password/login/port strings -- would need actual
#     disassembly to locate any embedded TCP port constant, not attempted this pass.
#   - The ET24 module bundles plaintext English/German diagnostic error-message catalogs (real,
#     readable text) but these are operator-facing troubleshooting documentation, not protocol/
#     credential detail.
#   - The `TBII_ADMIN` SQL schema itself only defines configuration-parameter access-control
#     METADATA (e.g. a column comment: "Access rights and edit behaviour: 0..Read-/Writeable,
#     1..ReadOnly, 2..Password") -- describing HOW the engineering tool categorizes parameters,
#     not an actual credential value.
# **Net: a real, new artifact type explored, but it does NOT resolve this candidate's blocker.**
# No TCP port, wire-protocol detail, or new credential found anywhere in this batch. The
# `TBIIUpdate_V0602.zip` and `TBIIUpdate_V0602 (1).zip` files are confirmed byte-identical
# duplicates (md5-verified). Still not buildable for the same reason stated below.
#
# FOLLOW-UP 2026-09-15/16 (a NEWER CPC module version, `TBIIUpdate_SICAM_AK3_CP-2016_CP-2019_
# V0604_2511.zip`, containing `20162406.04` -- CPCX26 firmware V06.04, 2025-06-04, vs. the older
