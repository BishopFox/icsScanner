#
# FOLLOW-UP 2026-09-16 (`TBIIUpdate_SICAM_A8000_CP-8030_CP-8031_CP-8050_V2620_2607.zip`, 217MB --
# a DIFFERENT, newer SICAM A8000 hardware sub-family than AK3's own CP-2016/CP-2019, but the same
# broader SICAM RTU/TOOLBOX II ecosystem, worth cross-referencing here rather than a separate file):
# used the sibling `Content_...xlsx` module catalog to identify and extract this hardware's own
# "Central Processing/Communication" module -- `CPCI85` (SC8-085-1), module code `80852426.20`,
# 77MB (vs. ~4-5MB for the AK3/older-A8000 CPC modules -- a real, order-of-magnitude size jump).
#
# **Genuine, substantial new finding: this hardware generation runs a full, named embedded Linux
# platform, "SICORE"**, not the older bare-RTOS style firmware. Unpacked cleanly (zlib -> real GNU
# tar archive, confirmed via `file`) into 6 named components: `SICORE-KERNEL`, `SICORE-ROOTFS`,
# `SICORE-HARDWARE`, `SICORE-SYSTEM`, `SICORE-FILES`, and the actual RTU application
# `RTUM85-2620`. This is the clearest evidence yet that Siemens's current-generation SICAM A8000
# RTUs (at least the CP-8030/8031/8050 family) have moved to a real, modern, modular embedded
# Linux OS -- a materially different architecture from AK3's own CP-2016/CP-2019 hardware.
#
# **Real, additional evidence this generation may have moved AWAY from AK3's own "no password"
# design entirely**: the module's bundled `.ARF` parameter-name catalog (read directly, not
# guessed) includes `iec_INT32R_rbac_web_sess.ARF` and `iec_INT32R_cpci85_rbac_gleich_sess.ARF` --
# literal "RBAC" (Role-Based Access Control) parameter names, one explicitly tied to "web_sess"
# (a web-interface session counter). This confirms the CP-8030/8031/8050 generation has a REAL
# RBAC-gated web interface, a fundamentally different access-control model than AK3's documented
# "Administrator (no password set)" -- this candidate's own finding may be specific to older/
# legacy AK3 hardware, not representative of Siemens's current SICAM RTU lineup as a whole. Also
# confirmed real IPsec/IKE VPN support via the same catalog (`ipsec_zeit`/`ipsec_datenmenge`/
# `ike_zeit` parameter names, ×8 tunnel instances) -- another real security feature not present in
# the AK3-generation hardware reviewed so far.
#
# **Blocked at genuine, comprehensive encryption -- could not verify the RBAC scheme itself.** All
# 6 SICORE components (including ROOTFS, which would otherwise be the single highest-value target
# in this whole SICAM/SIPROTEC research thread -- a real Linux filesystem) are wrapped identically
# as `<name>.ipk.enc` (entropy 7.997, no header structure -- genuine encryption, not unusual
# compression) + a paired `<name>.ipk.key` (exactly 256 bytes / 2048 bits, high entropy -- shape-
# consistent with an RSA-2048-wrapped symmetric key). This is the SAME `.ipk.enc`/`.ipk.key`
# scheme already seen on `DCM00_25.30.2_ARM32V7.zip` earlier in this same ingest batch -- now
# confirmed as a real, comprehensive, cross-product Siemens firmware-encryption architecture for
# this "SICORE" platform generation, not a one-off. No decryption attempted, matching this
# project's standing practice. The module's own `syel2.sql` catalog (same TOOLBOX II format as
# every other module in this whole candidate's history) was also checked directly for RBAC
# default-role/credential values -- none found, same catalog-metadata-only disposition as always.
#
# Net: does not resolve THIS candidate's own AK3 blocker (different hardware), but is valuable,
# durable context for the broader SICAM RTU family and a real architectural finding (SICORE
# platform + RBAC + IPsec + comprehensive encryption) worth having on record.
#
# FOLLOW-UP 2026-09-16 (independent research sweep, per user's own manual USB-connection test):
# the user reported manually testing SICAM AK3 reachability and observing it may require a USB
