# THE FILE bundles a real, complete embedded-Linux USB recovery/update key: `vmlinuz` (a real
# Linux kernel), `startup_script`, and `usb-rootfs.img` — a plain, UNENCRYPTED SquashFS filesystem
# (confirmed directly via `file`: "Squashfs filesystem, little endian, version 4.0, zlib
# compressed", 148MB, 9151 inodes) — extracted directly with `unsquashfs`, no decryption needed.
#
# THE FINDING, confirmed directly, not inferred, and — unlike most empty-root-password findings
# in this sweep — CONCLUSIVELY UNMITIGATED, not just theoretically present:
#   1. `/etc/shadow`: `root::17799:0:99999:7:::` — the password field is LITERALLY EMPTY. Every
#      other account in the same file (daemon, sshd, messagebus, systemd-journal-gateway,
#      systemd-timesync) correctly uses `*` or `!` to mean "cannot log in with a password"; root
#      is the ONE account this system deliberately leaves blank.
#   2. `sshd` IS enabled by default: real `S09sshd` runlevel symlinks confirmed directly in BOTH
#      `/etc/rc2.d/` and `/etc/rc5.d/` (a classic sysvinit rootfs, not systemd — different init
#      system from the Busch-Jaeger/free@home product family elsewhere in this sweep).
#   3. `/etc/ssh/sshd_config` (read directly) contains, UNCOMMENTED:
#        PermitRootLogin yes
#        PermitEmptyPasswords yes
#      Both are EXPLICIT, DELIBERATE overrides of OpenSSH's own secure defaults (which would
#      otherwise be "prohibit-password" and "no" respectively) — this is not a case of a setting
#      merely being left at a permissive compiled default; someone actively configured this
#      device to accept blank-password root logins over the network. `PasswordAuthentication`
#      itself is left commented (falls back to OpenSSH's own compiled default of "yes", which is
#      sufficient on its own, and made explicit and unambiguous here by `PermitEmptyPasswords yes`
#      specifically overriding what would otherwise block a blank password even with
#      PasswordAuthentication enabled).
#   A second, alternate config file also ships in the same image, `sshd_config_readonly`, where
#   the same three directives are ALL commented out (falling back to secure OpenSSH compiled
#   defaults) — this project did NOT determine which of the two config files is actually the one
#   in effect on a real deployed device (e.g. selected by the `startup_script` based on a runtime
#   mode switch) — a real, stated gap, not glossed over. The ACTIVE `sshd_config` (not the
#   `_readonly` variant) is the one with the insecure settings, so this is reported based on that
#   file's content specifically.
#
# NET EFFECT: unlike the DBSS_111x/panel43/SysAP/SysAP2 findings elsewhere in this sweep (all of
# which share this exact "empty root password" trait but have SSH/Telnet confirmed BLOCKED by
# default), THIS system's SSH service is both enabled by default AND explicitly configured to
# accept the empty root password — a fully unmitigated, directly network-exploitable
# unauthenticated-root-access finding, if `sshd_config` (not `sshd_config_readonly`) is the one
# actually loaded on a real running device.
#
# NOT YET BUILDABLE: this project has no fingerprint precondition for this specific ABB "M10"/
# H2Scan/COMe-mBTi10 system, and which of the two shipped sshd_config variants is actually active
