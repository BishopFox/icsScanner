# Candidate stub — 2026-09-16. Competitor-vendor CVE/known-exploit sweep. Confirmed no prior
# Johnson Controls candidate/check existed anywhere in this project before writing this file.
#
# THE FINDING, confirmed directly from Johnson Controls's own official documentation ("Default
# password - Metasys - LIT-12013762", fetched and read directly via WebFetch, not a search
# summary): the "Local Controller Display" — a physical LCD+keypad hardware module (part numbers
# M4-DLK0350-0, M4-SNC16121/16122/25151/25152-series, M4-CGE09090-0H, M4-CGM09090-0H) mounted on
# Metasys field controllers — ships with a DERIVED (not fixed) default password:
#     "the default password is CHGxxxx where xxxx is the last four digits of the MAC Address of
#     the IP controller that the DLK is connected to. When you connect to an MS/TP or N2 device,
#     the default password is CHGxxxx where xxxx is the controller's address."
# Worked example given directly in the source: address 10 -> password CHG0010. A second WebFetch
# (of the guide's own overview page) confirmed this is a genuinely PHYSICAL interface — "a field
# device featuring a display keypad... hands-on, local interaction," explicitly "accessible at the
# controller's physical location without requiring network connectivity" — not a network/web
# service of any kind.
#
# WHY THIS IS `protocol: local-only`, NOT a network check: there is no network service to connect
# to — the same shape as this project's existing Trane UC800/GE Multilin/SICAM FCM/SICAM AK3
# local-panel-passcode candidates, filed the same way.
#
# COMPANION SCRIPT, per explicit user request: `scripts/jci_metasys_local_display_password.py`
# computes the candidate CHGxxxx password from either a MAC address (IP-connected controllers) or
# a decimal MS/TP/N2 address (serial-connected controllers) — the same "derived/computed rather
# than static" routing this project already established for
# `scripts/mac_derived_password.py`/`scripts/rt1_sitemanager_mac_password.py`. UNLIKE those two
# siblings, this script has no `--try` mode at all: there is no live network login to attempt —
# it is purely a calculator for someone physically present at the device's keypad. Both derivation
# paths verified directly against the source's own worked example (address 10 -> CHG0010).
#
# HONEST SCOPE NOTE: this candidate is DISTINCT from the larger Metasys ADS/ADX/NAE/SMP-level
# authentication system (the "MetasysSysAgent" account and related CVE-2019-7594 hardcoded RC2
# key, CVE-2014-5427 password-hash disclosure, CVE-2021-36200 user enumeration, CVE-2023-4486
# unauthenticated DoS — all network-facing, all checked this pass) — that account's own default
# password is explicitly withheld even in Johnson Controls's own documentation ("contact your
# local Johnson Controls representative"), so it remains NOT buildable, unlike this local-display
# finding. Not filed as a separate candidate this pass since no further research was done on it
# beyond confirming the password itself isn't published anywhere checked.

