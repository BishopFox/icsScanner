description: >
  The Mielta M5 cellular GPS/asset tracker's firmware contains a password-gated command console
  (changepwd/get/set/default/serupdate, confirmed via the firmware's own embedded help text and
  "Access denied" auth-gate strings) with a candidate factory-default password ("12345") found
  positioned as a default-configuration value alongside a real default server IP address. The
  device's SMS capability (AT+CMGR/AT+CMGS) alongside a cellular modem in active use suggests
  this interface may be reachable via inbound SMS to the device's own phone number, not just a
  local console — a genuinely remote attack surface if confirmed, with no RF-range restriction.
  Not independently confirmed via disassembly of the actual command parser. Architecturally out
  of scope for this project (no SMS/cellular-modem capability exists in this codebase, same
  disposition as the SIMATIC FDE Gateway's Wi-Fi-password finding) — recorded for the record as
  research a human might want to responsibly disclose to Mielta directly.
