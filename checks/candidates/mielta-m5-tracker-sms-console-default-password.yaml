# Candidate stub — 2026-09-14. User supplied 8 Mielta firmware files (a Russian manufacturer of
# cellular-connected asset-tracking/telemetry hardware — GPS/cellular trackers, BLE-RS485
# bridges, agricultural sensor probes). New vendor for this project. NOT executable (no `kind`).
# Confirmed no prior Mielta candidate/check existed before writing this file.
#
# TARGET: `firmware50295.bin`, confirmed a "Mielta M5" cellular GPS/asset tracker (a SIM900-
# module-based device — genuine, unencrypted ARM firmware, string-extracted directly, no
# disassembly needed for this finding).
#
# THE FINDING, confirmed by direct string extraction — a real command-line/console interface is
# baked into the firmware, with its own help text:
#   help: Lists all the registered commands
#   changepwd {old_pwd} {new_pwd} {new_pwd} <TAB>Password changing.
#   get {param_name} <TAB>Get tracker parameters.
#   set {param_name} [{value}] <TAB>Set tracker parameters.
#   default <TAB>Reset configuration to factory settings.
#   serupdate <TAB>Update firmware from server.
#   restore / write <TAB>Read/write configuration to/from FLASH memory.
#   ...
# Also present, confirming a real auth GATE exists before these commands run:
#   "Access denied! Log in to enable commands execution"
#   "access denied"
#   "PASSWORD_ERR", "Password is incorrect! Try again.", "Old password is not correct",
#   "New password accepted", "New passwords are not equal", "Incorrect password length"
#
# THE CANDIDATE DEFAULT PASSWORD: the literal ASCII string "12345" sits directly inside what is
# unambiguously a factory-default configuration block — found immediately following a real,
# literal default SERVER IP ADDRESS ("148.251.87.48") in the same null-terminated string
# sequence, itself immediately followed by a blank/zeroed placeholder field
# ("000000000000000") and an IP-format string ("%d.%d.%d.%d") used elsewhere for display. This
# byte-for-byte layout (server address, then a short numeric value, then a blank ID placeholder)
# is exactly the shape of a factory-default parameter table, not incidental — but this is
# CONTEXTUAL INFERENCE from the binary's data layout, not a disassembled read of the password-
# check code itself, and is reported at that confidence level, not higher.
#
# REACHABILITY — the genuinely novel and most important part of this finding: `AT+CMGR`/`AT+CMGS`
# (SMS read/send) are present in the same firmware, and the device is a cellular-modem-equipped
# tracker (APN string "internet.beeline.ru", a real Russian carrier, confirms live cellular
# connectivity is the normal operating mode). This STRONGLY SUGGESTS the same command
# interface (`changepwd`/`get`/`set`/`default`, gated by the same password) is reachable via
# INBOUND SMS to the device's own SIM phone number, not just a local UART/serial console — but
# the EXACT SMS command syntax (e.g., whether the password is the first token of the message,
# a separate "login" step, etc.) was NOT independently confirmed from a disassembled command
# parser this pass — inferred from the presence of both interfaces in the same firmware image,
# not read directly off the SMS-parsing code path.
#
# WHY THIS IS ARCHITECTURALLY OUT OF SCOPE FOR THIS PROJECT, not just "not yet buildable": if the
# SMS-reachability inference above is correct, this is a REMOTELY EXPLOITABLE default-credential
# vulnerability reachable from anywhere in the world with only the device's phone number — no
# RF-range restriction the way the SIMATIC FDE Gateway's Wi-Fi password finding had. But this
# project's entire architecture (Target/Check abstraction, every protocol probe, every executor)
# is built around TCP/IP reachability — there is no cellular-modem/SMS-sending capability
# anywhere in this codebase, and building one would be a materially different, much larger
# capability than anything this project currently does (matches the Wi-Fi-password precedent's
# own "not testable by this project, which has no 802.11/RF capability" disposition, same
# reasoning applied to cellular/SMS instead of Wi-Fi). Recorded here for the record — this is
# real, well-sourced research a human might reasonably want to responsibly disclose to Mielta
# directly, even though icsScanner itself can never test for it.
#
# Scope note: the other 7 Mielta files supplied were reviewed but not pursued to this depth —
# M1/M7 (3.1.0.075, 2021) are largely MediaTek cellular-modem baseband firmware (AT-command
# string tables, MediaTek's own EPO/assisted-GPS download URL) with Mielta-specific
# phone-pairing log strings but no comparable password-gated command interface found;
# MIELTA_HARVEST_FW and Mielta_BLE_RS485_Converter are genuine unencrypted ARM firmware with no
# comparable finding; Firmware_2.3.3_20052022.bin and MIELTA_KATANA_ZOND_Firmware_v.1.2.39.bin
# are genuinely encrypted (entropy ~7.97-7.99 across the full file, past a tiny plaintext
# version-string header for KATANA_ZOND) — not pursued, same standing practice as SCALANCE S615.

