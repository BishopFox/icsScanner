# Field Reference entry — 2026-10-05. From the Honeywell ingest firmware-sidecar sweep
# (project_open_tasks -151/-152). Filed as a `physical_access_reference` / `protocol: local-only`
# candidate so it surfaces in the web UI's Field Reference tab, matching the existing local-panel-
# passcode pattern (Avocent AlterPath PM loopback-reset, Trane UC800, SICAM FCM/AK3, Eaton
# PXR20D/DA1/DC1). No runtime probing code reads this field -- it is read-only reference data.
#
# THE FINDING: RAE Systems (now Honeywell) portable gas monitors ship with a factory-default
# programming / technician-mode password of "0000". This PIN gates the device's TECHNICIAN
# (programming / calibration / configuration) menu on the unit's own LCD+keypad -- the level used
# to change sensor spans, alarm set-points, datalog and config -- distinct from normal user
# (monitoring) operation, which needs no password.
#
# EVIDENCE: default "0000" read directly from shipped firmware in this ingest --
#   - QRAE (PGM-2000): qrae-firmware.zip -- "Enter Password=  0000", "Confirm new password= 0000",
#     "Change Password?", "Wrong Password!"
#   - QRAE Plus V2.10: qrae-plus-v-2-10-firmware.zip (QRAE+(PGM2000)_V210_Eng&Sp), bilingual --
#     "Enter Password=  0000" / "Ingresar Clave = 0000".
#   QRAE3 and the other RAE handhelds in the ingest (MiniRAE/ppbRAE 3000, MultiRAE, ToxiRAE Pro,
#   UltraRAE 3000, VRAE) use the same documented "0000" default per the product manuals, but their
#   firmware here is signed/packed and the PIN string was NOT independently read from those images
#   -- stated honestly rather than claimed as firmware-confirmed.
#
# WHY LOCAL-ONLY / NOT A NETWORK CHECK: these are standalone handheld monitors. "0000" is entered on
# the device's own buttons to unlock the local programming menu -- there is no IP/TCP/UDP service,
# web UI, or remote protocol that accepts it, so an IP scanner has nothing to probe. Publicly
# documented in the RAE/Honeywell user guides (a known default, not a discovered secret) -> no CVE,
# none warranted; disclosure_status:public. Full technician write-up in
# lab-notes/rae-handheld-technician-default-pin-0000.md.
#
# HARDENING (the reference's point): change the programming password from "0000" so only authorized
# technicians can alter sensor calibration / alarm set-points -- altered set-points on a gas monitor
# are a real safety concern.

