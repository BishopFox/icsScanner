#
# LOGIN WIRE FORMAT (fully known from Login.php + initc.js — no guessing):
#   1. GET /lxi/Account/Login.php -> hidden form fields OldSalt (per-unit salt) + Nonce (per-session).
#   2. storedHash = hex( SHA256( OldSalt + ":" + "Keysight" ) )          # == PASSWORD_HASH at factory
#   3. resp      = SHA256( Nonce + ":" + storedHash )                    # 32 raw bytes
#   4. POST to Login.php: Password2 = base64(resp), Nonce = <nonce>, Password = (anything non-empty).
#      Server: ConvertBase64EncodedPasswordToPasswordHash(Password2)=UPPER(hex(base64_decode)), then
#      ValidatePassword() compares (strcasecmp, case-insensitive) to UPPER(SHA256(Nonce ":" storedHash)).
#   SUCCESS = authenticated session (no "The password is incorrect." error). The check reads the LIVE
#   salt+nonce off the page, so it works whether or not the salt was regenerated — it authenticates
#   iff the unit still has the default "Keysight" password.
#
# SCOPE: the keysight-lxid PHP web framework is shared across modern Keysight LXI instruments
# (Truevolt 3446xA DMMs here; DAQ970A and other current LXI gear use the same keysight-lxid) —
# Index.php templates InstrumentName, confirming shared code. So this is the MODERN Keysight LXI
# default web password, family-wide.
#
