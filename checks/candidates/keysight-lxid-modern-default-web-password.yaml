#   LXI_DB_ITEM_PASSWORD_HASH_DEFAULT    = D15D06B97E0688AD6D16DD7ED54D8FC432B22F40674B48B6E66CE3BE4D54D53A
# The hashing scheme (var/www/lxi/js/initc.js + utils/AccountUtils.php): storedHash =
# SHA256( salt + ":" + password ). Brute-matched the factory default hash:
#   SHA256("96139424-b55b-4e11-a09e-bd611a80bbd5:Keysight") == D15D06B9…4D54D53A
# => the modern Keysight LXI factory default web password is **"Keysight"** (capital K), enabled by
