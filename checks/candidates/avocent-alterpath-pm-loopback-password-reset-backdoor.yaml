# Candidate stub — 2026-09-19, UPDATED same day after user asked to discuss this finding further.
# New-vendor ingest triage (Avocent/Liebert/Geist/Emerson-RPC/DSView batch, user-supplied). Filed
# separately from `candidates/avocent-pm-head-unit-hardcoded-root-admin-passwords.yaml` -- that
# candidate covers a different, later, embedded-Linux Avocent "PM" product line; this one covers
# an older, distinct, non-Linux "AlterPath PM" platform (8051, not Linux).
#
# THE FINDING: `fl0542002.bin`, `fl0542003.bin`, and `FL0542-004.bin` (all user-supplied ingest)
# are firmware for Avocent's "AlterPath PM" rack-PDU family. Product identity confirmed via
# `fl0583001.pkg` (gzip->tar), which bundles `fw.properties` naming the exact affected models --
# PM8-10A/15A/20A, PM10-10A/15A/16A/20A/30A, PM20-16A/20A/30A -- firmware V1.9.1, dated 2007-05-02.
# All three standalone .bin files contain the literal ASCII string (confirmed at file offset
# 0x38a2 in the firmware binary):
#   "Loopback detected. Changing administrator password to default."
#
# UPDATE, same day: initially filed with the actual reset password value NOT recovered (would have
# required 8051 disassembly). Resolved without disassembly by finding Avocent's OWN official
# "AlterPath PM Installation, Administration, and User's Guide" (v1.60 edition, a legitimate
# archival mirror of Avocent/Cyclades documentation, independently fetched and read directly with
# pdftotext -- not trusted from a search engine's paraphrase). The manual's "Resetting the Admin
# Password" procedure (page 37) is a fully DOCUMENTED, VENDOR-SANCTIONED recovery mechanism, not a
# hidden backdoor:
#   1. Connect the RJ-45 loopback connector SHIPPED IN THE BOX WITH THE PRODUCT (part number
#      CON0132, listed in the manual's own shipping-contents table) to the unit's OUT port.
#   2. Wait one minute. The console prints, verbatim: "[ALTERPATH PM]: Loopback detected. Changing
#      administrator password to default." -- an EXACT match to the string found in our firmware
#      binary, confirming this is the same documented mechanism, not a coincidental similar string.
#   3. Remove the loopback connector. "Now the password for the user admin is reset to the default
#      (pm8)" -- quoted directly from the manual.
#   4. If daisy-chained, repeat per-unit.
# The manual reviewed is the v1.60 edition (our firmware is the later v1.9.1) -- the console
# message string is byte-identical between the two, strongly indicating the mechanism and default
# value carried forward unchanged, but this is an inference from the matching string, not an
# independent v1.9.1-specific manual confirmation (no v1.9.1 manual was found; the copy bundled
# inside fl0583001.pkg itself is a placeholder, "Manual Not Available" / "Release notes not
# available" -- worth noting that Avocent's own shipped firmware package did NOT include real
# documentation of its own reset mechanism, even though it exists publicly elsewhere).
#
# REVISED SEVERITY ASSESSMENT: this is a REAL, still-worth-tracking finding, but a substantially
# LOWER-severity one than an undisclosed backdoor would be, precisely because it's documented and
# requires PHYSICAL possession of/access to the unit's OUT port (a $-cheap loopback connector or
# even a bent wire could substitute, but the attacker still needs hands-on physical access, not a
# network path). The security-relevant angle worth keeping is: (a) the reset password is a FIXED,
# PUBLICLY DOCUMENTED, non-randomized value ("pm8") -- a physical attacker with ~1 minute of
# unsupervised access gets guaranteed admin access regardless of whatever password the operator
# configured, and (b) the "daisy chain" note means one loopback cable can walk an attacker through
# an entire chain of these PDUs one at a time. This is the same general risk class as "console port
# = game over" on many embedded/networking devices, not a novel network-remote vulnerability.
#
# SEVERITY: CVSS v3.1 scored with the `cvss` Python package (installed this session):
#   Vector: CVSS:3.1/AV:P/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
#   Base Score: 6.8 (MEDIUM) -- AV:P (physical) because the vendor's own documentation confirms
#   this requires hands-on access to the unit's OUT port, not network reachability. Previously
#   left unscored pending exactly this confirmation.
#
# NOT BUILDABLE AS A LIVE NETWORK CHECK -- this is a physical-access mechanism, not something a
# network scanner can trigger or detect remotely (there is no network-observable signal at all;
# the mechanism operates entirely over the unit's serial OUT port). NOT a responsible-disclosure
# candidate in the usual sense -- Avocent already publishes this as intended, documented recovery
# functionality, not a secret a vendor needs to be told about. disclosure_status set to `public`
# accordingly. Filed as `protocol: local-only` with a `physical_access_reference` block, matching
# this project's existing local-panel-passcode pattern (Trane UC800, SICAM FCM/AK3, the Eaton
# PXR20D/DA1/DC1 candidate) -- read-only reference data for the web UI's Field Reference tab, no
# runtime probing code reads this field.

check_id: candidate-avocent-alterpath-pm-loopback-password-reset-backdoor
protocol: local-only
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Avocent (Vertiv) / Cyclades"
  product: "AlterPath PM8/PM10/PM20 (Cyclades PM IPDU) rack PDU family (firmware V1.9.1, 2007-05-02; documented mechanism confirmed against the V1.60 manual edition)"
references:
  - "User-supplied ingest: fl0542002.bin, fl0542003.bin, FL0542-004.bin, fl0583001.pkg (bundled fw.properties confirms exact models + firmware version), string confirmed at offset 0x38a2 in the firmware binary"
  - "Avocent 'AlterPath PM Installation, Administration, and User's Guide', V_160 edition, 'Resetting the Admin Password' section (p.37) -- archival mirror at mirrors.develooper.com/cyclades/alterpath/pm/doc/V_160/pm_install_admin_user_160_081005.pdf, fetched and read directly with pdftotext, not trusted from a search summary"
physical_access_reference:
  summary: "AlterPath PM8/PM10/PM20 rack PDUs ship an RJ-45 loopback connector (P/N CON0132) that, when plugged into the unit's OUT port for one minute, resets the admin password to the fixed, publicly-documented default \"pm8\" -- confirmed directly in Avocent's own official manual, console-message text byte-identical to a string found in the real firmware."
  steps:
    - "Connect the loopback connector shipped with the unit to its OUT port (disconnect any existing cable there first)."
    - "Wait one minute. The console prints: \"Loopback detected. Changing administrator password to default.\", then \"Please remove the loopback cable now.\""
    - "Remove the loopback connector. Log in as admin using the default password \"pm8\"."
    - "If units are daisy-chained, repeat this procedure on each unit in the chain individually."
description: >
  Avocent's "AlterPath PM" rack-PDU family (PM8/PM10/PM20 series) ships a DOCUMENTED, vendor-
  sanctioned admin-password-reset mechanism: connecting the RJ-45 loopback connector shipped with
  the unit to its OUT port for one minute resets the admin password to a fixed, publicly-documented
  default, "pm8" -- confirmed directly from Avocent's own official manual (V1.60 edition), whose
  console-message text is byte-identical to a string found in the actual firmware binary (V1.9.1),
  confirming the same mechanism. This is a real, guaranteed, no-authentication-required admin
  compromise for anyone with brief physical access to the unit's OUT port (documented to work
  per-unit down an entire daisy chain), but is NOT remotely/network exploitable -- CVSS 3.1:
  AV:P/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H = 6.8 MEDIUM. No CVE exists or is expected -- this is
  vendor-documented intended functionality, not an undisclosed vulnerability, hence
  disclosure_status:public. Not buildable as a network-reachable check (no network-observable
  signal exists for a purely physical, serial-port mechanism).
