# Candidate stub — DELIBERATELY kept as a candidate (kind: absent), not promoted to an active
# check. See lab-notes/side-quests.md's "Live-derived-credential executor capability" entry and
# 01-METHODOLOGY-AND-CHECKLISTS.md's "Scanner check vs. standalone script" section (2026-08-25):
# this is the "derived/computed rather than static" trigger — the Administrator password is
# computed from the target's own live-observed MAC address, which doesn't fit this project's
# static `params.credentials` model. Built as a standalone tool instead:
# scripts/mac_derived_password.py.
#
# detection_hints: filled in anyway, same reasoning as the P3 debug-password candidate — a
# detection is safe to generate and ship even though the active probing logic lives outside
# icsScanner's own registry.
#
# No CVE — documented factory-default behavior (a design choice, not a disclosed vulnerability),
# same class as the sibling checks/http/schneider-powerlogic-pm5500-series-*.yaml checks.

check_id: candidate-schneider-pm5500-mac-derived-admin-password
protocol: http
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Schneider Electric"
detection_hints:
  transport: tcp
  app_protocol: http
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No single fixed probe exists here — unlike every other check in this project, this credential is DERIVED per-target from the device's own MAC address (see scripts/mac_derived_password.py), so there is no one specific value a narrow signature could name. Honest absence, for a different reason than the usual empty-broad case (e.g. the Beckwith M-3425A check): here it's narrow that's structurally inapplicable, not broad."
    patterns: []
  broad:
    description: "Any HTTP Basic Auth login attempt with username 'Administrator' and a 12-hex-character password — the shape a MAC-derived password always takes (colons stripped, uppercased), regardless of which specific MAC/device it was computed from. Verified directly by computing the real base64 encoding for multiple sample MAC-derived passwords and confirming the shared prefix, not assumed."
    patterns:
      - context: request
        regex: "Authorization: Basic QWRtaW5pc3RyYXRvcj[A-Za-z0-9+/]{16,18}={0,2}"
references:
  - "https://productinfo.se.com/pm5500/595e2aa946e0fb0001f715da/PM5500%20user%20manual/English/PM5500SeriesUserManualv02_0000044889.ditamap/$/C_DefaultPasswordsAndUserAccounts_0000387599"
description: >
  Schneider Electric PowerLogic PM5500/PM5600/PM5700 series power meters (current firmware) ship
  with a factory-default Administrator account whose password is computed directly from the
  meter's own MAC address (colons removed, uppercased) — e.g. MAC 00:80:f4:02:14:38 -> password
  0080F4021438. Documented directly in Schneider's own official user manual. Not an active
  icsScanner check — see scripts/mac_derived_password.py for the standalone tool, and the
  "Scanner check vs. standalone script" note above for why.
