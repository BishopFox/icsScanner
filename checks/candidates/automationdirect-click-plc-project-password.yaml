description: >
  AutomationDirect CLICK PLUS/CLICK Ethernet PLCs (firmware v3.0+) ship with a factory-default
  admin/click project-transfer password, confirmed directly in AutomationDirect's own help
  documentation. Genuine default-credential finding, but gated behind a proprietary
  programming-protocol handshake (not HTTP/Telnet/FTP) that hasn't been reverse-engineered here
  — the only real security-research tool found for this PLC family (cutaway-security/
  click-plc-scanner) is explicitly read-only recon over Modbus/ENIP, not an implementation of
