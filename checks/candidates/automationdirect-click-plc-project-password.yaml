# Candidate stub — Phase 18 (PLC Direct/AutomationDirect), the first MANUALLY-researched vendor
# in this sweep (not sourced from SCADAPASS, which was fully closed out in Phase 17 — see
# `lab-notes/side-quests.md`'s "Manual (non-SCADAPASS) vendor research pass" entry, prompted
# directly by a user question about whether PLC Direct had been swept). NOT executable (no
# `kind`). STRONGEST lead from this phase — a genuine default-credential finding, but blocked on
# non-standard-protocol reverse-engineering, not a research gap in the credential itself.
#
# CONFIRMED (primary source, fetched directly): AutomationDirect's own official CLICK PLC help
# documentation (cdn.automationdirect.com/static/helpfiles/click/Content/279.htm and 280.htm)
# states that, as of firmware v3.0+, CLICK PLUS and CLICK Ethernet PLCs "ship from the factory
# with a default username and password" — username admin (factory-set, cannot be changed),
# password "click". Independently corroborated by a WebSearch converging on the same value.
# Serial-only CLICK CPUs (older C0-0*CPU series) ship with a BLANK password instead — a
# different, also-real default, not folded into this same candidate without separately
# confirming it applies to a network-reachable surface (it doesn't; serial-only by definition).
#
# BLOCKED — non-standard protocol, not a credential-confirmation gap: this password gates
# PROJECT TRANSFER via AutomationDirect's own CLICK programming software, not an HTTP/Telnet/FTP
# login. CLICK PLCs are network-reachable over standard Modbus TCP (502) and EtherNet/IP CIP
# (44818) for I/O access — confirmed via a named security research team's own tool with real
# source code, cutaway-security/click-plc-scanner (fetched directly) — but that tool is
# explicitly READ-ONLY reconnaissance (register/coil reads, device-identity extraction) and does
# NOT implement or test the password/project-transfer mechanism at all. Modbus itself has no
# authentication concept whatsoever, so the "click" password must be enforced by a
# CLICK-specific extension on top of (or alongside) the standard protocol — the exact wire
# format for that specific mechanism was not found in this pass. Needs either the actual CLICK
# programming-software wire protocol reverse-engineered (same rigor bar as PCOM/TCP,
# Phase 1.5) or a named security team's tool that specifically implements the password check
# (not just read-only recon) before this becomes buildable.

