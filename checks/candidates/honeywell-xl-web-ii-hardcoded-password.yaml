# Candidate stub — default-credentials sweep, Phase 4 (Honeywell), CORRECTED 2026-08-15 after
# new research. NOT executable (no `kind`). Was flagged in the human review queue as "just needs
# an endpoint" — that framing turns out to have been based on an incomplete understanding of the
# vulnerability. It's not a login credential at all, and finding the panel's login endpoint
# (which the user did, via a real named security tool — see below) does NOT resolve this.
#
# ENDPOINT PROGRESS (2026-08-15): the user supplied a real, verified source —
# projectdiscovery/nuclei-templates' `http/exposed-panels/honeywell-xl-web-controller.yaml`
# (a named, actively-maintained open-source security-scanner project, fetched directly and
# confirmed: GET /standard/default.php, matched via the page title "Honeywell XL Web
# Controller", author-verified). This DOES resolve the login-PANEL detection/fingerprinting
# question — useful on its own, a real product-identification endpoint — but does NOT resolve
# the "remad-1234" vulnerability, which is a DIFFERENT thing entirely, clarified by re-reading
# Rupp's advisory with this more specific question in mind:
#
# - "remad-1234" is specifically tied to the controller's "Modem Settings" page, not the main
#   login. It's a hardcoded value used in a CLIENT-SIDE JavaScript comparison
#   (`if ("remad-1234" != sOldPassword)`) that is part of a PASSWORD-CHANGE confirmation flow.
# - The actual vulnerability (per multiple secondary sources corroborating the advisory,
#   including a Threatpost/SecurityAffairs writeup): an unauthenticated attacker can access the
#   relevant JavaScript file directly ("without a valid application session") and, through it,
#   DISCLOSE the real, currently-configured password from system settings — a password-
#   disclosure/access-control bypass, not a static login credential test.
# - The researcher deliberately withholds the exact vulnerable file/URL for this specific
#   mechanism (distinct from the login-panel path the nuclei template gives) "due to ethical
#   reasons" — this remains unresolved even with the login endpoint now known.
#
# RECLASSIFIED: this is now the SAME shape as CVE-2022-2003 (AutomationDirect DirectLOGIC
# password disclosure via crafted message, Phase 18) and the Beresford S7comm bypass (Phase 7)
# — a protocol/access-control-manipulation password-DISCLOSURE vulnerability, wrong vulnerability
# class for this sweep's default-credentials architecture. "remad-1234" was never a value to
# submit at a login form; submitting it as a password would very likely just fail against real
# hardware. NOT buildable as a `basic_auth_default_creds.py` check regardless of endpoint
# knowledge — would need a native check reverse-engineering the actual disclosure mechanism
# (the specific JS file / request that returns the real password), which remains unknown.

check_id: candidate-honeywell-xl-web-ii-hardcoded-password
protocol: http
cve_id: CVE-2017-5140
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Honeywell International"
