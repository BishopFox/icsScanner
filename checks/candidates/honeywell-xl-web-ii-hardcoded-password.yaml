description: >
  Honeywell XL Web II building-automation controllers (XL1000C500 XLWebExe-2-01-00 and prior,
  XLWeb 500 XLWebExe-1-02-08 and prior) — CVE-2017-5140 (password stored in clear text, CWE-522)
  and CVE-2017-5143 (unauthenticated path traversal, CWE-22) per ICSA-17-033-01. The login panel
  itself is now confirmed fingerprintable at GET /standard/default.php (via a verified
  ProjectDiscovery nuclei template), but the specific "remad-1234" finding is a Modem-Settings
  password-DISCLOSURE mechanism via an unauthenticated JavaScript-file access, not a login
  credential — the exact vulnerable file/request for that mechanism remains withheld by the
  researcher. Wrong vulnerability class for this sweep's default-creds architecture even now
  that the login panel's own path is known. Fixed in firmware 3.04.05.05.
