# UPDATE 2026-09-16 (user-supplied ingest — a real cache of ~70 Eaton knowledgehub PDFs, exactly
# the primary-source documents the JS-rendering blocker above couldn't reach): CONFIRMED directly
# from two of those PDFs, read via pdftotext, not a search summary.
#   "E-Series Relay Default Password.pdf": "The factory default password for an E-Series Relay is
#   1234."
#   "How do I reset the password on my E-Series Relay_.pdf": "Pressing the »Ack/Rst« key during
#   cold booting will bring up a reset menu. Select »Reset All Passwords?« and confirm with »Yes«.
#   All passwords will be reset to the defaults 1234." — confirms this is a genuine, still-current
#   vendor-documented default/reset value, not a stale or superseded one.
#
# REACHABILITY: no longer local-only-only — see the MAJOR update immediately below, which
# resolves the "Send Modbus commands" open question in a much bigger way than expected: this whole
# relay platform is a real Ethernet/TCP-IP network device with its own engineering-software
# protocol, not just a Modbus add-on.
#
# UPDATE 2026-09-16 (THIRD Eaton ingest batch — a full ETR-5000 documentation package: quickstart
# guide, troubleshooting guide, full reference/operating manuals, and dedicated SCADA-communication
# docs for DNP3/IEC61850/Modbus/Profibus, all read directly via pdftotext): confirms the "E-Series"
# name in this candidate refers to a whole FAMILY of Eaton protection/control relays --
# EMR/EBR/EDR/EGR/ETR at the -3000/-3MP0/-4000/-5000 tiers (Motor/Bus/?/Generator/Transformer
# relay variants, all sharing the same "E-Series" platform, software (PowerPort-E), and security
# model per the ETR-5000 manual's own "2.4 Security" chapter). This is the SAME "1234" access-
# level-password finding above, now understood in its full, much larger context:
#
#   - "The ETR-5000 is delivered with maximum 'open' settings, i.e. all access restrictions are
#     deactivated" out of the box.
#   - "All access level passwords have the default value »1234«." (matches the finding above,
#     confirmed a second time from a different, richer primary source).
#   - "The connection passwords have an empty text as default (i.e. these are not asked for)."
#     -- a SEPARATE, more severe credential than the 1234 one: these gate the "PowerPort-E"
#     engineering-software connection itself (both a USB "local connection password" and an
#     Ethernet "remote network connection password"), and both default to literally EMPTY.
#   - PowerPort-E access via Ethernet ("PP-E via Eth") is ACTIVE by default (same as via USB) --
#     PowerPort-E access via a "Modbus Tunnel" is the only one OFF by default. The relay has a
#     rear-panel RJ45 Ethernet interface for exactly this purpose, separate from its Modbus-TCP
#     SCADA interface (default port 502, confirmed in the manual).
#   - Reset mechanism confirmed identical to the original finding: "»Ack/Rst« key during a cold
#     restart" resets ALL passwords (both types) back to these same defaults.
#
# WHY STILL NOT BUILDABLE AS A LIVE CHECK, despite this rich detail: PowerPort-E's own wire
# protocol is GENUINELY ENCRYPTED, not just undocumented -- the manual states plainly that "all
# connections between ETR-5000 and PowerPort-E are fully encrypted, using state-of-the-art
# cryptographic algorithms," with Eaton-issued certificates "automatically exchanged when the
# connection is being established" and checked by both sides. This is a real cryptographic
# barrier (mutual-certificate-style), not an "we haven't reverse-engineered it yet" gap -- the
# same class of blocker as the SICORE/.ipk.enc encryption elsewhere in this research thread, not
# the "just need a live capture" class most other Eaton candidates in this thread are blocked by.
# No literal TCP port number for PowerPort-E was found in this pass (only the separate Modbus-TCP
# SCADA port, 502, is documented).
#
# NET EFFECT ON THIS CANDIDATE: reclassified from `protocol: local-only` to `protocol: unknown` --
# this is a real, confirmed, default-enabled NETWORK exposure (not just a front-panel PIN), but the
# specific wire protocol that would need to be spoken to exploit it is encrypted by design. The
# front-panel/HMI access-level-password angle (1234, via direct physical keypad entry) remains a
# genuine LOCAL finding as before; the network angle is documented here for the record as a
# separate, more severe, but currently unbuildable exposure.

