# Candidate stub — second ips.us/store.ips.us document batch (57 files, W1002287-345), 2026-08-28.
# NOT executable (no `kind`). Source: `ingest/W1002325.pdf` (ABB REL300 Relay System Instruction
# Manual, I.L. 40-385.7A, "ABB Network Partner" era — a vintage, likely 1990s, product line).
#
# CONFIRMED, read directly from the manual's Communication Interface section: for remote setting
# changes via INCOM(R)/PONI network communication (SETR="YES"), a user-defined password normally
# gates write access. If that password is lost, cycling the relay's DC power OFF then ON opens a
# 15-minute window during which the password can be changed again using a documented, fixed
# fallback string: literally the word "PASSWORD" (all-caps, the manual's own text: "REL300 allows
# a change of password within the next 15 minutes, by using a default 'PASSWORD'"). This is a real
# vendor-documented backdoor/reset credential, not a guess or an inference from a generic
# "password reset" feature description.
#
# NOT BUILT, two independent reasons:
# 1. PROTOCOL SCOPE: the only remote/network interface described is INCOM(R) (INtegrated
#    COMmunications, a Westinghouse Electric Corp.-trademarked proprietary protocol) via a PONI
#    (Product Operated Network Interface) module, plus local-only RS-232C. No Ethernet/TCP/IP
#    interface of any kind is mentioned anywhere in this manual. INCOM is a legacy serial
#    multidrop network from the Westinghouse/ABB relay era — this project's scanner operates over
#    IP; there is no established IP-to-INCOM gateway mechanism in scope here, matching the same
#    "real credential, wrong transport for this scanner" pattern already logged for CAREL's
#    local-panel-passcode and the Fanox SIA-B USB/RS485-only finding.
# 2. PRECONDITION-GATED: even on a reachable INCOM network, the fallback only activates within 15
#    minutes of a DC power cycle — not a persistent standing credential, so even a hypothetical
#    INCOM-capable check would need to time itself against a power-cycle event it can't control or
#    observe, an awkward fit for this project's stateless request/response check model.
#
# Filed for completeness/documentation value (a real, citable vendor-acknowledged default/backdoor
# credential, useful for a report appendix or an assessor doing a physical/serial engagement on
# legacy ABB switchgear) rather than as a network-scanner buildability candidate.

