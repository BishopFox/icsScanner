# Candidate stub — Siemens deep-dive sweep (2026-09-12). NOT executable (no `kind`). SIPROTEC 4
# BLOCKER TAG (2026-09-22 triage pass): live-hardware-gap -- Two open questions (whether 'System interface: No access' is the Ethernet path, and a second one) need a live device or a dedicated manual passage to resolve.
# protection relays (a huge, still widely-deployed installed base — 7SJ6x/7SK8x/etc. series),
# NOT SIPROTEC 5 (confirmed, separately, that the newer generation has no factory default at
# all — see "Ruled out" note below).
#
# Source: Siemens's own official "SIPROTEC 4, System Description" manual (E50417-H1176-C151-B9,
# Edition 01.2018, cache.industry.siemens.com/dl/files/467/109742467), fetched and read directly
# (pdftotext, not a search summary) — the exact passage appears TWICE in the document (§1.4.6
# overview + §4.6 detail), word-for-word identical both times:
#   "Passwords are numbers with a length of up to 8 digits. At delivery all passwords are set by
#   default to 000000. The passwords for the Web Monitor are an exception: Here the default
#   setting is 000002 for 'Full access', 000001 for 'Changes' and 000000 for 'Read only'."
# Web Monitor is explicitly described as a real HTTP interface: "Via an Internet browser and
# with the help of the Web Monitor you can read out and change data from a SIPROTEC device."
#
# A second, lower-tier source (elec-engg.com, an unattributed technical blog) had already
# claimed the same "000000" figure for SIPROTEC 4 generally — that claim is now independently
# CONFIRMED by the official manual above, rather than trusted on its own (per this project's
# standing "search-summary claims need primary-source corroboration" discipline, sharpened
# earlier in this same sweep by the Siemens "Basisk" S7-300 false-lead lesson).
#
# Real, important nuance found in the SAME manual passage, not glossed over: immediately below
# the password defaults, the manual states the Web Monitor's own default ACCESS-LEVEL settings
# (a separate gate from the password itself): "Operator interface: Read only / Service
# interface: Read only / System interface: No access — You have to change these settings to get
# access to the SIPROTEC device." In SIPROTEC/DIGSI 4 terminology (not independently re-verified
# in THIS pass, but consistent with this device family's general architecture), "System
# interface" is understood to be the Ethernet/substation-automation network port — if that
# understanding is correct, the factory-default "No access" on that specific interface could mean
# the network-reachable path to the Web Monitor is walled off by default REGARDLESS of the
# password value, similar in shape to this sweep's own FloBoss ("not set up as a Modbus server")
# and Danfoss ("HTTP server disabled by default on that product line") negatives elsewhere.
#
# Ruled out, not overlooked: SIPROTEC 5 (the newer generation) was checked directly and
# confirmed to have NO factory default password at all — it uses per-device confirmation IDs
# (222222/333333/444444/666666 defaults) and enforces an operator-assigned, complexity-checked
# connection password from first use. Do not conflate the two generations; this candidate is
# SIPROTEC 4 only.
#
# NOT YET BUILDABLE — two open questions, either of which needs a live device or a second,
# dedicated manual passage to resolve cleanly: (1) whether "System interface: No access" is
# actually the Ethernet/network path (as opposed to, say, a serial/DIGSI-direct-connect service
# port) — get this wrong and the check either never fires on real hardware (safe failure) or,
# worse, is built around a wrong mental model of the access-level gate; (2) the exact HTTP
# mechanism for entering the numeric password (Basic Auth vs. a custom login form) was not shown
# in this manual passage — same open question already flagged for the sibling WinCC Runtime
# Sm@rtServer candidate filed the same session.
#
# Action needed before building: a SIPROTEC 4 Web Monitor-specific manual section (distinct from
# this System Description's general passwords overview) or a live/simulated device capture would
# resolve both the interface-terminology question and the HTTP mechanism in one pass.
#
# FOLLOW-UP 2026-09-15/16 (large new SICAM/SIPROTEC batch): open question #2 above (the exact HTTP
# auth mechanism) is now ANSWERED, from real firmware, not a manual passage. `6MD2340_V04.18.00.zip`
# (a SIPROTEC 4 relay, confirmed product) ships a `.cms` firmware update -- identified this as a
# standard, non-proprietary format: a PKCS#7/CMS SignedData container (`openssl cms -inform DER
# -noverify -verify` parses and verifies it cleanly; NOT encrypted, only signed -- content is
# available in the clear once verified). The extracted payload is a real embedded web server's
# HTML/JS bundle, explicitly titled `<TITLE>EN100</TITLE>` / "EN100-Modul" -- confirming this is
# the SIPROTEC 4 EN100 Ethernet communication module's own web UI (the network-facing hardware
# this candidate needs, not a serial/local-only path). Its `MaintPassword.html` page uses a real
# CUSTOM LOGIN FORM (not HTTP Basic Auth), with the exact algorithm read directly out of the
# bundled `MD5.JS`-referencing inline script:
#     hash = MD5( MD5(password) + challenge )
# where `challenge` is a server-issued nonce delivered in a hidden form field
# (`<input type='hidden' name='Challenge' value='%s'>`) and POSTed back with the computed hash.
# This resolves the "Basic Auth vs. custom form" open question: it's a custom challenge-response
# form POST, not Basic Auth -- a real, useful protocol detail for building this check, though the
# executor question (this project doesn't have an HTML-form-based MD5-challenge-response
# credential-test executor yet) is a new, separate blocker this doesn't resolve.
#
# CORRECTION to this candidate's own "Ruled out" note above: SIPROTEC 5 is NOT entirely free of a
# factory-default password mechanism. `SIP5_ComProt_V11.00_Manual_C055-N_de.pdf` (Siemens's own
# official Communication Protocols handbook, C53000-L1800-C055-N, Ed. 04.2026, read directly)
# documents, in a commissioning/diagnostics walkthrough for enabling IEC 61850 report writes:
# "Geben Sie das Passwort 000000 ein" ("Enter the password 000000") as a literal step to unlock
# write access via IEC 61850 (a real TCP/IP protocol, port 102/MMS). This is a DIFFERENT, narrower
# mechanism than the main HMI/connection password this candidate already ruled out for SIPROTEC 5
# (which does use per-device confirmation IDs, not 000000) -- but it means "no factory default
# password at all" is not quite accurate for SIPROTEC 5's full attack surface. Not independently
# confirmed as network-reachable beyond the protocol's own well-known TCP/IP nature; not pursued
# as its own candidate this pass, flagged here so it isn't lost.

