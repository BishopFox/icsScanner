  SIPROTEC 4 protection relays ship with all passwords factory-set to 000000, with the Web
  Monitor HTTP interface using a distinct set of defaults (000002 Full access / 000001 Changes /
  000000 Read only) — confirmed word-for-word from Siemens's own official System Description
  manual. Not yet buildable: the manual's own default access-level settings ("System interface:
  No access") may wall off network reachability to this interface by default regardless of the
  password, and the exact HTTP auth mechanism for entering the numeric password is unconfirmed.
  SIPROTEC 5 (the newer generation) is confirmed NOT affected — no factory default exists there.
