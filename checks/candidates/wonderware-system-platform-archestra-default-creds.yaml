# BOTH OPEN QUESTIONS RESOLVED 2026-09-22 (firmware-gap sourcing pass), both to a NEGATIVE —
# this candidate is now believed OUT OF SCOPE for this project's active-network-scanner charter,
# not just unbuilt:
#
# 1. CVE-2019-6525 (ICSA-19-029-03): fetched and read the CISA advisory directly this pass (not
#    a search summary). The CVSS vector is explicitly AV:L (local attack vector) and the advisory
#    states plainly "not exploitable remotely" — this is a local-access-only finding, same
#    disposition class as this project's other physical/local-only candidates. Not buildable as a
#    network check by definition, independent of ever learning the exact API endpoint.
#
# 2. The administrator:blank ArchestrA-IDE credential's network-surface question: a targeted
#    search of Wonderware/AVEVA's own technical documentation and support material (archestra.info
#    port reference, AVEVA System Platform Installation Guide, Tech Note 1010 on ArchestrA network
#    account restrictions) confirms Galaxy Repository (GR) — the actual networked component of
#    System Platform, the piece other nodes connect to remotely — authenticates via WINDOWS DOMAIN
#    credentials passed from the connecting client, not a separate ArchestrA-IDE-specific
#    admin:blank login. The same documentation notes the ArchestrA service account is explicitly
#    BLOCKED from interactive/RDP logon by default, reinforcing that this account isn't meant to
#    be reached as a distinct network-facing login at all. This corroborates (does not just leave
#    open) the candidate's own original hypothesis: administrator:blank is a local Windows-
#    application (Archestra IDE) login screen, not a network-facing credential.
