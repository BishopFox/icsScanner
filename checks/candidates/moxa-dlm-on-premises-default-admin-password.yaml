# DIFFERENT EXPOSURE MODEL from every other Moxa finding this session: DLM (Device Lifecycle
# Management) On-Premises is a SERVER SOFTWARE PACKAGE the customer installs themselves (Windows/
# Linux management server, not embedded device firmware) -- `moxa-dlm-on-premises-dlm-agent-mil-
# 3.4-higher-software-package-v1.1.0.zip` is the AGENT installed on managed devices, the server
# itself isn't firmware this project can extract/crack.
#
# THE FINDING, from Moxa's own official "Moxa DLM On-Premises" manual (v1.1, user-supplied,
# fetched/read directly via pdftotext), step 8 of the server installation procedure: "Create a
# default administrator account, the default password is admin@123." -- a literal, vendor-
# documented installer-set credential, not a network-service factory default in the usual sense
# for this project (there is no "factory" for a self-hosted server install) -- the risk model here
# is "the installer sets a known password during setup, and an administrator who doesn't change it
# immediately (per Moxa's own generic post-install security advice, not specifically called out
# for this credential) leaves a known-password admin account reachable on the DLM web console."
#
# NETWORK EXPOSURE: the manual's own next step states the web console is accessed via
# `https://YOUR_FQDN` immediately after this account is created -- i.e. HTTPS, reachable as soon
# as the server installation completes.
#
# NOT YET BUILDABLE AS A LIVE CHECK: the web login wire protocol for the DLM server console was
# not examined this pass (no server software/firmware was available to extract -- this is a
# server-side web application, and only the client-side deployed AGENT package was present in
# this ingest batch, which is a different component entirely, not verified to share any
# credential or protocol with the server console).
#
# UPDATE 2026-09-22 (Moxa re-pass): THE ACTUAL DLM SERVER PACKAGE WAS OBTAINED this pass
# (`moxa-dlm-on-premises-dlm-server-software-package-v1.2.0.zip`, 432MB, fetched directly from
# Moxa's own CDN at moxa.com -- the product page's own "Please sign in" UI gate does not apply to
# the direct file URL, same finding as several other Moxa software products this pass). This is a
# real Debian/Ubuntu 22.04 (jammy) apt package (`dlm_1.2.0-build.88_amd64.deb`) deploying a Docker
# Compose stack (containers: dlm/api, dlm/nginx, dlm/emqx [MQTT broker], dlm/lwm2m, dlm/sqlite,
# dlm/ssh-web-console, dlm/zeus, dlm/host-app, dlm/openssl), running as systemd service `dlmg2`.
#
# MECHANISM NOW PARTIALLY CONFIRMED FROM THE VENDOR'S OWN INSTALLER SCRIPT (not the manual this
# time): the .deb's `postinst` script's "Step 5/6 - Administrator Account Setup" runs
# `docker exec dlm-api bin/init-admin "$admin_email"` -- the password is NOT passed as an
# argument here, so it must be set inside that binary itself. Extracted the `dlm/api` OCI image
# (`opt/moxa/dlm/api/bin/init-admin`, a non-stripped Go ELF binary) and found the literal string
# "admin@123" embedded in its compiled string-constant pool, directly adjacent to what are very
# likely admin-account struct field name constants (e.g. "Firstname" immediately follows it).
# HONESTY NOTE: Go's linker packs many short string literals and reflection field names back-to-
# back with no separator byte, so `strings`-style extraction cannot prove "admin@123" is an
# isolated, unambiguous literal on its own -- this is strong corroborating evidence for the
# manual's claim, not a byte-perfect confirmed constant the way the DA-660/etc. shadow-hash
# crackings were. Confidence in the underlying finding itself is unchanged (still vendor-manual-
# sourced at its core); what's new is independent corroboration from the vendor's own compiled
# binary and a precise, vendor-sourced description of the real account-creation mechanism.
#
# STILL NOT BUILDABLE AS A LIVE CHECK: the actual HTTPS web console login wire protocol (the
# `dlm/nginx` + `dlm/api` REST API's login endpoint/request shape) was not captured this pass --
# that needs a live deployed instance, not just the package contents. Firmware-gap is resolved
# (real server software now in hand); a live-hardware-gap remains for building the check itself.
#
# CORROBORATION 2026-10-01, resolving the earlier honesty caveat about ambiguous Go string-pool
# adjacency: the same DLM server package (`dlm-1.2.0-build.88_amd64.deb`, reviewed this time via
# the firmware-sidecar gated-file queue -- a 432MB docker-image tar bundled inside the .deb that
# the file-count safety guard had refused to fully unpack) was re-examined via a bounded,
# single-file list-then-pull of its static-config env files rather than the init-admin binary's
# string pool. `opt/moxa/dlm/lwm2m/env-files/../static-config/env-files` is templated with
# `${VAR}` placeholders everywhere EXCEPT this one file, `.../lwm2m.env`, which carries plain,
# unambiguous literal key=value pairs:
#     DLM_LOGIN_EMAIL=admin@moxa.com
#     DLM_LOGIN_PASSWORD=admin@123
# This is a byte-perfect plaintext config value, not an adjacency inference -- and it reveals a
# fact the earlier binary-string pass couldn't: the login identifier is the literal email
# "admin@moxa.com", not just an unspecified "admin" username. Both the DLM manual's documented
# password and the init-admin binary's string-pool evidence are now corroborated by a third,
# unambiguous source.

# ALSO FOUND IN THE SAME PASS, documented separately (different services, different attack
# surfaces within the same stack, not this candidate's own scope): the DLM stack's bundled EMQX
# message broker ships its OWN hardcoded dashboard default password, and the bundled LWM2M
# service ships hardcoded default/bootstrap pre-shared keys -- see
# checks/candidates/moxa-dlm-emqx-dashboard-default-password.yaml and
# checks/candidates/moxa-dlm-lwm2m-default-psk-keys.yaml.

