description: >
  GE Multilin protection relays (469 Motor Management Relay, 489 Generator Management Relay,
  750/760 Feeder Management Relay, 850 Feeder Protection System, 869 Motor Protection System,
  and likely others in the same product families) ship with factory default passcode "0" —
  documented across multiple corroborating instruction manuals — which disables the passcode
  security feature entirely for setpoint changes when entered via the front-panel keypad. All 6
  named models also have a real, built network check for the equivalent Modbus-side mechanism
  (see checks/modbus/ge-multilin-*-factory-passcode.yaml) — this entry exists purely for the
  separate local/physical-access workflow, independent of network reachability.
