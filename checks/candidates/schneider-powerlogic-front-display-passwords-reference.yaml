# Candidate/reference stub — 2026-08-25. User supplied Schneider FAQ FA212760 ("What is the
# default front display 'Username and Password' for PowerLogic meters?") directly. NOT
# executable (no `kind`). This is explicitly a reference document, not a per-product research
# gap in the usual sense — see below.
#
# CRITICAL SCOPE NOTE: this FAQ's own "Environment" field states "On-board Password" — this is
# the LOCAL FRONT-PANEL/HMI keypad password, entered directly on the physical meter, not a
# network-reachable login on its own. Out of scope for this project's architecture by itself.
#
# WHY IT'S STILL VALUABLE: on several product lines already built in this sweep, Schneider's own
# documentation states the front-panel password IS REUSED as the "standard security mode" network
# login password (explicitly stated for PM8000 and ION9000: "if standard security is enabled,
# the password is the same as the front display password"). This FAQ's table therefore
# INDEPENDENTLY CORROBORATES 2 already-built checks:
#   - PM5000 Series: 0000 — matches the "Display passcode: 0000 (zero)" already confirmed for
#     PM5500 via FA243273.
#   - PM8000 Series: User1 (Administrator) / User2 (Viewer), password 0 — matches
#     checks/http/schneider-powerlogic-pm8000-default-creds.yaml's existing User1:0/User2:0
#     credentials exactly (3rd independent source for this pair now).
#
# NEW PRODUCT FAMILIES NAMED, NOT BUILT — genuine research gap, not a guess:
#   EM3500 (00000), EM3570 (0010), iEM3000 Series (0010), CM2000/CM2 (unique per-meter, NOT
#   static — same non-static shape as MAC-derived cases, skip entirely), CM3000/CM3 (0000),
#   CM4000/CM4 (0), PM200/PM2 (00000), PM600/PM6 (0), PM700/PM7 (00000), PM800/PM8 (0000),
#   PM2000 Series ("0 or 0000 depends on model" — too ambiguous to ship), HDPM6000 meter (HMI):
#   username USER, password adminpass (the ONLY row with an actual username — the rest are all
#   "None", i.e. password-only, same architecture-mismatch shape already open for EGX200/EGX400/
#   ECC21-CM3000/4000 elsewhere in this sweep).
# For every one of these, TWO separate things are unconfirmed, not just one: (1) whether that
# specific meter model even HAS an Ethernet/webpage interface at all (many of these base models
# are RS-485-only, with Ethernet only added via an optional Ethernet Communication Card sold
# separately — e.g. CM3000/CM4000's OWN webpage login is via the separate ECC21 card, already
# tracked as its own password-only candidate, NOT this front-panel value); (2) if a webpage does
# exist, whether the front-panel value is actually reused there (confirmed pattern for PM8000/
# PM5500/ION9000, but not confirmed for any of these specific smaller/older meter lines).
#
# HDPM6000 UPDATE, 2026-08-25: a separate Schneider FAQ ("Installation and configuration of the
# HDPM6000 meter Head Unit") independently confirms the head unit DOES have its own "Embedded web
# page for configuration and data monitoring" over TCP/IP — a real network surface exists. It
# does NOT state the embedded webpage's own login value, and the "(HMI)" qualifier on the
# front-panel credential (USER/adminpass) suggests that value may be specific to the separate
# physical HMI display accessory, not necessarily the head unit's own webpage. Still not enough
# to build — the actual webpage credential (if different from the HMI's) remains unconfirmed.
#
# Action needed, per model, before any of these becomes a check: confirm (a) Ethernet/webpage
# presence for that specific SKU, and (b) that the standard-security-mode network login actually
# reuses this front-panel value (not assumed just because 3 other product lines do it).

