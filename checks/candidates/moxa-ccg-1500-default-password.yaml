# CCG-1500 candidate/check existed before writing this file.
#
# THE FINDING, confirmed directly from "moxa-ccg-1500-series-manual-v1.3.pdf" (read via
# pdftotext), section "Accessing the Web Interface": the CCG-1500 Series (a 5G-to-Ethernet/serial
# protocol converter for Modbus TCP/RTU communications, i.e. a real SCADA-facing gateway, not just
# a generic PC accessory) ships with a default HTTPS web-UI login at the default IP
# https://192.168.225.1:443:
#     Account: admin
#     Password: moxa
# The manual documents a forced password-change screen on first login using the default
# credentials — so this is the out-of-box default, not a permanent one, but (per this project's
# consistent treatment of "forced change on first use" defaults elsewhere, e.g. Eaton Webcard-M3,
# WinCC Runtime Administrator) still a real, valid finding for any unit received/reset and not yet
# commissioned.
#
# NOT YET BUILDABLE: the exact HTTP wire protocol is unconfirmed. The manual describes an in-page
# login form (Account/Password fields, a "LOG IN" button, and a subsequent in-page password-change
# modal) rather than a browser-native Basic Auth popup -- this looks like a modern JSON-POST-style
# custom login (matching the shape of other recently-built Moxa/Eaton checks that needed a
# `json_post_default_creds`-style module), not raw HTTP Basic Auth. The shipped firmware
# (`moxa-ccg-1500-series-firmware-v1.4.0.rom`) is a genuinely AES/encrypted-zip container per
# `binwalk` (```Zip archive data, encrypted``` wrapping `update.zip`) -- could not extract the
# actual web-UI JS/HTML to confirm the endpoint path or field names. This project's existing
# "don't guess wire format" discipline applies here the same way it did for the Siemens WinCC
# Sm@rtServer candidate.
#
# No CVE — documented factory-default behavior.

