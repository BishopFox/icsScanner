#      iptables 1.8.7, dnsmasq 2.85, curl 7.79.0, etc., consistent with a VPN/firewall security
#      appliance). This is not a surprising negative: Siemens's own proprietary WBM web-UI code
#      has no GPL obligation to appear in a GPL-compliance bundle, so this path was always
#      unlikely to reach the login form — confirmed rather than assumed.
#   4. **Conclusion: this looks like genuine vendor-applied encryption on the firmware payload,
#      not merely an unrecognized/custom compression scheme.** The combination of (a) a
#      security-focused product line with an obvious incentive to protect firmware integrity,
#      (b) a hash/signature-shaped field positioned exactly at the payload boundary, and (c) a
