# Findings:
#   1. **Container format identified, partially.** The S615 firmware `.sfw` file (23,627,440
#      bytes, extracted from the vendor zip, no outer encryption on the zip itself) opens with a
#      plaintext ASCII magic string "SIMATIC NET FIRMWARE UPDATE" followed by a structured,
#      length-prefixed (2-byte tag + 2-byte big-endian length) TLV metadata header, ~880 bytes,
#      confirmed readable via direct hexdump. This header is a genuine, useful, independently-
#      verified finding on its own: it lists this exact package's compatible hardware order
#      numbers, INCLUDING **`6GK5 615-0AA00-2AA2`** and **`6GK5 615-0AA01-2AA2`** (both are real
#      SCALANCE S615 order numbers), alongside sibling SCALANCE M800-family order numbers — this
#      firmware package genuinely targets the S615, confirming the acquisition is the right
#      artifact, not a mistaken product.
#   2. **Payload is high-entropy with zero recognized format signature.** Immediately after the
#      plaintext header (~offset 0x36c) sits a short sub-block containing what is very likely a
#      CRC32 or hash field (`3341f5bd`, tag 0x0016), followed by ~22.5 MB of data that: (a) unblob
#      26.6.4's full signature scan matched to ZERO known chunk types across the entire file
#      (`all_chunks=[]` in its own log — no gzip/xz/lzma/zstd/squashfs/cramfs/jffs2/ubifs/cpio
#      magic found anywhere), and (b) measures Shannon entropy ~99.99% (statistically
#      indistinguishable from random) end to end. No common compressed-firmware magic byte
#      (1f8b/fd377a585a00/28b52ffd/68737173/etc.) appears at the payload's start offset either,
#      checked directly via hexdump.
#   3. **The GPL/OSS-compliance tarball (`M800_S615_T07.01.00_oss.tar.zip`, 860 files, fully
#      listed) contains zero web-server/CGI/HTTP component** — only expected third-party GPL/LGPL
