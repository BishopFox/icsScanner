#   - `ingest/W1001351.pdf` (Doc. 1SDH000532R0002, PR122/P/PR123/P trip units — a newer,
#     communications-capable generation): its own default-settings table lists the SAME value,
#     "25  Password  --  0001" — confirming this is a stable vendor-wide convention across
#     multiple trip-unit generations, not a single-model coincidence.
#
# NETWORK-REACHABILITY ANGLE, the actual open question: `W1001351.pdf`'s section 15.2 documents
# an optional **PR120/D-M "COM" communication module** (optional for PR122/P and PR123/P),
# explicitly described as "Dedicated communication module for connecting the relay to a Modbus
# net, and for remote supervisory and control activities on the circuit breakers" — Modbus RTU
# protocol, RS-485 physical interface, 9600-19200 bps, with its own "Local/remote" menu setting.
# This raises the real question this candidate can't yet answer: is the SAME "0001" EDIT-mode
# password the gate for Modbus-originated setting/control changes, or does the Modbus channel use
# a separate (possibly weaker, possibly absent) access-control mechanism? The manual documents
# the module's existence and its menu parameters (serial address, baud rate, protocol format) but
# does not state how — or whether — password protection extends to that channel specifically.
#
# NOT BUILT, for the same reasons already established for this project's other protection-relay
# candidates:
#   1. Network reachability is RS-485 serial only (Modbus RTU) — no native Ethernet/TCP disclosed
#      anywhere in either manual. Same "needs a third-party Modbus-RTU-to-TCP gateway" caveat as
#      GE Multilin 369/269+ in this project's own sweep.
#   2. The actual security-relevant question (does the Modbus channel enforce the same password,
#      a different one, or none at all) is unanswered — this is not a "guess the default and
#      test it" check, it's an open architecture question requiring either a dedicated PR120/D-M
#      communications reference document or a live/simulated capture, neither attempted this pass.
#   3. Even if reachable, this gates settings changes AND (per the module's own description)
#      circuit-breaker control — the same elevated-caution tier as every other breaker/relay
#      control-plane candidate in this project.
#
# CORROBORATING INDUSTRY CONTEXT, same batch, different vendors — confirms "remote breaker
# control gated by password, default value undisclosed" is a common pattern across this whole
# equipment class, not an ABB-specific quirk:
#   - `ingest/W1001559.pdf` (Cutler-Hammer/Eaton 1150V protective relay, Metal-Enclosed Switchgear
