#
# CONFIRMED, read directly from two ABB SACE Emax installation/service manuals (both "Emax UL
# Listed" low-voltage air circuit breakers, different trip-unit generations):
#   - `ingest/W1001346.pdf` (Doc. RH0109002, PR111-A/PR112-A/PR113-A trip units): factory-default
#     "EDIT" mode password is a 4-digit number, **"0001"** — "the default password is '0001'."
#     Entered via the front-panel keypad; setting it to "0000" disables the password prompt
