#   - `ingest/W1001362.pdf` (GE EntelliGuard trip unit): "A number of the GT Electronic trip unit
#     types can be optioned to allow the Breaker & Trip Unit combination to communicate data
#     bi-directionally through Modbus or Profibus... a password is provided that prevents
#     unauthorized changes through communication or the keypad" — again, no default value stated.
#     Notably this one explicitly confirms the password IS meant to gate BOTH the keypad AND
