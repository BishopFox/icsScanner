description: >
  ICS Electronics 9065 (Ethernet-to-GPIB Gateway) and 9099 (Ethernet-to-Modbus RTU Interface,
  TE9099 variant) ship an embedded control.html page whose "cmd" field relays an arbitrary,
  free-text command to whatever instrument (GPIB) or field device (Modbus RTU) is physically
  attached downstream, submitted via a plain unauthenticated GET to /cgi — confirmed directly from
  the vendor's own shipped HTML source in both official firmware packages. The 9065 also exposes
  unauthenticated GPIB bus-control primitives (Remote Enable, Go To Local, Selected Device Clear,
  Group Execute Trigger). PARTIALLY BUILT 2026-09-14, per explicit user go-ahead:
  checks/http/ics-electronics-9065-9099-gpib-modbus-control-unauthenticated.yaml confirms ONLY
  unauthenticated reachability of the control page, via the page's separate, argument-less "Read"
  button (submitread) — it never sends the "cmd" field or presses "Send" (submitsend), so it
  cannot inject a command into whatever is attached downstream. The full command-relay primitive
  (an actual arbitrary "cmd" via submitsend) remains deliberately NOT built — a materially
  riskier, real command-injection-class action against whatever is physically wired to the
  device, correctly left for its own separate explicit go-ahead. Smoke-tested in
  tests/smoke_test_ics_electronics_gpib_modbus_control.py.
