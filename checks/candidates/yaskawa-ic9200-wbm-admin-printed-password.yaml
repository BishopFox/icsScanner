# Candidate stub — 2026-09-16. Ingest triage of the 67-file Yaskawa document-catalog cluster
# (SIE-/SIEPC/SIEPS document-number-only filenames, part of a much larger Yaskawa CACR/servo/
# motion-controller batch ingested earlier this session). Confirmed no prior Yaskawa iC9200/iCube
# candidate/check existed before writing this file.
#
# THE FINDING, confirmed directly from "SIEPC88090100.txt" ("iC9200 Product Manual", Model:
# JEYRM-MPX02210L32-2, read via pdftotext), section 4.9 "Web-Based Management - WBM":
#
#   "In the delivery state, the CPU has the IP address 192.168.1.1 via Ethernet port (X3/X4)."
#   "On delivery, the following access data are preset with administrator rights:
#      * Username: admin
#      * The password is printed under the front flap on the front of the CPU."
#   "By default user authentication is enabled. On delivery, the 'admin' user is already created
#    with administrator rights." "Use the administrator password printed on the CPU only for the
#    initial login to the WBM."
#
# The WBM (Web-Based Management) interface is HTTPS, self-signed TLS certificate auto-generated
# by the CPU during commissioning ("https://192.168.1.1" is the documented example URL).
#
# WHY THIS IS NOT A GUESSABLE DEFAULT CREDENTIAL, honestly assessed: unlike every other "admin"-
# username finding in this project, the PASSWORD half here is NOT a fixed, shared, or derivable
# value — it's printed uniquely on each physical unit ("under the front flap"), the same general
# shape as a modern consumer router's printed default WiFi password. A remote network scanner has
# no way to guess or derive this value; obtaining it requires physical access to the device
# itself, which would typically already grant more direct access than a network login would.
# Filed as a `physical_access_reference` for documentation/OSINT completeness (confirms the
# default username, default IP, and the mechanism), NOT as a candidate for a guessable-credential
# check — this is a structurally different, weaker finding than this project's usual "admin/admin"
# or "admin/<derived-value>" cases, and should not be conflated with them.
#
# PRODUCT NOTE: "iC9200" / "iCube Engineer" — filed under Yaskawa's own SIEPC document-numbering
# system as a Yaskawa-published manual; whether the underlying CPU/platform is a Yaskawa-original
# design or an OEM/white-labeled "iCube" platform is not resolved from this document alone — not
# pursued further this pass, attributed to Yaskawa as the publishing vendor per this project's
# usual convention.

check_id: candidate-yaskawa-ic9200-wbm-admin-printed-password
protocol: local-only
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Yaskawa"
  product: "iC9200 (iCube Engineer CPU, Model JEYRM-MPX02210L32-2)"
references:
  - "iC9200 Product Manual (SIEPC88090100), section 4.9 Web-Based Management - WBM, user-supplied ingest, read directly via pdftotext"
physical_access_reference:
  summary: "Yaskawa iC9200 CPU modules ship with a default HTTPS Web-Based Management (WBM) login of username 'admin' at the default IP address 192.168.1.1, with the password printed under the front flap on the physical unit — confirmed directly in the vendor's own product manual."
  steps:
    - "Physically access the iC9200 CPU unit and lift the front flap to read the printed administrator password."
    - "Connect to the CPU's default IP address (192.168.1.1, Ethernet port X3/X4) and open https://192.168.1.1 in a browser, accepting the self-signed TLS certificate warning."
    - "Log in with username 'admin' and the printed password."
description: >
  Yaskawa iC9200 CPU modules ship with a default HTTPS Web-Based Management (WBM) administrator
  account (username "admin") enabled by default, reachable at the default IP address 192.168.1.1
  — confirmed directly in the vendor's own product manual. Unlike most default-credential
  findings in this project, the password is NOT a fixed or derivable value: it is printed
  uniquely on each physical unit's front flap, requiring physical access to obtain. Filed as a
  local-only physical_access_reference for documentation completeness, not as a guessable-
  credential network check — a structurally weaker/different finding than this project's usual
  admin/admin or derived-password cases, and not buildable as an automated scanner check.
