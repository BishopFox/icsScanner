# Candidate stub — 6th ips.us/store.ips.us document batch (371 files, W1001711-W1002131 range),
# 2026-08-29. NOT executable (no `kind`). Real feeder protection relay, same review bar as every
# other GE relay candidate in this project.
#
# CONFIRMED, read directly from `ingest/W1002013.pdf` (GEK-105545, GE DFP100 Digital Feeder
# Protection Relay Instruction Book): a 3-tier access model, each with its own disclosed factory-
# default password:
#   - VIEW level (read-only): default password "DFP_VIEW"
#   - CONTROL level (VIEW + breaker operation + remote event/oscillography trigger): default
#     password "DFP_CNTL"
#   - SETTING level (CONTROL + full relay settings, including changing ALL THREE passwords):
#     default password "DFP_SETT"
#   Login uses a `SETACCESS` command over the relay's terminal/communications interface.
#
# CORROBORATED, same batch, independent document: `ingest/W1002012.pdf` (GE DDP/DFP-family FAQ,
# "GE POWER MANAGEMENT DFP FREQUENTLY ASKED QUESTIONS") describes a hardware factory-reset
# procedure ("hold the target reset button down and apply control power... until you hear a
# clicking noise") that resets communications to a KNOWN state: baud 4800, password "1", unit ID
# 255. This is a DIFFERENT password value/tier than the VIEW/CONTROL/SETTING passwords above
# (likely an older Mlink-era default, or a different DFP family member — GE's own Mlink software
# documentation elsewhere in this batch, `ingest/W1002013.pdf` lines ~5870-5887, separately shows
# "the default INQUIRY password is: DFP100" and "the default MODIFICATIONS password is: 1" for
# the same relay via its Mlink PC software path) — both sourcing paths agree the CONTROL/
# MODIFICATIONS-tier default is the literal digit "1," a second independently-corroborated value
# for the same relay.
#
# NETWORK REACHABILITY: confirmed serial-only. The manual explicitly lists "RS232, RS485, or
# fiber optic" ports and even documents an optional Hayes-compatible MODEM connection — no
# Ethernet or native TCP/IP interface anywhere in the manual. Same "needs a serial-to-TCP gateway
# for IP reachability" caveat as several other older GE relay families already logged in this
# project (269+, 369).
#
# NOT BUILT: (1) serial-only reachability, no confirmed IP path; (2) two independently-sourced
# but DIFFERENT default values exist for what may be the same or an adjacent access tier
# (DFP_CNTL vs. the literal "1") — needs reconciling against a single authoritative source (or
# accepting both as valid across different DFP100 firmware/software-generation eras) before
# building a check with a defensible credential list, not guessed.

