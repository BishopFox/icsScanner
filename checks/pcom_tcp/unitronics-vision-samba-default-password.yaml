# Default-credentials sweep — HIGH-PRIORITY KEV finding, promoted from
# checks/candidates/CVE-2023-6448-unitronics-vision.yaml once the PCOM/TCP wire protocol was
# verified (2026-08-14) against a real primary source (Claroty Team82's PCOM-Tools, see
# core/pcom_tcp.py's docstring for full provenance). See
# checks/pcom_tcp/native/unitronics_default_password.py for the implementation.
#
# Real-world stakes: this is the actual vulnerability behind the November 2023 attacks on U.S.
# water utility infrastructure. Surfaced via CISA KEV catalog research (live feed fetched
# directly, 2026-08-14), not the originally-planned vendor list.

check_id: pcom-tcp-unitronics-default-password
protocol: pcom-tcp
kind: native
module: checks.pcom_tcp.native.unitronics_default_password
cve_id: CVE-2023-6448
severity: "9.8 CRITICAL (score only — see CISA ICSA-23-348-15 for full CVSS vector before treating as authoritative)"
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: high
fingerprint_precondition:
  protocol_probe: pcom_tcp_identity
detection_hints:
  transport: tcp
  app_protocol: pcom-tcp
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own PCOM/TCP Check Password request (opcode 0x02) using the documented factory-default password '1111' — verified by executing core/pcom_tcp.py's build_check_password_request('1111') directly, not hand-derived (its checksum algorithm is intricate enough that hand computation would be a real correctness risk)"
    patterns:
      - context: request
        bytes: "\\x01\\x00\\x66\\x00\\x23\\x00\\x2f\\x5f\\x4f\\x50\\x4c\\x43\\x00\\xfe\\x01\\x00\\x00\\x00\\x02\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x08\\x00\\x3b\\xfd\\x31\\x31\\x31\\x31\\x20\\x20\\x20\\x20\\xbc\\xfe\\x5c"
  broad:
    description: "Any PCOM/TCP Check Password request (opcode 0x02), regardless of which password is guessed — verified this 24-byte header is byte-identical across different guessed passwords (only the 8-byte command_data field and its footer checksum vary), so this is a genuine, precise signature for the CVE-2023-6448 vulnerability class in general, not just this scanner's own '1111' guess"
    patterns:
      - context: request
        bytes: "\\x2f\\x5f\\x4f\\x50\\x4c\\x43\\x00\\xfe\\x01\\x00\\x00\\x00\\x02\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x08\\x00\\x3b\\xfd"
references:
  - "https://www.cisa.gov/news-events/ics-advisories/icsa-23-348-15"
  - "https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=CVE-2023-6448"
  - "https://github.com/claroty/PCOM-Tools"
  - "https://nvd.nist.gov/vuln/detail/CVE-2023-6448"
description: >
  Unitronics VisiLogic (before 9.9.00), used in Vision and Samba series PLCs/HMIs, ships with
  default administrative password "1111" over the proprietary PCOM/TCP protocol (port 20256).
  Actively exploited in the wild (CISA KEV-listed) — this is the vulnerability behind the real
  November 2023 attacks on U.S. water utility infrastructure. Patched in VisiLogic 9.9.00;
  CISA recommends changing all default PLC/HMI passwords regardless of patch status.
