# Default-credentials sweep, Phase 5 (Wonderware/AVEVA). Uses the new generic
# checks/mssql/native/mssql_default_creds.py executor.
#
# detection_hints: ADDED 2026-11-18 (supersedes the earlier "omitted" note). pymssql's first packet
# is a TDS PRELOGIN (type 0x12): it carries no credentials and is byte-identical for every TDS
# client (SSMS, sqlcmd included), so it is NOT the signal. The signal is the default account NAME in
# the TDS LOGIN7 request, sent client-to-server after the handshake. LOGIN7 encodes the username as
# plain UCS-2LE (only the password is obfuscated), so each default login is a fixed little-endian
# byte string, derivable without capturing a live LOGIN7 or standing up a mock server. A Suricata
# content/pcre match is offset-independent, so the narrow rule below does not depend on LOGIN7's
# variable field layout (the part the earlier note rightly declined to hand-derive): it matches the
# 8 default account names in UCS-2LE on tcp/1433, to_server. Those names reach the wire only during
# a login attempt with that account, so a hit means default-credential use, not mere presence.
#
# Sources (cross-checked, not a single search summary): initial search citing the account-name
# pattern, independently corroborated by a direct fetch of w3h/icsmaster's Scada_Password.csv
# (a community-compiled ICS default-credential reference) — both agree on the same 8 pairs. The
# underlying AVEVA/Schneider security bulletin (LFSec00000115.pdf) was located but returned
# unreadable binary content on fetch; the CVE and account-name existence are independently
# confirmed via CISA (ICSA-17-024-01) and NVD (CVE-2017-5155).

check_id: mssql-wonderware-historian-default-logins
protocol: mssql
kind: native
module: checks.mssql.native.mssql_default_creds
cve_id: CVE-2017-5155
severity: "score not confirmed in this pass — see CISA ICSA-17-024-01 for the full CVSS vector before treating any score as authoritative"
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  protocol_probe: mssql_identity
detection_hints:
  transport: tcp
  app_protocol: mssql
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: >-
      A TDS LOGIN7 login attempt (tcp/1433, client-to-server) using one of the 8 Wonderware
      Historian default accounts. LOGIN7 carries the username as plain UCS-2LE, so each default
      name is a fixed byte string; this regex matches the aa|ww prefix followed by the
      dbo|Admin|Power|User suffix, i.e. exactly aadbo, wwdbo, aaAdmin, wwAdmin, aaPower, wwPower,
      aaUser, wwUser. These names appear on the wire only during a login attempt with that account,
      so a match is a default-credential use, not mere device presence.
    patterns:
      - context: request
        regex: "(\\x61\\x00\\x61\\x00|\\x77\\x00\\x77\\x00)(\\x64\\x00\\x62\\x00\\x6f\\x00|\\x41\\x00\\x64\\x00\\x6d\\x00\\x69\\x00\\x6e\\x00|\\x50\\x00\\x6f\\x00\\x77\\x00\\x65\\x00\\x72\\x00|\\x55\\x00\\x73\\x00\\x65\\x00\\x72\\x00)"
advisory_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-17-024-01"  # promoted from references (canonical advisory)
references:
  - "https://www.cisa.gov/news-events/ics-advisories/icsa-17-024-01"
  - "https://nvd.nist.gov/vuln/detail/CVE-2017-5155"
  - "https://threatpost.com/default-credentials-found-in-schneider-electric-wonderware-historian/123346/"
  - "https://raw.githubusercontent.com/w3h/icsmaster/master/Scada_Password.csv"
params:
  default_port: 1433
  credentials:
    - ["aadbo", "pwddbo"]
    - ["wwdbo", "pwddbo"]
    - ["aaAdmin", "pwAdmin"]
    - ["wwAdmin", "wwAdmin"]
    - ["aaPower", "pwPower"]
    - ["wwPower", "wwPower"]
    - ["aaUser", "pwUser"]
    - ["wwUser", "wwUser"]
description: >
  Wonderware Historian (2014 R2 SP1 P01 and earlier) creates 8 default SQL Server logins at
  install time (aadbo, wwdbo, aaAdmin, wwAdmin, aaPower, wwPower, aaUser, wwUser), each with a
  predictable default password. An attacker with database access can compromise the Historian
  database and, per the advisory, potentially resources beyond it depending on the installation.
