# PROMOTED from checks/candidates/moxa-em-1220-1240-hardcoded-root-telnet-password.yaml,
# 2026-09-22 (disclosure_status was already disclosed-pending-fix -- sent to Moxa PSIRT
# 2026-09-19, acknowledged 2026-09-21 -- so this project's never-ship-undisclosed rule no longer
# blocks it; zero new code needed, this executor already existed). See the candidate file's own
# header for the full sourcing detail — summary here per this project's YAML-header convention.
#
# confidence set to `low` here, not the candidate's `high` — that field reflects the finding's
# realism, but checks/telnet/native/telnet_default_creds.py's own docstring convention (matching
# every other built telnet-default-creds check in this project) is confidence=low unless a
# specific device's exact post-login banner text has been verified against real hardware, which
# was not done for this product (the candidate confirmed the config-file/inittab evidence for
# reachability, not a live banner capture).
#
# Moxa's EM-1220-LX/EM-1240-LX energy meter series ships a hardcoded root account whose password
# cracks to the literal string "root" from the vendor's own shipped /etc/passwd DES-crypt hash
# (jt17KLyKZIzxQ) — a genuinely different product category and platform from every other Moxa
# finding this session. Telnet (root login) is confirmed always-running via an inittab respawn
# entry (`inet:respawn:/bin/inetd` + `/etc/inetd.conf`'s `telnet stream tcp nowait root
# /bin/telnetd`), no config gate to second-guess.
#
# No CVE found for this specific issue.
#
# MOXA PSIRT RESPONSE 2026-09-24 (case closed, no CVE/advisory): reviewed all 8 findings from this
# disclosure batch and declined to treat any as vulnerabilities, stating verbatim: "All of the
# reported credentials are factory-default accounts that can be changed by the user. They are
# documented in the publicly available user manuals for these products, and users are instructed
# to change them during initial setup. Because these credentials are user-configurable rather than
# hardcoded, we do not treat them as product vulnerabilities." No vulnerability case opened, no
# advisory planned; several affected products already End-of-Support. Moxa asked that any
# publication describe these as "documented, user-changeable default credentials."
# THIS PROJECT'S OWN EVIDENCE FOR THIS SPECIFIC FINDING does not match that characterization: the
# root/root credential was cracked from a real /etc/passwd DES-crypt hash extracted from shipped
# firmware -- no public manual documenting this value was found by this project. Per user
# direction 2026-09-24, disclosure_status is updated to `public`, accepting Moxa's classification
# for tracking/publication purposes -- this file's own evidence trail above is left intact, not
# rewritten to match Moxa's framing.

check_id: telnet-moxa-em-1220-1240-hardcoded-root-telnet-password
protocol: telnet
kind: native
module: checks.telnet.native.telnet_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "EM-1220-LX / EM-1240-LX (energy meter series)"
params:
  credentials:
    - ["root", "root"]
references:
  - "moxa-em-1220-series-firmware-v2.2.zip, user-supplied ingest (actually a RAR archive despite .zip extension), EM-1220-LX/em1220-2.2.dsk extracted via jefferson, /etc/passwd read directly"
detection_hints:
  transport: tcp
  app_protocol: telnet
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own Telnet username+password login attempt using the documented factory credential (root:root)"
    patterns:
      - context: request
        regex: "root\\r\\n\\r\\n"
  broad:
    description: "Any Telnet login attempt (a username followed by a password, both CRLF-terminated) on this device — the vulnerability class (default/weak credentials on this product's Telnet server), not the specific guessed credential"
    patterns: []  # generic "any-line" pattern removed 2026-11-11 (real-traffic validation); no device-specific signature beyond the narrow probe/credential bytes. See lab-notes/zeek-detection-validation-pnnl-2026-11.md
description: >
  Moxa's EM-1220-LX/EM-1240-LX energy meter series ships a hardcoded root account whose password
  cracks to the literal string "root" from the vendor's own shipped /etc/passwd DES-crypt hash —
  a different product category and platform from every other Moxa finding this session. Telnet
  root login is confirmed always-running via an inittab respawn entry, no config gate. CVSS 3.1:
  9.8 CRITICAL (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). No CVE found for this specific issue.
  Sent to Moxa PSIRT 2026-09-19, acknowledged 2026-09-21, DECLINED 2026-09-24 (Moxa classifies
  this as a documented, user-changeable default -- this project's own evidence, a cracked
  /etc/passwd hash from shipped firmware, does not support that characterization).
  disclosure_status: public per user direction 2026-09-24, accepting Moxa's classification for
  tracking purposes. confidence: low, matching this project's convention for every
  telnet-default-creds check without a verified live post-login banner capture (see this file's
  own header note).
