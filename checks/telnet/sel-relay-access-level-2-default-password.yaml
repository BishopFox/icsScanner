# Native check — promoted from checks/candidates/sel-relay-access-level-2-default-password.yaml
# 2026-08-29, once the multi-step `chains` param was added to
# checks/telnet/native/telnet_default_creds.py specifically to unblock this candidate. See that
# module's own docstring for the executor mechanics. Companion to
# checks/telnet/sel-relay-access-level-1-default-password.yaml — same sourcing, same 8-model
# corroboration (SEL-421, SEL-3031, SEL-2032, SEL-351, SEL-387A, SEL-749M, SEL-587Z, SEL-734),
# now with a real 2-step wire sequence confirmed byte-for-byte from SEL-351's own manual: connect
# -> send "ACC" -> receive a password prompt -> send "OTTER" -> receive the Level 1 prompt "=>"
# -> send "2AC" -> receive a second password prompt -> send "TAIL" -> reach Level 2 ("Perform all
# relay access level functions" per SEL-421's Table 4.3 — full write/control access).
#
# EXTRA CAUTION: this is the MORE severe of the two SEL findings — full write/control access to a
# protection relay, not just read access. destructive:true, same as the Level 1 check.
#
# success_indicators DELIBERATELY LEFT UNSET: unlike Level 1 (whose "=>" prompt is explicitly
# named in SEL-421's own Table 4.3), no source reviewed so far states the exact prompt text or
# banner shown specifically upon reaching Level 2 — guessing one (e.g. an extra ">" character,
# by analogy to common CLI escalation conventions) would be exactly the kind of unverified
# assumption this project's own discipline avoids. This check therefore relies on the weaker
# "no failure_indicator seen after the full chain" signal, same honesty tier as several other
# low-confidence checks in this project — a real gap to close if a future session finds or
# captures the actual Level 2 banner text.

check_id: telnet-sel-relay-access-level-2-default-password
protocol: telnet
kind: native
module: checks.telnet.native.telnet_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Schweitzer Engineering Laboratories"
params:
  password_prompt: "password:"
  chains:
    - - ["ACC", "OTTER"]
      - ["2AC", "TAIL"]
  default_port: 23
detection_hints:
  transport: tcp
  app_protocol: telnet
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own exact probe: the full 2-step SEL escalation chain (ACC command, OTTER password, 2AC command, TAIL password) sent in one session"
    patterns:
      - context: request
        bytes: "ACC\r\nOTTER\r\n2AC\r\nTAIL\r\n"
  broad:
    description: "Any SEL relay 2-step access-level escalation on Telnet — the vulnerability class (unauthenticated-by-default Level 2 write/control access reachable via a 2-command chain FROM Level 1), not tied to the specific OTTER/TAIL guess"
    patterns:
      - context: request
        regex: "^[0-9]?[A-Z]{2,3}\\r\\n[A-Z]{4,6}\\r\\n2[A-Z]{2}\\r\\n[A-Z]{4,6}\\r\\n"
references:
  - "https://www.tenable.com/plugins/nnm/6268"
  - "https://na.eventscloud.com/file_uploads/72d60018e3c410cab98bad27cff49f05_5_SEL_421_IM_20111215.pdf"
  - "https://www.manualslib.com/manual/1498136/Schweitzer-Engineering-Laboratories-Sel-3031.html?page=38"
description: "Schweitzer Engineering Laboratories (SEL) protection relays ship with factory-default Access Level 2 (full write/control access, command 2AC/2ACCESS) password TAIL over the built-in Telnet server (port 23), reachable via a 2-step escalation chain from Access Level 1 (ACC/OTTER first) — confirmed vendor-wide across at least 8 independent relay/communications-processor/metering models, all read directly from their own official Instruction Manuals, plus a dedicated Tenable NNM plugin. See the sibling Access Level 1 check for the single-step read-access finding."
