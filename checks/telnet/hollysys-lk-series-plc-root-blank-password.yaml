# Default-credentials sweep, Phase 9. Telnet sibling of
# checks/ftp/hollysys-lk-series-plc-anonymous-ftp.yaml — same primary source (plcscan.org,
# fetched and read directly), same PLC: "而root的密码也为空，可以使用telnet直接登录系统" —
# "and root's password is also blank, [one] can log directly into the system via telnet."

check_id: telnet-hollysys-lk-series-plc-root-blank-password
protocol: telnet
kind: native
module: checks.telnet.native.telnet_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "HollySys Automation"
params:
  credentials:
    - ["root", ""]
  default_port: 23
detection_hints:
  transport: tcp
  app_protocol: telnet
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own Telnet username+password login attempt(s) using the documented factory credential(s) (root:'')"
    patterns:
      - context: request
        bytes: "root\r\n\r\n"
  broad:
    description: "Any Telnet login attempt (a username followed by a password, both CRLF-terminated) on this device — the vulnerability class (default/weak credentials on this product's Telnet server), not the specific guessed credential"
    patterns: []  # generic "any-line" pattern removed 2026-11-11 (real-traffic validation); no device-specific signature beyond the narrow probe/credential bytes. See lab-notes/zeek-detection-validation-pnnl-2026-11.md
references:
  - "https://github.com/scadastrangelove/SCADAPASS/blob/master/scadapass.csv"
  - "http://plcscan.org/blog/2014/12/hollysys-lk-series-plc-system-default-password-vulnerability/"
description: "HollySys LK-series PLCs ship with a factory-default root account and a BLANK Telnet password — confirmed against real internet-exposed hardware via Shodan/Zoomeye by the source researcher. No CVE, documented factory-default behavior."
