# Default-credentials sweep, Metoree Protective-Relays/switchgear-monitoring pivot session
# (2026-08-18, us.metoree.com/categories/5018/). Schweitzer Engineering Laboratories (SEL) —
# the single biggest name in North American power-grid protection relays, a genuinely
# high-impact target. Uses checks/telnet/native/telnet_default_creds.py's new `pre_command`
# param (added this session — SEL's ASCII terminal protocol requires typing an access-level
# command before any password prompt appears at all, a shape this module didn't support before).
#
# Sources, 3-way corroborated (strong tier):
# 1. Tenable NNM plugin 6268 ("Schweitzer Engineering Laboratories (SEL) Default telnet
#    Account"), CPE cpe:/a:selinc:sel_telnet — a dedicated, maintained security-tool signature
#    for exactly this issue, same corroboration tier as the Samsung DMS candidate's Tenable
#    plugin 53878.
# 2. SEL-421 Relay Protection and Automation System Instruction Manual (official SEL manual,
#    read directly via pdftotext) — Table 4.4 "Access Level Commands and Passwords": Access
#    Level 1, command ACCESS (short form ACC), factory default password OTTER. Also confirms the
#    Telnet Server (Table listing "TPORT default setting is port 23") and the exact prompt text
#    ("At the Password: ? prompt, type your Access Level [x] password").
# 3. SEL-3031 Instruction Manual (official SEL manual, ManualsLib), Table 2.6 "Default
#    Passwords": Access Level 1 = OTTER, matching the SEL-421 exactly — this is a vendor-wide
#    convention across the whole SEL relay product line, not a single-model quirk.
#
# SCOPE: Access Level 1 ONLY (command ACC/ACCESS, password OTTER) — "read access" per SEL-3031's
# own manual wording ("View data and status information" per SEL-421's Table 4.3). Deliberately
# NOT attempting Access Level 2 (2AC/2ACCESS, password TAIL, full write/control access) in this
# check: per the SEL-421 manual, "To enter Access Levels B, P, A, O, and 2, you must enter a
# correct password FROM Access Level 1" — i.e. Level 2 requires a 2-step escalation chain (first
# authenticate to Level 1, THEN issue 2AC and its own password), which this project's
# single-command-then-password executor doesn't express yet. Flagged as a real, more severe
# follow-up (checks/candidates/sel-relay-access-level-2-default-password.yaml) rather than
# force-fitting the escalation into this check.
#
# Access Level C's default password is explicitly NOT vendor-wide: SEL-421's manual gives "Sel-1"
# while SEL-3031's gives "CLARKE" for the equivalent CAL/C level — model-specific, not shipped
# here.
#
# Confidence held at "low" despite strong sourcing: the exact ASCII-terminal failure-response
# text is not independently confirmed (only the SEL-421 manual's PHYSICAL FRONT-PANEL LCD error
# screen text — "Password Invalid" — was found; the Telnet/ASCII session's own text response on
# a rejected password was not located in the sources checked). The module's default failure
# keywords (incorrect/failed/denied/invalid) likely cover it, but this hasn't been verified
# against a real device or an ASCII-protocol-specific source, same honesty standard as every
# other "low confidence, strong-but-not-live-verified" check in this sweep.
#
# `success_indicators: ["=>"]` set explicitly rather than relying on the executor's weak
# no-failure-keyword-seen fallback — real gap caught while writing this check's own test: an
# ambiguous/empty response (e.g. a device that never replies as expected) would otherwise default
# to a false CONFIRMED. "=>" is the confirmed Access Level 1 prompt per SEL-421's own Table 4.3
# ("Access Level 1, Prompt =>") — requiring it in the response makes CONFIRMED mean the relay
# actually granted Access Level 1, not just "didn't say no."
#
# No CVE — documented factory-default behavior.

check_id: telnet-sel-relay-access-level-1-default-password
protocol: telnet
kind: native
module: checks.telnet.native.telnet_default_creds
destructive: true
risk_reason: ["login"]  # plain login attempt, no confirmed lockout risk, no device write (2026-08-29 reclassification)
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "Schweitzer Engineering Laboratories"
params:
  password_only: true
  pre_command: "ACC"
  credentials:
    - ["", "OTTER"]
  success_indicators:
    - "=>"
  default_port: 23
detection_hints:
  transport: tcp
  app_protocol: telnet
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "SEL relay Access Level 1 password guess using this scanner's exact probe (ACC command, OTTER password)"
    patterns:
      - context: request
        bytes: "ACC\r\nOTTER\r\n"
  broad:
    description: "Any SEL relay ASCII access-level command followed immediately by a password on Telnet — the vulnerability class (unauthenticated-by-default access-level escalation), not tied to the specific OTTER guess"
    patterns:
      - context: request
        regex: "^[0-9]?[A-Z]{2,3}\\r\\n[A-Z]{4,6}\\r\\n"
references:
  - "https://www.tenable.com/plugins/nnm/6268"
  - "https://na.eventscloud.com/file_uploads/72d60018e3c410cab98bad27cff49f05_5_SEL_421_IM_20111215.pdf"
  - "https://www.manualslib.com/manual/1498136/Schweitzer-Engineering-Laboratories-Sel-3031.html?page=38"
description: "Schweitzer Engineering Laboratories (SEL) protection relays and metering devices ship with factory-default Access Level 1 (read/view access, command ACC) password OTTER over the built-in Telnet server (port 23) — confirmed vendor-wide across at least 8 independent models (SEL-421, SEL-3031, SEL-2032, SEL-351, SEL-387A, SEL-749M, SEL-587Z, SEL-734, all read directly from their own official Instruction Manuals) and a dedicated Tenable NNM plugin. Access Level 2 (full write/control access, password TAIL) requires a 2-step escalation from Level 1, not covered by this check — see the sel-relay-access-level-2 candidate."

# UPDATE 2026-08-28 — same OTTER/TAIL convention independently reconfirmed across 5 MORE official
# SEL Instruction Manuals (all read directly, part of a large user-supplied ips.us/store.ips.us
# document batch): SEL-2032 Communications Processor (Table 3.1: 1=OTTER, 2=TAIL, C=CLARKE —
# matching SEL-3031's own C-level value exactly), SEL-351 Directional Overcurrent Relay (1=OTTER,
# B=EDITH, 2=TAIL), SEL-387A Current Differential Relay (1=OTTER, B=EDITH, 2=TAIL), SEL-749M Motor
# Protection Relay (1=OTTER, 2=TAIL), SEL-587Z High-Impedance Differential Relay (1=OTTER,
# 2=TAIL). NEW finding: Access Level B's default password is "EDITH" (confirmed identically on
# both SEL-351 and SEL-387A) — not previously documented anywhere in this project. This is now a
# confirmed company-wide convention across the whole SEL relay line, not a 2-model coincidence.
# Two more manuals in the same batch (SEL-787, SEL-751A) show the identical "Factory Default
# Passwords for Access Levels 1 and 2" table heading/structure but weren't individually read for
# their exact values this pass — near-certain to match, not yet independently confirmed.
#
# UPDATE 2026-08-29 — 8th independent model confirmed, a DIFFERENT product category (a metering
# device, not a protection relay): `ingest/W1001870.pdf`, SEL-734 Advanced Metering System
# Instruction Manual. Its own "Table 10.20 Factory Default Passwords" gives Access Level 1 =
# OTTER and Access Level 2 = TAIL, matching every relay/communications-processor model already
# confirmed — this is now a company-wide convention across SEL's metering line too, not just
# protection relays. NEW finding, not previously documented anywhere in this project: this table
# also lists a THIRD access level, "E," with its own factory-default password "BLONDEL" — a
# different letter/value than the previously-found "B"/EDITH level (SEL-351/SEL-387A), suggesting
# SEL's mid-tier access-level naming and defaults vary more by product line than the universal
# 1=OTTER/2=TAIL convention does. SEL-734 has a native Ethernet port (confirmed in its own specs
# table) in addition to EIA-232 serial — same network-reachability profile as the already-shipped
# check's other confirmed models.
