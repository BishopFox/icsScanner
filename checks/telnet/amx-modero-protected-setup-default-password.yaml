# ARMED in checks/telnet/ — DOCUMENTED default (public), not an undisclosed finding. AMX's own
# Modero/MVP ViewPoint Operation/Reference manuals document the "Protected Setup" remote-login
# defaults: Standard Security => Telnet, default password `1988` (line-password login); Secure/DoD
# => SSH, user `amx`, default password `Amx1234!`. See the MVP-7500/8400 and Modero manuals
# (manualslib) + CISA ICSA-16-049-02 context. disclosure_status public (vendor-documented default).
#
# This check covers the Standard-Security Telnet line-password default (`1988`). The Secure/DoD
# SSH variant (amx:Amx1234!) is the SSH-executor analogue; add a checks/ssh/ sibling if an AMX unit
# confirms SSH is the active profile.
#
# NOTE (fingerprint): gated on vendor "AMX", produced by probe_amx_icsp_identity (core/
# fingerprint.py, added 2026-10-16). That probe identifies AMX via the IANA/SANS-registered AMX-ICSP
# port (TCP 1319 ICSP / 1320 Secure ICSP) plus the server-first 0x02-led ICSP banner — read-only,
# fail-closed, confidence "low" (the ICSP wire format is undocumented, so the probe does NOT decode
# it; see the probe's block comment). It needs live-device confirmation on a real Modero/MVP/NetLinx
# unit to promote confidence or relax the 0x02 gate. Until such a host fingerprints as AMX this check
# stays inert; it must NOT be run ungated (would fire amx/1988 at arbitrary telnet hosts). The durable
# fact here is the documented credential; the probe is what lets it fire only against AMX gear.
#
# SEPARATE, DO NOT CONFLATE: the AMX firmware-sidecar sweep (2026-10-16) found an OS-level root
# default (root:'root' / passwd:'password', shared across the v2_86_x Modero/CV line) that is NOT
# this documented UI password — that is an undisclosed firmware finding (disclosure-gated, kept as a
# candidate), not armed here.
check_id: telnet-amx-modero-protected-setup-default-password
protocol: telnet
kind: native
module: checks.telnet.native.telnet_default_creds
destructive: true
risk_reason: ["login"]  # single telnet login attempt (documented default); no device write
disclosure_status: public
confidence: low
fingerprint_precondition:
  vendor: "AMX"
params:
  credentials:
    - ["", "1988"]        # Standard Security: Telnet line-password default (no username prompt)
    - ["amx", "1988"]     # fallback if a username prompt is presented
  default_port: 23
detection_hints:
  transport: tcp
  app_protocol: telnet
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "This scanner's own Telnet login using the documented AMX Modero Standard-Security default password 1988."
    patterns:
      - context: request
        regex: "1988"
  broad:
    description: "Telnet login attempts against an AMX Modero/MVP panel from a single source (default-password login)."
    patterns:
      - context: request
        regex: "\\xff\\xfd"
advisory_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-16-049-02a"  # promoted from references (canonical advisory)
references:
  - "AMX MVP-7500/8400 & Modero Operation/Reference manuals — Protected Setup default passwords (1988 Standard, Amx1234! Secure/DoD, user amx)"
  - "https://www.cisa.gov/news-events/ics-advisories/icsa-16-049-02a"
description: >
  AMX Modero / MVP ViewPoint touch panels ship a documented Protected-Setup remote-login default:
  under Standard Security, Telnet accepts the default line password `1988` (Secure/DoD uses SSH with
  user `amx` / `Amx1234!`). This check attempts the documented Telnet default. No CVE — vendor-
  documented factory default (per AMX's own manuals). Fingerprint-gated on AMX (a Modero/MVP identity
  probe is a follow-up; inert until then).
