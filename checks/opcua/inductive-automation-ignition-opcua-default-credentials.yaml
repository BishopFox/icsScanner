# Built check 2026-10-06 (candidate re-triage), promoted from
# candidates/inductive-automation-ignition-opcua-default-credentials.yaml. The candidate's blocker was
# "needs an explicit OPC UA username/password authentication path added" -- now resolved: the reusable
# checks/opcua/native/opcua_default_creds.py (built in Phase 3 for MX-AOPC UA) provides exactly that.
# Ignition's built-in OPC UA server ships default creds opcuauser:password (vendor docs + forum),
# distinct from the Gateway web login. Ignition's OPC UA server listens on opc.tcp port 62541 by
# default. The executor discovers the endpoints (requires a UserName token), runs a random-bogus
# negative control, then activates a UserName session with opcuauser:password.
check_id: inductive-automation-ignition-opcua-default-credentials
protocol: opcua
kind: native
module: checks.opcua.native.opcua_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Inductive Automation"
  product: "Ignition built-in OPC UA server (opc.tcp, default port 62541)"
params:
  credentials:
    - ["opcuauser", "password"]
  default_port: 62541
  require_username_endpoint: true
  negative_control: true
references:
  - "Ignition User Manual, OPC-UA Connections and Settings (docs.inductiveautomation.com): built-in OPC UA server default credentials opcuauser:password, distinct from the Gateway web login."
  - "Inductive Automation community forum: 'Authentication to Ignition OPC UA Server' confirms opcuauser:password as the shipped default."
detection_hints:
  transport: tcp
  app_protocol: opcua
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No reliable narrow wire signature — OPC UA binary encodes the ActivateSession service as a numeric NodeId, not a matchable literal, and the UserName token password is not a stable plaintext pattern. The session-activation attempt is the scanner's action."
    patterns: []
  broad:
    description: "An OPC UA connection: the Hello (HEL) message carries the endpoint URL 'opc.tcp://...' in cleartext before any security negotiation — the protocol-exposure class, not the specific credential."
    patterns:
      - context: request
        regex: "opc\\.tcp://"
description: >
  Inductive Automation Ignition's built-in OPC UA server ships default credentials
  opcuauser:password (vendor documentation + community forum), distinct from the Gateway's own web
  login. Ignition is a very widely deployed SCADA/HMI platform, so a live default there grants OPC UA
  read/write to connected devices/tags. The executor discovers endpoints (requiring a UserName token),
  runs a random-bogus negative control, and activates a UserName session with opcuauser:password —
  CONFIRMED only if the bogus credential is rejected and the default is accepted. CVSS 3.1 9.8
  CRITICAL. Built against checks/opcua/native/opcua_default_creds.py.
