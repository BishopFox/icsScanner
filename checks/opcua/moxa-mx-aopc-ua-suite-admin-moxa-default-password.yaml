# Built check 2026-10-06 (Phase 3), promoted from candidates/moxa-mx-aopc-ua-suite-admin-moxa-default-password.yaml.
# The candidate's blocker was "no OPC UA authentication executor exists." Resolved: built a reusable
# checks/opcua/native/opcua_default_creds.py (asyncua UserName/Password session-activation test, with
# a GetEndpoints UserName-token guard + a random-bogus-credential NEGATIVE CONTROL so it cannot
# false-positive on an accept-any/anonymous server) + a real-asyncua-server smoke test.
# Moxa MX-AOPC UA Suite (Server + Logger) ships a fixed, documented default OPC UA client credential
# admin/moxa (the account name "admin" is explicitly unchangeable per Moxa's manual; only the password
# can be changed). The executor activates an OPC UA UserName session with admin/moxa; success = the
# default is live. Port: OPC UA well-known 4840 as the default fallback (confirm against the actual
# MX-AOPC UA Server deployment port; the scanner supplies the discovered port when available).
check_id: moxa-mx-aopc-ua-suite-admin-moxa-default-password
protocol: opcua
kind: native
module: checks.opcua.native.opcua_default_creds
severity: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8 CRITICAL)"
destructive: true
risk_reason: ["login"]
disclosure_status: public
confidence: high
fingerprint_precondition:
  vendor: "Moxa Technologies"
  product: "MX-AOPC UA Server / MX-AOPC UA Logger (OPC UA bridge software)"
params:
  credentials:
    - ["admin", "moxa"]
  default_port: 4840
  require_username_endpoint: true
  negative_control: true
references:
  - "Moxa MX-AOPC UA Server User Manual v4.0 + MX-AOPC UA Logger User Manual v3.0 (user-supplied, pdftotext): 'The default account and password for connecting an OPC UA client to the server are: Account: admin Password: moxa. The account name cannot be changed.'"
detection_hints:
  transport: tcp
  app_protocol: opcua
  mitre_attack_id: T0812
  analytic_story: "ICS Default Credentials"
  narrow:
    description: "No reliable narrow wire signature — OPC UA binary encodes the ActivateSession service as a numeric NodeId, not a matchable literal string, and the UserName token's password is not a stable plaintext pattern. The session-activation attempt itself is the scanner's action."
    patterns: []
  broad:
    description: "An OPC UA connection: the Hello (HEL) message carries the endpoint URL 'opc.tcp://...' in cleartext before any security negotiation — the protocol-exposure class, not the specific credential."
    patterns:
      - context: request
        regex: "opc\\.tcp://"
description: >
  Moxa MX-AOPC UA Suite (Server and Logger — OPC UA bridge/gateway software for Moxa serial and
  Ethernet I/O) ships a fixed, vendor-documented default OPC UA client credential admin/moxa (the
  account name is unchangeable; only the password can be changed). The executor discovers the
  server's endpoints (requiring a UserName identity token), runs a random-bogus-credential negative
  control, then activates an OPC UA UserName session with admin/moxa — CONFIRMED only if the bogus
  credential is rejected and admin/moxa is accepted, granting read/write to every bridged I/O point.
  CVSS 3.1 9.8 CRITICAL. Built against checks/opcua/native/opcua_default_creds.py.
